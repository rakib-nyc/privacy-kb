# INSTRUMENT COVERAGE — what each instrument must hold before a query touching it
# can be reported as substantively answered
# ==============================================================================
# meta/jurisdiction-coverage.yaml closed this hole at jurisdiction granularity. It
# does not close it at INSTRUMENT granularity, and that gap is worse, because it is
# architecturally invisible rather than a defect a gate could catch: every atom is
# correct, every gate passes, and the engine behaves exactly as designed.
#
# The case is FCRA. The corpus holds 15 U.S.C. § 1681t — preemption — and nothing
# else. A question about a consumer reporting agency therefore returns a confident
# preemption answer over a substantive void, and NOTHING IN THE OUTPUT SIGNALS THE
# VOID. New York's incompleteness is declared and self-reporting; FCRA's was merely
# true. The corpus did not know that "has preemption atoms" and "can answer
# questions about this instrument" are different claims.
#
# Declared per DUTY CATEGORY rather than as a per-instrument boolean, because
# "FCRA is incomplete" tells a reader to look elsewhere while "FCRA: preemption
# present, permissible purposes absent, CRA accuracy absent, dispute duties
# absent, furnisher duties absent" tells them what to look for.
#
# `citation_prefix` is matched against an obligation atom's source.citation, so
# presence is computed from the corpus rather than hand-asserted. See
# meta/decisions.yaml DEC-007 for what the engine does with a partial instrument.
version: 1
instruments:

  us.fcra.preemption:
    title: Fair Credit Reporting Act
    note: THE MOTIVATING CASE. Preemption without duties is the most dangerous partial
      state in the corpus, because a preemption answer is confident, correct, and
      silent about everything it cannot reach.
    categories:
    - id: preemption
      citation_prefix: ['15 U.S.C. § 1681t']
      supplies: What state law FCRA displaces, and where.
    - id: permissible_purposes
      citation_prefix: ['15 U.S.C. § 1681b']
      supplies: When a consumer report may be furnished or obtained at all — the first
        question in almost every real FCRA matter.
    - id: cra_accuracy_and_procedures
      citation_prefix: ['15 U.S.C. § 1681e']
      supplies: Reasonable procedures to assure maximum possible accuracy; reseller duties.
    - id: consumer_disclosures
      citation_prefix: ['15 U.S.C. § 1681g']
      supplies: What a CRA must disclose to the consumer on request.
    - id: dispute_and_reinvestigation
      citation_prefix: ['15 U.S.C. § 1681i']
      supplies: The 30-day reinvestigation duty — the operational core of FCRA compliance.
    - id: adverse_action
      citation_prefix: ['15 U.S.C. § 1681m']
      supplies: Notice duties on users of consumer reports who take adverse action.
    - id: furnisher_duties
      citation_prefix: ['15 U.S.C. § 1681s-2']
      supplies: Accuracy and investigation duties on entities that report TO a CRA.

