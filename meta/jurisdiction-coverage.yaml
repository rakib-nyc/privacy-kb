      title: Child Data Protection Act
      supplies:
      - restrict_use
      - notify
      - consent
      published_heading: Definitions
      verified: openleg:GBS 899-EE, heading fetched 2026-08-19
      note: 'THE CITATION IS IMPRECISE, left visible. § 899-ee publishes as "Definitions"; the Child Data
        Protection Act''s operative duties are in the sections following it. A declaration whose supplies[]
        lists restrict_use/notify/consent while pointing at a definitions section overstates what extracting
        that one section would deliver. Resolve to the specific operative sections before extraction.
        EXPECTED_SECTIONS IS NULL DELIBERATELY: the declaration names an ACT, and an act is not a section.
        § 899-ee resolves and publishes as "Definitions", so the citation is real, the heading is real,
        and the claim of three duty types is still wrong. Naming the instrument is not naming where the
        duties live — resolve to the operative sections before extraction.'
      expected_sections: null
    - id: ny.oag.cdpa_guidance_2025
      citation: NY OAG CDPA Implementation Guidance (19 May 2025)
      title: CDPA implementation guidance
      supplies:
      - guidance
      published_heading: New York Child Data Protection Act Implementation Guidance
      verified: 'RESOLVED 2026-08-24 from an owner-supplied PDF. The diagnosis was right and only the
        conclusion was wrong: NY OAG guidance really is published as a PDF with no OpenLegislation
        identifier, so no structured resolver reaches it — but that made it unFETCHABLE by the harness,
        not unobtainable. It is now held at corpus/state/ny/cdpa/raw/ny-oag-cdpa-guidance-2025.pdf.
        NOT MODELLED AS AN INSTRUMENT, because it is not one. Invariant I7: it creates no obligation and
        has no atoms. It attaches to the four CDPA atoms through interpreted_by, which carries the quoted
        passage inline with a source_ref hashed by gate 2, its span checked by gate 3, and its file
        required in the ledger by gate 33. supplies[] below therefore reads "guidance" and will never
        resolve to a duty — that is correct, not a gap.'
    - id: ny.safe_for_kids
      citation: N.Y. Gen. Bus. Law art. 44-D, §§ 1500–1508; 13 N.Y.C.R.R. §§ 700.1–700.11
      title: SAFE for Kids Act
      supplies:
      - prohibit
      - restrict_use
      - disclose
      note: 'RESOLVED 2026-08-20 BY LOCATION, NOT BY NAME. The earlier entry looked for the SHORT TITLE
        and for a NYCRR part, and neither is a thing OpenLegislation serves — but the Act''s operative
        text is consolidated into General Business Law article 44-D, and GBS 1500 through 1508 resolve
        one section at a time like any other. The citation above is the one that reaches the text; the
        short title reaches nothing. Effective 25 Jan 2027, so every atom is enacted_pending with a
        future effective_from — the reference test for invariant I2, and the corpus''s first record of
        that status. § 1508(1) then defers the Attorney General''s remedy 180 days past the effective
        date, so this instrument carries TWO future dates and they are not the same date. The Part 700
        regulations, which supply what "commercially reasonable" means, remain unreachable — see
        meta/blocked-sources.yaml.'
      published_heading: Definitions (§ 1500); Prohibition of addictive feeds (§ 1501)
      verified: openleg:GBS 1500–1508, headings fetched 2026-08-20
