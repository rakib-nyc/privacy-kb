expected_sections_note: 'expected_sections names WHERE THE DUTIES ARE, not merely which instrument they
  belong to. § 899-ee is why: its citation resolves, its published heading is real, and it is the CDPA''s
  DEFINITIONS section — so a declaration listing restrict_use/notify/consent against it overstates what
  extracting that section would deliver. A citation that resolves is not the same as a citation that supplies
  the duty claimed for it, and that is a third variety of denominator defect after "missing" and "wrong".
  null means the sections have not been resolved yet and the entry should not be trusted for planning.'
