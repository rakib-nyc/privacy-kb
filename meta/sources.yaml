  note: 'Owner-supplied PDF of the DCWP Notice of Adoption of Final Rule (5 Apr 2023), which adds Subchapter
    T to Chapter 5 of Title 6 RCNY. This is the ADOPTED text, not the proposed rule that rules.cityofnewyork.us
    carries, and amlegal returns 403 to automated requests — see meta/blocked-sources.yaml. SEGMENTED
    SECTIONS: §§ 5-301 to 5-304 only. TWO DELIBERATE EXCLUSIONS, both declared rather than silent. (1)
    § 5-300 is TERM-LED — ten definitions named rather than numbered, with no enacted designator anywhere
    — so it carries no paragraph_path and belongs in definition records; the extractor REFUSES to walk
    it, because walked as a hierarchy its two independent roman runs collide at one path. (2) The worked
    EXAMPLE in § 5-301 and its three impact-ratio data tables are not segmented: they carry no designator,
    and pdftotext renders the tables as whitespace-aligned columns that do not linearise into a provision.
    That is 44% of § 5-301 by character count, and it is the part demonstrating impact-ratio METHODOLOGY
    — so the instrument holds the rule''s operative text but not its worked computation.'
