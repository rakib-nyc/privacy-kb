  status: open
- id: DEBT-022
  title: A defined term can collide inside one jurisdiction, and the fact keys did not know it
  registered: '2026-08-20'
  raised_by: Extracting the SAFE for Kids Act
  the_defect: 'New York defines "Covered user" TWICE in the General Business Law. Under the Child Data
    Protection Act, GBL § 899-ee(1), it means a user in New York whom the operator actually knows to be
    a minor, or who is using a service primarily directed to minors. Under the SAFE for Kids Act, GBL
    § 1500(4), it means a user in New York who is not the operator or its agent or affiliate — which is
    very nearly everybody, adults included. Same two words, same chapter of the same law, and the only
    element they share is being in New York. The corpus expressed the CDPA version as the fact key
    data.subject_is_covered_user, unqualified, and expressed the CDPA operator as
    entity.is_ny_covered_operator — a term the CDPA does not define at all (§ 899-ee(3) defines
    "Operator"), while SAFE for Kids DOES define "Covered operator" at § 1500(7).'
  why_it_matters: 'The keys were not merely vague, they were pointed at the wrong statute. A SAFE for
    Kids atom written naturally against entity.is_ny_covered_operator would have inherited the Child Data
    Protection Act''s duties, and one written against data.subject_is_covered_user would have pulled
    adults into a minor-protection regime or kept minors out of a general one. Every gate would have
    passed: the spans are verbatim, the paths unique, the predicates satisfiable and on filled
    namespaces. Nothing in the system compares a fact key against the definition it stands for.'
  what_was_done: 'Three things, in the order they matter. (1) The CDPA keys were renamed to
    entity.is_ny_cdpa_operator and data.subject_is_cdpa_covered_user, so no key claims a term its
    instrument does not use. (2) SAFE for Kids uses entity.is_ny_addictive_platform_operator, which
    describes what § 1500(7) says rather than borrowing the colliding label. (3) The collision itself is
    now a checked artifact rather than a note: ny.def.covered_user.cdpa and
    ny.def.covered_user.safe_for_kids are definition records whose differs_from is COMPUTED from their
    elements and recomputed by gate 26, so the divergence cannot drift from the words that justify it.
    tools/compute-differs.mjs also had to learn to label each side by CITATION when both drafters used
    the same phrase — it had been labelling by term, which fails precisely on this class.'
  what_is_still_open: 'Nothing connects a fact key to a definition record. The renaming above is a
    convention held by hand, and the next colliding term will be caught the same way this one was — by
    someone reading two statutes at once. A gate that required every entity./data. key used by an
    instrument''s atoms to resolve against a definition record for that instrument would close it, and
    would need a definition corpus far larger than three federal and two New York records.'
  trigger: The next instrument that defines a term another instrument in the corpus already defines.
    Comprehensive state privacy laws will do this constantly.
  risk_if_forgotten: Medium and quiet. The failure is a correct-looking answer about the wrong population.
  status: open_mitigated
