  raw_file: corpus/principles/fipps/raw/apec-privacy-framework-2015-20260818.pdf
  page: 15
  dpi: 200
  covers:
  - subparagraph_marker
  checked: '2026-08-19'
  checked_by: visual read of rendered page
  result: match
  span_sha256_16: 67f47c651021b7d0
  note: Span matches character for character. The a)/b)/c) markers each lead their own item on the page
    — the exact construct the column extractor previously mis-ordered.
