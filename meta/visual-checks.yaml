# VISUAL SPOT-CHECKS
# ==================
purpose: Gate 12. Every other check reads a transformation of the document — poppler's text layer, pdfminer's
  text layer, a regex over either. They can agree and still all be wrong about the same thing, because
  they start from the same content stream. These checks rasterise the page and read the passage back
  off the image.
selection: 'FEATURE-BASED, across every pdf_* source regardless of risk tier. Tier does not predict
  where renderer faults appear: the APEC and Global CBPR Frameworks are the same shape and the same
  tier and only one exposed the baseline-offset bug, and a medium-tier single-column document then produced
  the footnote divergence. Selection follows meta/source-features.yaml — every feature present among
  an instrument''s spans must be covered by at least one check, plus a floor of three checks per instrument,
  capped at the number of spans that exist.'
method: 'python3 tools/visual-sample.py <record_id>   # renders the page at 200dpi, prints the span
  beside it'
span_hash: sha256 of the whitespace-normalised verbatim_span, first 16 hex. Editing a span moves the
  hash and gate 12 demands a fresh check.
checks:
