# RATCHETS, AND WHAT IT COSTS TO MOVE ONE
# ======================================
# Three gates carry a threshold rather than a rule: gate 8 (eval scenario count and pass rate),
# gate 34 (taxonomy leaves neither covered nor ruled out of scope), gate 35 (quoted phrases in
# analysis prose that do not appear in the text they cite). Each is a RATCHET — it is supposed to
# move in one direction only.
#
# Red-teaming 0.1 found the weakness: all three thresholds live in editable places (a key in
# coverage.yaml, a literal in validate.mjs, a regenerable baseline.json) and NOTHING required a
# reason when one moved the wrong way. The gates caught silent regression; they did not catch a
# deliberate, undocumented relaxation, which is the easier mistake to make under deadline.
#
# So the declared value lives here, gate 42 asserts the live value matches it, and moving a
# ratchet the wrong way now means editing this file — a diff with a reason in it.
version: 1
ratchets:
  gate_34_unaccounted_taxonomy_leaves:
    value: 38
    direction: down
    source: meta/coverage.yaml unaccounted_allowance
    last_moved: '2026-08-31'
    last_move_direction: up
    reason: >-
      Removing the third-party framework records under DEC-008 left two leaves (I.B.4, I.C.7) with
      no atoms, so the count rose 36 -> 38. Raised once, deliberately. It resumes falling.
  gate_35_unmatched_quoted_phrases:
    value: 24
    direction: down
    source: tools/validate.mjs const ALLOW
    last_moved: '2026-08-20'
    last_move_direction: down
    reason: Ratcheted 25 -> 24 as the health-tension trio landed clean.
  gate_43_weak_effective_from_basis:
    value: 106
    direction: down
    source: tools/date-basis.mjs --check (api_snapshot + undetermined)
    last_moved: '2026-09-09'
    last_move_direction: down
    reason: >-
      First declaration. 248 records carried an effective_from with no statement of what kind of
      date it was, and the three kinds present are not interchangeable: 73 are stated in the
      instrument's own text, 64 are read off citation apparatus standing in for effectiveness,
      9 are the source API's snapshot date, and 102 are not traceable to anything the repository
      holds. Only the first kind can carry invariant I2's `effective_from > as_of` comparison.
      111 is the population that cannot. It falls as sources are re-walked for a stated date,
      and the nine api_snapshot records — all four N.Y. GBL § 899-aa among them — fall first,
      because a fetch timestamp standing in for an effective date is what made the SHIELD Act
      disappear from a February 2025 query.

      111 -> 106 in the same change. The eCFR point-in-time pass (tools/ecfr-vintages.mjs)
      established a fifth and strongest basis, versioner_evidence: the source's own version
      history showing when THIS SPAN first appeared. Ten records now carry it. Every other basis
      is evidence about the instrument, and a span can be far younger than the rule containing
      it — 47 C.F.R. s 64.1200(d)(3) dates from 2003 and the words this corpus quotes replaced
      "30 days" with "ten (10) business days" in April 2025.
  gate_8_eval_scenarios:
    value: 30
    direction: up
    source: evals/baseline.json scenarios
    last_moved: '2026-08-31'
    last_move_direction: down
    reason: >-
      Three scenarios asserted over records removed under DEC-008 and a fourth was narrowed;
      31 -> 30. Rebaselined deliberately, recorded in DEC-008.
