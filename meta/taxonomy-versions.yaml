# ---------------------------------------------------------------------------
# COORDINATE SCHEME — read this before assigning any atom a taxonomy coordinate.
#
# the source taxonomy v2.6.1 / v4.2.0 do NOT use the nested outline format (e.g. "II.C.h",
# "I.A.d.vii") that BRIEF.md and CORPUS-MANIFEST.md assume. Per the legal-domain taxonomy
# page 2: "Instead of the former outline format we used for our bodies of
# knowledge, we now represent the taxonomy content as a series of competencies and
# performance indicators."
#
# the source taxonomy numbers COMPETENCIES only (I.A, I.B, II.C ...). Performance indicators are
# unnumbered bullets beneath each competency.
#
# This repo therefore uses:   <DOMAIN>.<COMPETENCY>.<PI-ORDINAL>     e.g. II.C.4
#
#   - "II.C"  is the source taxonomy’s own competency code. Authoritative.
#   - ".4"    is OUR ordinal, assigned by the PI's order of appearance in the
#             PDF. NOT authoritative. It is stable only against this taxonomy version.
#
# On any taxonomy version bump, PI ordinals MUST be re-derived and every atom's
# subject.domain coordinate re-validated. tools/validate.mjs gate 6 checks presence,
# not semantic stability — that check is human.
# ---------------------------------------------------------------------------
coordinate_scheme:
  format: "<DOMAIN>.<COMPETENCY>.<PI_ORDINAL>"
  competency_code_authoritative: true
  pi_ordinal_authoritative: false
  pi_ordinal_stable_for_version_only: true
