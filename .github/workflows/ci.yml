# EVERY GATE, ON EVERY PUSH. The 38 gates in tools/validate.mjs are the reason anything in
# corpus/ can be trusted, and until now nothing ran them except a person remembering to.
# `npm test` already exits non-zero correctly, so this file is thin on purpose.
name: gates

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The extractors shell out to pdftotext for every PDF-sourced record, and the dual-parse
      # gate needs a SECOND, independent renderer or it would compare a rendering with itself.
      - name: Install renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet pyyaml pdfplumber

      - run: npm ci

      # 14 checks: gate fixtures, extractor conformance, dual-parse, authority tiering, feature
      # scan, engine/schema correspondence, the gates themselves, ancestry, coverage freshness,
      # taxonomy geometry, engine properties, MCP, workflows.
      - run: npm test

      # Separate step so a corpus regression is distinguishable from a harness failure.
      - name: Evals
        run: node evals/runner.mjs
