<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="How a query is answered">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ttl { font-size: 15px; font-weight: 700; fill: #111827; }
    .bx  { font-size: 12.5px; font-weight: 600; fill: #111827; }
    .sm  { font-size: 10.5px; fill: #6b7280; }
    .box { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    .det { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .llm { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .ar  { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .ttl,.bx { fill: #f3f4f6; } .sm { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .det { fill: #312e81; stroke: #818cf8; }
      .llm { fill: #78350f; stroke: #fbbf24; }
    }
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/></marker></defs>

  <text x="16" y="26" class="ttl">Steps 1–6 are code. The model never computes — it writes over a computed result.</text>

  <rect x="16"  y="52" width="132" height="62" rx="6" class="box"/>
  <text x="30" y="76" class="bx">Facts in</text>
  <text x="30" y="94" class="sm">entity · data · event</text>
  <text x="30" y="108" class="sm">+ as_of (required)</text>

  <rect x="176" y="52" width="270" height="62" rx="6" class="det"/>
  <text x="190" y="74" class="bx">Deterministic solver</text>
  <text x="190" y="91" class="sm">applicability → preemption → exemptions</text>
  <text x="190" y="105" class="sm">42 gates guarantee every span is real</text>

  <rect x="474" y="52" width="184" height="62" rx="6" class="box"/>
  <text x="488" y="74" class="bx">Verified result</text>
  <text x="488" y="91" class="sm">obligations · deadlines</text>
  <text x="488" y="105" class="sm">backstops · stated gaps</text>

  <rect x="686" y="52" width="178" height="62" rx="6" class="llm"/>
  <text x="700" y="74" class="bx">Prose (optional)</text>
  <text x="700" y="91" class="sm">a model may narrate it</text>
  <text x="700" y="105" class="sm">it may not change it</text>

  <path d="M148,83 L172,83" class="ar"/>
  <path d="M446,83 L470,83" class="ar"/>
  <path d="M658,83 L682,83" class="ar"/>

  <rect x="16" y="148" width="848" height="76" rx="6" class="box"/>
  <text x="30" y="171" class="bx">What the solver refuses to do</text>
  <text x="30" y="191" class="sm">• Answer without a date — there is no "current law", only law as of a date (invariant I2)</text>
  <text x="30" y="207" class="sm">• Return pending law as an obligation at any date · surface an unverified record · report silence when no statute applies</text>
</svg>
