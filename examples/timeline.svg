<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img" aria-label="Breach notification deadlines: five business days to the NY Attorney General is the earliest">
  <rect x="0" y="0" width="880" height="296" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">Breach discovered 2 Sept 2026 — every clock the engine computed</text>
  <text x="24" y="55" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">Meridian Health · HIPAA covered entity · no New York office or employees · one New York patient</text>

  <rect x="24" y="76" width="60" height="24" rx="5" fill="#cf222e"/>
  <text x="54" y="93" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Sep 9</text>
  <text x="98" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2328">GBL § 899-aa(9) — 5 business days to the NY Attorney General</text>
  <text x="98" y="105" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#cf222e">Triggered BY notifying HHS. Doing the federal thing correctly started this clock.</text>

  <rect x="24" y="122" width="104" height="22" rx="5" fill="#bc4c00"/>
  <text x="76" y="138" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Sep 16</text>
  <text x="142" y="138" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">6 RCNY § 5-304(b) — LL144 candidate notice, 10 business days</text>

  <rect x="24" y="160" width="216" height="22" rx="5" fill="#0969da"/>
  <text x="132" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Oct 2</text>
  <text x="254" y="176" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">GBL § 899-aa(2) — notify New York residents, 30 days</text>

  <rect x="24" y="198" width="424" height="22" rx="5" fill="#6639ba"/>
  <text x="236" y="214" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Nov 1</text>
  <text x="462" y="214" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">45 C.F.R. § 164.526 — amendment request, 60 days</text>

  <line x1="24" y1="240" x2="856" y2="240" stroke="#d0d7de" stroke-width="1"/>
  <text x="24" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">A company that files with HHS promptly, then works its 30- and 60-day obligations, has already</text>
  <text x="24" y="280" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">missed the earliest deadline on the list by day six. There is no nexus threshold in § 899-aa.</text>
</svg>
