correct_answer: The premise is right and the conclusion is wrong. CBPR is voluntary and creates no freestanding
  legal duty in the United States. But you have published a claim that you adhere to it, and that claim
  is a representation about your privacy practices. If your actual practices depart from it materially,
  that is a deceptive act or practice under FTC Act § 5(a)(1), and the FTC has brought exactly this case
  repeatedly against companies whose certification lapsed or whose conduct diverged from what they advertised.
  The exposure comes from the claim, not from the framework — which also means the cheapest mitigation
  is not leaving CBPR but making the claim accurate and keeping it current. Two riders. There is no private
  right of action under the FTC Act, so the private-plaintiff vehicle is the state UDAP statute and its
  elements differ. And if you are a bank, a Federal credit union, a common carrier or an air carrier,
  § 45(a)(2) puts you outside the Commission's reach entirely — which is not relief from the conduct standard,
  only a change in who enforces it.
all_pass: true
