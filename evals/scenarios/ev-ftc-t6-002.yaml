id: ev.ftc.t6.002
question: We are CBPR-certified and we say so on our website. Our counsel says CBPR is a voluntary framework
  with no force of law in the United States, so certification creates no binding obligation. Is that right?
trap: 'T6, and it is the trap that produces a confidently wrong "you''re fine". The premise is correct
  and the conclusion does not follow. The framework binds nobody by itself — every principle record in
  this corpus carries enforceability_pathway: none, because those documents are addressed to states and
  member economies and offer an organisation nothing to join. But an organisation CAN claim adherence,
  and a public claim of adherence is a representation about privacy practices. Materially departing from
  it is deception under FTC Act § 5. The obligation is not in the scheme; it is in § 5, triggered by the
  claim. A system that answers "no binding obligation" and stops has found the right fact and given the
  wrong advice. SCOPE NARROWED 2026-08-31: criteria asserting over the APEC and Global CBPR scheme records
  were removed with those records, which were sourced from documents this repository no longer redistributes.
  The § 5 backstop this scenario exists to pin is untouched.'
