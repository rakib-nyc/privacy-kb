correct_answer: >-
  No on both counts. 45 C.F.R. § 160.203 makes HIPAA a floor: a contrary State law is preempted
  only where it is LESS protective, and a more stringent State provision survives and runs in
  parallel. So a complete HIPAA programme does not discharge New York duties, and where the two
  set different clocks the shorter governs in practice. Two cautions about this answer. First,
  "more stringent" is assessed provision by provision, not statute by statute, so the same New
  York statute can be preempted in one respect and controlling in another. Second, this corpus
  does not yet contain New York's breach-notification or safeguards statutes, so it cannot tell
  you what those duties are — it can only tell you that they are not displaced. Treat the New
  York layer as unassessed rather than clear.
needs_expert_review: false
all_pass: true
