id: ev.hipaa.t8.001
question: >-
  We are a HIPAA covered entity operating in New York. We have a full HIPAA compliance programme.
  Does complying with the Privacy Rule discharge our New York obligations, and does HIPAA preempt
  the state law?
trap: >-
  T8. HIPAA is a FLOOR, not a ceiling. 45 C.F.R. § 160.203 preserves contrary State law that is
  MORE STRINGENT, so state duties run in parallel rather than being displaced, and where clocks
  differ the shorter one governs in practice. The naive answer treats a federal sectoral statute
  as occupying the field and tells the client they are done. Compounding it, this corpus does NOT
  yet hold New York's breach or safeguards statutes, so the honest answer has to say which state
  duties it cannot assess rather than reporting a clean bill — the system must distinguish "no
  state duty applies" from "this corpus cannot see the state duties".
