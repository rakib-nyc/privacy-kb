correct_answer: >-
  No. §§ 313.13–313.15 suspend named paragraphs, and the paragraph they name for the initial notice
  is § 313.4(a)(2) — the CONSUMER notice, owed before a disclosure to a nonaffiliated third party.
  They do not touch § 313.4(a)(1), the customer notice, which is owed on the relationship alone and
  is still owed to every customer. What you do get is narrower and conditional. The marketing
  disclosure fits § 313.13 only because you have both the initial notice and a contract limiting
  reuse; without the contract there is no exception at all and the disclosure violates
  § 313.10(a)(1). Separately, if the § 313.13 route is the only way you disclose and your policies
  have not changed since your last notice, § 313.5(e)(1) does relieve the annual notice — but that
  relief is contingent on continuing conduct, and one out-of-exception disclosure or one policy
  change restores the duty, with § 313.5(e)(2) then measuring the deadline from the change rather
  than from your anniversary date.
all_pass: true
