id: ev.glba.t1.003
question: >-
  We are a covered dealership. We send customer contact and payment data to an outside marketing firm
  that runs our service-reminder campaigns, under a contract that forbids them using it for anything
  else, and we gave every customer the initial privacy notice. Someone told us that once we are inside
  the §§ 313.13–313.15 exceptions we can stop sending privacy notices. Is that right?
trap: >-
  T1 against a moving target: these exceptions carve out a DISCLOSURE, not a duty set, and they name
  the paragraphs they suspend. § 313.14 and § 313.15 suspend the initial notice at § 313.4(a)(2) by
  its paragraph number — and say nothing about § 313.4(a)(1), the customer notice. The naive answer
  collapses "the initial notice" into one obligation and switches off a duty that is still owed to
  every customer on the lot. The second trap is that § 313.13 is EARNED, not held: strip the contract
  and the disclosure is not partially exempt, it is a bare violation of § 313.10(a)(1). The third is
  § 313.5(e), which does relieve the annual notice for this dealer, but is contingent on continuing
  conduct and is lost by a single out-of-exception disclosure.
