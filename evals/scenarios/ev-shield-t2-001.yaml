id: ev.shield.t2.001
question: >-
  We are a Delaware-incorporated telehealth company operating out of Texas. No New York office, no
  New York employees, one New York patient. We are a HIPAA covered entity and we have just notified
  the Secretary of HHS of a breach. Do we have any New York obligation?
trap: >-
  T2 and T3 at once, and the honest answer is the opposite of the intuitive one twice over. T2:
  SHIELD attaches to holding a New York RESIDENT'S private information — there is no nexus, revenue
  or headcount threshold anywhere in § 899-aa, so one patient is enough and the absence of New York
  operations is irrelevant. T3: the entity has done the federal thing correctly, and doing it is
  what STARTED the state clock. § 899-aa(9) gives a covered entity five BUSINESS days from
  notifying the Secretary to notify the New York attorney general, and it expressly reaches
  breaches of information that is not even "private information" under § 899-aa(1)(b). The naive
  answer — "HIPAA-regulated, HIPAA preempts, we're done" — fails the obligation precisely because
  the federal step was performed. And the compliance-deemed pathway at § 899-aa(2)(b) does not
  rescue it: that provision removes only notice to affected PERSONS and expressly preserves the
  notices to the attorney general and the state police.
