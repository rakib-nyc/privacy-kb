correct_answer: >-
  Yes, two of them, and the second was created by the step you just took. § 899-aa(2) requires you
  to notify the New York resident within thirty days of discovering the breach — the duty attaches
  to holding a New York resident's private information, with no nexus, revenue or headcount
  threshold, so one patient and no New York presence is enough. And § 899-aa(9) requires a covered
  entity that notifies the Secretary of HHS to notify the New York attorney general within five
  BUSINESS days of doing so, expressly including breaches of information that is not "private
  information" under § 899-aa(1)(b). That is the earlier of the two deadlines in practice. If you
  notified affected persons under the HIPAA breach rule, § 899-aa(2)(b) means you need not notify
  those same people again — but it preserves the notices to the attorney general, the department
  of state and the division of state police under § 899-aa(8)(a), and to consumer reporting
  agencies where more than 5,000 residents are involved. HIPAA does not preempt any of this;
  45 C.F.R. § 160.203 makes it a floor, and § 899-aa(10) preempts only local ordinances.
all_pass: true
