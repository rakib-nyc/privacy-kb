id: ev.pra.001
question: A streaming service disclosed our viewing history. Which regulator do we complain to?
trap: Assuming a regulator exists. VPPA has NO agency enforcer at all -- it runs entirely on a private
  right of action with liquidated damages.
trap_category: null
rubric:
- name: the VPPA atom exists
