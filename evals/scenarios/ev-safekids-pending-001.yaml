correct_answer: >-
  Nothing yet, and that is the whole answer as of today. The SAFE for Kids Act is enacted but not in
  force: it sits at N.Y. Gen. Bus. Law article 44-D, §§ 1500–1508, and takes effect 25 January 2027.
  Until then it imposes no obligation, and any tool that returns it as a present duty is wrong.
  What it will require: § 1501(1) makes it unlawful to provide an addictive feed to a covered user
  unless you have used commercially reasonable and technically feasible methods to determine the
  user is not a covered minor, or obtained verifiable parental consent. § 1502 closes a 12 AM–6 AM
  Eastern window on feed notifications to covered minors absent separate consent for nighttime
  notifications. § 1504 forbids degrading or repricing the service because you cannot give that
  user a feed. §§ 1501(3) and (5) confine age-determination and consent data to their purpose and
  require immediate deletion. Two dates matter, not one: § 1508(1) bars the attorney general from
  suing until 180 days after the effective date, which is not a grace period and not a cure period
  — a violation on day one is actionable once the bar lifts. Penalties run to $5,000 per violation
  with disgorgement expressly including destruction of unlawfully obtained data, and there is no
  private right of action, so private plaintiffs go to GBL § 349. Note finally what this corpus
  cannot tell you: §§ 1501(2) and 1501(4) delegate what "commercially reasonable" and "verifiable
  parental consent" actually require to attorney-general regulations at 13 N.Y.C.R.R. Part 700,
  which no structured source serves and which are not held here.
all_pass: true
