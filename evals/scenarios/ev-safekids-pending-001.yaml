- name: the enforcement atom records the SECOND date, not just the first
  record: ny.gbl.1508.1.ag_enforcement
  path: requirement_detail
  contains: TWO DATES, NOT ONE
- name: and refuses the grace-period reading
  record: ny.gbl.1508.1.ag_enforcement
  path: common_errors
