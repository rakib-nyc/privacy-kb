id: ev.safekids.pending.001
question: >-
  We run a social media app with a personalised feed. We have New York users, some of them
  teenagers. New York passed the SAFE for Kids Act. What do we have to do, and by when?
trap: >-
  THE PENDING-LAW TRAP, and it is the one BRIEF.md § 7 names second because training data is dense
  with coverage of this Act from the year it was signed. Every duty in it is real, final and
  quotable — and none of it binds anyone on the date of this query. The article takes effect
  25 January 2027, and § 1508(1) then bars the attorney general from bringing any action for a
  further 180 days, so there are TWO future dates and confusing them is the second error. The
  naive answer states the § 1501 prohibition as a present obligation; the over-corrected answer
  reads the 180 days as a compliance grace period, which it is not — the duties bind on the
  effective date and only the remedy is deferred. Invariant I3 exists for exactly this.
