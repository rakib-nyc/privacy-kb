id: ev.trap.t10.002
question: What is the civil penalty for violating an FTC order? The statute says $10,000.
trap: 'T10: the statutory figure is not the operative one. s45(l) and s45(m) are inflation-adjusted by
  rule and the real number is far higher.'
trap_category: T10
rubric:
- name: the FTC authority record exists
  record_exists: us.authority.ftc
- name: penalties are marked inflation-adjusted
  record: us.authority.ftc
  path: authority.penalty_authority.inflation_adjusted
  equals: true
- name: the note says never to quote the statutory figure as current
  record: us.authority.ftc
  path: authority.penalty_authority.note
  contains: NEVER quote
- name: it is repeated in common_errors where a drafter will see it
  record: us.authority.ftc
  path: common_errors
  contains: $10,000
all_pass: true
