correct_answer: >-
  12 August 2026 — a New York deadline, and it exists only because you complied with the federal
  rule. N.Y. Gen. Bus. Law § 899-aa(9) requires a covered entity that notifies the Secretary of
  HHS to notify the New York attorney general within five BUSINESS days of doing so. You notified
  on 5 August, so the AG filing is due 12 August. The resident-notice duty under § 899-aa(2) runs
  thirty days from DISCOVERY, expiring 31 August, and is subject in addition to "the most expedient
  time possible and without unreasonable delay" — thirty days is a ceiling on that standard, not a
  safe harbour. Three things follow. The next deadline is a state one even though the federal
  notice went out first. § 899-aa(9) expressly reaches breaches of information that is not
  "private information" under § 899-aa(1)(b), so a clinical-data breach with no covered data
  element still triggers it. And HIPAA does not displace any of this: 45 C.F.R. § 160.203 makes it
  a floor, and § 899-aa(10) preempts only local ordinances. If notice to affected persons already
  went out under the HIPAA breach rule, § 899-aa(2)(b) removes the duty to notify those same
  people again — but it expressly preserves the attorney general, department of state and state
  police notices under § 899-aa(8)(a).
all_pass: true
