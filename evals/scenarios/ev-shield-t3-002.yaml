id: ev.shield.t3.002
question: >-
  We are a HIPAA covered entity. We discovered a breach on 1 August 2026 and notified the Secretary
  of HHS on 5 August, inside the federal window. Some of the affected people are New York
  residents. What is our next deadline?
trap: >-
  T3, and this is the case a general model gets backwards. Every instinct says the federal clock
  is the binding one and the state layer is a slower parallel duty to handle afterwards. The
  opposite is true, and the reason is structural rather than arithmetic: N.Y. Gen. Bus. Law
  § 899-aa(9) is triggered BY the act of notifying the Secretary, not by discovery. Doing the
  federal thing correctly on 5 August starts a five-BUSINESS-day New York clock that expires on
  12 August, while the § 899-aa(2) resident-notice clock — thirty days from discovery on 1 August
  — does not expire until 31 August. So the next deadline is a state one, it exists only because
  federal compliance occurred, and an entity that files the federal notice and then turns to "the
  state layer" next quarter has already missed it. Compounding the trap, § 899-aa(9) expressly
  reaches breaches of information that is NOT "private information" under § 899-aa(1)(b), so a
  clinical-data breach with no covered data element still triggers the Albany filing.
