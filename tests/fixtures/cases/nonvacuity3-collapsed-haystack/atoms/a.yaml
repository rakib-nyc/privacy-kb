verbatim_span: Organizations that choose to participate in the CBPR System should implement privacy policies
  and practices consistently with the CBPR program requirements for all personal information that they
  have collected or received that is subject to cross-border transfer to other participating APEC economies10.
  These privacy policies and practices should be evaluated by an APEC-recognized Accountability Agent
  for compliance with the CBPR program requirements. Once an organization has been certified for participation
  in the CBPR System, these privacy policies and practices will become binding as to that participant
  and will be enforceable by an appropriate authority, such as a regulator to ensure compliance with the
  CBPR program requirements.
