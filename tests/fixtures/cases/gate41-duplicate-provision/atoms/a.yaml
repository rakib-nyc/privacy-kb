summary: An operator of an addictive social media platform may not provide an addictive feed to a covered
  user unless it has either used commercially reasonable and technically feasible methods to determine
  the user is not a covered minor, or obtained verifiable parental consent.
requirement_detail: 'THE CENTRAL DUTY OF THE ARTICLE, AND IT IS A DEFAULT-OFF RULE. The chapeau prohibits
  the conduct and the two lettered paragraphs are the only ways out, so the operator carries the burden:
  absent one of them, providing the feed is unlawful. Read the two routes carefully, because they are
  not symmetrical. Paragraph (a) is satisfied by a PROCESS — commercially reasonable and technically feasible
  methods, as the Attorney General defines them by regulation under subdivision 2 — and subdivision 2(d)
  then supplies a presumption that a user the process did not flag is not a covered minor, defeasible
  only by actual knowledge. Paragraph (b) is satisfied by an OUTCOME, verifiable parental consent, and
  it is what an operator needs once it does have actual knowledge. Note what the article does NOT prohibit:
  it does not prohibit minors from using the service, and it does not prohibit personalisation as such.
  It prohibits ONE ranking input — media recommended on the basis of information associated with the user
  — and § 1500(1)(a) through (h) carve out eight ways of ordering a feed that stay lawful, including a
  pre-existing sequence from one source, express subscription, search results and direct private communications.
  THE REGULATIONS ARE THE OPERATIVE DETAIL AND THE CORPUS DOES NOT HOLD THEM. Subdivisions 2 and 4 delegate
  both routes to Attorney General rulemaking at 13 N.Y.C.R.R. Part 700, which is not machine-readable
  anywhere — see meta/blocked-sources.yaml. What "commercially reasonable" means in practice is decided
  there, not here.'
common_errors:
- Treating this as in force. It is not. The article takes effect 25 January 2027 and the Attorney General
  may not sue until 180 days after that.
- Reading paragraph (b) as an alternative an operator may simply choose. It is the route for a user the
  operator knows to be a covered minor; paragraph (a) is the route for everyone else.
- Assuming "covered minor" means any minor. Under § 1500(3) it means a minor the operator has ACTUAL KNOWLEDGE
  is a minor — which is why subdivision 2(d) gives a compliant operator a presumption rather than a safe
  harbour.
- Confusing this instrument's "covered operator" with the Child Data Protection Act's term of the same
  name. They are different definitions in the same chapter of the same law — see ny.def.covered_operator.safe_for_kids.
open_questions:
- 'Whether the Attorney General''s Part 700 regulations, adopted after the article was enacted, narrow
  or widen "commercially reasonable and technically feasible". The corpus cannot answer this: no structured
  source serves NYCRR.'
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all. Subdivision
    2 of § 1507 is a savings construction rather than a preemption clause — it disclaims liability inconsistent
    with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says nothing about anyone else.
    Same posture the corpus records for the CDPA, for the same reason.
