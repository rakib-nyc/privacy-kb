requirement_detail: 'THE CENTRAL DUTY OF THE ARTICLE, AND IT IS A DEFAULT-OFF RULE. The chapeau prohibits
  the conduct and the two lettered paragraphs are the only ways out, so the operator carries the burden:
  absent one of them, providing the feed is unlawful. Read the two routes carefully, because they are
  not symmetrical. Paragraph (a) is satisfied by a PROCESS — commercially reasonable and technically feasible
  methods, as the Attorney General defines them by regulation under subdivision 2 — and subdivision 2(d)
  then supplies a presumption that a user the process did not flag is not a covered minor, defeasible
  only by actual knowledge. Paragraph (b) is satisfied by an OUTCOME, verifiable parental consent, and
  it is what an operator needs once it does have actual knowledge. Note what the article does NOT prohibit:
  it does not prohibit minors from using the service, and it does not prohibit personalisation as such.
  It prohibits ONE ranking input — media recommended on the basis of information associated with the user
  — and § 1500(1)(a) through (h) carve out eight ways of ordering a feed that stay lawful, including a
  pre-existing sequence from one source, express subscription, search results and direct private communications.
  THE REGULATIONS ARE THE OPERATIVE DETAIL AND THE CORPUS DOES NOT HOLD THEM. Subdivisions 2 and 4 delegate
  both routes to Attorney General rulemaking at 13 N.Y.C.R.R. Part 700, which is not machine-readable
  anywhere — see meta/blocked-sources.yaml. What "commercially reasonable" means in practice is decided
  there, not here.'
