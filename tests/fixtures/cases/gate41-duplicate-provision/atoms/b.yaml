common_errors:
- Treating this as in force. It is not. The article takes effect 25 January 2027 and the Attorney General
  may not sue until 180 days after that.
- Reading paragraph (b) as an alternative an operator may simply choose. It is the route for a user the
  operator knows to be a covered minor; paragraph (a) is the route for everyone else.
- Assuming "covered minor" means any minor. Under § 1500(3) it means a minor the operator has ACTUAL KNOWLEDGE
  is a minor — which is why subdivision 2(d) gives a compliant operator a presumption rather than a safe
  harbour.
- Confusing this instrument's "covered operator" with the Child Data Protection Act's term of the same
  name. They are different definitions in the same chapter of the same law — see ny.def.covered_operator.safe_for_kids.
