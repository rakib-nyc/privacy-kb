obligation_type: prohibit
summary: Unfair or deceptive acts or practices in or affecting commerce are unlawful. This is the general
  federal privacy backstop.
requirement_detail: 'THE BACKSTOP THAT NEVER SWITCHES OFF (invariant I6). § 5 has no sector, no data type,
  no size threshold and no notice trigger: it reaches any person, partnership or corporation in or affecting
  commerce, subject only to the § 45(a)(2) carve-outs. In privacy it operates mainly through DECEPTION
  — a material misrepresentation or omission about privacy practices, judged from the perspective of a
  reasonable consumer. Its most important property for this system is that a published privacy notice
  becomes an enforceable commitment through it: the promise is not law, and departing from the promise
  is.'
