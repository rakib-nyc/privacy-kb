common_errors:
- Assuming § 5 needs a sectoral hook. It has none; it is what fills the space when no sectoral statute
  applies.
- Assuming a private plaintiff can sue under § 5. There is no private right of action — the state UDAP
  statute is the private vehicle, and its elements differ.
- Citing FTC v. Wyndham or § 13(b) for monetary relief without noting AMG Capital Management v. FTC (2021),
  which held § 13(b) does not authorise equitable monetary relief.
