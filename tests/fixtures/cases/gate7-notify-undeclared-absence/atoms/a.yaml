summary: A person who takes adverse action against a consumer based in whole or in part on a consumer
  report must give the consumer notice of the adverse action.
requirement_detail: 'THE DUTY THAT BINDS THE USER, not the agency, and it is the FCRA obligation most
  often missed by entities that do not think of themselves as being in the credit business. The trigger
  is broad on both sides: "any adverse action" and "based in whole OR IN PART" on a consumer report —
  a report that contributed to a decision triggers it even if other factors dominated. Employers, landlords
  and insurers are all users, and the employment path additionally requires the pre-adverse-action disclosure
  under § 1681b(b)(3), which this atom does not carry.'
common_errors:
- Reading "based on" as "solely based on". The statute says in whole OR IN PART, so a report that contributed
  at all triggers the notice.
- Assuming only lenders are users. Employers, landlords and insurers take adverse actions on consumer
  reports routinely and owe this notice.
- Confusing this with the CRA-side duties. § 1681m binds the USER of the report; §§ 1681e and 1681i bind
  the agency.
open_questions:
- § 1681b(b)(3) imposes an additional PRE-adverse-action disclosure in the employment context. It is not
  extracted, so an employment-screening analysis built on this atom alone is incomplete — the instrument-coverage
  report names permissible_purposes as present, which does not imply the employment sub-procedure within
  it is.
