preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t
  note: FCRA preempts by ENUMERATED SUBJECT rather than across the board. § 1681t(a) is a savings clause
    preserving state law except where inconsistent; § 1681t(b) then carves out specific subjects — including
    the contents of consumer reports and furnisher duties — where no state requirement may be imposed
    at all. Whether a state law survives is a subject-by-subject question, never an instrument-level one.
