    note: 'FCRA is one of the few federal privacy statutes with a real private right of action, which
      is why it generates far more litigation than GLBA or HIPAA. THE PRIVATE RIGHT IS ROLE-DEPENDENT:
      see the furnisher atoms, where § 1681s-2(c) removes private enforcement of subsection (a) entirely
