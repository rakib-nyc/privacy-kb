common_errors:
- Treating Global CBPR certification as compliance with US law. It is a transfer and accountability mechanism,
  not a defence to any federal or state obligation.
- Assuming the Global CBPR System is the APEC CBPR System. The Global Forum's system is separate and open
  beyond APEC economies, though its principles derive from the APEC Framework.
