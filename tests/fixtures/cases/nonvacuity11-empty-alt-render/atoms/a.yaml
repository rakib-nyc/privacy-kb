summary: A voluntary certification system under which an APEC-recognized Accountability Agent evaluates
  an organization's privacy policies and practices against the CBPR program requirements; on certification
  those policies become binding on the organization and enforceable by an appropriate authority.
derived_from:
  record_id: intl.apec.principle.accountability.p32
  relationship: implementation
  note: The CBPR System operationalises the APEC Privacy Framework. Paragraph 32 of the Framework (Accountability)
    is the principle it gives effect to on transfer. Not a textual descendant — ancestry-diff skips implementation
    relationships.
