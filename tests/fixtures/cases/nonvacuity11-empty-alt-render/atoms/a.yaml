scheme:
  id: intl.apec.cbpr_system
  title: APEC Cross-Border Privacy Rules (CBPR) System
  operator: APEC Electronic Commerce Steering Group, through the Cross Border Privacy Rules Joint Oversight
    Panel
  established: '2011'
  certifies: Personal information controllers, for personal information subject to cross-border transfer
    to other participating APEC economies
  adherence_mechanism: certification
  elements:
  - self-assessment
  - compliance review
  - recognition/acceptance
  - dispute resolution and enforcement
  authority_tier: self_regulatory_scheme
accountability_agent:
  role: Assesses an organization's privacy policies and practices against the CBPR program requirements
    and certifies compliance
  recognised_by: APEC, against the Accountability Agent Recognition Criteria
  own_enforcement_power: true
  enforcement_note: Paragraph 24 provides that Accountability Agents "should be able to enforce the CBPR
    program requirements through law or contract". That is a derived power — it runs through contract
    with the certified organization or through domestic law — not an independent regulatory power. Privacy
    Enforcement Authorities enforce separately under domestic law.
