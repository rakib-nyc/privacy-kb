common_errors:
- Treating certification as compliance with US law. It is a transfer and accountability mechanism; it
  displaces no federal or state obligation.
- Reading "enforceable by an appropriate authority" as APEC enforcement. APEC has no enforcement power.
  Enforcement runs through the Accountability Agent's contract and through domestic Privacy Enforcement
  Authorities.
- Confusing this with the Global CBPR System, which is a separate scheme operated by a different body.
