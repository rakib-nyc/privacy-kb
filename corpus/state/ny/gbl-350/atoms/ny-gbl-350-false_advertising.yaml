summary: >-
  False advertising in the conduct of any business, trade or commerce, or in the furnishing of any
  service in New York, is unlawful.
requirement_detail: >-
  THE OTHER HALF OF THE NY UDAP PAIR, and it is narrower than § 349 in subject and identical in
  reach. § 349 covers unfair, deceptive and abusive acts generally; § 350 covers false ADVERTISING
  specifically, and privacy claims are pleaded under both because a privacy notice is an
  advertisement when it appears in marketing material. § 350-e supplies the private action, on the
  same terms as § 349(h). The practical reason to carry both: § 350 reaches a representation made to
  the public at large, where § 349 litigation often turns on whether the plaintiff saw the
  statement.
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 350
  note: State UDAP. No federal statute preempts it; it runs alongside FTC Act § 5 under invariant I6.
enforcement:
  enforcers:
    - state_ag
    - private_litigants
  private_right_of_action: true
  penalty:
    structure: >-
      AG injunction and restitution. Private action under § 350-e: actual damages or $500, whichever
      is greater, with treble damages up to $10,000 for a wilful violation.
    range:
      min: 500
      unit: usd_statutory_minimum
    note: The § 350-e private action is broader in damages than § 349(h) and is pleaded alongside it.
  statute_of_limitations: null
related:
  - ny.gbl.349.a.unlawful
common_errors:
  - >-
    Treating § 350 as redundant with § 349. It is narrower in subject — false advertising — and its
    private action under § 350-e carries a higher statutory floor and treble cap.
  - >-
    Assuming a privacy notice cannot be advertising. Where it appears in marketing material it is,
    and both sections reach it.
