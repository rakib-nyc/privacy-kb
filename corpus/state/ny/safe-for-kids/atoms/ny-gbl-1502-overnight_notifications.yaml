summary: >-
  Between 12 AM and 6 AM Eastern an operator may not send a covered minor notifications concerning
  an addictive feed without verifiable parental consent for nighttime notifications.
requirement_detail: >-
  A CLOCK-BOUND PROHIBITION, and the three qualifiers on it all narrow. The window is fixed in
  EASTERN time, not the user's local time, so a covered minor travelling west is protected on New
  York's clock. The notifications reached are those CONCERNING AN ADDICTIVE FEED — a security alert
  or a direct message is not within the section. And the subject is a COVERED MINOR, which under §
  1500(3) requires actual knowledge, so unlike § 1501(1) this section never engages the
  age-determination route: an operator with no actual knowledge that the user is a minor is not
  prohibited by this section at all. The consent that lifts it is specific. Verifiable parental
  consent to provide an addictive feed under § 1501(1)(b) is not consent to send nighttime
  notifications; the section requires consent "to send such nighttime notifications" in terms.
common_errors:
  - Applying the window in the user's local time zone. The statute says Eastern.
  - Treating § 1501(1)(b) consent as covering this too. It is a separate consent for a separate act.
  - >-
    Reading it as a ban on all overnight notifications. It reaches notifications concerning an
    addictive feed, sent to a covered minor.
open_questions: []
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: >-
    COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all.
    Subdivision 2 of § 1507 is a savings construction rather than a preemption clause — it disclaims
    liability inconsistent with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says
    nothing about anyone else. Same posture the corpus records for the CDPA, for the same reason.
