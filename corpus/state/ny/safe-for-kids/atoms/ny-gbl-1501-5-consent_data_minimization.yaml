summary: >-
  Information collected to obtain verifiable parental consent may be used only for that purpose and
  must be deleted immediately after the attempt.
requirement_detail: >-
  The mirror of subdivision 3, for the other compliance route. Obtaining verifiable parental consent
  means collecting information about a person who is not the user at all — a parent — and often
  information capable of identifying them, so the article confines it to the consent transaction and
  requires deletion on the same immediate clock. READ IT WITH SUBDIVISION 6, which is easy to miss:
  consenting does not buy the parent any access to or control over the child's account or data. The
  consent is a permission the operator needs, not a right the parent acquires.
common_errors:
  - >-
    Keeping the parent's identity document as proof of consent. The proof the operator may keep is
    that consent was obtained; the material collected to verify it must go.
  - >-
    Assuming a parent who grants consent gains access to the child's account. § 1501(6) says the
    opposite in terms.
open_questions: []
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: >-
    COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all.
    Subdivision 2 of § 1507 is a savings construction rather than a preemption clause — it disclaims
    liability inconsistent with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says
    nothing about anyone else. Same posture the corpus records for the CDPA, for the same reason.
enforcement:
