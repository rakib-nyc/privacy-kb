  private_right_of_action: false
  penalty:
    structure: >-
      Attorney General action or special proceeding under § 1508(1): injunction, restitution,
      disgorgement (expressly including destruction of unlawfully obtained data), damages, and civil
      penalties.
    range: Up to $5,000 per violation.
    note: >-
      § 1508(1) bars the Attorney General from bringing any action until 180 days after the
      effective date, so the first day enforcement is available is later than the first day the
      duties bind.
