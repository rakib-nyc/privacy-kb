summary: >-
  Instructions telling parents how to give verifiable parental consent must be available in at least
  the twelve most commonly spoken languages in New York.
requirement_detail: >-
  A LANGUAGE-ACCESS DUTY ON THE CONSENT MECHANISM, which matters because consent is the only route §
  1501(1) leaves open for a user known to be a covered minor. Instructions a parent cannot read are
  a barrier to the child's access, not merely a service defect. The twelve languages are not
  enumerated here: the subdivision incorporates N.Y. Executive Law § 202-a, so the list moves when
  the state's language-access determination moves, and the Attorney General may define it further by
  regulation. Neither the Executive Law section nor the Part 700 regulations are in this corpus, so
  the operative list is a stated gap. WHO OWES IT IS NOT STATED IN TERMS. Subdivision 1 is drafted
  in the passive voice — instructions "shall be made available" — while subdivision 2 names the
  Attorney General expressly for the parallel duty over public guidance. The contrast is the
  strongest textual signal that subdivision 1 falls on the operator, which is the reading recorded
  here, but the text does not say so and the open question is left visible.
common_errors:
  - >-
    Reading "twelve" as a fixed list fixed in this statute. It is a floor — "no fewer than" — and
    the list itself lives in the Executive Law.
open_questions:
  - >-
    Whether § 1506(1) binds the covered operator or the Attorney General. Subdivision 2 names the
    Attorney General expressly and subdivision 1 does not, which is why this record reads it as an
    operator duty — but the sentence has no subject and the Part 700 regulations may settle it.
  - >-
    Which twelve languages. The list comes from N.Y. Executive Law § 202-a, which is not in this
    corpus, and may be further defined by regulations that are not machine-readable anywhere.
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: >-
    COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all.
    Subdivision 2 of § 1507 is a savings construction rather than a preemption clause — it disclaims
    liability inconsistent with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says
    nothing about anyone else. Same posture the corpus records for the CDPA, for the same reason.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Attorney General action or special proceeding under § 1508(1): injunction, restitution,
      disgorgement (expressly including destruction of unlawfully obtained data), damages, and civil
      penalties.
    range: Up to $5,000 per violation.
    note: >-
      § 1508(1) bars the Attorney General from bringing any action until 180 days after the
      effective date, so the first day enforcement is available is later than the first day the
      duties bind.
  statute_of_limitations: null
