summary: >-
  Information collected to determine a covered user's age may be used only for age determination and
  must be deleted immediately after the attempt.
requirement_detail: >-
  A PURPOSE LIMITATION WITH A DELETION CLOCK ATTACHED, and the pairing is the point. The
  age-determination route in § 1501(1)(a) requires an operator to learn something about its users
  that it had no reason to hold before, and this subdivision makes that collection single-purpose
  and short-lived so the compliance mechanism does not become its own privacy harm. The same
  structure repeats at subdivision 5 for verifiable-parental-consent data. The exception is narrow
  and does not widen the permitted purpose: retention necessary for compliance with another New York
  or federal requirement suspends the deletion duty, and nothing more — the data still may not be
  used for anything but age determination.
common_errors:
  - >-
    Reading the exception as a general business-records carve-out. It reaches retention that is
    NECESSARY for compliance with a legal requirement, not retention that is convenient.
  - >-
    Retaining the age signal to improve the age model. That is a purpose other than age
    determination of the user it was collected from.
open_questions: []
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: >-
    COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all.
    Subdivision 2 of § 1507 is a savings construction rather than a preemption clause — it disclaims
    liability inconsistent with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says
    nothing about anyone else. Same posture the corpus records for the CDPA, for the same reason.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Attorney General action or special proceeding under § 1508(1): injunction, restitution,
      disgorgement (expressly including destruction of unlawfully obtained data), damages, and civil
      penalties.
    range: Up to $5,000 per violation.
    note: >-
      § 1508(1) bars the Attorney General from bringing any action until 180 days after the
      effective date, so the first day enforcement is available is later than the first day the
      duties bind.
  statute_of_limitations: null
