verbatim_span: >-
  A covered operator shall not withhold, degrade, lower the quality, or increase the price of any
  product, service, or feature, other than as necessary for compliance with the provisions of this
  article or any rules or regulations promulgated pursuant to this article, to a covered user due to
  the covered operator not being permitted to provide an addictive feed to such covered user under
  subdivision one of section fifteen hundred one of this article.
