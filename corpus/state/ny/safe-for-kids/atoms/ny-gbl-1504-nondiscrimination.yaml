summary: >-
  An operator may not withhold, degrade, lower the quality of, or raise the price of any product,
  service or feature because it is not permitted to give that user an addictive feed.
requirement_detail: >-
  THE ANTI-RETALIATION PROVISION, and it is what stops § 1501 from being optional in practice.
  Without it an operator could comply with the feed prohibition and then charge for the
  non-personalised experience, or degrade it until the user supplied an age or a parent supplied
  consent — which would convert a prohibition into a price. The exception is drawn tightly to
  compliance: differences that are NECESSARY for compliance with this article or its regulations are
  permitted, which is what allows the non-feed experience to differ from the feed experience at all.
  It does not permit differences that are merely a consequence of the user being outside the feed.
  Note the trigger is the operator "not being permitted to provide an addictive feed" under §
  1501(1) — so the protection follows the prohibition. A user who is outside § 1501(1) gets nothing
  from this section.
common_errors:
  - >-
    Reading it as a general non-discrimination rule for minors. It is tied to one cause: the
    operator not being permitted to provide an addictive feed under § 1501(1).
  - >-
    Assuming any difference between the feed and non-feed experience violates it. Differences
    necessary for compliance are expressly permitted.
open_questions: []
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 1507(2)
  note: >-
    COPPA reaches children under 13 and governs the collection of personal information; this article
    reaches minors under 18 and governs how a feed is ORDERED, which COPPA does not address at all.
    Subdivision 2 of § 1507 is a savings construction rather than a preemption clause — it disclaims
    liability inconsistent with 15 U.S.C. § 6502 for operators subject to 15 U.S.C. § 6501, and says
    nothing about anyone else. Same posture the corpus records for the CDPA, for the same reason.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Attorney General action or special proceeding under § 1508(1): injunction, restitution,
      disgorgement (expressly including destruction of unlawfully obtained data), damages, and civil
      penalties.
    range: Up to $5,000 per violation.
    note: >-
      § 1508(1) bars the Attorney General from bringing any action until 180 days after the
      effective date, so the first day enforcement is available is later than the first day the
      duties bind.
  statute_of_limitations: null
