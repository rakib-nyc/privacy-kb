summary: >-
  The Attorney General may sue to enjoin, obtain restitution, disgorgement and damages, and recover
  civil penalties of up to $5,000 per violation — but not until 180 days after the article takes
  effect.
requirement_detail: >-
  TWO DATES, NOT ONE, AND THIS IS THE FIELD MOST OFTEN GOT WRONG. The article takes effect on 25
  January 2027; the Attorney General may not bring an action until 180 days after that. The duties
  bind before the enforcer can move, which is a real interval and not a grace period — a violation
  during it is still a violation and is still actionable once the bar lifts. It is not a cure period
  either: nothing in the section conditions the delay on the operator fixing anything. The remedy
  set is unusually broad for a state consumer statute. Alongside injunction, restitution and damages
  it authorises DISGORGEMENT of profits or gains "including but not limited to the destruction of
  unlawfully obtained data" — an algorithmic-disgorgement remedy of the kind the FTC has pursued by
  consent order, here written into the statute. REACH: the Attorney General may proceed against "any
  person, within or outside the state", which pairs with the § 1507(1) scope rule — an out-of-state
  operator is reachable so long as the conduct occurred in whole or in part in New York. ENFORCEMENT
  IS EXCLUSIVELY PUBLIC. The section creates no private right of action, and no other section of the
  article does either. A New York consumer harmed by a violation is left to GBL § 349, which is why
  the backstop matters here rather than despite it.
common_errors:
  - >-
    Reading the 180 days as a compliance grace period. The duties bind on the effective date; only
    the Attorney General's remedy is deferred.
  - Reading the 180 days as a cure period. Nothing in the section conditions it on remediation.
  - >-
    Assuming a private right of action because the penalty is per-violation. There is none; § 1508
    names only the Attorney General.
