summary: >-
  Regardless of the method used, the breach notice must include the notifier's contact information,
  the telephone numbers and websites of the relevant state and federal agencies, and a description
  of the categories of information involved.
requirement_detail: >-
  CONTENT IS A SEPARATE DUTY FROM TIMING AND FROM METHOD, and it is the one a rushed breach response
  drops. Subdivision 5 fixes the permitted methods, subdivision 2 the clock, and this subdivision
  what the notice must actually say — including a requirement no federal breach rule imposes: the
  phone numbers and websites of the relevant state and federal agencies. A notice that is timely,
  correctly delivered and silent about which elements of private information were involved violates
  this subdivision on its own.
common_errors:
  - >-
    Treating a timely notice as a compliant one. Subdivision 7 imposes independent content
    requirements.
  - Omitting the agency contact details. New York requires them; the HIPAA and GLBA notices do not.
open_questions: []
no_deadline_stated: >-
  Subdivision 7 fixes CONTENT, not timing — it opens "Regardless of the method by which notice is
  provided". The clock for the notice it describes lives in subdivision 2 (thirty days from
  discovery) and is carried by that atom. Checked subdivision 7 in full; it states no interval.
