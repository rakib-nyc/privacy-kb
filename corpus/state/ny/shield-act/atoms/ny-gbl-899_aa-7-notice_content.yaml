preemption:
  posture: ceiling
  authority: N.Y. Gen. Bus. Law § 899-aa(10)
  note: >-
    CEILING as to LOCAL law only. Subdivision 10 makes § 899-aa exclusive and preempts local
    ordinances, forbidding a locality from imposing anything more restrictive. It says nothing about
    federal law and does not displace it — federal breach regimes run alongside, which is what
    subdivision 2(b) is about.
enforcement:
