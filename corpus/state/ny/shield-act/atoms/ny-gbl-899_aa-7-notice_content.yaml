verbatim_span: >-
  Regardless of the method by which notice is provided, such notice shall include contact
  information for the person or business making the notification, the telephone numbers and websites
  of the relevant state and federal agencies that provide information regarding security breach
  response and identity theft prevention and protection information, and a description of the
  categories of information that were, or are reasonably believed to have been, accessed or acquired
  by a person without valid authorization, including specification of which of the elements of
  personal information and private information were, or are reasonably believed to have been, so
  accessed or acquired.
