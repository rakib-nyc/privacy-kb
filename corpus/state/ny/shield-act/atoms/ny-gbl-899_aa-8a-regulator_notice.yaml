verbatim_span: >-
  In the event that any New York residents are to be notified, the person or business shall notify
  the state attorney general, the department of state, the division of state police, and the
  department of financial services as to the timing, content and distribution of the notices and
  approximate number of affected persons and shall provide a copy of the template of the notice sent
  to affected persons; provided, however, that notice to the department of financial services shall
  only be required if the person or business is a covered entity, as defined in 23 NYCRR 500.1, and
  provided further that such notice shall be provided to the department of financial services in
  compliance with 23 NYCRR 500.17. Such notice shall be made without delaying notice to affected New
  York residents.
