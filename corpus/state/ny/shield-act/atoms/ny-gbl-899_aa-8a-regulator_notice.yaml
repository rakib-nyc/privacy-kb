obligation_type: notify
summary: >-
  Where any New York residents are to be notified, the business must also notify the Attorney
  General, the Department of State and the Division of State Police, and must give them the timing,
  content and distribution of the notices, the approximate number of affected persons and a copy of
  the notice template.
requirement_detail: >-
  THIS IS A SEPARATE, MANDATORY DUTY AND IT IS THE ONE MOST OFTEN MISSED. Notifying the affected
  residents does not discharge it. It is triggered by the fact that residents are to be notified at
  all, with no headcount threshold anywhere in the paragraph — one New York resident is enough. WHAT
  MUST BE SENT IS MORE THAN A HEADS-UP. Four things are enumerated: the timing, content and
  distribution of the notices; the approximate number of affected persons; and a copy of the
  template actually sent to residents. An entity that emails the Attorney General to say a breach
  occurred has not complied. THE FOURTH RECIPIENT IS CONDITIONAL. The Department of Financial
  Services is notified only if the business is a covered entity as defined in 23 NYCRR 500.1, and
  that notice must be given in compliance with 23 NYCRR 500.17. The other three recipients are
  unconditional. IT MUST NOT DELAY THE RESIDENT NOTICE. The closing sentence forecloses the
  sequencing a business might otherwise prefer — regulator first, then residents — and means the two
  run together rather than in series. The § 899-aa(2) exemption for an inadvertent disclosure
  removes notice to affected persons only. Where that carve-out is claimed for more than 500
  residents, § 899-aa(2)(a) separately requires the written determination to go to the Attorney
  General within ten days.
exemptions: []
common_errors:
  - >-
    Treating notice to residents as discharging the regulator duty. They are separate, and this one
    has no threshold.
  - >-
    Sending a bare notification. The paragraph enumerates timing, content, distribution, approximate
    number affected, and a copy of the template.
  - >-
    Notifying the Department of Financial Services reflexively. That recipient is conditional on
    being a covered entity under 23 NYCRR 500.1.
  - >-
    Notifying regulators first and residents afterwards. The paragraph forbids the regulator notice
    from delaying the resident notice.
open_questions:
  - >-
    23 NYCRR Part 500, which supplies both the covered-entity definition at 500.1 and the notice
    mechanics at 500.17, is not in the corpus.
no_deadline_stated: >-
  The statute sets NO period for this notice. It times the duty only by forbidding it to delay the
  notice to affected residents, so it runs alongside the thirty-day clock in § 899-aa(2) rather than
  after it. Recording a computed due date would invent a deadline the legislature did not set, and a
  zero-day clock would head every breach timeline as though it were the most urgent item.
context_not_required: >-
  Subdivision 8(a) states the whole duty: the trigger, the four recipients, exactly what must be
  reported, the copy requirement, the condition on the Department of Financial Services notice, and
  the rule that it must not delay notice to residents.
