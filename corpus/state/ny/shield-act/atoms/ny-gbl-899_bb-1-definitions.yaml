summary: >-
  "Compliant regulated entity" means a person or business subject to and in compliance with GLBA
  regulations, HIPAA/HITECH, 23 NYCRR Part 500, or other federal or New York data security rules.
requirement_detail: >-
  THE DEFINITION THE COMPLIANCE-DEEMED PATHWAY TURNS ON, and the operative words are SUBJECT TO AND
  IN COMPLIANCE WITH. Being regulated is not enough; an entity in breach of its GLBA Safeguards
  obligations is not a compliant regulated entity and gets nothing from § 899-bb(2)(b)(i). That
  makes the New York safeguards duty conditional on federal compliance rather than displaced by
  federal regulation — the inverse of how a preemption analysis would frame it.
common_errors:
  - Reading "subject to" as sufficient. The definition requires actual compliance.
  - Assuming it covers breach notification too. § 899-aa(2)(b) has its own, narrower, deemed route.
