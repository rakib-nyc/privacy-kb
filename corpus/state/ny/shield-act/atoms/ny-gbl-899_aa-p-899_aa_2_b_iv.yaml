    verbatim_span: >-
      If notice of the breach of the security of the system is made to affected persons pursuant to
      the breach notification requirements under any of the following laws, nothing in this section
      shall require any additional notice to those affected persons, but notice still shall be
      provided to the state attorney general, the department of state and the division of state
      police pursuant to paragraph (a) of subdivision eight of this section and to consumer
      reporting agencies pursuant to paragraph (b) of subdivision eight of this section:
    path:
