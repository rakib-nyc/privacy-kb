    citation: N.Y. Gen. Bus. Law § 899-AA(2)(b)
  - position: precedes
    relation: scopes
    verbatim_span: >-
      Any person or business which owns or licenses computerized data which includes private
      information shall disclose any breach of the security of the system following discovery or
      notification of the breach in the security of the system to any resident of New York state
      whose private information was, or is reasonably believed to have been, accessed or acquired by
      a person without valid authorization. The disclosure shall be made in the most expedient time
      possible and without unreasonable delay, provided that such notification shall be made within
      thirty days after the breach has been discovered, except for the legitimate needs of law
      enforcement, as provided in subdivision four of this section.
    path:
      - '2'
    citation: N.Y. Gen. Bus. Law § 899-AA(2)
