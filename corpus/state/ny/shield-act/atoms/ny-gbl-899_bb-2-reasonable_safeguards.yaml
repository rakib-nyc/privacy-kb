summary: >-
  A person or business that owns or licenses computerized data including the private information of
  a New York resident must develop, implement and maintain reasonable administrative, technical and
  physical safeguards.
requirement_detail: >-
  THE STANDING SECURITY DUTY, and unlike § 899-aa it needs no breach to bite. Same extraterritorial
  trigger — holding a New York resident's private information, with no nexus or size threshold — so
  an out-of-state business owes reasonable safeguards continuously. The enforcement route is unusual
  and worth stating: § 899-bb(2)(d) deems a failure to comply a violation of GBL § 349, which is how
  the safeguards duty borrows the UDAP machinery. But § 899-bb(2)(e) says nothing in the section
  creates a private right of action, so the § 349 deeming runs to the attorney general and does NOT
  hand a consumer the § 349(h) private action.
exemptions:
  - id: ny.gbl.899_bb.2.b.i.compliant_regulated_entity
    type: entity_level
    reach: obligation
    scope: >-
      A "compliant regulated entity" — one already subject to and in compliance with GLBA,
      HIPAA/HITECH, 23 NYCRR Part 500, or other state or federal data security regulations — is
      DEEMED compliant with the reasonable-safeguards duty. CONSEQUENCE TEST: reach is obligation,
      not instrument. The entity remains fully covered by § 899-aa breach notification and by every
      other New York duty; only this safeguards obligation is satisfied by the other regime. And it
      is conditional on ACTUAL compliance with that regime, not on being subject to it — an entity
      in breach of its GLBA Safeguards obligations is not a compliant regulated entity and gets
      nothing from this paragraph.
    source_citation: N.Y. Gen. Bus. Law § 899-bb(2)(b)(i)
    verbatim_span: is a compliant regulated entity as defined in subdivision one of this section; or
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_compliant_regulated_entity == true
  - id: ny.gbl.899_bb.2.c.small_business
    type: size_threshold
    reach: obligation
    scope: >-
      A small business satisfies the program requirement if its safeguards are APPROPRIATE FOR ITS
      SIZE AND COMPLEXITY, the nature and scope of its activities, and the sensitivity of the
      information. CONSEQUENCE TEST: this scales the standard rather than switching it off — a small
      business still owes reasonable safeguards and is still fully covered by § 899-aa. Typed
      size_threshold with reach obligation for exactly that reason: nothing about the entity leaves
      the statute.
    source_citation: N.Y. Gen. Bus. Law § 899-bb(2)(c)
    verbatim_span: >-
      A small business as defined in paragraph (c) of subdivision one of this section complies with
      subparagraph (ii) of paragraph (b) of subdivision two of this section if the small business's
      security program contains reasonable administrative, technical and physical safeguards that
      are appropriate for the size and complexity of the small business, the nature and scope of the
      small business's activities, and the sensitivity of the personal information the small
      business collects from or about consumers.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_ny_small_business == true
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 899-bb
  note: >-
    No preemption clause. The section coexists with federal security regimes and expressly builds on
    them through the compliant-regulated-entity route rather than yielding to them.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Failure to comply is DEEMED a violation of GBL § 349 under § 899-bb(2)(d); the attorney
      general may enjoin and obtain civil penalties.
    range: null
    note: >-
      § 899-bb(2)(e): nothing in the section creates a private right of action. The § 349 deeming is
      an AG enforcement route and does not open the § 349(h) private action.
  statute_of_limitations: null
common_errors:
  - >-
    Reading the § 349 deeming as giving consumers a private claim. § 899-bb(2)(e) forecloses it; the
    deeming runs to the attorney general.
  - >-
    Treating the compliant-regulated-entity route as an exemption from SHIELD. It satisfies the
    safeguards duty only — § 899-aa breach notification is untouched.
  - >-
    Assuming being subject to GLBA or HIPAA is enough. The paragraph requires being IN COMPLIANCE
    with it.
