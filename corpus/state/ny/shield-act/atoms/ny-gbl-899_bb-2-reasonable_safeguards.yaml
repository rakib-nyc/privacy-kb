verbatim_span: >-
  Reasonable security requirement. (a) Any person or business that owns or licenses computerized
  data which includes private information of a resident of New York shall develop, implement and
  maintain reasonable safeguards to protect the security, confidentiality and integrity of the
  private information including, but not limited to, disposal of data.
