obligation_type: notify
summary: >-
  Where more than five thousand New York residents are to be notified at one time, the business must
  also notify the consumer reporting agencies of the timing, content and distribution of the notices
  and the approximate number of affected persons.
requirement_detail: >-
  THE THRESHOLD IS ON RESIDENTS NOTIFIED AT ONE TIME, not on the size of the breach. A breach
  touching more people whose notices go out in separate tranches may fall outside this paragraph; a
  smaller breach notified in a single run may fall inside it. Note what is NOT required. Unlike
  subdivision 8(a), this paragraph does not call for a copy of the notice template — only timing,
  content, distribution and the approximate number. The agencies are not named. The statute says
  consumer reporting agencies as a class, which in practice means the nationwide agencies, and
  identifying them is left to the business. As with 8(a), this notice may not delay the notice to
  affected residents.
exemptions: []
common_errors:
  - >-
    Reading the threshold as the number of people affected. It is the number to be notified at one
    time.
  - >-
    Assuming the same package as the Attorney General notice. The template copy is required by 8(a)
    and not by this paragraph.
open_questions:
  - >-
    The statute does not name the consumer reporting agencies, and the corpus holds no record
    identifying which agencies satisfy the duty.
no_deadline_stated: >-
  The statute sets NO period for this notice. It times the duty only by forbidding it to delay the
  notice to affected residents, so it runs alongside the thirty-day clock in § 899-aa(2) rather than
  after it. Recording a computed due date would invent a deadline the legislature did not set, and a
  zero-day clock would head every breach timeline as though it were the most urgent item.
context_not_required: >-
  Subdivision 8(b) states the whole duty: the five-thousand-resident threshold, the recipient class,
  what must be reported, and the rule that it must not delay notice to residents.
