deadline:
  trigger_event: discovery of the breach
  duration:
    value: 30
    unit: calendar_days
  computation: >-
    "In the most expedient time possible and without unreasonable delay", and in any event within
    thirty days after the breach has been DISCOVERED — not after it occurred. The thirty days is an
    outer limit on a reasonableness standard, not a safe harbour: a delay that is unreasonable at
    day ten violates the subdivision even though day thirty has not arrived. Tolled only for the
    legitimate needs of law enforcement under subdivision 4.
summary: >-
  A person or business that owns or licenses computerized data including the private information of
  a New York resident must disclose any breach of the security of the system to that resident,
  within thirty days of discovery.
requirement_detail: >-
  EXTRATERRITORIAL BY DESIGN. The duty attaches to holding a New York RESIDENT'S private
  information, not to doing business in New York — there is no nexus, revenue or headcount threshold
  anywhere in the subdivision. A company with no New York office and one New York customer is
  covered. This is the single most commonly missed feature of the SHIELD Act and it is why a
  federal-only breach analysis is incomplete for almost any consumer-facing business.
exemptions:
  - id: ny.gbl.899_aa.2.a.inadvertent_no_harm
    type: activity_level
    scope: >-
      No notice to affected persons where the exposure was an INADVERTENT disclosure by persons
      authorised to access private information AND the business reasonably determines it will not
      likely result in misuse, financial harm, or emotional harm in the online-credential case.
      CONSEQUENCE TEST: the carve-out is EARNED and documented — the determination must be in
      writing and kept five years, and if over 500 New York residents are affected it must go to the
      attorney general within ten days. So an entity that reaches the right conclusion and writes
      nothing down has not qualified; and invoking it at scale actively creates a filing duty rather
      than removing one.
    source_citation: N.Y. Gen. Bus. Law § 899-aa(2)(a)
    verbatim_span: >-
      Notice to affected persons under this section is not required if the exposure of private
      information was an inadvertent disclosure by persons authorized to access private information,
      and the person or business reasonably determines such exposure will not likely result in
      misuse of such information, or financial harm to the affected persons or emotional harm in the
      case of unknown disclosure of online credentials as found in subparagraph (ii) of paragraph
      (b) of subdivision one of this section. Such a determination must be documented in writing and
      maintained for at least five years. If the incident affects over five hundred residents of New
      York, the person or business shall provide the written determination to the state attorney
      general within ten days after the determination.
    burden_of_proof: entity
    applies_if:
      all:
        - event.disclosure_was_inadvertent == true
        - event.authorized_persons_only == true
        - practice.risk_determination_documented == true
  - id: ny.gbl.899_aa.2.b.other_regime_notice
    type: activity_level
    scope: >-
      If affected persons were notified under GLBA, HIPAA/HITECH, or 23 NYCRR Part 500, no
      ADDITIONAL notice to those persons is required. CONSEQUENCE TEST: this is the narrowest kind
      of compliance-deemed pathway and reading it as an exemption from § 899-aa is the classic
      error. It switches off ONE duty — notice to affected persons — and expressly preserves notice
      to the attorney general, the department of state and the division of state police under
      subdivision 8(a), and to consumer reporting agencies under 8(b). A GLBA-regulated entity that
      notifies its customers and tells nobody in Albany has complied with the federal rule and
      violated this one. Typed activity_level rather than entity_level for exactly that reason: the
      entity stays covered, and only the act of re-notifying the same people falls away.
    source_citation: N.Y. Gen. Bus. Law § 899-aa(2)(b)
    verbatim_span: >-
      If notice of the breach of the security of the system is made to affected persons pursuant to
      the breach notification requirements under any of the following laws, nothing in this section
      shall require any additional notice to those affected persons, but notice still shall be
      provided to the state attorney general, the department of state and the division of state
      police pursuant to paragraph (a) of subdivision eight of this section and to consumer
      reporting agencies pursuant to paragraph
    burden_of_proof: entity
    applies_if:
      all:
        - practice.notified_under_other_breach_regime == true
common_errors:
  - >-
    Treating the thirty days as a safe harbour. The primary standard is "most expedient time
    possible and without unreasonable delay"; thirty days is the ceiling on top of it.
  - Running the clock from the breach. It runs from DISCOVERY.
  - >-
    Requiring a New York presence. The trigger is the residency of the data subject — a business
    with no New York operations and one New York customer is covered.
  - >-
    Reading § 899-aa(2)(b) as an exemption. It removes only notice to affected persons and expressly
    preserves the regulator and CRA notices under subdivision 8.
