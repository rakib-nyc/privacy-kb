preemption:
  posture: ceiling
  authority: N.Y. Gen. Bus. Law § 899-aa(10)
  note: >-
    CEILING as to LOCAL law only. Subdivision 10 makes § 899-aa exclusive and preempts local
    ordinances, forbidding a locality from imposing anything more restrictive. It says nothing about
    federal law and does not displace it — federal breach regimes run alongside, which is what
    subdivision 2(b) is about.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      AG injunction, plus damages for actual costs or losses including consequential financial
      losses. For a knowing or reckless violation, a civil penalty of the greater of $5,000 or up to
      $20 per instance of failed notification, capped at $250,000.
    range:
      min: 5000
      unit: usd_civil_penalty_floor_knowing
    note: >-
      NO PRIVATE RIGHT OF ACTION. § 899-aa(6)(a) gives the action to the attorney general. Private
      plaintiffs reach breach conduct through GBL § 349 and common-law theories instead, which is
      why the two NY instruments are read together.
  statute_of_limitations: >-
    Three years from the earlier of the AG becoming aware of the violation or the date notice was
    sent under § 899-aa(8)(a); never more than six years from discovery of the breach by the
    company, unless the company took steps to hide it.
