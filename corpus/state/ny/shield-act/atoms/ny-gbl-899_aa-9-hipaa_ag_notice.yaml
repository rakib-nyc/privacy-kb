verbatim_span: >-
  Any covered entity required to provide notification of a breach, including breach of information
  that is not "private information" as defined in paragraph (b) of subdivision one of this section,
  to the secretary of health and human services pursuant to the Health Insurance Portability and
  Accountability Act of 1996 or the Health Information Technology for Economic and Clinical Health
  Act, as amended from time to time, shall provide such notification to the state attorney general
  within five business days of notifying the secretary.
