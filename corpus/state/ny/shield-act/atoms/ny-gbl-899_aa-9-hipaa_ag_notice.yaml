summary: >-
  A HIPAA covered entity that notifies the Secretary of HHS of a breach must also notify the New
  York attorney general within five business days.
requirement_detail: >-
  THE CLEAREST PROOF THAT HIPAA IS A FLOOR. This duty is triggered BY federal compliance: notifying
  the Secretary starts a five-business-day New York clock that has no federal counterpart. It also
  expressly reaches breaches of information that is NOT "private information" under subdivision 1(b)
  — so a HIPAA breach of clinical data with no covered data element still triggers the Albany
  filing. An entity that concludes "we are HIPAA-regulated, HIPAA preempts, we are done" fails this
  obligation precisely because it did the federal thing correctly.
exemptions: []
common_errors:
  - Reading it as calendar days. It is five BUSINESS days.
  - >-
    Assuming it only covers "private information". The subdivision says the opposite — it expressly
    includes breaches of information that is not private information as defined in subdivision 1(b).
  - Treating HIPAA compliance as discharging it. Federal compliance is the TRIGGER, not a defence.
