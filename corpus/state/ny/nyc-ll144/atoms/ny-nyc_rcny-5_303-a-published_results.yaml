summary: >-
  Before using an AEDT, an employer or employment agency in the city must publish the date and a
  summary of the most recent bias audit, and the tool's distribution date.
requirement_detail: >-
  PUBLICATION IS A PRECONDITION ON USE, NOT A FOLLOW-UP. The duty attaches BEFORE the tool is used,
  so an employer that deploys first and posts later has already violated it. Subdivision (b) allows
  the requirement to be met by an active hyperlink, and subdivision (c) requires the posting to be
  kept up for at least 6 MONTHS after the latest use of the AEDT for an employment decision — so the
  obligation outlives the use that triggered it.
common_errors:
  - Publishing after deployment. The subdivision says "Before the use of an AEDT".
  - Taking the posting down once use begins. Subdivision (c) requires it to stay up.
open_questions:
  - >-
    THE DOCUMENT STATES NO EFFECTIVE DATE. effective_from is taken from the PDF's own CreationDate
    metadata (5 April 2023), which is evidence about the FILE rather than a statement in the rule.
    New York City rules generally take effect after publication in the City Record, which this
    corpus does not hold. Confirm the operative date against the City Record before relying on any
    as-of query in 2023.
preemption:
  posture: none
  authority: 6 RCNY Subchapter T
  note: >-
    City rule implementing N.Y.C. Admin. Code § 20-870 et seq. No federal statute regulates
    automated employment decision tools as such; Title VII reaches discriminatory OUTCOMES and says
    nothing about auditing a tool in advance.
