summary: >-
  For an AEDT that selects or classifies candidates, the independent auditor must calculate
  selection rates and impact ratios for each category.
requirement_detail: >-
  THIS IS THE METHODOLOGY THE ADMINISTRATIVE CODE DOES NOT CONTAIN. § 20-870 defines a "bias audit"
  as an impartial evaluation including testing for disparate impact, and stops there — what must
  actually be computed lives here, and nowhere else. The chapeau sets the SELECTION branch: it
  governs tools that move candidates forward or classify them, as distinct from subdivision (c),
  which governs tools that SCORE. An employer that applies the wrong branch computes the wrong
  statistic.
common_errors:
  - >-
    Applying this to a scoring tool. Scoring is subdivision (c), which computes a median and a
    scoring rate rather than a selection rate.
open_questions:
  - >-
    THE DOCUMENT STATES NO EFFECTIVE DATE. effective_from is taken from the PDF's own CreationDate
    metadata (5 April 2023), which is evidence about the FILE rather than a statement in the rule.
    New York City rules generally take effect after publication in the City Record, which this
    corpus does not hold. Confirm the operative date against the City Record before relying on any
    as-of query in 2023.
