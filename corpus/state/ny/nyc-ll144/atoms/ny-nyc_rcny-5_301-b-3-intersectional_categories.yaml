summary: >-
  The calculations must separately compute impact on sex categories, race/ethnicity categories, and
  intersectional categories of sex, ethnicity and race.
requirement_detail: >-
  THE INTERSECTIONAL REQUIREMENT IS THE SUBSTANTIVE CORE OF THE AUDIT, and it is the requirement
  most likely to be missed, because sex and race/ethnicity can each look clean while their
  intersection does not. Paragraph (iii) requires the impact ratio for combinations — the rule's own
  illustration compares Hispanic or Latino male candidates against Not Hispanic or Latino Black or
  African American female candidates — so a tool passing both single-axis tests can still fail here.


  THIS PROVISION HAD NO CITABLE PATH UNTIL 2026-08-20. The walker treated bare roman numerals as
  prose and absorbed (i), (ii) and (iii) into this paragraph, so nothing in the corpus could cite
  the intersectional requirement separately. It was recovered by the first nested-PDF extraction;
  see meta/extractor-assumptions.yaml bare-roman-designators.
common_errors:
  - >-
    Auditing sex and race/ethnicity only. Paragraph (iii) requires the intersection, and it is where
    single-axis testing hides disparate impact.
open_questions:
