summary: >-
  It is unlawful to use an automated employment decision tool unless it has been the subject of a
  bias audit conducted no more than one year before its use, and a summary of the results has been
  made publicly available.
requirement_detail: >-
  THE FIRST US LAW REQUIRING AN ALGORITHMIC AUDIT AS A PRECONDITION OF USE, and the structure is
  unusual: it does not prohibit discriminatory outcomes — Title VII already does — it prohibits USE
  WITHOUT AN AUDIT. An employer whose tool is perfectly fair still violates this paragraph by
  deploying it unaudited, and an employer with a poor audit result does not violate it by publishing
  that result. The audit must be by an independent auditor and no more than one year old, which
  makes it recurring rather than a one-time clearance.
common_errors:
  - >-
    Reading it as a discrimination prohibition. It is a process precondition; Title VII governs the
    outcome.
  - Treating the audit as one-time. It must be no more than one year old at the time of use.
  - >-
    Assuming a poor result is itself a violation. The violation is using the tool without an audit,
    or without publishing the summary.
open_questions:
  - >-
    The DCWP implementing rules at 6 RCNY §§ 5-300 et seq. define HOW a bias audit is computed and
    are not in the corpus — amlegal returns 403 to automated requests. An employer asking how to
    audit reaches this atom and learns the answer is one level down. See meta/blocked-sources.yaml.
preemption:
  posture: none
  authority: N.Y.C. Admin. Code § 20-870 et seq.
  note: >-
    City law. No federal or New York State statute reaches automated employment decision tools
    directly, so this fills a gap rather than exceeding a floor — Title VII reaches the
    DISCRIMINATION such a tool may produce, not the tool's use.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Civil penalties under § 20-872; each day of unlawful use is a separate violation and each
      failure to give notice is a separate violation.
    range: null
    note: >-
      § 20-874 preserves other rights of action, so the absence of a private right under this
      subchapter does not foreclose a Title VII or state-law claim.
  statute_of_limitations: null
