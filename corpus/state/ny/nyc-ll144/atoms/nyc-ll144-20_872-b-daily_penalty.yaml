summary: >-
  Each day on which an automated employment decision tool is used in violation of the subchapter
  gives rise to a separate violation.
requirement_detail: >-
  THE PER-DAY STRUCTURE IS WHAT MAKES THIS ENFORCEABLE AGAINST A LARGE EMPLOYER. An unaudited tool
  left running accrues a violation every day it operates, so exposure scales with the delay in
  fixing it rather than with the number of candidates affected — the opposite of the per-contact
  model in TCPA and VPPA. § 20-872(c) then makes each failure to give notice its own separate
  violation, so audit failures and notice failures accumulate on different axes.
common_errors:
  - Modelling exposure per candidate. Use accrues per DAY; notice failures accrue per candidate.
  - Assuming remediation caps historical exposure. Each prior day already gave rise to a violation.
open_questions: []
preemption:
  posture: none
  authority: N.Y.C. Admin. Code § 20-870 et seq.
  note: >-
    City law. No federal or New York State statute reaches automated employment decision tools
    directly, so this fills a gap rather than exceeding a floor — Title VII reaches the
    DISCRIMINATION such a tool may produce, not the tool's use.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Civil penalties under § 20-872; each day of unlawful use is a separate violation and each
      failure to give notice is a separate violation.
    range: null
    note: >-
      § 20-874 preserves other rights of action, so the absence of a private right under this
      subchapter does not foreclose a Title VII or state-law claim.
  statute_of_limitations: null
