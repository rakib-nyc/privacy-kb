  duration:
    value: 1
    unit: years
  computation: >-
    The audit must be no more than one year old AT THE TIME OF USE, and the clock runs from the
    audit, not from deployment. It is a standing condition on continued use rather than a one-off
    precondition — an audit that lapses makes ongoing use unlawful without anything else changing.
exemptions: []
summary: >-
  An employer or employment agency may not use or continue to use an AEDT if more than one year has
  passed since its most recent bias audit.
requirement_detail: >-
  THE WORD THAT DOES THE WORK IS "CONTINUE". § 20-871(a) of the Code makes a bias audit a
  precondition on use; this subdivision makes currency a CONTINUING condition, so the obligation
  does not discharge on first deployment. A tool audited once and left in service becomes unlawful
  on the anniversary, with no act by the employer in between.
common_errors:
  - >-
    Reading the audit as a one-time gate. It expires, and continued use after expiry is itself the
    violation.
  - Assuming the year runs from deployment. It runs from the audit.
open_questions:
  - >-
    THE DOCUMENT STATES NO EFFECTIVE DATE. effective_from is taken from the PDF's own CreationDate
    metadata (5 April 2023), which is evidence about the FILE rather than a statement in the rule.
    New York City rules generally take effect after publication in the City Record, which this
    corpus does not hold. Confirm the operative date against the City Record before relying on any
    as-of query in 2023.
preemption:
  posture: none
  authority: 6 RCNY Subchapter T
  note: >-
    City rule implementing N.Y.C. Admin. Code § 20-870 et seq. No federal statute regulates
    automated employment decision tools as such; Title VII reaches discriminatory OUTCOMES and says
    nothing about auditing a tool in advance.
