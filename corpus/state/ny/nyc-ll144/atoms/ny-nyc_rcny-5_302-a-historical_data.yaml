verbatim_span: >-
  Historical Data. A bias audit conducted pursuant to section 5-301 of this Chapter must use
  historical data of the AEDT. The historical data used to conduct a bias audit may be from one or
  more employers or employment agencies that use the AEDT. However, an individual employer or
  employment agency may rely on a bias audit of an AEDT that uses the historical data of other
  employers or employment agencies only in the following circumstances: if such employer or
  employment agency provided historical data from its own use of the AEDT to the independent auditor
  conducting the bias audit or if such employer or employment agency has never used the AEDT.
