summary: >-
  A bias audit must use historical data OF THE AEDT, which may come from one or more employers using
  it — but an employer may rely on such a multi-employer audit only if it contributed its own data
  or has never used the tool.
requirement_detail: >-
  CORRECTED ON VISUAL CHECK. An earlier draft of this record read the subdivision as requiring the
  employer's OWN data. It does not, and the difference decides whether a vendor audit is usable at
  all. The requirement is historical data "of the AEDT", and the second sentence says in terms that
  it "may be from one or more employers or employment agencies that use the AEDT". Pooled,
  multi-employer data is the norm the rule contemplates, not an exception to it.


  THE RESTRICTION IS ON RELIANCE, NOT ON THE AUDIT. An individual employer may rely on an audit
  built from other employers' data in exactly two circumstances: it gave its own historical data
  from its use of the AEDT to the independent auditor, or it has NEVER used the AEDT. That second
  limb is what lets a first-time adopter rely on a vendor audit, and it closes the moment the tool
  goes into service — after which the employer must be contributing its own data to keep relying on
  the pooled audit.


  Read with subdivision (b), which permits TEST data only where insufficient historical data exists
  to conduct a statistically significant audit, and then requires the summary of results to explain
  why historical data was not used and how the test data was generated.
common_errors:
  - >-
    Reading it as requiring the employer's own data. It requires historical data of the AEDT, which
    may be pooled across employers.
  - >-
    Assuming a first-time adopter cannot use a vendor audit. The never-used limb exists for
    precisely that case.
  - >-
    Continuing to rely on a pooled audit after deployment without contributing data. Once the
    employer has used the tool, the never-used limb no longer applies.
