  computation: >-
    Not less than TEN BUSINESS DAYS before use. One of the few notices in this corpus that must
    PRECEDE the processing by a fixed period rather than accompany it.
exemptions: []
related: []
summary: >-
  An employer or employment agency using an automated employment decision tool must notify each
  candidate or employee residing in the city that the tool will be used, and of the job
  qualifications and characteristics it will assess.
requirement_detail: >-
  A NOTICE THAT MUST ARRIVE BEFORE THE PROCESSING, not with it. The ten-business-day lead time makes
  this operationally unlike every other notice here: a GLBA or HIPAA notice accompanies the
  relationship, and this one has to be planned into the hiring timeline. It also attaches to the
  RESIDENCY of the candidate rather than the location of the employer — the same extraterritorial
  shape as SHIELD § 899-aa, so a company outside the city assessing a city resident is covered.
common_errors:
  - Giving notice at the point of assessment. It must be at least ten business days before.
  - Assuming a non-NYC employer is outside it. The trigger is the candidate residing in the city.
open_questions: []
preemption:
  posture: none
  authority: N.Y.C. Admin. Code § 20-870 et seq.
  note: >-
    City law. No federal or New York State statute reaches automated employment decision tools
    directly, so this fills a gap rather than exceeding a floor — Title VII reaches the
    DISCRIMINATION such a tool may produce, not the tool's use.
enforcement:
  enforcers:
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Civil penalties under § 20-872; each day of unlawful use is a separate violation and each
      failure to give notice is a separate violation.
    range: null
    note: >-
      § 20-874 preserves other rights of action, so the absence of a private right under this
      subchapter does not foreclose a Title VII or state-law claim.
  statute_of_limitations: null
