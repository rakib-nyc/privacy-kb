  computation: >-
    Each permitted method requires notice at least 10 BUSINESS days before use. Business days, not
    calendar — a fortnight of calendar time can be short of ten business days across public
    holidays.
exemptions: []
summary: >-
  Notice to candidates may be given on the employment section of the website, in the job posting, or
  by mail or e-mail — each at least 10 business days before use.
requirement_detail: >-
  THREE ROUTES, ONE CLOCK. The subdivision offers alternative methods and the naive reading is that
  the website route is a standing notice that needs no timing — it is not: every branch carries the
  same 10-business-day lead time. The count is in BUSINESS days, which is the detail most often got
  wrong when a compliance calendar is built in calendar days.
common_errors:
  - Counting calendar days. The rule says business days.
  - >-
    Treating a permanent website notice as satisfying the lead time by itself. Paragraph (1) still
    requires it to be posted at least 10 business days before use.
open_questions:
  - >-
    THE DOCUMENT STATES NO EFFECTIVE DATE. effective_from is taken from the PDF's own CreationDate
    metadata (5 April 2023), which is evidence about the FILE rather than a statement in the rule.
    New York City rules generally take effect after publication in the City Record, which this
    corpus does not hold. Confirm the operative date against the City Record before relying on any
    as-of query in 2023.
preemption:
