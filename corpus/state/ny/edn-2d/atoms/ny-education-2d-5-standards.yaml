verbatim_span: >-
  Data security and privacy standards. a. The commissioner, in consultation with the chief privacy
  officer, shall promulgate regulations establishing standards for educational agency data security
  and privacy policies and shall develop one or more model policies for use by educational agencies.
  The commissioner shall seek the input of experts, including those from security, cyber-security
  and fields in addition to education that have experience with personal data protection, in
  developing such standards and policies. b. The standards for data security and privacy policies
  shall include, but not be limited to:
