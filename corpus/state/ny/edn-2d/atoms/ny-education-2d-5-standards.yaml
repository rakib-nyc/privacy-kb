summary: >-
  The commissioner, in consultation with the chief privacy officer, must promulgate regulations
  establishing standards for educational agency data security and privacy policies.
requirement_detail: >-
  THE DELEGATION THAT PRODUCES 8 N.Y.C.R.R. PART 121, which is where the operational detail of New
  York student-data compliance actually lives — and which this corpus does not hold, because NYCRR
  has no structured source. Recording the delegation rather than the regulations keeps the gap
  visible: a query about what a district must actually DO reaches this atom and learns that the
  answer is one level down and unextracted.
common_errors:
  - >-
    Expecting the operative standards here. They are in 8 N.Y.C.R.R. Part 121, promulgated under
    this subdivision.
  - Treating the absence of Part 121 as meaning there are no standards.
open_questions:
  - >-
    8 N.Y.C.R.R. Part 121 is not in the corpus — NYCRR has no structured source. See
    meta/blocked-sources.yaml.
