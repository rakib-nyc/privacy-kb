summary: >-
  Each third party contractor that receives student data or teacher or principal data must comply
  with the breach and unauthorized-release duties in subdivision 6.
requirement_detail: >-
  THE SUBDIVISION THAT REACHES THE VENDOR DIRECTLY. § 2-d(3) reaches contractors through the
  contract an educational agency must give them; subdivision 6 imposes duties on the contractor
  itself and supplies the civil penalties. So an edtech vendor outside FERPA — not being an
  educational agency — has direct New York exposure here, which is the practical answer to why a
  FERPA-only analysis under-serves a New York district.
common_errors:
  - >-
    Assuming a vendor has no direct exposure because FERPA binds only institutions. Subdivision 6
    binds the contractor.
  - >-
    Treating the § 2-d(3) contract as the whole vendor obligation. It is the entry point, not the
    duty set.
