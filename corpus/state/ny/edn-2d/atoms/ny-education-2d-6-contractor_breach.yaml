verbatim_span: >-
  Breach and unauthorized release of personally identifiable information. a. Each third party
  contractor that receives student data or teacher or principal data pursuant to a contract or other
  written agreement with an educational agency shall be required to notify such educational agency
  of any breach of security resulting in an unauthorized release of such data by the third party
  contractor or its assignees in violation of applicable state or federal law, the parents bill of
  rights for student data privacy and security, the data privacy and security policies of the
  educational agency and/or binding contractual obligations relating to data privacy and security,
  in the most expedient way possible and without unreasonable delay. The educational agency shall,
  upon notification by the third party contractor, be required to report to the chief privacy
  officer any such breach of security and unauthorized release of such data. The chief privacy
  officer shall, upon belief that such breach and unauthorized release constitutes criminal conduct,
  report such breach and unauthorized release to law enforcement in the most expedient way possible
  and without unreasonable delay. b. In the case of an unauthorized release of student data, the
  educational agency shall notify the parent or eligible student of the unauthorized release of
  student data that includes personally identifiable information from the student records of such
  student in the most expedient way possible and without unreasonable delay. In the case of an
  unauthorized release of teacher or principal data, the educational agency shall notify each
  affected teacher or principal of the unauthorized release of data that includes personally
  identifiable information from the teacher or principal's annual professional performance review in
  the most expedient way possible and without unreasonable delay. c. In the case of notification to
  a parent, eligible student, teacher or principal under paragraph b of this subdivision due to the
  unauthorized release of student data by a third-party contractor or its assignee, the third-party
  contractor shall promptly reimburse the educational agency for the full cost of such notification.
  d. Each violation of a third party contractor pursuant to paragraph a of this subdivision shall be
  punishable by a civil penalty of the greater of five thousand dollars or up to ten dollars per
  student, teacher, and principal whose data was released, provided that the latter amount shall not
  exceed the maximum penalty under paragraph (a) of subdivision six of section eight hundred
  ninety-nine-aa of the general business law. e. If the chief privacy officer determines that a
  third party contractor or its assignee, in violation of applicable state or federal law, the data
  privacy and security policies of the educational agency provided by such educational agency to the
  third party contractor and/or binding contractual obligations relating to data privacy and
  security, has released any student data or teacher or principal data received from an educational
  agency to any person or entity not authorized by law to receive such data pursuant to a lawful
  subpoena or otherwise, the chief privacy officer, after affording the third party contractor with
  notice and an opportunity to be heard, shall be authorized to:
