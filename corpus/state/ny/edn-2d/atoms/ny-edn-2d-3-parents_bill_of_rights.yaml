summary: >-
  Each educational agency must publish a parents bill of rights for data privacy and security on its
  website and include it with every contract under which a third-party contractor receives student
  data.
requirement_detail: >-
  NEW YORK EXCEEDS THE FERPA FLOOR HERE, and the mechanism is worth noting because it is unusual:
  FERPA is a funding condition on institutions with no private enforcement, while § 2-d imposes a
  direct publication duty AND reaches THIRD-PARTY CONTRACTORS through the contract-inclusion
  requirement. An edtech vendor that is outside FERPA — it is not an educational agency — is reached
  in New York through the contract its customer must give it. That is the practical answer to why
  FERPA analysis alone under-serves a New York school district.
common_errors:
  - Treating FERPA as the whole analysis for a New York district. § 2-d adds duties FERPA does not.
  - >-
    Assuming a vendor is outside it because it is not an educational agency. The contract-inclusion
    requirement reaches contractors.
open_questions: []
preemption:
  posture: none
  authority: N.Y. Education Law § 2-d
  note: >-
    FERPA is a funding condition rather than a preemptive scheme, so state student-privacy law
    coexists with it; § 2-d is recorded as exceeds_floor for that reason.
