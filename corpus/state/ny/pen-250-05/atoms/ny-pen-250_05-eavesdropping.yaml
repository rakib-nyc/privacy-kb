summary: >-
  A person is guilty of eavesdropping when he unlawfully engages in wiretapping, mechanical
  overhearing of a conversation, or intercepting or accessing an electronic communication.
requirement_detail: >-
  NEW YORK IS A ONE-PARTY CONSENT STATE, and this section is why — but the consent rule is not in
  this text. § 250.05 makes eavesdropping a class E felony and defines it by reference to
  "unlawfully", with the one-party consent limit supplied by the definitions at § 250.00 and the
  requirement that the actor not be a party to the conversation. That matters for session-replay and
  chat-interception claims: plaintiffs have tried to import the California CIPA pattern into New
  York, and the one-party posture is the reason those theories fare differently here. Do not assume
  the CIPA case law transfers.
common_errors:
  - Assuming the California all-party rule applies. New York is one-party consent.
  - Reading § 250.05 alone. The consent limit comes from the § 250.00 definitions, not this section.
