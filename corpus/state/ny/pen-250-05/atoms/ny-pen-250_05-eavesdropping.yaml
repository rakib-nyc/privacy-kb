verbatim_span: >-
  § 250.05 Eavesdropping. A person is guilty of eavesdropping when he unlawfully engages in
  wiretapping, mechanical overhearing of a conversation, or intercepting or accessing of an
  electronic communication. Eavesdropping is a class E felony.
