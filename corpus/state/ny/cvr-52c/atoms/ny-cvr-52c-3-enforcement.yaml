verbatim_span: >-
  The attorney general may enforce the provisions of this section. Any employer found to be in
  violation of this section shall be subject to a maximum civil penalty of five hundred dollars for
  the first offense, one thousand dollars for the second offense and three thousand dollars for the
  third and each subsequent offense.
