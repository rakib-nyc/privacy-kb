summary: >-
  The attorney general may enforce this section, and an employer in violation is subject to
  escalating maximum civil penalties per offence.
requirement_detail: >-
  THE PENALTIES ARE PER OFFENCE AND ESCALATE, which is what makes a notice duty with no private
  right of action worth complying with. Enforcement runs to the attorney general alone — a monitored
  employee has no claim under this section, and would have to reach the conduct through GBL § 349 or
  a common-law theory instead. That asymmetry between a clear statutory duty and no private remedy
  is the same shape as SHIELD § 899-bb, and both are in this corpus.
common_errors:
  - Assuming an employee can sue. § 52-c(3) gives enforcement to the attorney general.
  - Treating the penalty as one-off. It escalates by offence.
