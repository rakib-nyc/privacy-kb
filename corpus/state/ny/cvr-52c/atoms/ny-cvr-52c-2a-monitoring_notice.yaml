summary: >-
  An employer that monitors or intercepts employee telephone, email or internet use by any
  electronic device must give prior written notice upon hiring and post notice conspicuously.
requirement_detail: >-
  THE PROVISION THE PROJECT MANIFEST POINTED AT THE WRONG SECTION FOR. New York requires NOTICE of
  electronic monitoring, not consent — an employer may monitor, but not silently. It pairs with
  Penal Law § 250.00/250.05 in the corpus: New York is a one-party consent state so an employer
  party to a communication may record it, and this section supplies the transparency obligation that
  the criminal statute does not. Note the scope of "employer": any entity with a place of business
  in the state, expressly EXCLUDING the state and its political subdivisions, so public-sector
  employees get nothing from this section.
common_errors:
  - >-
    Reading it as a consent requirement. It requires notice and acknowledgement, not permission —
    the employer may monitor either way.
  - >-
    Assuming public employees are covered. Subdivision 1 excludes the state and its political
    subdivisions.
  - >-
    Citing N.Y. Labor Law § 203-f for this duty. That section is "Inventions made by employees" and
    has nothing to do with monitoring — see meta/debt.yaml DEBT-016.
