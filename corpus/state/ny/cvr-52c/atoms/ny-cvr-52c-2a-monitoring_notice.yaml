verbatim_span: >-
  Any employer who monitors or otherwise intercepts telephone conversations or transmissions,
  electronic mail or transmissions, or internet access or usage of or by an employee by any
  electronic device or system, including but not limited to the use of a computer, telephone, wire,
  radio, or electromagnetic, photoelectronic or photo-optical systems, shall give prior written
  notice upon hiring to all employees who are subject to electronic monitoring. The notice required
  by this subdivision shall be in writing, in an electronic record, or in another electronic form
  and acknowledged by the employee either in writing or electronically. Each employer shall also
  post the notice of electronic monitoring in a conspicuous place which is readily available for
  viewing by its employees who are subject to electronic monitoring.
