summary: >-
  Unfair, deceptive, or abusive acts or practices in the conduct of any business, trade or commerce,
  or in the furnishing of any service in New York, are unlawful.
requirement_detail: >-
  THE NY UDAP BACKSTOP, and it is no longer a deception-only statute. Chapter 708 of the Laws of
  2025 added UNFAIR and ABUSIVE prongs and retitled Article 22-A to match. The reach is 'any
  business, trade or commerce or ... any service in this state' — it is not sector-limited and not
  data-limited, which is why invariant I6 pairs it with FTC Act § 5 as the constraint that never
  switches off.
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 349(g)
  note: >-
    State UDAP. No federal statute preempts it; § 349(g) is itself a non-supersession clause
    preserving other NY law. The FTC-compliance defence at § 349(d) is NOT preemption — it is an
    activity-level complete defence that the defendant must establish.
enforcement:
  enforcers:
    - state_ag
    - private_litigants
  private_right_of_action: true
  penalty:
    structure: >-
      AG: injunction and restitution. Private: actual damages or $50, whichever is greater; treble
      up to $1,000 for wilful or knowing violation; discretionary attorney's fees.
    range:
      min: 50
      unit: usd_statutory_minimum
    note: >-
      The private right is NARROWER than the AG's — see the deception-only asymmetry on the
      private-action atom.
  statute_of_limitations: null
