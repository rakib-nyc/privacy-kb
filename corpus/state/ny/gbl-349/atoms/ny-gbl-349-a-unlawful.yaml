common_errors:
  - >-
    TREATING § 349 AS DECEPTION-ONLY. That was true until Chapter 708 of the Laws of 2025. It now
    has three prongs — unfair, deceptive, abusive — matching CFPB UDAAP's structure rather than the
    FTC's two.
  - >-
    Assuming the private right of action expanded with the statute. It did not: § 349(h) still
    reaches only DECEPTIVE acts and practices.
  - >-
    Reading it as a consumer-protection statute limited to consumer transactions. The text says 'any
    business, trade or commerce'.
open_questions:
  - >-
    Chapter 708 of the Laws of 2025 (S8416/S8416A, sponsor Comrie), signed 2025-12-19, amended the
    Article 22-A heading and § 349 and added § 348. A further amendment took effect 2026-04-03.
    Verified against the OpenLegislation bill record and the law updates feed.
