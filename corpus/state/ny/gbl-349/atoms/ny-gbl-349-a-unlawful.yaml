exemptions:
  - id: ny.gbl.349.d.ftc_compliance_defense
    type: activity_level
    scope: >-
      A complete defence for a PARTICULAR act or practice that is subject to and complies with FTC
      rules, regulations or statutes as interpreted by the FTC or the federal courts. CONSEQUENCE
      TEST: if the entity does something adjacent — a different practice not covered by the FTC rule
      it complies with — it REMAINS fully covered by § 349 for that practice. The defence attaches
      to the act, never to the actor, which is why it is activity_level and not entity_level.
    source_citation: N.Y. Gen. Bus. Law § 349(d)
    verbatim_span: >-
      In any action or proceeding brought pursuant to this section it shall be a complete defense
      that the act or practice is, or if in interstate commerce would be, subject to and complies
      with the rules and regulations of, and the statutes administered by, the federal trade
      commission or any official department, division, commission or agency of the United States as
      such rules, regulations or statutes are interpreted by the federal trade commission or such
      department, division, commission or agency or the federal courts.
    burden_of_proof: defendant
    applies_if:
      all:
        - practice.complies_with_ftc_rule == true
  - id: ny.gbl.349.e.media_carrier
    type: activity_level
    scope: >-
      Broadcasters, publishers and printers are outside § 349 FOR THE ACT OF broadcasting,
      publishing or printing someone else's advertisement. CONSEQUENCE TEST: if a broadcaster does
      something adjacent — deceptive billing for its own subscriptions, say — it is FULLY COVERED.
      The trailing clause 'who broadcasts, publishes, or prints the advertisement' is what makes
      this activity_level rather than entity_level; typing it entity_level would wrongly exempt a
      media company's entire consumer-facing business.
    source_citation: N.Y. Gen. Bus. Law § 349(e)
    verbatim_span: >-
      Nothing in this section shall apply to any television or radio broadcasting station or to any
      publisher or printer of a newspaper, magazine or other form of printed advertising, who
      broadcasts, publishes, or prints the advertisement.
    burden_of_proof: defendant
    applies_if:
      all:
        - entity.is_media_carrier == true
        - practice.is_carrying_third_party_advertisement == true
