common_errors:
  - >-
    Analysing NY unfairness without the federal test. The statute expressly imports the FTC Act
    meaning of 'substantial injury'.
  - >-
    Assuming NY unfairness mirrors NY deception doctrine. It does not — it is a three-part balancing
    test, not a materially-misleading standard.
open_questions:
  - >-
    The statute imports the FTC Act meaning of 'substantial injury' but not expressly the other two
    limbs. Whether the whole § 45(n) test travels, or only that term, is not resolved by this text.
    Recorded as an ambiguity rather than assumed.
  - >-
    Chapter 708 of the Laws of 2025 (S8416/S8416A, sponsor Comrie), signed 2025-12-19, amended the
    Article 22-A heading and § 349 and added § 348. A further amendment took effect 2026-04-03.
    Verified against the OpenLegislation bill record and the law updates feed.
