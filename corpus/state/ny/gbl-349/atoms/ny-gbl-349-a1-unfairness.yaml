summary: >-
  An act or practice is unfair when it causes or is likely to cause substantial injury that is not
  reasonably avoidable and is not outweighed by countervailing benefits to consumers or to
  competition.
requirement_detail: >-
  NY's unfairness test is the FTC Act § 45(n) three-part test, and the statute says so: 'substantial
  injury' 'shall have the same meaning as the term "substantial injury" in the federal trade
  commission act, 15 U.S.C. Section 41 et seq.' That cross-reference is LOAD-BEARING — NY unfairness
  cannot be construed without the federal standard, so the two atoms are linked and a change in
  federal § 45(n) doctrine moves NY law with it.
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 349(g)
  note: >-
    State UDAP. No federal statute preempts it; § 349(g) is itself a non-supersession clause
    preserving other NY law. The FTC-compliance defence at § 349(d) is NOT preemption — it is an
    activity-level complete defence that the defendant must establish.
