verbatim_span: >-
  An act or practice is unfair when it causes or is likely to cause substantial injury which is not
  reasonably avoidable and is not outweighed by countervailing benefits to consumers or to
  competition. The term "substantial injury" as used in this subdivision shall have the same meaning
  as the term "substantial injury" in the federal trade commission act, 15 U.S.C. Section 41 et seq.
