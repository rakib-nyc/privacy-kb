summary: >-
  Any person injured by a DECEPTIVE act or practice may sue for injunctive relief and actual damages
  or $50, whichever is greater, with treble damages up to $1,000 for wilful or knowing violation.
requirement_detail: >-
  THE ASYMMETRY THAT MATTERS. The Attorney General reaches all three prongs — unfair, deceptive,
  abusive — but the private right of action in § 349(h) reaches only DECEPTIVE acts and DECEPTIVE
  practices. Chapter 708 expanded the AG's authority without expanding the private cause of action.
  A plaintiff alleging only unfairness or abusiveness has no § 349(h) claim on this text.
preemption:
  posture: none
  authority: N.Y. Gen. Bus. Law § 349(g)
  note: >-
    State UDAP. No federal statute preempts it; § 349(g) is itself a non-supersession clause
    preserving other NY law. The FTC-compliance defence at § 349(d) is NOT preemption — it is an
    activity-level complete defence that the defendant must establish.
