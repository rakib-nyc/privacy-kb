verbatim_span: >-
  In addition to the right of action granted to the attorney general pursuant to this section, any
  person who has been injured by reason of any deceptive act or deceptive practice made unlawful by
  this section may bring an action in such person's own name to enjoin such deceptive act or
  deceptive practice, an action to recover such person's actual damages or fifty dollars, whichever
  is greater, or both such actions. The court may, in its discretion, increase the award of damages
  to an amount not to exceed three times the actual damages up to one thousand dollars, if the court
  finds the defendant willfully or knowingly violated this section. The court may award reasonable
  attorney's fees to a prevailing plaintiff.
