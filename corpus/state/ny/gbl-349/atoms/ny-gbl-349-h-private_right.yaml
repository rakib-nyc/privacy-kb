common_errors:
  - >-
    Assuming the private right expanded with the statute. It did not — § 349(h) is still limited to
    deceptive acts and practices while § 349(a) now covers three prongs.
  - >-
    Treating the $50 floor as the exposure. The real driver is class aggregation plus discretionary
    attorney's fees, not the per-plaintiff minimum.
  - Overlooking that treble damages require a WILFUL OR KNOWING violation and are capped at $1,000.
open_questions:
  - >-
    Whether a practice that is abusive but not deceptive can be pleaded as deceptive is a litigation
    question this text does not answer.
  - >-
    Chapter 708 of the Laws of 2025 (S8416/S8416A, sponsor Comrie), signed 2025-12-19, amended the
    Article 22-A heading and § 349 and added § 348. A further amendment took effect 2026-04-03.
    Verified against the OpenLegislation bill record and the law updates feed.
