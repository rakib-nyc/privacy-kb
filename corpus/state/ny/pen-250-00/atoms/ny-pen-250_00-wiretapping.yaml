verbatim_span: >-
  "Wiretapping" means the intentional overhearing or recording of a telephonic or telegraphic
  communication by a person other than a sender or receiver thereof, without the consent of either
  the sender or receiver, by means of any instrument, device or equipment. The normal operation of a
  telephone or telegraph corporation and the normal use of the services and facilities furnished by
  such corporation pursuant to its tariffs or necessary to protect the rights or property of said
  corporation shall not be deemed "wiretapping."
