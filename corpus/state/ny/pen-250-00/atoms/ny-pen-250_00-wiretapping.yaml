summary: >-
  "Wiretapping" means the intentional overhearing or recording of a telephonic or telegraphic
  communication by a person other than a sender or receiver, without the consent of a sender or
  receiver.
requirement_detail: >-
  THIS IS WHERE NEW YORK'S ONE-PARTY CONSENT RULE ACTUALLY LIVES, FOR TELEPHONIC COMMUNICATION. §
  250.05 makes eavesdropping a felony by reference to "unlawfully", and the content comes from here:
  the definition excludes a person who IS a sender or receiver, and requires absence of consent from
  a sender or receiver — either one. So a party to the call cannot commit the offence by recording
  it, and neither can a third party with one party's consent. Reading § 250.05 alone leaves the
  consent question unanswered, which is exactly the gap that produces California-style
  session-replay theories in New York.


  READ IT WITH § 250.00(2), NOT INSTEAD OF IT. This subdivision reaches TELEPHONIC OR TELEGRAPHIC
  communication only. An in-person conversation is governed by the separate definition of mechanical
  overhearing at subdivision 2, which carries its own consent test and an extra limb this one has no
  analogue for — the actor must not have been present at the conversation. The two were welded into
  a single segmentation leaf until 2026-08-20, and this atom's span carried both; the citation said
  § 250.00(1) while the words included § 250.00(2). See meta/validation-events.yaml VE-007.
common_errors:
  - Looking for the consent rule in § 250.05. It is here, in the definitions.
  - >-
    Assuming all-party consent because the statute is criminal. The definition requires consent of A
    sender or receiver, not both.
  - >-
    Applying this subdivision to an in-person conversation. It reaches telephonic or telegraphic
    communication; the conversation limb is § 250.00(2).
