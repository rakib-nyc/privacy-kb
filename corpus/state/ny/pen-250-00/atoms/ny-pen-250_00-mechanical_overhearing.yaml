summary: >-
  "Mechanical overhearing of a conversation" means intentionally overhearing or recording a
  conversation without the consent of at least one party, by a person not present at it.
requirement_detail: >-
  THE IN-PERSON LIMB, AND IT IS NOT A COPY OF SUBDIVISION 1. Where § 250.00(1) reaches telephonic or
  telegraphic communication, this reaches "a conversation or discussion" — people talking in a room.
  The consent test is the same in substance, "without the consent of at least one party thereto", so
  New York is a one-party-consent state for in-person recording as well.


  THE LIMB WITH NO ANALOGUE IN SUBDIVISION 1 IS THE PRESENCE REQUIREMENT. The actor must be "a
  person not present thereat". A participant physically in the room is outside the definition
  ALTOGETHER — not because they consented, but because they were there. That is a second,
  independent reason a party may record, and it survives even where the consent analysis is
  contested.


  WHY THIS ATOM EXISTS AT ALL: the walker welded subdivisions 1 and 2 into one leaf, so this
  definition had no citable path and the corpus answered questions about in-person recording out of
  the telephonic definition. Recovered 2026-08-20.
common_errors:
  - >-
    Reading § 250.00(1) as covering in-person conversation. It reaches telephonic or telegraphic
    communication only; this subdivision is the conversation limb.
  - >-
    Treating the presence requirement as a consent question. "A person not present thereat" is a
    separate element — a participant in the room is outside the definition however consent falls.
  - Assuming all-party consent. The test is consent of at least one party.
