summary: >-
  A person whose name, portrait, picture, likeness or voice is used within New York for advertising
  or trade purposes without written consent may sue to enjoin the use and recover damages.
requirement_detail: >-
  NEW YORK HAS NO COMMON-LAW RIGHT OF PRIVACY — the Court of Appeals rejected one in Roberson (1902)
  and the legislature responded with §§ 50 and 51, which is why the New York right is entirely
  statutory and narrower than the tort elsewhere. The pair works as prohibition plus remedy: § 50
  makes the use a misdemeanour, § 51 supplies the civil action. VOICE was added by the 2020
  digital-replica amendments, which is what brings synthetic media and voice cloning inside a
  statute otherwise about photographs. Note the requirement of WRITTEN consent — implied or oral
  permission does not satisfy it.
common_errors:
  - >-
    Looking for a New York common-law privacy tort. There is none; Roberson foreclosed it and the
    statute replaced it.
  - Assuming consent can be implied. §§ 50 and 51 require written consent.
  - Treating it as covering photographs only. Voice is expressly included.
