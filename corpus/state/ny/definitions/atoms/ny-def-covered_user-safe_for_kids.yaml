differs_from:
  - id: ny.def.covered_user.cdpa
    difference: >-
      "Covered user" (N.Y. Gen. Bus. Law § 1500(4)) vs "Covered user" (N.Y. Gen. Bus. Law §
      899-ee(1)). Only Covered user (N.Y. Gen. Bus. Law § 1500(4)): excludes carveout operator and
      affiliates. Only Covered user (N.Y. Gen. Bus. Law § 899-ee(1)): includes trigger actual
      knowledge; includes trigger service directed to minors; requires subject is minor. Shared:
      requires located in new york.
