common_errors:
  - >-
    Reading "covered user" here as a minor. It is not. The minor-specific term in this article is
    "covered minor" at § 1500(3), which additionally requires actual knowledge. § 1501(1) is drafted
    against COVERED USER precisely so the duty attaches before the operator knows who is a minor —
    that is what makes the age-determination route necessary.
  - >-
    Carrying this definition into the Child Data Protection Act. Same two words, same chapter of the
    General Business Law, different people. See ny.def.covered_user.cdpa.
