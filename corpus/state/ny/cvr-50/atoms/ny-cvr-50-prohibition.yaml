summary: >-
  A person, firm or corporation that uses a living person's name, portrait, picture, likeness or
  voice for advertising or trade purposes without prior written consent is guilty of a misdemeanor.
requirement_detail: >-
  THE PROHIBITION THE CIVIL ACTION RESTS ON, and holding both is what makes the pair legible. § 50
  is criminal and § 51 civil, they share the same elements, and a § 51 claim therefore rises or
  falls on whether the § 50 conduct occurred. The consent requirement is the operative constraint in
  practice: WRITTEN, and obtained in advance. That is stricter than most publicity statutes and is
  why release paperwork rather than platform terms is the controlling document in a New York
  likeness dispute.
common_errors:
  - Reading § 51 without § 50. The civil action tracks the criminal elements.
  - >-
    Accepting platform terms of service as consent. § 50 requires prior WRITTEN consent from the
    person or, for a minor, a parent or guardian.
