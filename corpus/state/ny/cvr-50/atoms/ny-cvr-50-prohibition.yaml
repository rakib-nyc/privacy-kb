verbatim_span: >-
  § 50. Right of privacy. A person, firm or corporation that uses for advertising purposes, or for
  the purposes of trade, the name, portrait, picture, likeness, or voice of any living person
  without having first obtained the written consent of such person, or if a minor of such minor's
  parent or guardian, is guilty of a misdemeanor.
