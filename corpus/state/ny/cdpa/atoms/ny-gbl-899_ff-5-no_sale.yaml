summary: An operator shall not purchase or sell, or allow a processor or third-party operator to purchase
  or sell, the personal data of a covered user.
requirement_detail: 'A FLAT BAN ON SALE, with no consent route out of it. That is stronger than anything
  else in this corpus: GLBA gives an opt out, COPPA permits disclosure with verifiable parental consent,
  and this subdivision simply forbids the transaction. It also reaches PURCHASE, so the buyer of a minor
  dataset is liable as well as the seller — an unusual posture that puts data brokers inside a statute
  they might read as binding only the collecting operator.'
common_errors:
- Looking for a consent exception. There is none in subdivision 5.
- Assuming it binds only the seller. It reaches purchase as well.
