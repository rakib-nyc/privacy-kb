summary: An operator shall not process, or allow a processor to process, the personal data of a covered
  user except as permitted by the enumerated grounds.
requirement_detail: 'THE CDPA REACHES AN OLDER COHORT THAN COPPA AND FLIPS THE DEFAULT. COPPA governs
  children under 13; a "covered user" here extends to minors under 18, so a service lawfully outside COPPA
  can sit squarely inside this section. And the structure is prohibition-first: processing is barred unless
  a ground applies, where COPPA is built around notice and verifiable parental consent. Note the trigger
  in § 899-ee: actual knowledge that the user is a minor OR a signal from the device, which means a service
  not directed to minors is still reached once it receives the signal.'
common_errors:
- Assuming COPPA compliance answers it. The CDPA covers minors up to 18, where COPPA stops at 13.
- Treating it as consent-based. Subdivision 1 prohibits processing unless a listed ground applies.
- Assuming a service not directed to minors is outside it. § 899-ee reaches actual knowledge OR a device
  signal.
