summary: '"Covered user" means a user known by the operator to be a minor, or using a device or service
  in a manner that signals the user is a minor.'
requirement_detail: THE TRIGGER IS THE WHOLE STATUTE. A service not directed to minors is still reached
  the moment it has actual knowledge OR receives a signal that the user is a minor — so the CDPA cannot
  be avoided by declining to build a child-directed product, which is the standard COPPA posture. That
  makes minor-detection an operational obligation rather than a market-segment decision, and it is why
  § 899-ff(6) starts a thirty-day clock on being INFORMED as well as on determining.
common_errors:
- Treating the CDPA as applying only to child-directed services. Actual knowledge or a signal is enough.
- Assuming COPPA's under-13 line. A covered user extends to minors under 18.
