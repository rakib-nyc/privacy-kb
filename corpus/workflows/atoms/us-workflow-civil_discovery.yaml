scenario: Responding to a civil subpoena or discovery request for personal data. The producing party is
  caught between a discovery obligation and the sectoral regimes governing the data.
constraints:
- statement: HIPAA permits disclosure in judicial proceedings only on stated conditions, so a bare subpoena
    is not sufficient authority to produce PHI.
  from_record: us.cfr.45.164.502.a.use_disclosure_general
  note: null
- statement: '42 C.F.R. part 2 is stricter still: consent given to a HIPAA-regulated recipient does NOT
    carry through to uses in proceedings against the patient.'
  from_record: us.part2.2_13.a.use_disclosure_prohibition
  note: null
- statement: Where the Government is the requester and the records are financial, the Right to Financial
    Privacy Act supplies a procedure with customer notice and a chance to challenge before production.
  from_record: us.rfpa.3402.access_prohibition
  note: null
- statement: A provider of electronic communication service to the public may not divulge contents voluntarily,
    so civil process alone does not reach stored communications held by a third party.
  from_record: us.sca.2702.a1.divulgence_prohibition
  note: null
common_errors:
- Treating a subpoena as authority to produce regulated data. Several regimes require more than process
  — HIPAA requires stated conditions and part 2 requires consent.
- Assuming a protective order cures a part 2 problem. The bar on uses in proceedings against the patient
  is not a confidentiality question.
