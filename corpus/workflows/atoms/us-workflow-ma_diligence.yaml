scenario: Merger, acquisition or divestiture where personal data transfers with the business. No single
  statute governs it; the constraint is assembled from the notice commitments the target made, the sectoral
  regimes it sits in, and the transfer permissions each of those grants.
constraints:
- statement: GLBA permits disclosure of nonpublic personal information in connection with a proposed or
    actual sale, merger, transfer or exchange of a business unit ONLY where the information concerns solely
    consumers of that unit — so a buyer acquiring one division does not thereby acquire the seller's wider
    customer data.
  from_record: us.cfr.16.313.10.a1.disclosure_limit
  note: The permission is § 313.15(a)(6); this atom carries the prohibition it excepts.
- statement: HIPAA has no merger exception. A covered entity transferring PHI in a transaction relies
    on the health care operations permission or on a business associate relationship, and neither survives
    the target ceasing to be a covered entity.
  from_record: us.cfr.45.164_506.c_1
  note: null
- statement: 'The target''s own published privacy notice binds the buyer in practice: a material departure
    from what the target promised is deception under FTC Act § 5, and the promise does not lapse on closing.'
  from_record: us.usc.15.45.a1.public_commitment_deception
  note: null
- statement: Where the target holds New York residents' private information the safeguards duty is continuous
    and transfers with the data — there is no diligence-period suspension.
  from_record: ny.gbl.899_bb.2.reasonable_safeguards
  note: null
common_errors:
- Treating a data room as outside the regimes. Diligence disclosure IS disclosure, and the GLBA merger
  exception is limited to consumers of the unit being sold.
- Assuming the target's privacy notice dies at closing. § 5 exposure runs to the acquirer.
