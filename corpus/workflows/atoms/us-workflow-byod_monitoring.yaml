scenario: Employee-owned device used for work, and employer monitoring of it. No single statute; the constraint
  is the intersection of interception law, workplace notice duties and the sectoral obligations attaching
  to whatever data the device touches.
constraints:
- statement: Interception of a communication requires one party's consent federally, and the employer
    is usually a party or has consent — but roughly a dozen states require ALL-party consent and the stricter
    rule governs the same recording.
  from_record: us.wiretap.2511.2d.one_party_consent
  note: null
- statement: Stored data on the device is the Stored Communications Act's territory, not the Wiretap Act's,
    because interception must be contemporaneous with transmission.
  from_record: us.wiretap.2510.4.intercept_definition
  note: null
- statement: A New York employer monitoring employee email, telephone or internet use must give prior
    written notice on hiring and post it conspicuously — notice, not consent.
  from_record: ny.civil_rights.52c.2a.monitoring_notice
  note: null
- statement: A monitoring policy broad enough to chill protected concerted activity is unlawful even where
    it is a reasonable security measure.
  from_record: us.nlra.157.protected_activity
  note: null
common_errors:
- Relying on device ownership. Who owns the handset does not decide whether an interception is lawful;
  consent and contemporaneity do.
- Treating a signed BYOD policy as consent for every jurisdiction. All-party states are not satisfied
  by the employer being a party.
