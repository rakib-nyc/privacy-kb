scenario: A school district engaging an edtech vendor. FERPA binds the institution and not the vendor,
  so the vendor is reached through contract terms and through state law that addresses it directly.
constraints:
- statement: FERPA is a FUNDING CONDITION on the institution targeting a policy or practice, with no private
    right of action after Gonzaga v. Doe — so it constrains the district, not the vendor.
  from_record: us.ferpa.1232g.b1.disclosure_prohibition
  note: null
- statement: The school-official exception is the route by which a vendor may receive education records
    at all, and it carries conditions the contract has to satisfy.
  from_record: us.ferpa.99_31.a1ia.school_official_exception
  note: null
- statement: 'In New York the vendor is reached DIRECTLY: § 2-d(6) imposes duties on third party contractors
    and supplies civil penalties against them.'
  from_record: ny.education.2d.6.contractor_breach
  note: null
- statement: The parents bill of rights must be included with every contract under which a contractor
    receives student data, which is how the district hands the vendor its obligations.
  from_record: ny.education.2d.3.parents_bill_of_rights
  note: null
common_errors:
- Answering a New York district with FERPA alone. § 2-d adds duties FERPA does not and reaches the vendor
  directly.
- Assuming a vendor outside FERPA is unregulated. It is reached by contract and by state law.
open_questions:
