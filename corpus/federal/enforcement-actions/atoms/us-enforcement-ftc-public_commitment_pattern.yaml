doctrinal_rule: The Commission treats a published privacy representation as enforceable against the entity
  that made it, and a material departure from it as a deceptive act or practice under FTC Act § 5 — without
  any sectoral statute reaching the conduct. This is the enforcement pattern that gives voluntary frameworks
  and certifications their practical force.
