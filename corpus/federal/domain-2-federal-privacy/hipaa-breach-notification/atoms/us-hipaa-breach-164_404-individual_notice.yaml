obligation_type: notify
summary: >-
  Following discovery of a breach of unsecured protected health information, a covered entity must
  notify each affected individual.
requirement_detail: >-
  The duty runs to individuals whose unsecured PHI has been, or is reasonably believed to have been,
  accessed, acquired, used or disclosed in the breach. 'Unsecured' is doing real work: PHI rendered
  unusable, unreadable or indecipherable through an approved method is outside the definition, which
  is why encryption functions as a safe harbour rather than a mitigating factor.
preemption:
  posture: floor
  authority: 42 U.S.C. § 1320d-7
  note: >-
    HIPAA is a FLOOR. More stringent state law is not preempted and runs in parallel — including
    state breach-notification statutes with shorter clocks than 60 days. Complying with HIPAA does
    not discharge a state duty, and the shortest applicable clock governs in practice.
