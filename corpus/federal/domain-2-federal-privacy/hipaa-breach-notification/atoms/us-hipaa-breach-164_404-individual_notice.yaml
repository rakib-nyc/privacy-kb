common_errors:
  - >-
    Treating 60 days as the standard rather than the ceiling. § 164.404(b) requires notice 'without
    unreasonable delay AND in no case later than' 60 days — a 55-day delay with no reason can still
    violate it.
  - >-
    Assuming HIPAA compliance discharges state breach obligations. HIPAA is a floor; state clocks
    are often shorter and run in parallel.
  - >-
    Overlooking that encryption meeting the HHS guidance takes the incident outside 'unsecured PHI'
    entirely, so no notification duty arises.
