  duration:
    value: 60
    unit: calendar_days
  computation: >-
    Sixty days from DISCOVERY under § 164.404(b), which § 164.406 and § 164.408 adopt by
    cross-reference for breaches of 500 or more. Sixty days is an outer limit on "without
    unreasonable delay", not an allowance.
summary: >-
  A covered entity must notify the Secretary following discovery of a breach of unsecured protected
  health information.
requirement_detail: >-
  THE NOTICE THAT STARTS THE NEW YORK CLOCK. § 899-aa(9) gives a covered entity five business days
  from notifying the Secretary to notify the New York attorney general, so this federal duty is the
  TRIGGER for a state one — doing this correctly creates the next deadline rather than discharging
  it.
common_errors:
  - >-
    Assuming Secretary notice is annual for all breaches. § 164.408(b)-(c) split it: 500 or more
    contemporaneously, fewer than 500 within 60 days of the end of the calendar year.
  - Treating it as the last step. For a New York entity it starts a five-business-day state clock.
