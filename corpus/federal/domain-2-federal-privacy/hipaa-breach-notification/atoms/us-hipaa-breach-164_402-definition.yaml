summary: >-
  Breach means the acquisition, access, use or disclosure of protected health information not
  permitted under subpart E which compromises the security or privacy of the information.
requirement_detail: >-
  THE FOUR-FACTOR RISK ASSESSMENT IS WHERE HIPAA BREACH ANALYSIS ACTUALLY HAPPENS. The definition
  creates a PRESUMPTION — an impermissible use or disclosure is a breach unless the covered entity
  demonstrates a low probability of compromise through the assessment at § 164.402(2). The burden
  runs to the entity, so "we concluded it was not a breach" is only an answer if the four factors
  were documented. Note also that this is the gate every downstream duty passes through: no breach,
  no § 164.404 individual notice, no § 164.408 Secretary notice, and therefore no New York §
  899-aa(9) five-business-day clock either.
common_errors:
  - >-
    Treating an impermissible disclosure as automatically notifiable. It is presumed a breach,
    rebuttable by a documented four-factor assessment.
  - Treating "no breach" as a conclusion rather than a demonstration. The burden is on the entity.
