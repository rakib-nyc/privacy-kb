verbatim_span: >-
  For a breach of unsecured protected health information involving more than 500 residents of a
  State or jurisdiction, a covered entity shall, following the discovery of the breach as provided
  in § 164.404(a)(2), notify prominent media outlets serving the State or jurisdiction.
