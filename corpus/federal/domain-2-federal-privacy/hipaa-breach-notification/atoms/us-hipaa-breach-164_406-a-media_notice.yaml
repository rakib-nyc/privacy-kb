  duration:
    value: 60
    unit: calendar_days
  computation: >-
    Sixty days from DISCOVERY under § 164.404(b), which § 164.406 and § 164.408 adopt by
    cross-reference for breaches of 500 or more. Sixty days is an outer limit on "without
    unreasonable delay", not an allowance.
summary: >-
  For a breach involving more than 500 residents of a State or jurisdiction, a covered entity must
  notify prominent media serving that State or jurisdiction.
requirement_detail: >-
  THE THRESHOLD IS PER STATE, NOT NATIONWIDE. 500 residents OF A STATE OR JURISDICTION triggers
  media notice there — so a breach of 2,000 individuals spread thinly across forty states may
  trigger no media notice at all, while one of 600 concentrated in a single state does. Counting
  nationally is the standard error and it fails in the direction of under-notifying.
common_errors:
  - Counting the 500 nationally. The threshold is residents of a State or jurisdiction.
  - Assuming media notice replaces individual notice. It is in addition to § 164.404.
