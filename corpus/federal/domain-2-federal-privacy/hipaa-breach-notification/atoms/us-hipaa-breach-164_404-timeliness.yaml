summary: >-
  Individual breach notification must be made without unreasonable delay and in no case later than
  60 calendar days after discovery.
requirement_detail: >-
  A dual standard, not a single deadline. 'Without unreasonable delay' is the operative obligation;
  the 60-day figure is an outer limit that does not license delay up to it. § 164.412 permits a
  law-enforcement delay, which is the only tolling the rule provides.
preemption:
  posture: floor
  authority: 42 U.S.C. § 1320d-7
  note: >-
    HIPAA is a FLOOR. More stringent state law is not preempted and runs in parallel — including
    state breach-notification statutes with shorter clocks than 60 days. Complying with HIPAA does
    not discharge a state duty, and the shortest applicable clock governs in practice.
