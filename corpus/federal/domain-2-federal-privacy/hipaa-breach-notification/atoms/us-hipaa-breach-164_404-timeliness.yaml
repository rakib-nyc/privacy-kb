common_errors:
  - Reading the rule as a 60-day deadline. It is a promptness standard WITH a 60-day ceiling.
  - >-
    Assuming the clock runs from the breach. It runs from DISCOVERY, and § 164.404(a)(2) deems
    discovery to occur when the breach is known, or would have been known by exercising reasonable
    diligence.
