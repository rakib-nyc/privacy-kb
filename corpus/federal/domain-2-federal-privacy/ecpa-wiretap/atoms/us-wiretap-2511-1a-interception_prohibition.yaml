common_errors:
  - >-
    Assuming one-party consent settles it. Around a dozen states require all-party consent and the
    stricter rule governs.
  - >-
    Applying it to stored messages. Interception must be contemporaneous with transmission; stored
    data is 18 U.S.C. § 2701 et seq.
