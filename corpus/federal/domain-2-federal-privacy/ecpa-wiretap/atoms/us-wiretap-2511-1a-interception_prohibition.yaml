summary: >-
  Any person who intentionally intercepts, endeavors to intercept, or procures another to intercept
  any wire, oral or electronic communication violates the Wiretap Act.
requirement_detail: >-
  THE CORE OF ECPA, and everything practical about it lives in the exceptions rather than here. §
  2511(2)(d) makes one-party consent a complete defence federally, so an employer that is a party to
  the communication, or has consent from one party, is generally outside the statute — but roughly a
  dozen states require ALL-party consent, and the stricter law governs. The business-extension and
  provider exceptions at § 2511(2)(a) do the rest of the work in workplace monitoring. Note the word
  INTERCEPT: acquisition must be contemporaneous with transmission, which is why stored messages are
  the Stored Communications Act's territory and not this one.
