summary: >-
  Telephone or telegraph instruments, equipment or facilities furnished by a provider or by the
  subscriber for connection to the provider's facilities and used in the ordinary course of
  business, or used by a provider or by an investigative or law enforcement officer in the ordinary
  course of duties, are excluded from the term "electronic, mechanical, or other device".
requirement_detail: >-
  THE BUSINESS-EXTENSION ROUTE, and it works by DEFINITION rather than by exception. Because §
  2510(4) requires acquisition "through the use of any electronic, mechanical, or other device",
  equipment excluded here cannot produce an interception at all — the conduct never reaches §
  2511(1), so there is no violation for a court to excuse and no burden on the employer to establish
  an exception. Clause (i) covers instruments furnished by the provider in the ordinary course of
  its business and used by the subscriber or user in the ordinary course of its business, or
  furnished by the subscriber for connection to the provider's facilities; clause (ii) covers the
  provider's own ordinary-course use and a law enforcement officer's use in the ordinary course of
  duties. "Ordinary course" is where the litigation sits: extension monitoring for training or
  quality has fared better than recording that continues once a call is plainly personal, and
  separately purchased recording equipment attached for the purpose has generally not qualified. The
  route is also narrower than it looks, because the text speaks of a TELEPHONE OR TELEGRAPH
  instrument, equipment or facility and does not obviously reach software that copies email or chat
  — which is why modern workplace monitoring is argued on consent under § 2511(2)(d).
