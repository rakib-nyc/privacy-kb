common_errors:
  - >-
    Treating it as an affirmative defence. It is a definitional exclusion: excluded equipment is not
    a "device", so under § 2510(4) no interception occurs in the first place.
  - >-
    Stretching it to general endpoint or network monitoring software. The text reaches a telephone
    or telegraph instrument, equipment or facility and its components.
  - >-
    Reading "in the ordinary course of its business" as whatever the employer has decided to do. It
    qualifies the USE of the equipment, and courts have limited it to monitoring connected to the
    business purpose rather than to monitoring the employer finds convenient.
