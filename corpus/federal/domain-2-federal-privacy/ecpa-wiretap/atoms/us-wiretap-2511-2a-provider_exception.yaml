summary: >-
  It is not unlawful for an operator of a switchboard, or an officer, employee or agent of a
  provider whose facilities are used in the transmission, to intercept, disclose or use that
  communication in the normal course of employment while engaged in an activity that is a necessary
  incident to the rendition of service or to the protection of the provider's rights or property —
  but a provider of wire communication service to the public may not use service observing or random
  monitoring except for mechanical or service quality control checks.
requirement_detail: >-
  THE PROVIDER EXCEPTION, and the second thing an employer reaches for after consent. Its two
  conditions are cumulative and both are narrow: the actor must be an operator, officer, employee or
  agent of a PROVIDER whose facilities are used in the transmission, and the interception must occur
  in the normal course of employment while engaged in an activity that is a NECESSARY INCIDENT to
  rendering the service or to protecting the provider's rights or property. "Necessary incident"
  does the limiting work — monitoring for productivity or general policy compliance is not service
  rendition, and the rights-or-property branch has been read to reach protection of the system
  against fraud, theft and misuse rather than supervision at large. The final clause is a
  PROHIBITION rather than an exception: a provider of wire communication service to the public shall
  not use service observing or random monitoring except for mechanical or service quality control
  checks. An employer running its own internal mail or telephone system is a provider for this
  purpose but is usually not a provider to the public, which is the same distinction that puts it
  outside § 2702. The parallel and often better route is § 2510(5)(a), which removes ordinary-course
  extension equipment from the definition of "device" so that no interception occurs at all.
