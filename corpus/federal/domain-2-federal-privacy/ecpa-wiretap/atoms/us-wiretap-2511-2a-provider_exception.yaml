common_errors:
  - >-
    Importing "ordinary course of business" into this subparagraph. That phrase belongs to §
    2510(5)(a)'s device exclusion; what this text requires is a NECESSARY INCIDENT to the rendition
    of service or to the protection of the provider's rights or property.
  - >-
    Using it to justify listening beyond the incident. The exception covers the activity that is a
    necessary incident, not the remainder of the communication once that purpose is served.
  - >-
    Overlooking the closing clause, which affirmatively bars service observing and random monitoring
    by a provider of wire communication service to the public.
