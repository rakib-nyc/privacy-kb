verbatim_span: >-
  (i) It shall not be unlawful under this chapter for an operator of a switchboard, or an officer,
  employee, or agent of a provider of wire or electronic communication service, whose facilities are
  used in the transmission of a wire or electronic communication, to intercept, disclose, or use
  that communication in the normal course of his employment while engaged in any activity which is a
  necessary incident to the rendition of his service or to the protection of the rights or property
  of the provider of that service, except that a provider of wire communication service to the
  public shall not utilize service observing or random monitoring except for mechanical or service
  quality control checks.
