summary: >-
  "Intercept" means the aural or other acquisition of the contents of any wire, electronic or oral
  communication through the use of any electronic, mechanical or other device.
requirement_detail: >-
  THIS DEFINITION IS THE BOUNDARY BETWEEN THE TWO HALVES OF ECPA, and it is worth reading for what
  it does not say. The text requires ACQUISITION OF CONTENTS THROUGH A DEVICE; the word
  "contemporaneous" appears nowhere in § 2510 or § 2511. The contemporaneity requirement is a
  judicial construction, drawn from reading this definition against § 2510(17)'s separate definition
  of "electronic storage" and against the existence of chapter 121 — if acquiring a stored copy were
  an interception, the Stored Communications Act would be redundant. The courts of appeals have read
  it that way consistently since Steve Jackson Games and Konop, which is why retrieving an email
  from a mailbox or reading a saved chat log is a § 2701 question and not a § 2511 one. Two
  consequences for practice: the same monitoring product falls on either side of the line depending
  on WHEN it takes its copy, and "we intercept nothing, we only read stored data" relocates the
  analysis rather than concluding it. Note also that "contents" is separately defined at § 2510(8),
  so acquiring addressing and signalling data is generally a pen-register question under chapter 206
  rather than a Wiretap Act one.
