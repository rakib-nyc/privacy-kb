common_errors:
  - >-
    Treating contemporaneity as statutory text. It is a construction of this definition read against
    § 2510(17) and the existence of the SCA; the word does not appear in the section.
  - >-
    Applying the Wiretap Act to stored messages. Acquisition of a stored copy is 18 U.S.C. § 2701
    territory, with different elements, different exceptions and a different defendant.
  - >-
    Assuming any acquisition qualifies. The definition requires acquisition of CONTENTS through an
    electronic, mechanical or other device — and § 2510(5) then removes a class of ordinary-course
    equipment from that term entirely.
