common_errors:
  - >-
    Assuming everything sitting on a server is in electronic storage. Subparagraph (A) reaches
    temporary, intermediate storage incidental to transmission and (B) reaches storage for backup
    protection; opened mail left in place fits neither cleanly, and circuits have split on it.
  - >-
    Concluding that a communication outside "electronic storage" is therefore unprotected. It is
    outside §§ 2701 and 2702, which still leaves § 2703(b), contract, state law and the FTC Act § 5
    backstop.
  - >-
    Reading this definition as belonging only to the Wiretap Act because of where it is printed. It
    sits in § 2510 but governs chapter 121, which is the whole mechanism of the intercept/stored
    boundary.
