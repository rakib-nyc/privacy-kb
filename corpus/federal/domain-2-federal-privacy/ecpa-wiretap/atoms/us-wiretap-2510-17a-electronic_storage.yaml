summary: >-
  "Electronic storage" includes any temporary, intermediate storage of a wire or electronic
  communication incidental to its electronic transmission.
requirement_detail: >-
  THE OTHER HALF OF THE ECPA BOUNDARY, and the definition on which the Stored Communications Act
  stands. Subparagraph (A) with (B)'s backup-protection branch fixes the state a communication must
  be in for §§ 2701–2703 to attach, and by § 2711 this definition — written into the Wiretap Act's
  section — is the one chapter 121 uses, which is why the intercept/stored line is drawn by
  comparing definitions rather than by comparing the two chapters' prohibitions. The words are
  narrow on their face: TEMPORARY, INTERMEDIATE storage INCIDENTAL TO the electronic transmission.
  That produces a real gap rather than a drafting curiosity — a message that has been delivered and
  opened but left on the server is arguably neither in temporary intermediate storage nor held for
  backup protection, and the courts have divided on whether it is in "electronic storage" at all.
  Where it is not, § 2701 and § 2702 do not reach it, and the operative constraints fall back to the
  remote-computing-service branch of § 2703(b), contract, state law and FTC Act § 5.
