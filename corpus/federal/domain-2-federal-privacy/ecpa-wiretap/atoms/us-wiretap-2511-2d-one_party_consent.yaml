summary: >-
  It is not unlawful under the Wiretap Act for a person not acting under colour of law to intercept
  a communication where that person is a party, or where one party has given prior consent, unless
  the interception is for the purpose of committing a criminal or tortious act.
requirement_detail: >-
  THE WORKPLACE-MONITORING HINGE. Federally, one-party consent is a complete defence: an employer
  that is itself a party to the call, or that holds prior consent from any one party, is outside the
  Wiretap Act altogether rather than excused within it. Two limits sit inside the text and both are
  missed routinely. The exception is available only to a person NOT ACTING UNDER COLOUR OF LAW — a
  state actor must come within § 2511(2)(c) instead — and the closing proviso withdraws the defence
  where the interception is made for the purpose of committing a criminal or tortious act. Most
  importantly, the federal answer does not end the question: roughly a dozen states require the
  consent of ALL parties to record, and because this chapter sets a floor rather than a ceiling the
  stricter state rule governs the same recording. Note also that the text requires consent GIVEN
  PRIOR to the interception, which is why monitoring programmes are built on
  notice-and-acknowledgement at or before the point of collection.
