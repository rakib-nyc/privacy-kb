common_errors:
  - >-
    Reading the federal one-party rule as the operative rule. § 2511 is a floor; an
    all-party-consent state statute reaches the same recording and is stricter, and a multi-state
    call is generally analysed under the most demanding state involved.
  - >-
    Ignoring the colour-of-law limit. This subsection is available only to a person NOT acting under
    colour of law; interception by or at the direction of law enforcement runs through § 2511(2)(c)
    and its own conditions.
  - >-
    Treating consent as curing everything. The proviso removes the defence entirely where the
    interception is for the purpose of committing a criminal or tortious act.
