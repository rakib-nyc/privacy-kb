summary: >-
  A financial institution may not require a customer authorization for disclosure to a Government
  authority as a condition of doing business.
requirement_detail: >-
  THE ANTI-COERCION RULE, and the only sentence in § 3404 that binds the bank rather than the
  Government. "Such authorization" is the § 3404(a) statement, so the prohibition is specific: a
  financial institution cannot make signing a standing consent to government disclosure a term of
  opening or keeping an account. Without it the § 3404(a) consent route would swallow §§ 3405 to
  3408 entirely, because every customer would have signed away the notice and challenge apparatus at
  account opening — which is exactly what happens under statutes that require consent to be freely
  given but do not say what a refusal may cost. The provision is short and absolute; it admits no
  materiality, proportionality or "necessary for the service" qualifier of the kind that GLBA and
  the state comprehensive statutes use.
