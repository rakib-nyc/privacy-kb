common_errors:
  - >-
    Reading § 3404 as regulating only the Government. Subsection (b) is addressed to the financial
    institution.
  - >-
    Assuming a customer who signed at account opening has consented. If the authorization was
    required as a condition of doing business, § 3404(b) forbids it.
