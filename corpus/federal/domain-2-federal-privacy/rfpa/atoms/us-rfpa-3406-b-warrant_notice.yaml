common_errors:
  - Running the ninety days from receipt of the records. It runs from service of the search warrant.
  - >-
    Drafting the notice freehand. § 3406(b) prescribes the text, including the reference to the
    Right to Financial Privacy Act of 1978.
  - Assuming the customer must actually receive it. The duty is to mail to the last known address.
