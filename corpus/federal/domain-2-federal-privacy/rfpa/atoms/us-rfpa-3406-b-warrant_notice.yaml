obligation_type: notify
summary: >-
  No later than ninety days after serving a search warrant for financial records, the Government
  authority must mail the customer a copy of the warrant together with the statutory notice.
requirement_detail: >-
  THIS IS WHERE THE WARRANT ROUTE PAYS FOR ITS SILENCE. Because § 3406(a) allows production without
  telling the customer, § 3406(b) supplies notice afterwards, and the statute prescribes the words:
  the mailing must include a copy of the warrant and the quoted notice naming the agency, the date
  and the purpose, and pointing the customer to the Right to Financial Privacy Act. The duty is to
  MAIL to the last known address, not to achieve actual notice, so a stale address discharges it.
  Ninety days is an outer limit rather than a target, and § 3406(c) lets a court push it out further
  on the § 3409(a) findings. Note what the notice does not do: by the time it arrives the records
  are already in the Government's hands, so it supports a post hoc remedy rather than the
  pre-production challenge that §§ 3405 and 3407 preserve.
deadline:
  trigger_event: service of the search warrant by the Government authority
  duration:
    value: 90
    unit: calendar_days
  computation: >-
    The period runs from SERVICE of the warrant, not from receipt of the records or from the close
    of the investigation, and it is an outer bound — "no later than ninety days". Compliance is
    measured at mailing to the customer's last known address. § 3406(c) is the only extension: a
    court may delay the mailing, and the delay may not exceed one hundred and eighty days following
    service of the warrant, with additional delays of up to ninety days available on further
    application.
