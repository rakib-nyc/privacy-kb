verbatim_span: >-
  No later than ninety days after the Government authority serves the search warrant, it shall mail
  to the customer’s last known address a copy of the search warrant together with the following
  notice: “Records or information concerning your transactions held by the financial institution
  named in the attached search warrant were obtained by this (agency or department) on (date) for
  the following purpose: . You may have rights under the Right to Financial Privacy Act of 1978 [ 12
  U.S.C. 3401 et seq.].”.
