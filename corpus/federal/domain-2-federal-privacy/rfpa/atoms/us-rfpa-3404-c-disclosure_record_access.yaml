common_errors:
  - >-
    Treating it as a right to an accounting of all government access. It reaches only disclosures
    made under § 3404, the customer-authorization route.
  - >-
    Overlooking § 3409. A court order obtained by the Government authority suspends the customer's
    right to the record.
  - >-
    Assigning the record-keeping duty to the Government. The statute says the FINANCIAL INSTITUTION
    shall keep the record.
