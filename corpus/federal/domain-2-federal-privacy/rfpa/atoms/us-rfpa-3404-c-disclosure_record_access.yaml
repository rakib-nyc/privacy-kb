summary: >-
  The financial institution must keep a record of every disclosure to a Government authority made
  under § 3404, and the customer may obtain a copy of it — including the identity of the receiving
  authority — unless the Government obtains a § 3409 court order.
requirement_detail: >-
  AN ACCOUNTING OF DISCLOSURES, ENACTED IN 1978. The subsection does two things at once: it
  presupposes a duty on the financial institution to KEEP a record of every § 3404 disclosure, and
  it gives the customer a right to a COPY of that record naming the Government authority. That is
  the same mechanism HIPAA would adopt as the accounting of disclosures at 45 C.F.R. § 164.528
  fifteen years later, sitting inside a government-access statute rather than a health one. Two
  limits matter. The right reaches disclosures made "pursuant to this section" — the
  customer-authorized route — and not the subpoena, warrant or formal-request routes, which have
  their own notice provisions. And it is defeasible: a § 3409 court order suspends the customer's
  access, which is the same delayed-notice machinery § 3406(c) uses for warrants.
