verbatim_span: >-
  The customer has the right, unless the Government authority obtains a court order as provided in
  section 3409 of this title , to obtain a copy of the record which the financial institution shall
  keep of all instances in which the customer’s record is disclosed to a Government authority
  pursuant to this section, including the identity of the Government authority to which such
  disclosure is made.
