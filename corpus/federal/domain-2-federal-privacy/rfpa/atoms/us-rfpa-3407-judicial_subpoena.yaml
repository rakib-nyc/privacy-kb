summary: A Government authority may obtain financial records by judicial subpoena only if all three conditions
  in § 3407(1)–(3) are satisfied.
requirement_detail: 'THE JUDICIAL-SUBPOENA ROUTE IS § 3405 REARRANGED RATHER THAN § 3405 RELAXED. Paragraph (1)
  requires not only reason to believe the records are relevant to a legitimate law enforcement inquiry but that
  "such subpena is authorized by law" — a condition § 3405 states too, in its chapeau, so the difference is where
  the words sit and not what they require. Paragraph (2) requires service or mailing of the subpoena on the customer
  with the prescribed notice on or before the date it is served on the financial institution, and paragraph (3)
  imposes the same wait as § 3405(3): ten days from the date of service, fourteen from the date of mailing of
  the notice to the customer. The practical difference between the two routes is venue. Under § 3410(a) a motion
  to quash a judicial subpoena must be filed in the court that issued it, while an administrative summons is challenged
  in the appropriate district court, and routing a challenge to the wrong court is the error this distinction
  produces.'
