common_errors:
- Filing the motion to quash in the district court. § 3410(a) sends a challenge to a judicial subpoena to the
  issuing court.
- Assuming the two subpoena routes are textually identical. § 3407(1) states the "authorized by law" requirement
  as an enumerated condition where § 3405 carries it in the chapeau, and § 3407(3) drops the words "of the notice"
  after "service".
