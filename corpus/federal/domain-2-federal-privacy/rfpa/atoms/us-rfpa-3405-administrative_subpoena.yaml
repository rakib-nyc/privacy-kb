common_errors:
- Reading § 3405 as a grant of subpoena authority. It grants none — the process must be "otherwise authorized
  by law"; § 3405 only conditions its use.
- Treating conditions (1), (2) and (3) as alternative routes. They are conjunctive; all three must be met before
  the records may be obtained.
- Assuming the customer is notified after the fact. Under this route the copy and notice go to the customer on
  or before the date the subpoena is served on the financial institution.
