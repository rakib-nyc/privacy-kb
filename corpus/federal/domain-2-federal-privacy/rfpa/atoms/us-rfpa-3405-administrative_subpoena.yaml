summary: A Government authority may obtain financial records by administrative subpoena or summons only if all
  three conditions in § 3405(1)–(3) are satisfied.
requirement_detail: 'THE FIRST OF THE THREE COMPELLED-PRODUCTION ROUTES § 3402 LEAVES OPEN, and the one that shows
  the statute''s procedural character most plainly. § 3405 confers no subpoena power: the subpoena or summons
  must be "otherwise authorized by law", and this section only conditions its use. The three conditions are conjunctive
  — reason to believe the records are relevant to a legitimate law enforcement inquiry, service or mailing of
  a copy of the process on the customer together with the statutory notice on or before the date it is served
  on the bank, and expiry of the ten or fourteen day window without a motion to quash. Notice is therefore CONTEMPORANEOUS
  with the demand on the financial institution rather than after production, which is what converts a filing requirement
  into a privacy right: the customer learns of the demand while there is still something to challenge. Nothing
  in the section addresses the bank; the duty runs against the Government authority, and the financial institution
  is a stakeholder rather than the regulated party.'
