common_errors:
- Expecting the bank to raise the objection. The challenge belongs to the customer, and § 3410(f) says nothing
  in the chapter entitles a customer to assert the rights of a financial institution or enlarges the institution's
  own.
- Filing in the wrong court. A judicial subpoena is challenged where it issued; an administrative summons or formal
  written request in the district court.
- Assuming the low pleading burden means a low standard of review. § 3410(c) requires denial wherever there is
  a demonstrable reason to believe the inquiry is legitimate and the records relevant.
