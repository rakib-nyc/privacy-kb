summary: Within ten days of service or fourteen days of mailing, the customer may file a motion to quash the summons
  or subpoena, or an application to enjoin a formal written request, supported by a sworn statement of customer
  status and of the reasons the records are not relevant or the chapter was not substantially complied with.
requirement_detail: 'THIS IS THE PROVISION THAT ANSWERS UNITED STATES v. MILLER. Miller held the customer had
  no Fourth Amendment interest in records held by his bank, and therefore no standing to object when the Government
  subpoenaed them; § 3410 manufactures that standing by statute and puts the challenge in the CUSTOMER''S hands
  rather than the institution''s. The pleading burden on its face is light — an affidavit stating that the applicant
  is the customer and giving reasons for believing the records are not relevant to the stated inquiry or that
  the chapter was not substantially complied with — but § 3410(c) sets the standard the court then applies, and
  it is deferential: the motion must be DENIED if there is a demonstrable reason to believe the inquiry is legitimate
  and a reasonable belief that the records are relevant. Venue turns on the route: a judicial subpoena is challenged
  in the issuing court, an administrative summons or a formal written request in the appropriate district court.
  The window is short and it is load-bearing — §§ 3405(3) and 3407(3) release the records once it lapses with
  nothing on file, so the effect of the provision on the Government is a temporary bar on obtaining them. It is
  what makes RFPA a privacy statute rather than a filing requirement.'
deadline:
  trigger_event: service or mailing of the subpoena, summons, or formal written request on the customer
  duration:
    value: 10
    unit: calendar_days
  computation: Ten days from SERVICE, fourteen days from MAILING. The recorded duration is the service limb; a
    mailed process gets fourteen days. The period is measured from the process reaching the customer, not from
    the Government's demand on the financial institution, though §§ 3405(2) and 3407(2) require those to be simultaneous
    or the customer copy to come first. Service on the Government authority of the customer's papers is separately
    governed by the concluding sentence of § 3410(a), which requires delivery or registered or certified mail.
