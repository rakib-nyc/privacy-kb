common_errors:
  - >-
    Reading one hundred and eighty days as an absolute ceiling. Additional delays of up to ninety
    days may be granted on further application under the same subsection.
  - >-
    Overlooking that this is the provision that binds the bank. The nondisclosure order runs against
    the financial institution, unlike the rest of the chapter.
  - >-
    Sending the ordinary § 3406(b) notice when the delay expires. The subsection prescribes a
    different notice that discloses the delay and its basis.
