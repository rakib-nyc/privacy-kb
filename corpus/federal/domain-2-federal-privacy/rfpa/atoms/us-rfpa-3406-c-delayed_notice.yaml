summary: >-
  On the § 3409(a) findings a court may delay the § 3406(b) warrant notice — not beyond one hundred
  and eighty days from service, with further ninety-day extensions — and may order the financial
  institution not to disclose that the records were obtained.
requirement_detail: >-
  THE GAG ORDER IS THE PART THAT MATTERS TO THE BANK. Everything else in RFPA regulates the
  Government; this subsection is the one place a court is authorised to command the FINANCIAL
  INSTITUTION, and what it commands is silence — an order "prohibiting the financial institution
  from disclosing that records have been obtained or that a search warrant for such records has been
  executed". The delay itself is ex parte and is measured from service of the warrant rather than
  from the ordinary ninety-day due date: the delay "shall not exceed one hundred and eighty days
  following the service of the warrant", and further delays of up to ninety days each may then be
  granted on application, so the one hundred and eighty days bounds the first delay and not the
  total. When the delay finally lapses the customer gets a different notice from the § 3406(b) one:
  it states that notification was delayed by court determination that notice would seriously
  jeopardize an investigation, which tells the customer something the ordinary notice does not.
