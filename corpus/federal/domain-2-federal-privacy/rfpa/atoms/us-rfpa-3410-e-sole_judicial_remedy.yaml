summary: >-
  The chapter's challenge procedures are the sole judicial remedy available to a customer who wishes
  to oppose disclosure of financial records under the chapter.
requirement_detail: >-
  AN EXCLUSIVITY CLAUSE, AND THE OPPOSITE OF THE CABLE ACT'S. Where 47 U.S.C. § 551(f)(3) says the
  remedy it creates "shall be in addition to any other lawful remedy", § 3410(e) forecloses the
  alternatives: if a customer wants to STOP a disclosure, the § 3410 motion is the only judicial
  route, and a freestanding injunction suit or a collateral constitutional challenge is not
  available. The clause is carefully bounded in two ways that are easy to miss. It speaks to
  opposing DISCLOSURE, which is prospective relief, and it reaches disclosure "pursuant to this
  chapter", so a demand that does not travel one of the chapter's routes is not within it. Combined
  with the ten and fourteen day window in § 3410(a) and the appeal bar in § 3410(d), the practical
  effect is that a customer who misses the window has no pre-production remedy at all.
