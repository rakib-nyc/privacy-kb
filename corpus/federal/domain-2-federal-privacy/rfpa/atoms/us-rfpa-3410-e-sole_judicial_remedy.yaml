common_errors:
  - >-
    Planning a freestanding injunction or constitutional suit to block a bank subpoena. § 3410(e)
    makes the chapter's challenge procedure the sole judicial remedy for opposing disclosure.
  - >-
    Reading it as a bar on all remedies. It addresses opposing disclosure under the chapter; it does
    not on its face reach a demand made outside the chapter's routes.
open_questions:
  - >-
    12 U.S.C. § 3417 (civil penalties and liability) has not been extracted into this corpus, so the
    interaction between § 3410(e) exclusivity and any post-disclosure damages remedy is UNASSESSED
    rather than absent. The span is limited to opposing disclosure and does not on its face speak to
    remedies sought after the records have changed hands.
