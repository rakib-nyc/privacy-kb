common_errors:
- Treating a general consent buried in an account agreement as an RFPA authorization. § 3404(a) requires a separate
  signed and dated statement with specified contents, and § 3404(b) forbids requiring it as a condition of doing
  business.
- Relying on an authorization more than three months old. Paragraph (1) caps the authorized period at three months.
- Giving the statement only to the Government authority. It must be furnished to the financial institution as
  well.
- Expecting a general RFPA notice from the bank. As enacted the chapter also contained § 3404(d), requiring financial
  institutions to notify all of their customers of their rights under it; the amendment note in the USLM source
  records that Pub. L. 96-3 struck that subsection in 1979, leaving only the demand-specific notices in §§ 3405(2),
  3406(b) and 3407(2).
