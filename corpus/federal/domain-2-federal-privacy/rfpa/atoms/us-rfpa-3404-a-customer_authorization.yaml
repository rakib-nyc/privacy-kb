summary: Customer authorization is a valid route to financial records only if the customer furnishes both the
  financial institution and the Government authority a signed and dated statement that runs no more than three
  months, is revocable, identifies the records, specifies the purposes and the recipient authority, and states
  the customer's rights under the chapter.
requirement_detail: RFPA FORMALISES CONSENT TO A DEGREE MOST MODERN PRIVACY STATUTES DO NOT. The authorization
  must be signed AND dated, and it must be furnished to two recipients — the financial institution and the Government
  authority seeking disclosure — so a statement given only to the investigator does not qualify. Paragraph (1)
  caps its life at three months, which makes a standing or open-ended consent legally impossible rather than merely
  disfavoured; paragraph (2) requires the statement itself to recite revocability at any time before disclosure;
  paragraphs (3) and (4) require it to identify the records and to name both the purposes and the Government authority,
  so a blanket authorization covering unspecified future requests fails on its face. Paragraph (5) then requires
  the statement to state the customer's rights under the chapter, which makes the consent instrument itself a
  notice instrument. Read with § 3404(b), which forbids conditioning banking services on giving one, this is a
  markedly stronger consent standard than the FCRA or GLBA analogues.
