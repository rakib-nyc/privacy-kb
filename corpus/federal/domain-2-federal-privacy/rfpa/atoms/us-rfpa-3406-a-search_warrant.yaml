common_errors:
  - >-
    Assuming the customer gets pre-production notice. On the warrant route notice comes after
    execution, within ninety days under § 3406(b).
  - >-
    Treating a court order under § 3409 as satisfying this subsection. § 3406(a) requires a search
    warrant under the Federal Rules of Criminal Procedure specifically.
