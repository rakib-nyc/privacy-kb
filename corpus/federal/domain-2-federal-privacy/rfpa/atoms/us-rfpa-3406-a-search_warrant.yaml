summary: >-
  Under the § 3402(3) route a Government authority may obtain financial records only by a search
  warrant issued under the Federal Rules of Criminal Procedure.
requirement_detail: >-
  THE ONE ROUTE THAT BORROWS ITS PROTECTION FROM OUTSIDE RFPA. Where §§ 3405 and 3407 build a notice
  and challenge apparatus, § 3406(a) does nothing but require a Rule 41 search warrant, and the
  probable-cause finding a magistrate must already make is what supplies the safeguard. That is why
  the customer gets no pre-production notice here: under § 3406(b) the notice is mailed within
  ninety days AFTER the warrant is served, and under § 3406(c) even that may be judicially delayed.
  The asymmetry is deliberate and it is the single most consequential structural fact about RFPA for
  a practitioner — advising that a customer will always hear from the Government before the bank
  produces is wrong for the warrant route.
