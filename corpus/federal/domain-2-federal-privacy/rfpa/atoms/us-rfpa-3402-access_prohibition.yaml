summary: No Government authority may access or obtain a customer's financial records from a financial
  institution except under one of the enumerated procedures.
requirement_detail: 'THE STATUTORY ANSWER TO UNITED STATES v. MILLER, which held there is no Fourth Amendment
  expectation of privacy in bank records held by a third party. Congress supplied by statute what the
  Constitution did not, and the shape of that answer matters: RFPA binds the GOVERNMENT, not the bank,
  and it is procedural rather than prohibitory — the records are obtainable, but only through a listed
  route with customer notice. It is the clearest case in the corpus of a privacy interest that exists
  only because a statute created it.'
