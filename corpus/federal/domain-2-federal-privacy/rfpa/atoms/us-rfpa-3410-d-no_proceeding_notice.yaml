verbatim_span: >-
  A court ruling denying a motion or application under this section shall not be deemed a final
  order and no interlocutory appeal may be taken therefrom by the customer. An appeal of a ruling
  denying a motion or application under this section may be taken by the customer (1) within such
  period of time as provided by law as part of any appeal from a final order in any legal proceeding
  initiated against him arising out of or based upon the financial records, or (2) within thirty
  days after a notification that no legal proceeding is contemplated against him. The Government
  authority obtaining the financial records shall promptly notify a customer when a determination
  has been made that no legal proceeding against him is contemplated. After one hundred and eighty
  days from the denial of the motion or application, if the Government authority obtaining the
  records has not initiated such a proceeding, a supervisory official of the Government authority
  shall certify to the appropriate court that no such determination has been made. The court may
  require that such certifications be made, at reasonable intervals thereafter, until either
  notification to the customer has occurred or a legal proceeding is initiated as described in
  clause (A).
