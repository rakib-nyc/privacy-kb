obligation_type: notify
summary: >-
  A denial of a customer challenge is not appealable when made; the Government authority that
  obtained the records must promptly notify the customer once it determines no legal proceeding
  against him is contemplated, and a supervisory official must certify to the court if no such
  determination has been made within one hundred and eighty days.
requirement_detail: >-
  THE NOTIFICATION DUTY EXISTS BECAUSE THE APPEAL RIGHT IS OTHERWISE UNUSABLE. A ruling denying the
  customer's motion is expressly not a final order and no interlocutory appeal lies from it, so the
  customer has exactly two ways up: as part of an appeal from a final order in a proceeding brought
  against him arising out of the records, or within thirty days after being told that no proceeding
  is contemplated. If the Government never says so, the thirty-day clock never starts and the denial
  is effectively unreviewable — which is why the duty to notify PROMPTLY is the operative privacy
  obligation here rather than an administrative courtesy. The one hundred and eighty day
  certification is a backstop on that duty and not a substitute for it: it runs to the COURT, states
  only that no determination has been made, and may be repeated at intervals the court sets until
  the customer is notified or a proceeding begins.
deadline: null
no_deadline_stated: >-
  The subsection fixes no period for the notification itself — the Government authority "shall
  promptly notify a customer when a determination has been made that no legal proceeding against him
  is contemplated", and "promptly" is the only measure given. The other periods in § 3410 govern
  different acts: the thirty days in this subsection is the customer's appeal window measured from
  the notification, the one hundred and eighty days is the trigger for a supervisory certification
  to the court rather than for the notice, the seven calendar days in § 3410(b) is the deadline for
  deciding the motion, and the ten and fourteen days in § 3410(a) are the filing window. Checked §
  3410(a) through (f) in the USLM source; no period attaches to this notice.
