common_errors:
  - >-
    Advising that a denial can be appealed immediately. § 3410(d) makes it non-final and bars an
    interlocutory appeal.
  - >-
    Reading the one hundred and eighty day certification as the notice deadline. The certification
    runs to the court and reports that no determination has been made; the customer notice is due
    promptly once a determination is made.
open_questions:
  - >-
    The final sentence of § 3410(d) refers to a legal proceeding "initiated as described in clause
    (A)", but the subsection numbers its two appeal routes (1) and (2) and contains no clause (A).
    Recorded as it appears in the USLM release-point text; whether this is a scrivener's error or a
    survival from earlier lettering has not been checked against the Statutes at Large.
