common_errors:
  - >-
    Reading it as a customer filing deadline only. It is equally a bar on the Government: the
    records may not be obtained while the window is open.
  - Applying ten days to a mailed notice. Mailing gets fourteen days, service gets ten.
  - >-
    Treating a filed motion to quash as merely tolling the clock. The paragraph requires that the §
    3410 challenge provisions "have been complied with", which means the challenge is resolved.
