summary: >-
  Records may not be obtained under the administrative-subpoena route until ten days from service or
  fourteen days from mailing of the customer notice have expired with no motion to quash filed, or
  the § 3410 challenge procedure has been complied with.
requirement_detail: >-
  THE WAITING PERIOD IS THE OPERATIVE PRIVACY MECHANISM, not a customer deadline. Read with its
  chapeau, this paragraph is a bar on the Government authority: the records may not be obtained at
  all while the window is open. Two clocks run, ten days from the DATE OF SERVICE of the notice and
  fourteen from the DATE OF MAILING, and the applicable one is fixed by how the customer was reached
  rather than by the Government's choice. The window closes in one of two ways — it lapses with no
  sworn statement and motion to quash on file, or the § 3410 challenge procedures "have been
  complied with", which means litigated to a ruling rather than merely commenced. § 3407(3) is the
  same paragraph for judicial subpoenas, and § 3406 has no counterpart at all, because the warrant
  route substitutes after-the-fact notice for a pre-production challenge.
deadline:
  trigger_event: service or mailing of the § 3405(2) notice on the customer
  duration:
    value: 10
    unit: calendar_days
  computation: >-
    Ten days runs from the DATE OF SERVICE; fourteen days runs from the DATE OF MAILING. The
    recorded duration is the service limb, which is the shorter of the two and the one that governs
    personally served notice; a mailed notice gets fourteen. Either way the period is a bar on the
    Government rather than a duty of the customer, and it does not close the matter — if a motion to
    quash is filed within it, production waits on compliance with § 3410.
