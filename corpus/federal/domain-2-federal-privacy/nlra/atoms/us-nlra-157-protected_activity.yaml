summary: >-
  Employees have the right to self-organization, to bargain collectively through representatives of
  their own choosing and to engage in other concerted activities for the purpose of collective
  bargaining or other mutual aid or protection, and the right to refrain from those activities.
requirement_detail: >-
  THIS SECTION IS IN A PRIVACY CORPUS BECAUSE IT CONSTRAINS MONITORING, not because it is a privacy
  statute, and the collision it produces is direct: the employer's interest in watching its systems
  and the employee's § 7 right occupy the same ground, and a monitoring rule can be a genuinely
  reasonable security measure and still be unlawful. The protected zone is wider than most policy
  drafters assume — the right covers "other concerted activities for the purpose of collective
  bargaining or other mutual aid or protection", which does not require that a union exist, so a
  social-media policy, a camera in a break area or a keystroke logger in a wholly non-union
  workplace is measured against it. Two boundaries matter and neither is in this text: § 157 confers
  the right, while the prohibition on employer interference is 29 U.S.C. § 158(a)(1), and the
  coverage exclusions — supervisors, public employers, agricultural laborers — sit in the
  definitions at 29 U.S.C. § 152. Neither section is held in this corpus, so this atom states the
  right and not the remedy, and the National Labor Relations Board's work-rule doctrine, which asks
  whether a rule would reasonably tend to chill protected activity, is agency and case law that must
  be surfaced as such rather than cited as this section. The same sentence also protects the right
  "to refrain from any or all of such activities", so a policy that compels participation is exposed
  from the opposite direction.
