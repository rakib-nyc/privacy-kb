common_errors:
  - >-
    Assuming § 7 only matters where there is a union. The right runs to "other concerted activities
    for the purpose of collective bargaining or other mutual aid or protection" and does not depend
    on one.
  - >-
    Citing § 157 as the prohibition. It confers rights; employer interference is an unfair labor
    practice under 29 U.S.C. § 158(a)(1), which this corpus does not hold.
  - >-
    Applying it to supervisors or public-sector employees. Those exclusions live in the definitions
    at 29 U.S.C. § 152 and are not encoded in this atom.
open_questions:
  - >-
    29 U.S.C. §§ 152 and 158 are not extracted. Coverage and the unfair-labor-practice prohibition
    therefore cannot be resolved from this atom alone.
confidence: high
preemption:
  posture: field
  authority: null
  note: >-
    The Act contains no express preemption clause and none appears in the section extracted. NLRA
    preemption is judicially developed — conduct arguably protected by § 157 or arguably prohibited
    by § 158 is for the Board rather than the states — and that doctrine is case law which this
    corpus does not hold. Recorded as field so that a state monitoring statute is not treated as
    freely cumulative with § 157; the posture must be confirmed against the case law before it is
    relied on.
enforcement:
  enforcers:
    - nlrb
  private_right_of_action: false
  penalty:
    structure: >-
      Charge to the Board, prosecuted by the General Counsel. There is no private right of action to
      enforce § 157 in court; an employee files an unfair labor practice charge and the Board's
      remedies are remedial rather than punitive.
    range: null
    note: >-
      The remedial provisions at 29 U.S.C. § 160 have NOT been extracted. Treat exposure as
      UNASSESSED rather than absent, and note that a rescission and notice-posting order against a
      monitoring policy is the practical remedy most relevant here.
  statute_of_limitations: >-
    The six-month charge-filing limit is in 29 U.S.C. § 160(b), which is not extracted; do not
    compute it from this atom.
