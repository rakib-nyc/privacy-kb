verbatim_span: >-
  Whenever informant records maintained by a criminal law enforcement agency under an informant’s
  name or personal identifier are requested by a third party according to the informant’s name or
  personal identifier, the agency may treat the records as not subject to the requirements of this
  section unless the informant’s status as an informant has been officially confirmed.
