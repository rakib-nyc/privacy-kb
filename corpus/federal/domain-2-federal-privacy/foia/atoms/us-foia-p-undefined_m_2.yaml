verbatim_span: >-
  This subsection shall not be construed to alter the power of any other agency to create or
  maintain an independent online portal for the submission of a request for records under this
  section. The Director of the Office of Management and Budget shall establish standards for
  interoperability between the portal required under paragraph (1) and other request processing
  software used by agencies subject to this section.
