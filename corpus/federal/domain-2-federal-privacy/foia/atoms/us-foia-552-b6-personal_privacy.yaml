summary: >-
  FOIA does not apply to personnel and medical files and similar files the disclosure of which would
  constitute a clearly unwarranted invasion of personal privacy.
requirement_detail: >-
  THE PROVISION THAT STOPS FOIA BEING A UNIVERSAL DISCLOSURE MECHANISM. Exemption 6 is the privacy
  limit on a statute whose default is release, and the word doing the work is CLEARLY — the invasion
  must be clearly unwarranted, which tilts the balance toward disclosure. Exemption 7(C) covers
  law-enforcement records on a different and lower standard, so the same record can be protected
  under one and not the other. Note the direction of the duty: this is a limit on an agency's
  obligation to release, not a duty owed to the data subject, and FOIA supplies the requester with a
  cause of action while the person whose privacy is at stake has none under it.
common_errors:
  - >-
    Reading Exemption 6 and 7(C) as the same standard. Exemption 6 requires the invasion be CLEARLY
    unwarranted; the law-enforcement exemption is worded differently.
  - >-
    Assuming the data subject can enforce it. FOIA gives the REQUESTER a remedy; the third party
    whose privacy is at issue must look elsewhere.
open_questions:
  - >-
    Exemption 7(C) is inline within the § 552(b)(7) leaf rather than separately addressable in the
    segmentation, so it cannot carry its own paragraph_path. Its standard is described here rather
    than cited directly.
preemption:
  posture: none
  authority: 5 U.S.C. § 552(b)(6)
  note: >-
    Federal disclosure statute. The Privacy Act of 1974 governs the same records from the other
    direction, and 5 U.S.C. § 552a(b)(2) makes FOIA-required disclosure an exception to the Privacy
    Act prohibition — the two are read together.
