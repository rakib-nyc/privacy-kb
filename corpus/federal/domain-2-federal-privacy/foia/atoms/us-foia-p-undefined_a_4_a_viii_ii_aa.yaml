verbatim_span: >-
  If an agency has determined that unusual circumstances apply (as the term is defined in paragraph
  (6)(B)) and the agency provided a timely written notice to the requester in accordance with
  paragraph (6)(B), a failure described in subclause (I) is excused for an additional 10 days. If
  the agency fails to comply with the extended time limit, the agency may not assess any search fees
  (or in the case of a requester described under clause (ii)(II) of this subparagraph, duplication
  fees).
