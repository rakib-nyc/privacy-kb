verbatim_span: >-
  In order to carry out the provisions of this section, each agency shall promulgate regulations,
  pursuant to notice and receipt of public comment, specifying the schedule of fees applicable to
  the processing of requests under this section and establishing procedures and guidelines for
  determining when such fees should be waived or reduced. Such schedule shall conform to the
  guidelines which shall be promulgated, pursuant to notice and receipt of public comment, by the
  Director of the Office of Management and Budget and which shall provide for a uniform schedule of
  fees for all agencies.
