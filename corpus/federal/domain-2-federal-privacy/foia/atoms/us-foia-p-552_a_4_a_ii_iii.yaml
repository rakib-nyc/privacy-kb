    verbatim_span: >-
      In this clause, the term “a representative of the news media” means any person or entity that
      gathers information of potential interest to a segment of the public, uses its editorial
      skills to turn the raw materials into a distinct work, and distributes that work to an
      audience. In this clause, the term “news” means information that is about current events or
      that would be of current interest to the public. Examples of news-media entities are
      television or radio stations broadcasting to the public at large and publishers of periodicals
      (but only if such entities qualify as disseminators of “news”) who make their products
      available for purchase by or subscription by or free distribution to the general public. These
      examples are not all-inclusive. Moreover, as methods of news delivery evolve (for example, the
      adoption of the electronic dissemination of newspapers through telecommunications services),
      such alternative media shall be considered to be news-media entities. A freelance journalist
      shall be regarded as working for a news-media entity if the journalist can demonstrate a solid
      basis for expecting publication through that entity, whether or not the journalist is actually
      employed by the entity. A publication contract would present a solid basis for such an
      expectation; the Government may also consider the past publication record of the requester in
      making such a determination.
    path:
      - a
      - '4'
      - A
      - ii
