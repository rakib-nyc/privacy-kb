verbatim_span: >-
  Whenever the court orders the production of any agency records improperly withheld from the
  complainant and assesses against the United States reasonable attorney fees and other litigation
  costs, and the court additionally issues a written finding that the circumstances surrounding the
  withholding raise questions whether agency personnel acted arbitrarily or capriciously with
  respect to the withholding, the Special Counsel shall promptly initiate a proceeding to determine
  whether disciplinary action is warranted against the officer or employee who was primarily
  responsible for the withholding. The Special Counsel, after investigation and consideration of the
  evidence submitted, shall submit his findings and recommendations to the administrative authority
  of the agency concerned and shall send copies of the findings and recommendations to the officer
  or employee or his representative. The administrative authority shall take the corrective action
  that the Special Counsel recommends.
