verbatim_span: >-
  With respect to a request for which a written notice under clause (i) extends the time limits
  prescribed under clause (i) of subparagraph (A), the agency shall notify the person making the
  request if the request cannot be processed within the time limit specified in that clause and
  shall provide the person an opportunity to limit the scope of the request so that it may be
  processed within that time limit or an opportunity to arrange with the agency an alternative time
  frame for processing the request or a modified request. To aid the requester, each agency shall
  make available its FOIA Public Liaison, who shall assist in the resolution of any disputes between
  the requester and the agency, and notify the requester of the right of the requester to seek
  dispute resolution services from the Office of Government Information Services. Refusal by the
  person to reasonably modify the request or arrange such an alternative time frame shall be
  considered as a factor in determining whether exceptional circumstances exist for purposes of
  subparagraph (C).
