verbatim_span: >-
  The Director of the Office of Management and Budget, in consultation with the Attorney General,
  shall ensure the operation of a consolidated online request portal that allows a member of the
  public to submit a request for records under subsection (a) to any agency from a single website.
  The portal may include any additional tools the Director of the Office of Management and Budget
  finds will improve the implementation of this section.
