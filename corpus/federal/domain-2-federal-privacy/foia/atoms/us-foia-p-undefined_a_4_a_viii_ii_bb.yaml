verbatim_span: >-
  If an agency has determined that unusual circumstances apply and more than 5,000 pages are
  necessary to respond to the request, an agency may charge search fees (or in the case of a
  requester described under clause (ii)(II) of this subparagraph, duplication fees) if the agency
  has provided a timely written notice to the requester in accordance with paragraph (6)(B) and the
  agency has discussed with the requester via written mail, electronic mail, or telephone (or made
  not less than 3 good-faith attempts to do so) how the requester could effectively limit the scope
  of the request in accordance with paragraph (6)(B)(ii).
