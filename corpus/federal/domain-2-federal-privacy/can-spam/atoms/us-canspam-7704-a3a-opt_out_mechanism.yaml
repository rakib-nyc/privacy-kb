common_errors:
- Decommissioning the unsubscribe endpoint when the campaign ends. Clause (ii) requires it to remain capable
  of receiving requests for at least 30 days after the message was sent.
- Offering only a topic preference centre. Subparagraph (B) allows a menu only where it includes an option
  to receive no commercial email at all from the sender.
- Applying the duty to every message the company sends. It reaches commercial messages; the primary-purpose
  test in 16 C.F.R. § 316.3 decides mixed transactional-and-commercial mail.
