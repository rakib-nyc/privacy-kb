summary: A commercial electronic mail message must carry a functioning, clearly and conspicuously displayed
  return email address or other Internet-based mechanism the recipient can use to ask to stop receiving
  messages, and it must keep working for at least 30 days after the message was sent.
requirement_detail: THE OPT-OUT MECHANISM IS A PROPERTY OF THE MESSAGE, NOT OF THE PROGRAMME. Every commercial
  message must carry its own working unsubscribe address or link, and clause (ii) requires it to keep
  functioning for at least 30 days after transmission — the half practitioners miss most often, because
  campaign infrastructure and landing pages are routinely torn down the week the campaign ends. Subparagraph
  (B) permits a preference menu in place of a single global unsubscribe, but only if the menu includes
  an option to stop ALL commercial email from the sender; a preference centre with no all-off switch does
  not satisfy (A)(i). The duty attaches only to commercial messages, so whether a mixed message is commercial
  is decided upstream by the primary-purpose test in 16 C.F.R. § 316.3, not by how the sender labels it.
  Subparagraph (C) forgives an unexpected, temporary technical failure corrected within a reasonable time
  — a defence to a broken mechanism, never to an absent one. What the recipient may be made to DO to use
  the mechanism is capped separately by 16 C.F.R. § 316.5.
