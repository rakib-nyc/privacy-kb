common_errors:
  - >-
    Reading 10 business days as a grace period during which sending is fine. It is the outer limit
    for stopping, and a suppression process that syncs weekly can breach it without anyone noticing.
  - >-
    Deleting the opted-out address instead of suppressing it. Clause (iv) makes transferring that
    address unlawful, and only a retained suppression list proves the request was honoured.
  - >-
    Assuming the sender may resume on the strength of the original signup. Subparagraph (B) requires
    affirmative consent given after the opt-out request.
