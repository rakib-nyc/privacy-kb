summary: >-
  Once a recipient uses the paragraph (3) mechanism to ask to stop, it is unlawful for the sender to
  transmit a commercial electronic mail message within the scope of that request more than 10
  business days after the request is received.
requirement_detail: >-
  TEN BUSINESS DAYS IS A CEILING, NOT A GRACE PERIOD, and the clock runs from RECEIPT of the request
  rather than from whenever the suppression file next syncs — a weekly manual export between an ESP
  and a CRM is already out of time if the eleventh business day arrives first. The prohibition is
  drafted against the sender and then extended: clauses (ii) and (iii) reach persons acting on the
  sender's behalf who send, or who supply the addresses for sending, with actual or constructive
  knowledge, which is what puts the agency and the list broker inside the statute. Clause (iv)
  forbids selling, leasing, exchanging or otherwise transferring the address of a recipient who has
  opted out, so the opted-out address must be SUPPRESSED and retained, not deleted — deletion both
  destroys the proof and guarantees the address is re-acquired on the next list purchase.
  Subparagraph (B) lifts the prohibition only on affirmative consent given by the recipient AFTER
  the opt-out request, so a pre-existing consent record does not revive the relationship. What the
  sender may require of the recipient to make the request stick is capped by 16 C.F.R. § 316.5(b).
deadline:
  trigger_event: receipt of the recipient's request not to receive further commercial email
  duration:
    value: 10
    unit: business_days
  computation: >-
    Counted in business days from receipt of the request. Transmitting a commercial message within
    the scope of the request after the tenth business day is the violation; the period is an outer
    limit on processing, not a permitted delay.
