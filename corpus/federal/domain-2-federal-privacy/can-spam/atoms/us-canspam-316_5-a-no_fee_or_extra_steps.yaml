preemption:
  posture: express_partial
  authority: 15 U.S.C. § 7707(b)(1)
  note: >-
    CAN-SPAM expressly preempts state statutes regulating commercial email EXCEPT to the extent they
    prohibit falsity or deception. A state opt-in requirement is displaced; a state
    deceptive-subject-line prohibition is not. See us.canspam.7707.b1.state_law_preemption.
