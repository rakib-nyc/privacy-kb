summary: >-
  Neither a sender nor anyone acting for a sender may require a recipient to pay a fee, to give
  information beyond an email address and opt-out preferences, or to take any step beyond sending a
  reply message or visiting a single web page, in order to use the opt-out mechanism required by 15
  U.S.C. § 7704(a)(3).
requirement_detail: >-
  THE RULE, NOT THE STATUTE, IS WHERE UNSUBSCRIBE UX IS ACTUALLY REGULATED. Section 7704(a)(3)
  requires a mechanism; § 316.5 caps what the sender may make the recipient do to use it — no fee,
  no information beyond the email address and opt-out preferences, and nothing beyond a reply
  message or a visit to a SINGLE web page. That single-page limit is the operative constraint: a
  login wall, an account-preferences flow behind authentication, or a confirm-then-confirm-again
  sequence violates the rule even though the link technically works and the address is eventually
  suppressed. Paragraph (b) applies the same cap to having the request HONOURED, which forecloses
  the pattern of accepting the click and then demanding a survey or a reason before processing it.
  The part was issued under the CAN-SPAM Act itself (the authority note to part 316 cites 15 U.S.C.
  7701-7713), so this is a legislative rule with the force of the statute, not FTC guidance under
  invariant I7. The same 2008 rulemaking fixed the multi-advertiser "sender" rule in § 316.2(m) and
  the definition of a valid physical postal address in § 316.2(p); both are definitional records and
  are not yet in this corpus.
