common_errors:
  - Requiring a login to unsubscribe. § 316.5(a) permits at most a reply email or a single web page.
  - >-
    Asking the recipient why they are leaving before processing the request. Collecting anything
    beyond the email address and opt-out preferences is prohibited.
  - >-
    Treating the CAN-SPAM Rule as FTC guidance rather than law. It is a legislative rule under the
    Act; the guidance/statute distinction in invariant I7 does not downgrade it.
