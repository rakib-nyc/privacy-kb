verbatim_span: >-
  In applying the term “transactional or relationship message” defined in the CAN-SPAM Act, 15
  U.S.C. 7702(17), the “primary purpose” of an electronic mail message shall be deemed to be
  transactional or relationship if the electronic mail message consists exclusively of transactional
  or relationship content as set forth in paragraph (c) of this section.
