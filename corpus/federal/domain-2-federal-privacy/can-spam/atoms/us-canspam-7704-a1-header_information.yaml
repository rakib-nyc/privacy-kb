common_errors:
- Reading it as requiring consent. It requires an opt-out mechanism, not opt-in.
- Assuming state law can add a consent requirement. § 7707(b)(1) preempts it except as to falsity or deception.
- Expecting a consumer private action. There is none; providers of internet access service have a narrow
  one.
