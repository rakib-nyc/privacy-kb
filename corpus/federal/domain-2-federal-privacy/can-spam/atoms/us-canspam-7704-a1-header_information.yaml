summary: It is unlawful to initiate the transmission of a commercial or transactional electronic mail
  message containing materially false or materially misleading header information.
requirement_detail: CAN-SPAM IS AN OPT-OUT STATUTE THAT PREEMPTS OPT-IN STATE LAW, which is the opposite
  posture from most of this corpus and the reason its name is misleading — it does not ban spam, it regulates
  it. § 7707(b)(1) expressly preempts state statutes regulating commercial email except as to falsity
  or deception, so a state cannot impose a consent requirement. There is no general private right of action;
  enforcement runs to the FTC, state AGs and, narrowly, providers of internet access service under § 7706(g).
