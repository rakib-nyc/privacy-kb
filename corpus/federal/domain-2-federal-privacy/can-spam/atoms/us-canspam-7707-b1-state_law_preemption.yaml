  authority: 15 U.S.C. § 7707(b)(1)
  note: >-
    Express and subject-specific. State statutes that expressly regulate commercial email are
    superseded; state provisions prohibiting falsity or deception in such messages are not, and §
    7707(b)(2) separately saves state laws that are not email-specific and state law on fraud or
    computer crime.
