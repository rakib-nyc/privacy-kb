obligation_type: prohibit
summary: >-
  CAN-SPAM supersedes any state statute, regulation or rule that expressly regulates the use of
  electronic mail to send commercial messages, except to the extent it prohibits falsity or
  deception in any portion of the message or information attached to it.
requirement_detail: >-
  THIS IS THE PROVISION THAT MAKES THE UNITED STATES AN OPT-OUT JURISDICTION FOR COMMERCIAL EMAIL,
  and the exception is where all the surviving state law lives. Preemption is express and PARTIAL: a
  state may not impose a consent requirement or its own unsubscribe regime, but a state prohibition
  on falsity or deception in a commercial message survives untouched — which is why California
  Business and Professions Code § 17529.5 has withstood repeated preemption challenges and generates
  most of the private commercial-email litigation in the country, CAN-SPAM itself giving consumers
  no action. Paragraph (2), quoted in the sibling leaves, preserves two further categories: state
  laws not specific to electronic mail (trespass, contract, tort) and state law on fraud or computer
  crime, so an ordinary common-law claim is not preempted merely because the conduct travelled by
  email. The practical test is subject-matter plus theory: is the state provision aimed at
  commercial email as such, and does it turn on falsity or deception? Recording this as field
  preemption — the standard error — makes the tool tell a client there is no state exposure when the
  largest real exposure is state.
