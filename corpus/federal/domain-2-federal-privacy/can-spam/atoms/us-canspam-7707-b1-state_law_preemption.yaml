common_errors:
  - >-
    Treating CAN-SPAM as field preemption of state email law. It is express and partial;
    falsity-or-deception provisions survive, and paragraph (2) saves non-email-specific state law.
  - >-
    Concluding that no private claim can arise from a commercial email. CAN-SPAM has no consumer
    private right of action, but the surviving state deception statutes do.
  - >-
    Assuming a state may add an opt-in consent requirement for commercial email. That is precisely
    what (b)(1) displaces.
