preemption:
  posture: floor
  authority: 47 U.S.C. § 551(f)(3)
  note: >-
    Recorded as floor. § 551(f)(3) states that the remedy provided by the section "shall be in
    addition to any other lawful remedy available to a cable subscriber", which is an express
    savings of other remedies rather than a displacement of them. No express ceiling clause was
    found in the section extracted.
