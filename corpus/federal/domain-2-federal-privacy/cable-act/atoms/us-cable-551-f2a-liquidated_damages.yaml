summary: >-
  On a § 551(f)(1) action the court may award actual damages subject to a liquidated floor of $100
  for each day of violation or $1,000, whichever is higher, alongside punitive damages and
  reasonable attorneys' fees and litigation costs.
requirement_detail: >-
  THE DAMAGES FORMULA IS A PER-DAY CLOCK, WHICH IS WHY IT BEHAVES DIFFERENTLY FROM THE VPPA'S. The
  award is actual damages "but not less than" liquidated damages, and the liquidated figure is
  itself the higher of $100 for each day of violation or $1,000 — so $1,000 is a floor for a short
  violation and the per-day limb overtakes it after ten days. That structure suits a CONTINUING
  breach: an operator that keeps subscriber information past the point where § 551(e) required
  destruction is in violation every day it holds the data, and the exposure accrues rather than
  being capped at a per-person figure. Contrast 18 U.S.C. § 2710(c)(2)(A), where the VPPA fixes
  liquidated damages "in an amount of $2,500" with no time dimension at all, so its arithmetic runs
  on the number of plaintiffs rather than the duration of the breach. Paragraphs (B) and (C) add
  punitive damages and reasonable attorneys' fees and litigation costs, and both are separate awards
  the court "may" make rather than components of the liquidated figure — a plaintiff does not have
  to prove actual loss to reach the floor, but punitive damages and fees remain discretionary.
