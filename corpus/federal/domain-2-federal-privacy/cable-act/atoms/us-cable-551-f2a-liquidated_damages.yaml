common_errors:
  - >-
    Reading $1,000 as the cap. It is the lower limb of a whichever-is-higher test; $100 a day for
    each day of violation governs any violation lasting more than ten days.
  - >-
    Treating the liquidated figure as per subscriber by analogy to the VPPA. § 551(f)(2)(A) is
    written around days of violation, not around the number of persons affected.
  - >-
    Assuming actual damages must be proven to recover. The award is actual damages "but not less
    than" the liquidated floor.
