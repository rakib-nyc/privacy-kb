summary: >-
  A cable operator must destroy personally identifiable information when it is no longer necessary
  for the purpose for which it was collected and no request or court order remains pending.
requirement_detail: >-
  THE SECOND FEDERAL RETENTION LIMIT IN THIS CORPUS, and it is stricter than the VPPA's. Where 18
  U.S.C. § 2710(e) allows up to one year after the purpose ends, § 551(e) requires destruction when
  the purpose ends, with no grace period at all — the only extension being a pending request or
  court order. Two statutes with near-identical structure and materially different clocks, which is
  why they must be read as separate duties rather than one pattern.
common_errors:
  - Applying the VPPA's one-year outer bound here. § 551(e) has none.
  - Retaining pending a business decision. Only a pending request or court order extends it.
