  penalty:
    structure: >-
      Civil action by any person aggrieved, in a United States district court, under 47 U.S.C. §
      551(f)(1); the court may award actual damages subject to a liquidated floor, punitive damages,
      and reasonable attorneys' fees and litigation costs under § 551(f)(2)(A)-(C).
    range:
      min: 1000
      unit: usd_liquidated_floor_per_action
    note: >-
      § 551(f)(1) opens the action for a violation of THIS SECTION, so it reaches this duty and not
      only the § 551(c) disclosure prohibition. The liquidated floor is the higher of $100 for each
      day of violation or $1,000; the recorded minimum is the fixed limb. See
      us.cable.551.f1.private_action and us.cable.551.f2a.liquidated_damages.
  statute_of_limitations: null
