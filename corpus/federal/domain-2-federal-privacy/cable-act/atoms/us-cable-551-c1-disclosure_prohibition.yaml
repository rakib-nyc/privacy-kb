summary: >-
  A cable operator shall not disclose personally identifiable information concerning a subscriber
  without prior written or electronic consent.
requirement_detail: >-
  ONE OF THE FEW FEDERAL PRIVACY STATUTES WITH AN OPT-IN DEFAULT. Where GLBA and FCRA build on
  notice-and-opt-out, § 551(c)(1) requires PRIOR consent, and § 551(f) supplies a private right of
  action with statutory damages — a combination that made the Cable Act a template for the VPPA two
  years later. The two statutes should be read together: their structures are near-identical and
  their case law cross-pollinates.
