verbatim_span: >-
  Except as provided in paragraph (2), a cable operator shall not disclose personally identifiable
  information concerning any subscriber without the prior written or electronic consent of the
  subscriber concerned and shall take such actions as are necessary to prevent unauthorized access
  to such information by a person other than the subscriber or cable operator.
