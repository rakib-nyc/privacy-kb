obligation_type: notify
deadline:
  trigger_event: entering into an agreement to provide cable or other service
  duration:
    value: 12
    unit: months
  computation: 'Two triggers, not one: the notice is due AT THE TIME of entering the agreement, and then
    at least once in every twelve months thereafter. The recurring limb is what the duration records;
    the at-agreement limb is a zero-elapsed-time obligation on the same provision.'
summary: At the time of entering an agreement to provide service and at least once a year thereafter,
  a cable operator must provide a separate, written privacy notice to the subscriber.
requirement_detail: 'A STATUTORY ANNUAL PRIVACY NOTICE, and it predates GLBA by fifteen years. The requirement
  that it be SEPARATE and WRITTEN is the operative constraint: it cannot be folded into the service agreement,
  which is exactly where a modern operator would put it. § 551(a)(1)(A)-(E) then fixes the content, including
  the retention period and the subscriber''s access rights.'
common_errors:
- Folding the notice into the subscriber agreement. § 551(a)(1) requires a separate written notice.
- Providing it once. It is required at agreement AND at least annually.
