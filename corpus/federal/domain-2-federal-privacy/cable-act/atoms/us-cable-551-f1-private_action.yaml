preemption:
  posture: floor
  authority: 47 U.S.C. § 551(f)(3)
  note: >-
    Recorded as floor. § 551(f)(3) states that the remedy provided by the section "shall be in
    addition to any other lawful remedy available to a cable subscriber", which is an express
    savings of other remedies rather than a displacement of them. No express ceiling clause was
    found in the section extracted.
enforcement:
  enforcers:
    - private_litigants
  private_right_of_action: true
  penalty:
    structure: >-
      Civil action in a United States district court under § 551(f)(1); the court may award actual
      damages subject to a liquidated-damages floor, punitive damages, and reasonable attorneys'
      fees and litigation costs under § 551(f)(2)(A)–(C).
    range:
      min: 1000
      unit: usd_liquidated_floor_per_action
    note: >-
      The liquidated floor is the HIGHER of $100 for each day of violation or $1,000, so the
      recorded minimum is the fixed limb; a violation continuing more than ten days is worth more on
      the per-day limb. Punitive damages and fees are separate awards under (B) and (C).
  statute_of_limitations: null
