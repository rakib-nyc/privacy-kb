summary: >-
  Any person aggrieved by any act of a cable operator in violation of § 551 may bring a civil action
  in a United States district court.
requirement_detail: >-
  THE ENFORCEMENT ENGINE FOR THE WHOLE SECTION, and it is what makes the notice, consent and
  destruction duties in § 551(a), (c) and (e) matter commercially rather than only regulatorily.
  Three features of the drafting do the work. The action lies for a violation of "this section", so
  every duty in § 551 is privately enforceable, not merely the disclosure prohibition. The plaintiff
  class is "any person aggrieved by any act of a cable operator" rather than "any subscriber", which
  is broader than the contractual relationship the rest of the section presupposes. And the forum is
  fixed as a United States district court. Read with § 551(f)(3), which preserves "any other lawful
  remedy available to a cable subscriber", the remedy is cumulative rather than exclusive — the
  exact opposite of RFPA's § 3410(e), where the statutory challenge procedure is declared the sole
  judicial remedy. The Cable Act and the VPPA are worth reading as a pair: near-identical
  private-action architecture four years apart, with materially different retention clocks and
  damages formulas.
