common_errors:
  - >-
    Assuming only the § 551(c) disclosure prohibition is privately enforceable. The action lies for
    a violation of the whole section, including the annual notice in (a) and the destruction duty in
    (e).
  - >-
    Reading the remedy as exclusive. § 551(f)(3) expressly preserves any other lawful remedy
    available to a cable subscriber.
  - >-
    Importing the VPPA's $2,500 liquidated figure. § 551(f)(2)(A) uses a different formula — $100 a
    day or $1,000, whichever is higher.
