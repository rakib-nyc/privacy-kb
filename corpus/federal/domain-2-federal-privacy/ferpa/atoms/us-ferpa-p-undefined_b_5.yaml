verbatim_span: >-
  Nothing in this section shall be construed to prohibit State and local educational officials from
  having access to student or other records which may be necessary in connection with the audit and
  evaluation of any federally or State supported education program or in connection with the
  enforcement of the Federal legal requirements which relate to any such program, subject to the
  conditions specified in the proviso in paragraph (3).
