verbatim_span: >-
  No funds shall be made available under any applicable program to any educational agency or
  institution unless the parents of students who are or have been in attendance at a school of such
  agency or at such institution are provided an opportunity for a hearing by such agency or
  institution, in accordance with regulations of the Secretary, to challenge the content of such
  student’s education records, in order to insure that the records are not inaccurate, misleading,
  or otherwise in violation of the privacy rights of students, and to provide an opportunity for the
  correction or deletion of any such inaccurate, misleading or otherwise inappropriate data
  contained therein and to insert into such records a written explanation of the parents respecting
  the content of such records.
