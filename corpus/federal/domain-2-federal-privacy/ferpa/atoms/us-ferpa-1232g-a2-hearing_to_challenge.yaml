common_errors:
  - >-
    Using the hearing to relitigate a grade or a discipline decision. The grounds are accuracy,
    misleading content, and privacy-rights violations, not substantive disagreement.
  - >-
    Closing the file when amendment is refused. The parent's written explanation must then be placed
    in the record and disclosed with the contested part (34 C.F.R. § 99.21(c)).
  - >-
    Assuming a court will hear the challenge. Gonzaga v. Doe foreclosed § 1983; the route is a
    complaint to the Department of Education.
