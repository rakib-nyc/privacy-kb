summary: >-
  Federal funds are conditioned on the institution giving parents an opportunity for a hearing to
  challenge the content of a student's education records as inaccurate, misleading or in violation
  of privacy rights, to correct or delete such data, and to insert a written explanation into the
  record.
requirement_detail: >-
  THE AMENDMENT RIGHT IS A HEARING RIGHT, AND IT IS NARROWER THAN CLIENTS EXPECT. The grounds are
  fixed by the text — inaccurate, misleading, or otherwise in violation of the privacy rights of the
  student — so a challenge to the substance of a grade or a disciplinary finding fails, while a
  challenge to whether the record accurately reports the grade that was given succeeds; courts have
  policed that line consistently, and it is where most FERPA amendment requests die. The procedure
  is not in the statute: 34 C.F.R. §§ 99.20 to 99.22 supply the request, the hearing before an
  official without a direct interest, and the written decision. The remedy on refusal is the third
  limb of this paragraph and the one institutions forget — the parent may place a written
  explanation in the record, and under 34 C.F.R. § 99.21(c) it must be kept with the contested part
  of the record and disclosed whenever that part is disclosed. Because Gonzaga University v. Doe
  (2002) foreclosed private enforcement, a parent whose hearing is denied complains to the
  Department rather than suing, which is why the practical leverage in edtech disputes is the
  school's contract with the vendor rather than the statute.
