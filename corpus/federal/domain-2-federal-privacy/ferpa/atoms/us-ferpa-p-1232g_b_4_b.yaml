verbatim_span: >-
  With respect to this subsection, personal information shall only be transferred to a third party
  on the condition that such party will not permit any other party to have access to such
  information without the written consent of the parents of the student. If a third party outside
  the educational agency or institution permits access to information in violation of paragraph
  (2)(A), or fails to destroy information in violation of paragraph (1)(F), the educational agency
  or institution shall be prohibited from permitting access to information from education records to
  that third party for a period of not less than five years.
