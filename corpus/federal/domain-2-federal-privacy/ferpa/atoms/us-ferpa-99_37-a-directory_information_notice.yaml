summary: >-
  An educational agency or institution may disclose directory information only if it has first given
  public notice to parents and eligible students in attendance of the types of information
  designated as directory information, of the right to refuse the designation, and of the period
  within which to refuse.
requirement_detail: >-
  DIRECTORY INFORMATION IS THE ONLY CATEGORY A SCHOOL MAY PUBLISH WITHOUT CONSENT, AND THE
  PERMISSION IS CONDITIONAL ON THE NOTICE HAVING BEEN GIVEN FIRST. A designation without the §
  99.37(a) public notice does not produce lawful directory information; it produces an unconsented
  disclosure under § 99.30, which is the sequencing error behind most district incidents involving
  yearbooks, athletic programmes and honour rolls. The statutory list sits at 20 U.S.C. §
  1232g(a)(5)(A) and the regulatory definition at § 99.3, and a school may designate less than the
  list but never an item that identifies the student in the way § 99.37(e) forbids — an SSN or other
  non-directory element used alone or in combination to identify the student pulls the disclosure
  back under the § 99.30 written-consent requirement. Paragraph (b) allows continued disclosure
  about FORMER students without repeating the notice, but an opt-out made while the student was in
  attendance keeps binding until the student rescinds it, so opt-out flags must survive the
  student-record archival process. Paragraph (d) is the underused lever: the school may state in the
  notice that directory-information disclosure is limited to specific parties or purposes, which is
  how a district keeps a lawful yearbook designation from becoming a commercial mailing list.
  Directory information is where the operational FERPA questions actually arise, and none of it is
  visible from the statute alone.
deadline: null
no_deadline_stated: >-
  The rule fixes no period for the notice itself. § 99.37(a)(3) requires the notice to state the
  period within which a parent or eligible student may refuse the designation, but sets no length
  for that period and no deadline for issuing the notice; the only timing requirement is sequential
  — notice before disclosure. Checked § 99.37(a) to (e), the annual-notification rule in § 99.7, and
  20 U.S.C. § 1232g(a)(5)(B), which requires only "a reasonable period of time" after notice.
