common_errors:
  - >-
    Treating designated directory information as publishable by default. The disclosure is lawful
    only after the § 99.37(a) public notice, including the refusal right and the refusal period.
  - >-
    Letting an opt-out lapse when the student leaves. Under § 99.37(b) an opt-out made while in
    attendance continues to bind until the former student rescinds it.
  - >-
    Designating an identifier such as a student SSN or an ID number that unlocks records. § 99.37(e)
    returns that disclosure to the § 99.30 consent requirement.
