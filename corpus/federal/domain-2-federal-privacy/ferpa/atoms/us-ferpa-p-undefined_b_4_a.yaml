verbatim_span: >-
  Each educational agency or institution shall maintain a record, kept with the education records of
  each student, which will indicate all individuals (other than those specified in paragraph (1)(A)
  of this subsection), agencies, or organizations which have requested or obtained access to a
  student’s education records maintained by such educational agency or institution, and which will
  indicate specifically the legitimate interest that each such person, agency, or organization has
  in obtaining this information. Such record of access shall be available only to parents, to the
  school official and his assistants who are responsible for the custody of such records, and to
  persons or organizations authorized in, and under the conditions of, clauses (A) and (C) of
  paragraph (1) as a means of auditing the operation of the system.
