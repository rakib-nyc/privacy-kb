verbatim_span: >-
  If, as a result of the hearing, the educational agency or institution decides that the information
  in the education record is not inaccurate, misleading, or otherwise in violation of the privacy
  rights of the student, it shall inform the parent or eligible student of the right to place a
  statement in the record commenting on the contested information in the record or stating why he or
  she disagrees with the decision of the agency or institution, or both.
