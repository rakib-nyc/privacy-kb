common_errors:
  - >-
    Reading "school official" as a status a vendor either has or lacks. It is a determination the
    school must make against criteria published in its § 99.7 annual notification, for a disclosure
    tied to a legitimate educational interest.
  - >-
    Assuming FERPA regulates the vendor. FERPA binds the institution; the vendor is reached through
    contract and through the § 99.33(e) five-year exclusion after improper redisclosure.
  - >-
    Treating acceptance of click-through terms as direct control. § 99.31(a)(1)(i)(B) requires the
    school to have direct control over the outside party's maintenance and use of the records.
