summary: >-
  An educational agency or institution may disclose personally identifiable information from
  education records without consent where the disclosure is to other school officials, including
  teachers, within the agency or institution whom it has determined to have legitimate educational
  interests.
requirement_detail: >-
  THIS IS WHERE EVERY EDTECH VENDOR ACTUALLY SITS, AND THE STATUTE ALONE WILL NOT GET YOU THERE. 20
  U.S.C. § 1232g(b)(1)(A) permits disclosure to school officials with legitimate educational
  interests; it is the regulation — § 99.31(a)(1)(i)(B) — that lets a contractor, consultant or
  volunteer BE one, and only where the outside party performs an institutional service the school
  would otherwise use employees for, is under the school's direct control as to maintenance and use
  of the records, and is bound by the redisclosure limits in § 99.33(a). Two conditions do the real
  work and are routinely missed: the school must have specified its criteria for "school official"
  and "legitimate educational interest" in the annual notification under § 99.7, so an undisclosed
  criterion cannot be relied on after the fact; and § 99.31(a)(1)(ii) requires reasonable methods
  limiting each official to the records in which they have such an interest, which is an
  access-control obligation districts fail on shared student-information-system accounts. The
  exception permits disclosure — it does not make the vendor a regulated party. FERPA binds the
  funded institution; the vendor's exposure is the contract, plus the five-year exclusion from
  access under § 99.33(e) if it rediscloses improperly. Note also that this is a permission, not an
  authorisation to use the data for the vendor's own purposes: product improvement or advertising
  falls outside "legitimate educational interests" and is the term state student-privacy statutes
  were written to reach.
