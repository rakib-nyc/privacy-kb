common_errors:
  - >-
    Treating forty-five days as the service standard. It is the statutory ceiling, and the duty is
    to act within a reasonable period that in no case exceeds it.
  - >-
    Giving parents of an enrolled college student routine access. The rights transferred to the
    eligible student under 34 C.F.R. § 99.5(a)(1); tuition payment does not restore them.
  - >-
    Reading access as a right to have the record changed. Amendment runs through the (a)(2) hearing,
    and a refusal leaves only the right to insert a written statement.
