summary: >-
  Federal funds are conditioned on the institution not denying, or effectively preventing, parents
  the right to inspect and review their children's education records, and on its granting access
  within a reasonable time and in no case more than forty-five days after the request.
requirement_detail: >-
  THE ACCESS RIGHT IS A CONDITION ON THE INSTITUTION'S POLICY, WHICH IS WHY THE REMEDY IS NEVER A
  SUIT. The statute forbids a policy of denying or effectively preventing inspection — an
  "effectively prevents" claim is how a fee schedule or an appointment-only rule becomes a violation
  without any outright refusal — and Gonzaga University v. Doe (2002) closed § 1983, so the only
  route is a complaint to the Department. The forty-five-day period is in the statute itself and is
  repeated at 34 C.F.R. § 99.10(b): calendar days from the request, an outer limit rather than a
  service standard, and not tolled by a school holiday. The right belongs to parents until the
  student turns 18 or enrols in a postsecondary institution, at which point it transfers to the
  student under 34 C.F.R. § 99.5(a)(1) — a university that gives parents routine access to an adult
  student's records is the recurring institutional error, and paying tuition does not change it.
  Access is not amendment: where the parent disputes what the record says, the route is the §
  1232g(a)(2) hearing, and the second sentence here limits inspection of a shared document to the
  part relating to that student.
deadline:
  trigger_event: the parent's request to inspect and review the student's education records
  duration:
    value: 45
    unit: calendar_days
  computation: >-
    Calendar days from the date the request was made. The statute fixes "a reasonable period of
    time, but in no case more than forty-five days after the request has been made", so forty-five
    days is the ceiling and a longer routine turnaround is a violation regardless of the reason; 34
    C.F.R. § 99.10(b) restates the same period.
