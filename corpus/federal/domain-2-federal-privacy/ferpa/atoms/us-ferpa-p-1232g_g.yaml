verbatim_span: >-
  The Secretary shall establish or designate an office and review board within the Department for
  the purpose of investigating, processing, reviewing, and adjudicating violations of this section
  and complaints which may be filed concerning alleged violations of this section. Except for the
  conduct of hearings, none of the functions of the Secretary under this section shall be carried
  out in any of the regional offices of such Department.
