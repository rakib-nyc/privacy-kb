verbatim_span: >-
  An educational agency or institution may disclose directory information about former students
  without complying with the notice and opt out conditions in paragraph (a) of this section.
  However, the agency or institution must continue to honor any valid request to opt out of the
  disclosure of directory information made while a student was in attendance unless the student
  rescinds the opt out request.
