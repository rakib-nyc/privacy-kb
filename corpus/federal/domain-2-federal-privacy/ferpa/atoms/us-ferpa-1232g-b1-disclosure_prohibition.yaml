summary: No funds shall be made available to an educational agency or institution that has a policy or
  practice of releasing education records, or personally identifiable information other than directory
  information, without written consent, except to the enumerated recipients.
requirement_detail: FERPA IS A FUNDING CONDITION, NOT A PROHIBITION, and the whole statute follows from
  that. It reaches only institutions receiving Department of Education funds; the sanction is withdrawal
  of funds; and it targets a POLICY OR PRACTICE rather than an individual disclosure, so one improper
  release is not a violation in the way a single HIPAA disclosure is. There is no private right of action
  — Gonzaga University v. Doe (2002) foreclosed § 1983 enforcement — which is why FERPA litigation is
  rare despite its breadth, and why the practical constraint on an edtech vendor is usually the school's
  contract rather than FERPA itself.
