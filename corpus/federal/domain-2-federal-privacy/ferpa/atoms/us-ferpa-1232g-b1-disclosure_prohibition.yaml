common_errors:
- Treating a single improper release as a violation. The statute targets a policy or practice.
- Assuming a private right of action. Gonzaga v. Doe foreclosed it.
- Applying it to a vendor directly. FERPA binds the institution; vendors are reached through the school-official
  exception and their contracts.
