    verbatim_span: >-
      No funds shall be made available under any applicable program to any educational agency or
      institution which has a policy or practice of permitting the release of education records (or
      personally identifiable information contained therein other than directory information, as
      defined in paragraph (5) of subsection (a)) of students without the written consent of their
      parents to any individual, agency, or organization, other than to the following—
    path:
      - b
      - '1'
    citation: 20 U.S.C. § 1232g(b)(1)
  - position: follows
    relation: scopes
    verbatim_span: >-
      Nothing in subparagraph (E) of this paragraph shall prevent a State from further limiting the
      number or type of State or local officials who will continue to have access thereunder.
    path:
      - b
      - '1'
    citation: 20 U.S.C. § 1232g(b)(1)
  - position: precedes
    relation: scopes
    verbatim_span: >-
      the Secretary of Agriculture, or authorized representative from the Food and Nutrition Service
      or contractors acting on behalf of the Food and Nutrition Service, for the purposes of
      conducting program monitoring, evaluations, and performance measurements of State and local
      educational and other agencies and institutions receiving funding or providing benefits of 1
      or more programs authorized under the Richard B. Russell National School Lunch Act ( 42 U.S.C.
      1751 et seq.) or the Child Nutrition Act of 1966 ( 42 U.S.C. 1771 et seq.) for which the
      results will be reported in an aggregate form that does not identify any individual, on the
      conditions that—
