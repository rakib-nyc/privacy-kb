verbatim_span: >-
  Upon request of an educational agency or institution, a State or local educational authority or
  Federal official or agency listed in § 99.31(a)(3) that maintains a record of further disclosures
  under paragraph (b)(2)(i) of this section must provide a copy of the record of further disclosures
  to the educational agency or institution within a reasonable period of time not to exceed 30 days.
