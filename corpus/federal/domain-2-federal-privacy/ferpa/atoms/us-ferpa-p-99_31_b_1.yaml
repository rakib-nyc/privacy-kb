verbatim_span: >-
  An educational agency or institution, or a party that has received education records or
  information from education records under this part, may release the records or information without
  the consent required by § 99.30 after the removal of all personally identifiable information
  provided that the educational agency or institution or other party has made a reasonable
  determination that a student's identity is not personally identifiable, whether through single or
  multiple releases, and taking into account other reasonably available information.
