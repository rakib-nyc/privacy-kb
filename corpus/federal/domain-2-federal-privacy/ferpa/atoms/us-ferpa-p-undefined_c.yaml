verbatim_span: >-
  Not later than 240 days after October 20, 1994 , the Secretary shall adopt appropriate regulations
  or procedures, or identify existing regulations or procedures, which protect the rights of privacy
  of students and their families in connection with any surveys or data-gathering activities
  conducted, assisted, or authorized by the Secretary or an administrative head of an education
  agency. Regulations established under this subsection shall include provisions controlling the
  use, dissemination, and protection of such data. No survey or data-gathering activities shall be
  conducted by the Secretary, or an administrative head of an education agency under an applicable
  program, unless such activities are authorized by law.
