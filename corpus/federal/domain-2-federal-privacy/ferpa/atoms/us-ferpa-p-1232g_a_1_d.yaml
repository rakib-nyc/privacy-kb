verbatim_span: >-
  A student or a person applying for admission may waive his right of access to confidential
  statements described in clause (iii) of subparagraph (C), except that such waiver shall apply to
  recommendations only if (i) the student is, upon request, notified of the names of all persons
  making confidential recommendations and (ii) such recommendations are used solely for the purpose
  for which they were specifically intended. Such waivers may not be required as a condition for
  admission to, receipt of financial aid from, or receipt of any other services or benefits from
  such agency or institution.
