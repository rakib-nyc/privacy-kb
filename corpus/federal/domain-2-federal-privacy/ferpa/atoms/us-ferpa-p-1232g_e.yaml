verbatim_span: >-
  No funds shall be made available under any applicable program to any educational agency or
  institution unless such agency or institution effectively informs the parents of students, or the
  students, if they are eighteen years of age or older, or are attending an institution of
  postsecondary education, of the rights accorded them by this section.
