summary: Disclosure is permitted to any person with the informed, written consent of the consumer, given
  in a form distinct and separate from any other legal or financial notice.
requirement_detail: 'THE CONSENT THAT COSTS THE MOST TO GET RIGHT. § 2710(b)(2)(B) does not accept consent
  buried in terms of service: it must be in a form DISTINCT AND SEPARATE from any other legal or financial
  notice. The 2012 amendment allows consent given electronically and in advance for up to two years, with
  a withdrawal mechanism that must be available at any time — which is why the social-sharing feature
  that triggered the amendment is lawful only with a standing, revocable, separately-obtained consent
  rather than an accepted agreement.'
common_errors:
- Accepting consent inside terms of service. It must be distinct and separate.
- Treating advance consent as permanent. It runs for up to two years and must be withdrawable at any time.
