summary: >-
  Any person aggrieved by a violation of this section may bring a civil action in a United States
  district court.
requirement_detail: >-
  THE REASON VPPA IS LITIGATED AT ALL. § 2710(c)(2) sets liquidated damages of $2,500 per violation,
  which converts a pixel or SDK on a video page into class exposure without any proof of actual
  harm. That combination — a 1988 statute, a per-violation floor, and modern web analytics — is why
  a statute written about videotape rental records is a live risk for any site that plays video and
  runs third-party tags.
common_errors:
  - Assuming actual damages must be proven. § 2710(c)(2) sets liquidated damages of $2,500.
  - >-
    Treating the statute as obsolete because it names videotapes. "Similar audio visual materials"
    has carried it onto the modern web.
