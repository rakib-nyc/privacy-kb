common_errors:
  - >-
    Dismissing VPPA as obsolete because it says 'video tape'. The defined terms are
    technology-neutral and it is among the most actively litigated privacy statutes in the US,
    largely against pixel and SDK deployments on streaming sites.
  - >-
    Assuming enforcement is regulatory. There is NO agency enforcer — VPPA is enforced entirely by
    private action, with liquidated damages of at least $2,500 per person.
  - >-
    Overlooking 'knowingly'. The disclosure must be knowing; inadvertent transmission is a contested
    question rather than an automatic violation.
open_questions:
  - >-
    Whether embedding a third-party pixel constitutes a 'knowing disclosure' is heavily litigated
    and unsettled. The statute's text does not resolve it and this record does not either.
  - >-
    The scope of 'consumer' as applied to free, ad-supported subscribers is contested. Recorded as
    an ambiguity in the source rather than resolved.
