summary: >-
  A video tape service provider who knowingly discloses personally identifiable information about a
  consumer is liable to the aggrieved person.
requirement_detail: >-
  Liability attaches to KNOWING disclosure of PII concerning a consumer. Three defined terms carry
  the weight, all at § 2710(a): 'video tape service provider' reaches any person engaged in the
  business of rental, sale or delivery of prerecorded audiovisual materials; 'consumer' includes a
  subscriber; and 'personally identifiable information' includes information identifying a person as
  having requested or obtained specific materials. Those definitions are why a 1988 statute about
  video rental reaches modern streaming and pixel deployments.
preemption:
  posture: floor
  authority: 18 U.S.C. § 2710(f)
  note: VPPA does not preempt more protective state video-privacy law; several states have their own.
enforcement:
  enforcers:
    - private_litigants
  private_right_of_action: true
  penalty:
    structure: liquidated damages, punitive damages, attorney fees and costs under § 2710(c)
    range:
      min: 2500
      unit: usd_liquidated_per_person
    note: >-
      Liquidated damages of not less than $2,500 per aggrieved person, which is what makes class
      exposure severe.
  statute_of_limitations: 2 years from the date of the act complained of or the date of discovery (§ 2710(c)(3))
