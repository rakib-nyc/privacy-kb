  trigger_event: the date the information is no longer necessary for the purpose for which it was collected
  duration:
    value: 1
    unit: years
  computation: >-
    As soon as practicable, and no later than ONE YEAR from the date the information stops being
    necessary — not one year from collection. The clock starts on a fact about purpose, so an
    operator with no retention analysis cannot know when it began.
summary: >-
  A video tape service provider must destroy personally identifiable information as soon as
  practicable, and no later than one year after it is no longer necessary for its purpose.
requirement_detail: >-
  A RARE FEDERAL RETENTION LIMIT. Most US federal privacy law regulates disclosure and says nothing
  about how long data may be kept; VPPA § 2710(e) is one of the few provisions that sets an outer
  bound. The trigger is purpose exhaustion rather than collection, which means the obligation cannot
  be operationalised without a documented purpose for each record.
common_errors:
  - Running the year from collection. It runs from the end of the purpose.
  - >-
    Treating one year as the standard. The standard is "as soon as practicable"; one year is the
    ceiling.
