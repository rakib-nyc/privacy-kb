verbatim_span: >-
  A person subject to this section shall destroy personally identifiable information as soon as
  practicable, but no later than one year from the date the information is no longer necessary for
  the purpose for which it was collected and there are no pending requests or orders for access to
  such information under subsection (b)(2) or (c)(2) or pursuant to a court order.
