verbatim_span: >-
  Court orders authorizing disclosure under subparagraph (C) shall issue only with prior notice to
  the consumer and only if the law enforcement agency shows that there is probable cause to believe
  that the records or other information sought are relevant to a legitimate law enforcement inquiry.
  In the case of a State government authority, such a court order shall not issue if prohibited by
  the law of such State. A court issuing an order pursuant to this section, on a motion made
  promptly by the video tape service provider, may quash or modify such order if the information or
  records requested are unreasonably voluminous in nature or if compliance with such order otherwise
  would cause an unreasonable burden on such provider.
