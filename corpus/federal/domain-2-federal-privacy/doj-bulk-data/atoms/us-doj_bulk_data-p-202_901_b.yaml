verbatim_span: >-
  The entire transaction that is the subject of the advisory opinion request must be an actual, as
  opposed to hypothetical, transaction and involve disclosed, as opposed to anonymous, parties to
  the transaction. Advisory opinion requests must be submitted by a U.S. person party to the
  transaction or that party's agent and have no application to a party that does not join the
  request. The transaction need not involve only prospective conduct, but an advisory opinion
  request will not be considered unless that portion of the transaction for which an opinion is
  sought involves only prospective conduct.
