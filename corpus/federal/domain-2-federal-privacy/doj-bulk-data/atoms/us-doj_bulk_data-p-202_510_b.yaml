verbatim_span: >-
  For purposes of this section, the term regulatory approval data means sensitive personal data that
  is de-identified or pseudonymized consistent with the standards of 21 CFR 314.80 and that is
  required to be submitted to a regulatory entity, or is required by a regulatory entity to be
  submitted to a covered person, to obtain or maintain authorization or approval to research or
  market a drug, biological product, device, or combination product, including in relation to
  post-marketing studies and post-marketing product surveillance activities, and supplemental
  product applications for additional uses. The term excludes sensitive personal data not reasonably
  necessary for a regulatory entity to assess the safety and effectiveness of the drug, biological
  product, device, or combination product.
