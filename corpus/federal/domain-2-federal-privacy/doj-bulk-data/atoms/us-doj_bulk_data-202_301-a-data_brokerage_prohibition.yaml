preemption:
  posture: none
  authority: 28 C.F.R. § 202.1301
  note: >-
    Part 202 displaces nothing. It is an IEEPA prohibition that runs ALONGSIDE every privacy duty in
    this corpus and every state privacy statute: complying with it satisfies no notice, consent or
    security obligation, and complying with those satisfies nothing here. The practical effect is
    additive exposure rather than a preemption question, and § 202.1301(e) says as much — violations
    may also be subject to other applicable laws.
enforcement:
