common_errors:
  - >-
    Treating consent as a cure. Nothing in § 202.301 turns on the data subject's permission; the
    prohibition runs against the U.S. person whatever the individual agreed to.
  - >-
    Assuming it only reaches entities located in a country of concern. Covered person at § 202.211
    also reaches foreign entities 50% or more owned by such a country, and individuals who are their
    employees or contractors, wherever they are.
  - >-
    Reading it as a security-controls requirement. The security requirements at § 202.248 govern
    RESTRICTED transactions under subpart J; a prohibited data-brokerage transaction is not cured by
    controls, and § 202.201 provides that access is determined without regard to the application or
    effect of any security requirements.
open_questions:
  - >-
    The defined terms that do the work here — data brokerage (§ 202.214), covered data transaction
    (§ 202.210), covered person (§ 202.211), bulk (§ 202.205), sensitive personal data (§ 202.249)
    and knowingly (§ 202.230) — are in the same fetched source but are NOT yet extracted as atoms.
    Until they are, an applicability answer from this atom depends on facts the engine cannot check.
  - >-
    The general and specific licensing regime and the advisory-opinion process may authorise an
    otherwise prohibited transaction. Neither is extracted here.
