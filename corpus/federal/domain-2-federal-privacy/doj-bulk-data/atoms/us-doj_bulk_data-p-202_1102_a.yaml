verbatim_span: >-
  Every person is required to furnish under oath, in the form of reports or otherwise, from time to
  time and at any time as may be required by the Department of Justice, complete information
  relative to any act or transaction or covered data transaction, regardless of whether such act,
  transaction, or covered data transaction is effected pursuant to a license or otherwise, subject
  to the provisions of this part and except as otherwise prohibited by Federal law. The Department
  of Justice may require that such reports include the production of any books, contracts, letters,
  papers, or other hard copy or electronic documents relating to any such act, transaction, or
  covered data transaction, in the custody or control of the persons required to make such reports.
  Reports may be required either before, during, or after such acts, transactions, or covered data
  transactions. The Department of Justice may, through any person or agency, conduct investigations,
  hold hearings, administer oaths, examine witnesses, receive evidence, take depositions, and
  require by subpoena the attendance and testimony of witnesses and the production of any books,
  contracts, letters, papers, and other hard copy or electronic documents relating to any matter
  under investigation, regardless of whether any report has been required or filed in connection
  therewith.
