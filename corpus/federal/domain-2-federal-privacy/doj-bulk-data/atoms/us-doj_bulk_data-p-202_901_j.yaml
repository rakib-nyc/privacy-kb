verbatim_span: >-
  An advisory opinion may be amended or revoked at any time after it has been issued. Notice of such
  will be given in the same manner as notice of the advisory opinion was originally given or in the
  Federal Register. Whenever possible, a notice of amendment or revocation will state when the
  Department will consider a party's reliance on the superseded advisory opinion to be unreasonable,
  and any transition period that may be applicable.
