verbatim_span: >-
  A U.S. subsidiary of a company headquartered in a country of concern develops an artificial
  intelligence chatbot in the United States that is trained on the bulk U.S. sensitive personal data
  of U.S. persons. While not its primary commercial use, the chatbot is capable of reproducing or
  otherwise disclosing the bulk U.S. sensitive personal health data that was used to train the
  chatbot when responding to queries. The U.S. subsidiary knowingly licenses subscription-based
  access to that chatbot worldwide, including to covered persons such as its parent entity. Although
  licensing use of the chatbot itself may not necessarily “involve access” to bulk U.S. sensitive
  personal data, the U.S. subsidiary knows or should know that the license can be used to obtain
  access to the U.S. persons' bulk sensitive personal training data if prompted. The licensing of
  access to this bulk U.S. sensitive personal data is data brokerage because it involves the
  transfer of data from the U.S. company ( i.e., the provider) to licensees ( i.e., the recipients),
  where the recipients did not collect or process the data directly from the individuals linked or
  linkable to the collected or processed data. Even though the license did not explicitly provide
  access to the data, this is a prohibited transaction because the U.S. company knew or should have
  known that the use of the chatbot pursuant to the license could be used to obtain access to the
  training data, and because the U.S. company licensed the product to covered persons.
