common_errors:
  - >-
    Reading part 202 as a privacy law with data-subject rights. It has none — no notice, no consent,
    no access, no deletion, no private right of action. It is an IEEPA prohibition addressed to U.S.
    persons and enforced by the Department of Justice.
  - >-
    Concluding that an entity with no HIPAA, GLBA or FCRA duty is unregulated. Part 202 reaches by
    data category and counterparty, so the entity with the fewest sectoral duties is often the one
    most exposed here.
  - >-
    Citing § 202.101 as the operative prohibition. It states scope and recites the Order's
    direction; the prohibitions themselves are separate sections, for example § 202.301.
open_questions:
  - >-
    The two data categories that define the part — government-related data and bulk U.S. sensitive
    personal data — are defined in subpart B (§ 202.222 and § 202.206) and are not extracted as
    atoms yet, so this atom states what the part reaches without letting the engine compute it.
  - >-
    effective_from records 8 April 2025, taken from the definition of effective date at § 202.216 in
    the same source. Compliance dates for particular obligations elsewhere in the part may differ
    and are not recorded here.
