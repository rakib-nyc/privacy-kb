verbatim_span: >-
  Executive Order 14117 of February 28, 2024 (Preventing Access to Americans' Bulk Sensitive
  Personal Data and United States Government-Related Data by Countries of Concern) (“the Order”),
  directs the Attorney General to issue regulations that prohibit or otherwise restrict United
  States persons from engaging in any acquisition, holding, use, transfer, transportation, or
  exportation of, or dealing in, any property in which a foreign country or national thereof has any
  interest (“transaction”), where the transaction: involves United States Government-related data
  (“government-related data”) or bulk U.S. sensitive personal data, as defined by final rules
  implementing the Order; falls within a class of transactions that has been determined by the
  Attorney General to pose an unacceptable risk to the national security of the United States
  because the transactions may enable access by countries of concern or covered persons to
  government-related data or bulk U.S. sensitive personal data; and meets other criteria specified
  by the Order.
