preemption:
  posture: none
  authority: 28 C.F.R. § 202.1301
  note: >-
    Part 202 displaces nothing. It is an IEEPA prohibition that runs ALONGSIDE every privacy duty in
    this corpus and every state privacy statute: complying with it satisfies no notice, consent or
    security obligation, and complying with those satisfies nothing here. The practical effect is
    additive exposure rather than a preemption question, and § 202.1301(e) says as much — violations
    may also be subject to other applicable laws.
enforcement:
  enforcers:
    - doj
  private_right_of_action: false
  penalty:
    structure: >-
      § 202.1301 applies section 206 of IEEPA, 50 U.S.C. 1705. Civil penalty up to the greater of
      the IEEPA maximum stated in § 202.1301(a)(2) or twice the amount of the transaction,
      inflation-adjusted; willful violation carries a criminal fine and, for a natural person,
      imprisonment. False statements in submissions are separately reachable under 18 U.S.C. 1001
      per § 202.1301(d).
    range: >-
      Civil: greater of the adjusted IEEPA maximum or twice the transaction amount. Criminal
      (willful): fine and, for a natural person, imprisonment.
    note: >-
      NO PRIVATE RIGHT OF ACTION and no data-subject remedy of any kind. This is a national security
      enforcement regime, so the exposure is to the Department of Justice, not to the individuals
      whose data moved. Criminal exposure for a data transfer is unique in this corpus.
  statute_of_limitations: null
