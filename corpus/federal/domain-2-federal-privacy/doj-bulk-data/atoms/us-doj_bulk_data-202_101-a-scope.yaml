obligation_type: prohibit
summary: >-
  Part 202 implements Executive Order 14117 by prohibiting or restricting U.S. persons from
  transactions involving government-related data or bulk U.S. sensitive personal data that fall
  within a class the Attorney General has determined poses an unacceptable national security risk.
requirement_detail: >-
  WHAT PART 202 REACHES, AND WHY IT IS UNLIKE EVERYTHING ELSE IN THIS CORPUS. Scope follows the
  Order it implements: the Attorney General is directed to regulate transactions defined to cover
  "any acquisition, holding, use, transfer, transportation, or exportation of, or dealing in, any
  property in which a foreign country or national thereof has any interest", where the transaction
  "involves United States Government-related data" or bulk U.S. sensitive personal data, and where
  it falls in a class determined to "pose an unacceptable risk to the national security of the
  United States". Two consequences follow. First, coverage turns on the CLASS and DESTINATION of a
  transaction rather than on a relationship with a data subject — there is no consumer in this part,
  no notice duty, no consent gate, no access right and no private remedy, so an entity can be
  squarely inside it while holding nothing any sectoral statute here regulates. Second, because the
  reach is by data category rather than by sector, the entity most exposed is frequently the one
  carrying the fewest other privacy obligations: brokers, adtech intermediaries and analytics
  vendors outside HIPAA, GLBA and FCRA. Scope alone decides nothing operationally — the prohibitions
  are in the sections that follow, and the definitions that fix coverage are in subpart B.
exemptions:
  - id: cfr.28.202.219.exempt_transaction
    type: activity_level
    scope: >-
      Subpart E exempts whole classes of data transaction from the prohibitions of this part, and §
      202.219 is the definitional hook: an exempt transaction is one subject to one or more of those
      exemptions. THIS IS THE FIRST THING TO CHECK, because the subpart E classes (personal
      communications, financial services, corporate group transactions, federal government activity
      and others) cover a large share of ordinary cross-border business. The exemption is
      ACTIVITY-scoped, not entity-scoped: it relieves the transaction, so the same U.S. person can
      be exempt on one data flow and prohibited on the next.
    source_citation: 28 C.F.R. § 202.219
    verbatim_span: >-
      The term exempt transaction means a data transaction that is subject to one or more exemptions
      described in subpart E of this part.
    burden_of_proof: entity
    applies_if:
      all:
        - practice.is_exempt_transaction_under_subpart_e == true
  - id: cfr.28.202.249.b2.public_data
    type: data_level
    scope: >-
      Data lawfully available to the public from a Federal, State or local government record, or in
      widely distributed media, is excluded from sensitive personal data at the time of the
      transaction. DATA-LEVEL, NOT ENTITY-LEVEL: it removes the data from the definition, so a
      broker dealing in public-record data is outside the prohibition for that data and fully inside
      it for anything else it moves. The timing qualifier matters — the test is applied at the time
      of the transaction, so data that was public when acquired but is not public now does not
      qualify.
    source_citation: 28 C.F.R. § 202.249(b)(2)
    verbatim_span: >-
      Data that is, at the time of the transaction, lawfully available to the public from a Federal,
      State, or local government record (such as court records) or in widely distributed media (such
      as sources that are generally available to the public through unrestricted and open-access
      repositories);
    burden_of_proof: entity
    applies_if:
      all:
        - data.lawfully_available_to_the_public == true
