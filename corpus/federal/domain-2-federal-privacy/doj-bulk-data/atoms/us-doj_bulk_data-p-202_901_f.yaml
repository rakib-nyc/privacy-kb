verbatim_span: >-
  After submission of an advisory opinion request, the Department, in its discretion, may state its
  present enforcement intention under the Order and this part with respect to the proposed conduct;
  may decline to state its present enforcement intention; or, if circumstances warrant, may take
  such other position or initiate such other action as it considers appropriate. Any requesting
  party or parties may withdraw a request at any time prior to issuance of an advisory opinion. The
  Department remains free, however, to submit such comments to the requesting party or parties as it
  deems appropriate. Failure to take action after receipt of a request, documents, or information,
  whether submitted pursuant to this procedure or otherwise, shall not in any way limit or stop the
  Department from taking any action at such time thereafter as it deems appropriate. The Department
  reserves the right to retain any advisory opinion request, document, or information submitted to
  it under this procedure or otherwise, to disclose any advisory opinion and advisory opinion
  request, including the identities of the requesting party and foreign parties to the transaction,
  the general nature and circumstances of the proposed conduct, and the action of the Department in
  response to any advisory opinion request, consistent with applicable law, and to use any such
  request, document, or information for any governmental purpose.
