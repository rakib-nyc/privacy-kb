verbatim_span: >-
  Persons availing themselves of certain general licenses may be required to file reports and
  statements in accordance with the instructions specified in those licenses, this part or the
  Order. Failure to file timely all required information in such reports or statements may nullify
  the authorization otherwise provided by the general license and result in apparent violations of
  the applicable prohibitions that may be subject to enforcement action.
