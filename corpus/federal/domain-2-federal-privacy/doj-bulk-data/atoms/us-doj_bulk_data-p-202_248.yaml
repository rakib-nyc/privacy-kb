verbatim_span: >-
  The term security requirements means the Cybersecurity and Infrastructure Agency (“CISA”) Security
  Requirements for Restricted Transactions E.O. 14117 Implementation, January 2025. This material is
  incorporated by reference into this section with the approval of the Director of the Federal
  Register under 5 U.S.C. 552(a) and 1 CFR part 51. This incorporation by reference (“IBR”) material
  is available for inspection at the Department of Justice and at the National Archives and Records
  Administration (“NARA”). Please contact the Foreign Investment Review Section, National Security
  Division, U.S. Department of Justice, 175 N St. NE, Washington, DC 20002, telephone: 202-514-8648,
  NSD.FIRS.datasecurity@usdoj.gov; www.justice.gov/nsd. For information on the availability of this
  material at NARA, visit www.archives.gov/federal-register/cfr/ibr-locations or email
  fr.inspection@nara.gov. The material may be obtained from the National Security Division and the
  Cybersecurity and Infrastructure Security Agency (CISA), Mail Stop 0380, Department of Homeland
  Security, 245 Murray Lane, Washington, DC 20528-0380; central@cisa.gov; 888-282-0870;
  www.cisa.gov/.
