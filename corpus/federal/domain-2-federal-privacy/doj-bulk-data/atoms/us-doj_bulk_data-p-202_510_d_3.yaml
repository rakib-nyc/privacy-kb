verbatim_span: >-
  Same as Example 1, except country of concern law requires foreign pharmaceutical companies to
  submit regulatory approval data using (1) a registered agent who primarily resides in the country
  of concern, (2) a country of concern incorporated subsidiary, or (3) an employee located in a
  country of concern. The U.S. pharmaceutical company enters into a vendor agreement with a
  registered agent in the country of concern to submit the regulatory approval data to the country
  of concern regulator. The U.S. pharmaceutical company provides to the registered agent only the
  regulatory approval data the U.S. pharmaceutical company intends the registered agent to submit to
  the country of concern regulator. The transaction with the registered agent is exempt, because it
  is necessary to obtain approval to market the drug in a country of concern. The U.S.
  pharmaceutical company must comply with the recordkeeping and reporting requirements set forth in
  §§ 202.1101(a) and 202.1102 with respect to such transaction, however.
