summary: >-
  A provider must comply with obligations to preserve, back up or disclose the contents of a
  communication and any record in its possession, custody or control, regardless of whether the
  material is located within or outside the United States.
requirement_detail: >-
  THE CONFLICT-OF-LAWS PROVISION, and it is one sentence. § 2713 makes location irrelevant to a US
  provider's obligation, which is precisely what a GDPR transfer analysis has to contend with: a
  provider subject to US process cannot answer an EU regulator by pointing at where the servers sit.
  It resolved Microsoft Ireland by legislation rather than by doctrine, and it is the reason the
  Article 48 question about foreign judgments is live for US cloud services in a way it is not for
  purely local ones.
common_errors:
  - Treating data localisation as an answer to US process. § 2713 makes storage location irrelevant.
  - >-
    Assuming it creates new authority to compel. It extends the reach of obligations that already
    exist under this chapter rather than adding a new one.
