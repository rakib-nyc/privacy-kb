verbatim_span: >-
  Initiate, or cause to be initiated, any telephone call that includes or introduces an
  advertisement or constitutes telemarketing, using an automatic telephone dialing system or an
  artificial or prerecorded voice, to any of the lines or telephone numbers described in paragraphs
  (a)(1)(i) through (iii) of this section, other than a call made with the prior express written
  consent of the called party or the prior express consent of the called party when the call is made
  by or on behalf of a tax-exempt nonprofit organization, or a call that delivers a “health care”
  message made by, or on behalf of, a “covered entity” or its “business associate,” as those terms
  are defined in the HIPAA Privacy Rule, 45 CFR 160.103.
