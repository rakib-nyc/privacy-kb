preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    The rule is prescribed under § 227, so the statutory savings clause governs it: § 227(f)(1)(B)
    and (C) preserve more restrictive intrastate State law on autodialers and on artificial or
    prerecorded voice messages.
enforcement:
  enforcers:
    - fcc
    - state_ag
  private_right_of_action: true
  penalty:
    structure: >-
      FCC forfeiture under 47 U.S.C. § 503(b); State AG action under § 227(g); private action under
      § 227(b)(3) for violation of the statute the rule implements.
    range: $500 per call under § 227(b)(3), trebled for a wilful or knowing violation.
    note: >-
      Consent is an affirmative defence in practice, and the burden of proving it rests on the
      caller — which is why the § 64.1200(f)(9) writing is retained.
  statute_of_limitations: null
