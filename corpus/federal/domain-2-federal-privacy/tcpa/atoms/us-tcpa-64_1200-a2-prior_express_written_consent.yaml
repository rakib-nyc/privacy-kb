common_errors:
  - >-
    Relying on a checkbox or a call recording for marketing consent. Paragraph (a)(2) requires prior
    express WRITTEN consent as defined in § 64.1200(f)(9), including the disclosure that agreement
    is not a condition of purchase.
  - >-
    Treating consent as permanent. Paragraphs (a)(10)–(a)(12) make revocation available by any
    reasonable means and put the caller on a clock to honour it.
  - >-
    Reading the health-care carve-out as covering any health-related message. It is limited to a
    "health care" message by or on behalf of a covered entity or business associate as those terms
    are defined in the HIPAA Privacy Rule at 45 C.F.R. § 160.103.
