summary: >-
  A call that includes or introduces an advertisement or constitutes telemarketing may not be made
  to the lines and numbers listed in § 64.1200(a)(1)(i)–(iii) using an autodialer or an artificial
  or prerecorded voice without prior express WRITTEN consent, subject to narrow nonprofit and HIPAA
  health-care carve-outs.
requirement_detail: >-
  THIS IS THE PROVISION THAT MAKES "PRIOR EXPRESS CONSENT" A TWO-STANDARD REGIME, and the split is
  invisible in the statute. 47 U.S.C. § 227(b)(1)(A) says only "prior express consent"; the
  Commission raised the bar for marketing content in the 2012 order codified here, so the same call
  to the same wireless number needs oral consent if it is informational and a signed writing if it
  advertises. The writing is defined at § 64.1200(f)(9) and is more demanding than practitioners
  expect: it must bear the signature of the person called, identify the number, clearly authorise
  autodialed or prerecorded marketing to that number, and — under (f)(9)(i)(B) — disclose that
  signing is not a condition of purchase. Consent is also revocable: paragraphs (a)(10) through
  (a)(12) let a called party revoke by any reasonable means and cap the caller's response, which
  means a consent file is a live record rather than a one-time artefact. Because this is a rule
  rather than the statute, its two carve-outs (tax-exempt nonprofits, and HIPAA health-care messages
  by a covered entity or business associate) are FCC creations that a court reads as part of the
  prohibition, not as defences the defendant must prove.
