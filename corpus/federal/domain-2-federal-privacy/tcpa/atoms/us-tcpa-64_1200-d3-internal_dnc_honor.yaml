preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    § 227(f)(1)(D) preserves more restrictive intrastate State law on telephone solicitations. The §
    227(f)(2) national-database carve-out does not reach the internal list, because the internal
    list is not the national database.
