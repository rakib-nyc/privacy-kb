common_errors:
  - >-
    Treating ten business days as the compliance period. The rule requires a reasonable time and
    caps it at ten business days; recording and listing are due immediately.
  - >-
    Assuming an exempt caller owes nothing. Paragraph (d) applies to callers relying on the
    (a)(3)(ii)–(v) exemptions and to any telemarketing call, independent of the national registry.
  - >-
    Believing a telemarketing vendor absorbs the risk. The rule assigns liability for a failure to
    honour the request to the entity on whose behalf the call was made.
