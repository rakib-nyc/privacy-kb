  private_right_of_action: true
  penalty:
    structure: >-
      Private action under 47 U.S.C. § 227(c)(5); FCC forfeiture under § 503(b); State AG action
      under § 227(g).
    range: >-
      Actual monetary loss or up to $500 per violation, whichever is greater, trebled for a wilful
      or knowing violation.
    note: >-
      Internal-list claims are the most common surviving theory after a registry defence succeeds,
      because the two regimes have different exemptions.
