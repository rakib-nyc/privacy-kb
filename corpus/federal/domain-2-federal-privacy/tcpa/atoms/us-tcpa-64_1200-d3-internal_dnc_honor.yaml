summary: >-
  On receiving a do-not-call request from a residential subscriber, the caller must record it and
  add the name and number to its internal do-not-call list at the time of the request, and must
  honour the request within a reasonable time not exceeding ten business days.
requirement_detail: >-
  THE INTERNAL, COMPANY-SPECIFIC DO-NOT-CALL LIST IS A SEPARATE REGIME FROM THE NATIONAL REGISTRY
  AND IS BREACHED FAR MORE OFTEN, because it is the only one that runs against callers who are
  otherwise fully exempt: paragraph (d) reaches calls made under the (a)(3)(ii)–(v)
  prerecorded-voice exemptions and any telemarketing call, so a nonprofit or an EBR caller with a
  clean registry scrub still owes it. Two clocks sit in this paragraph and they are different:
  recording is immediate ("at the time the request is made"), while suppression is "within a
  reasonable time" capped at ten business days — the ten days is an outer limit, not a grace period,
  and a caller with automated suppression cannot argue that ten days was reasonable for it. The
  vendor sentence is the operational trap: where the request is recorded or maintained by a third
  party, liability for a failure to honour it stays with the entity on whose behalf the call was
  made, so outsourcing the list does not outsource the exposure. The final sentence adds a rarely
  noticed consent duty — sharing or forwarding a consumer's do-not-call request outside the seller
  and its affiliates requires the consumer's prior express permission. Retention is governed
  separately by § 64.1200(d)(6): the request must be honoured for five years.
deadline:
  trigger_event: Receipt of a do-not-call request from a residential telephone subscriber
  duration:
    value: 10
    unit: business_days
  computation: >-
    Outer limit only. The paragraph requires the request to be recorded and listed at the time it is
    made, and honoured "within a reasonable time from the date such request is made"; ten business
    days from receipt is the ceiling on what can be reasonable, not the period allowed.
