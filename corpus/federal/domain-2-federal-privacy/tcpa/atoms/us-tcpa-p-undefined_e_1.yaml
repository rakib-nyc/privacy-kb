verbatim_span: >-
  It shall be unlawful for any person within the United States, or any person outside the United
  States if the recipient is within the United States, in connection with any voice service or text
  messaging service, to cause any caller identification service to knowingly transmit misleading or
  inaccurate caller identification information with the intent to defraud, cause harm, or wrongfully
  obtain anything of value, unless such transmission is exempted pursuant to paragraph (3)(B).
