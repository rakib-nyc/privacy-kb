verbatim_span: >-
  Any person that is determined by the Commission, in accordance with paragraphs (3) and (4) of
  section 503(b) of this title , to have violated this subsection shall be liable to the United
  States for a forfeiture penalty. A forfeiture penalty under this paragraph shall be in addition to
  any other penalty provided for by this chapter. The amount of the forfeiture penalty determined
  under this paragraph shall not exceed $10,000 for each violation, or 3 times that amount for each
  day of a continuing violation, except that the amount assessed for any continuing violation shall
  not exceed a total of $1,000,000 for any single act or failure to act.
