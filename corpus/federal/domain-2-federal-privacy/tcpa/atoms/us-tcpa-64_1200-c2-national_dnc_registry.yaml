summary: >-
  No person or entity may initiate a telephone solicitation to a residential subscriber registered
  on the national do-not-call registry; registrations are honoured indefinitely until cancelled or
  removed, subject to the safe harbour and the permission and personal relationship exceptions in
  (c)(2)(i)–(iii).
requirement_detail: >-
  THIS IS THE ENFORCEABLE HALF OF THE NATIONAL REGISTRY — 47 U.S.C. § 227(c)(3)(F) only tells the
  Commission to write it — and its structure is a strict prohibition with a compliance-based escape
  rather than a reasonableness standard. Paragraph (c)(2)(i) is a genuine safe harbour: the caller
  must show the violation was the result of error AND that its routine business practice meets all
  five enumerated standards, which include written procedures, trained personnel, a maintained
  internal list, and a registry-scrubbing process. The 2003 sunset of the
  established-business-relationship exception for registry calls is the most consequential change
  practitioners forget: an EBR no longer excuses a call to a registered residential number, and only
  prior express invitation or permission evidenced by a signed writing under (c)(2)(ii), or a
  personal relationship under (c)(2)(iii), does. Note the reach is RESIDENTIAL subscribers; wireless
  numbers are treated as presumptively residential by FCC policy rather than by the text of this
  paragraph, which is why the wireless question is litigated rather than looked up. Compliance here
  does not dispose of the FTC's parallel registry rule at 16 C.F.R. § 310.4(b)(1)(iii), whose
  exemptions differ.
deadline: null
exemptions:
  - id: us.tcpa.64_1200.c2ii.prior_express_invitation
    type: activity_level
    scope: >-
      Calls to a registered residential subscriber who has given prior express invitation or
      permission evidenced by a signed, written agreement naming the seller and the number.
    source_citation: 47 C.F.R. § 64.1200(c)(2)(ii)
    verbatim_span: >-
      It has obtained the subscriber's prior express invitation or permission. Such permission must
      be evidenced by a signed, written agreement between the consumer and seller which states that
      the consumer agrees to be contacted by this seller and includes the telephone number to which
      the calls may be placed; or
    burden_of_proof: >-
      On the caller: the paragraph requires the permission to be evidenced by a signed, written
      agreement, so the writing is the proof.
    applies_if:
      all:
        - practice.has_signed_written_solicitation_permission == true
