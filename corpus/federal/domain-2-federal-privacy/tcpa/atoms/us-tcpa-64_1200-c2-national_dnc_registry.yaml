interpreted_by: []
common_errors:
  - >-
    Relying on an established business relationship to call a registered residential number. The EBR
    exception to the registry prohibition was withdrawn; (c)(2)(ii) requires a signed writing.
  - >-
    Treating (c)(2)(i) as a reasonableness defence. It is a five-part safe harbour and the caller
    must satisfy every element, including registry scrubbing and written procedures.
  - >-
    Assuming registry compliance answers the whole call. The internal company-specific list under §
    64.1200(d) and the FTC Telemarketing Sales Rule apply independently.
open_questions: []
confidence: high
preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    § 227(f)(1)(D) preserves more restrictive intrastate State law on the making of telephone
    solicitations, so State do-not-call statutes survive. § 227(f)(2) is the exception: once the
    Commission requires a national database, a State may not require its own separate one for
    intrastate solicitations.
enforcement:
  enforcers:
    - fcc
    - state_ag
  private_right_of_action: true
  penalty:
    structure: >-
      Private action under 47 U.S.C. § 227(c)(5) for violation of the subsection (c) regulations;
      FCC forfeiture under § 503(b); State AG action under § 227(g).
    range: >-
      Actual monetary loss or up to $500 per violation, whichever is greater, trebled for a wilful
      or knowing violation.
    note: >-
      The § 227(c)(5) action requires more than one call within a 12-month period and is subject to
      the statutory due-care affirmative defence.
  statute_of_limitations: null
