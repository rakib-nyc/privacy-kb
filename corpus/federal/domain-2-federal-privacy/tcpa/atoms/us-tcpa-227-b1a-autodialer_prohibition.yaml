common_errors:
- Reading "prior express consent" as one standard. Marketing calls require prior express WRITTEN consent
  under the FCC rules.
- Assuming Facebook v. Duguid ended TCPA exposure. It narrowed the autodialer prong; the prerecorded-voice
  prong and the Do Not Call rules are untouched.
- Treating $500 as the ceiling. It is per call, trebled for wilfulness, and uncapped.
