summary: It is unlawful to make any call using an automatic telephone dialing system or an artificial
  or prerecorded voice, other than for emergency purposes or with the prior express consent of the called
  party, to the numbers listed in § 227(b)(1)(A).
requirement_detail: 'THE MOST LITIGATED PRIVACY STATUTE IN THE UNITED STATES, and the reason is in the
  remedy rather than the prohibition: § 227(b)(3) gives a private action for $500 per call, trebled for
  wilful violation, with no cap — so an ordinary marketing campaign produces class exposure measured in
  call counts. Consent is the whole battleground, and it is not one standard: the FCC requires prior express
  WRITTEN consent for marketing calls while § 227(b)(1)(A) itself says only prior express consent. Facebook
  v. Duguid (2021) narrowed "automatic telephone dialing system" to equipment using a random or sequential
  number generator, which moved much litigation to the artificial-or-prerecorded-voice prong.'
