verbatim_span: >-
  The State shall serve prior written notice of any such civil action upon the Commission and
  provide the Commission with a copy of its complaint, except in any case where such prior notice is
  not feasible, in which case the State shall serve such notice immediately upon instituting such
  action. The Commission shall have the right (A) to intervene in the action, (B) upon so
  intervening, to be heard on all matters arising therein, and (C) to file petitions for appeal.
