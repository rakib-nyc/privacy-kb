verbatim_span: >-
  Any person who willfully and knowingly violates this subsection shall upon conviction thereof be
  fined not more than $10,000 for each violation, or 3 times that amount for each day of a
  continuing violation, in lieu of the fine provided by section 501 of this title for such a
  violation. This subparagraph does not supersede the provisions of section 501 of this title
  relating to imprisonment or the imposition of a penalty of both fine and imprisonment.
