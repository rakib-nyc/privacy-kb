common_errors:
  - >-
    Citing § 227(c)(3)(F) as the provision a telemarketer violated. It directs the Commission; the
    enforceable prohibition is 47 C.F.R. § 64.1200(c)(2).
  - >-
    Applying the registry to non-solicitation calls. Subsection (c) reaches telephone solicitations
    only, unlike subsection (b), which turns on dialing technology regardless of call content.
  - >-
    Assuming FCC registry compliance disposes of the matter. The FTC's Telemarketing Sales Rule
    imposes a parallel registry duty with its own exemptions and its own enforcer.
