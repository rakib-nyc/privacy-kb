preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    § 227(f)(1) preserves more restrictive intrastate State law on telephone solicitations and on
    the technologies listed in (f)(1)(A)–(C). It is a floor with two carve-outs: the technical
    standards prescribed under subsection (d), and § 227(f)(2), which bars a State from requiring
    its own separate database once the Commission requires a national one.
enforcement:
  enforcers:
    - fcc
    - state_ag
  private_right_of_action: true
  penalty:
    structure: >-
      FCC forfeiture under 47 U.S.C. § 503(b); State AG parens patriae action under § 227(g);
      private action under § 227(c)(5).
    range: >-
      Up to $500 per violation in a private action under § 227(c)(5)(B), trebled under the §
      227(c)(5) continuation for a wilful or knowing violation.
    note: >-
      The § 227(c)(5) continuation also supplies an affirmative defence for a defendant with
      due-care compliance practices — a defence that has no counterpart in the § 227(b) private
      action.
  statute_of_limitations: null
