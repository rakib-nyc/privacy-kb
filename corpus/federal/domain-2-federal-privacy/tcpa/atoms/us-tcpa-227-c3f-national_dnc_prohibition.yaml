summary: >-
  Where the Commission requires a national do-not-call database, its regulations must prohibit any
  person from making or transmitting a telephone solicitation to the number of any subscriber
  included in that database.
requirement_detail: >-
  THIS IS THE STATUTORY AUTHORITY FOR THE NATIONAL DO NOT CALL REGISTRY, AND IT IS WRITTEN AS A
  DIRECTION TO THE COMMISSION RATHER THAN AS A DUTY ON A CALLER — which is why practitioners
  searching § 227 for the registry prohibition often conclude it is not there. The operative
  prohibition a defendant actually violates lives in 47 C.F.R. § 64.1200(c)(2), and the liability
  theory runs § 227(c)(5) → "the regulations prescribed under this subsection" → § 64.1200(c)(2).
  Two consequences follow that generic tools miss. First, subsection (c) reaches "telephone
  solicitations" as defined in § 227(a)(4) — calls encouraging the purchase of goods or services —
  so it does NOT reach informational, debt-collection or transactional calls, which is the opposite
  of subsection (b), where content is irrelevant and the dialing technology is everything. Second,
  because (c) liability is a regulatory violation rather than a statutory one, the FCC's safe
  harbour and its exemptions are part of the cause of action rather than affirmative defences bolted
  on afterwards. Note also that the registry is jointly administered with the FTC's parallel
  Telemarketing Sales Rule regime at 16 C.F.R. § 310.4(b)(1)(iii), so the same call routinely
  presents two federal claims with different enforcers and different exemptions.
