summary: >-
  Sending an unsolicited advertisement to a telephone facsimile machine is unlawful unless the
  advertisement is from a sender with an established business relationship with the recipient, and
  the number was obtained and the opt-out notice given as (ii) and (iii) require.
requirement_detail: >-
  THE ESTABLISHED BUSINESS RELATIONSHIP IS A THREE-PART CONDITION, NOT A STANDALONE EXCUSE, and
  reading clause (i) alone is how junk-fax defendants lose. The Junk Fax Prevention Act of 2005
  wrote the EBR into the statute, but it made the exception conjunctive: the sender needs the
  relationship under (i), a permitted route to the number under (ii), AND a conforming opt-out
  notice under (iii). The second continuation to subparagraph (C) then removes the exception
  entirely once the recipient has made a compliant opt-out request under paragraph (2)(E), so an EBR
  does not survive an opt-out. Note what subparagraph (C) does NOT depend on: unlike subparagraphs
  (A) and (B), it says nothing about dialling technology, so Facebook v. Duguid left it untouched —
  a manually transmitted fax advertisement is squarely within it. The operative meaning also sits
  partly in the definition of "unsolicited advertisement" in § 227(a)(5), which is why a fax
  containing no commercial content is generally outside the prohibition regardless of any
  relationship. The parallel FCC rule is 47 C.F.R. § 64.1200(a)(4), which carries the detailed
  notice mechanics and a separate EBR definition at § 64.1200(f)(6) that differs from the
  solicitation EBR at § 64.1200(f)(5).
