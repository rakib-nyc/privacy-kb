preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    § 227(f)(1)(A) expressly preserves more restrictive intrastate State law on the use of telephone
    facsimile machines to send unsolicited advertisements. State junk-fax statutes therefore coexist
    with, rather than yield to, § 227(b)(1)(C).
enforcement:
  enforcers:
    - fcc
    - state_ag
  private_right_of_action: true
  penalty:
    structure: >-
      Private action under § 227(b)(3); FCC forfeiture under 47 U.S.C. § 503(b); State AG action
      under § 227(g).
    range: >-
      $500 per fax under § 227(b)(3), trebled for a wilful or knowing violation, with no statutory
      cap.
    note: >-
      The § 227(b)(3) action has no due-care affirmative defence, unlike the do-not-call action
      under § 227(c)(5).
  statute_of_limitations: null
