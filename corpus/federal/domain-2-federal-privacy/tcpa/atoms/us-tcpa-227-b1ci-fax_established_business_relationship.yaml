common_errors:
  - >-
    Treating the established business relationship as sufficient on its own. Clauses (i), (ii) and
    (iii) are conjunctive, and a missing or non-conforming opt-out notice defeats the exception.
  - >-
    Assuming an EBR survives an opt-out request. The continuation to subparagraph (C) withdraws the
    clause (i) and (ii) exception once a compliant paragraph (2)(E) request has been made.
  - >-
    Reading Facebook v. Duguid onto the fax prong. Subparagraph (C) has no autodialer element; the
    decision construed the definition of automatic telephone dialing system, which (C) never uses.
