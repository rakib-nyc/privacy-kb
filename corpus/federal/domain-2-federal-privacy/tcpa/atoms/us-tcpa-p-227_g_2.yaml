verbatim_span: >-
  The district courts of the United States, the United States courts of any territory, and the
  District Court of the United States for the District of Columbia shall have exclusive jurisdiction
  over all civil actions brought under this subsection. Upon proper application, such courts shall
  also have jurisdiction to issue writs of mandamus, or orders affording like relief, commanding the
  defendant to comply with the provisions of this section or regulations prescribed under this
  section, including the requirement that the defendant take such action as is necessary to remove
  the danger of such violation. Upon a proper showing, a permanent or temporary injunction or
  restraining order shall be granted without bond.
