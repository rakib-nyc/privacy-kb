verbatim_span: >-
  If a person or entity making an artificial or prerecorded-voice telephone call pursuant to an
  exemption under paragraphs (a)(3)(ii) through (v) of this section or any call for telemarketing
  purposes (or on whose behalf such a call is made) receives a request from a residential telephone
  subscriber not to receive calls from that person or entity, the person or entity must record the
  request and place the subscriber's name, if provided, and telephone number on the do-not-call list
  at the time the request is made. Persons or entities making such calls (or on whose behalf such
  calls are made) must honor a residential subscriber's do-not-call request within a reasonable time
  from the date such request is made. This period may not exceed 30 days from the date of such
  request. If such requests are recorded or maintained by a party other than the person or entity on
  whose behalf the call is made, the person or entity on whose behalf the call is made will be
  liable for any failures to honor the do-not-call request. A person or entity making an artificial
  or prerecorded-voice telephone call pursuant to an exemption under paragraphs (a)(3)(ii) through
  (v) of this section or any call for telemarketing purposes must obtain a consumer's prior express
  permission to share or forward the consumer's request not to be called to a party other than the
  person or entity on whose behalf a call is made or an affiliated entity.
