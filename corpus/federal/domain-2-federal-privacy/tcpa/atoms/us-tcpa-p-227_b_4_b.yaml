verbatim_span: >-
  Any person that is determined by the Commission, in accordance with paragraph (3) or (4) of
  section 503(b) of this title , to have violated this subsection with the intent to cause such
  violation shall be liable to the United States for a forfeiture penalty pursuant to section
  503(b)(1) of this title . Paragraph (5) of section 503(b) of this title shall not apply in the
  case of a violation of this subsection. A forfeiture penalty under this subparagraph shall be in
  addition to any other penalty provided for by this chapter. The amount of the forfeiture penalty
  determined under this subparagraph shall be equal to an amount determined in accordance with
  subparagraphs (A) through (F) of section 503(b)(2) of this title plus an additional penalty not to
  exceed $10,000.
