preemption:
  posture: floor
  authority: 47 U.S.C. § 227(f)(1)
  note: >-
    The private action itself is not a preemption provision. § 227(f)(1) preserves more restrictive
    intrastate State law, so State mini-TCPA claims routinely accompany a § 227(c)(5) claim; §
    227(f)(2) is the one carve-out, barring a separate State database.
enforcement:
  enforcers:
    - fcc
  private_right_of_action: true
  penalty:
    structure: >-
      Private action in State court where permitted by that State's laws or rules of court:
      injunction, actual monetary loss or statutory damages, or both.
    range: >-
      Actual monetary loss or up to $500 per violation, whichever is greater; trebled for a wilful
      or knowing violation.
    note: >-
      Unlike § 227(b)(3), this action carries a statutory due-care affirmative defence and requires
      more than one call in a 12-month period.
  statute_of_limitations: null
