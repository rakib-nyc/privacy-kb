summary: >-
  A person who received more than one call within a 12-month period from or on behalf of the same
  entity in violation of the subsection (c) regulations may sue to recover actual monetary loss or
  up to $500 per violation, whichever is greater.
requirement_detail: >-
  THE TWO TCPA PRIVATE ACTIONS ARE NOT THE SAME ACTION, AND CONFLATING THEM IS THE MOST COMMON
  DEFENCE-SIDE ERROR IN A DO-NOT-CALL CASE. The § 227(b)(3) action lies for a single violating call
  and has no compliance defence. This one, § 227(c)(5), requires MORE THAN ONE call within any
  12-month period by or on behalf of the same entity, and the continuation to paragraph (5) gives
  the defendant an affirmative defence where it has established and implemented, with due care,
  reasonable practices and procedures to prevent violating solicitations. That defence is why the
  written procedures, personnel training and registry-scrubbing process in 47 C.F.R. §
  64.1200(c)(2)(i) are worth real money rather than being paperwork. Note the predicate is a
  violation "of the regulations prescribed under this subsection" — the claim is regulatory, so an
  FCC exemption is an element rather than a defence. Plaintiffs routinely plead both § 227(b) and §
  227(c) over the same call series precisely because the elements, the defences and the trebling
  triggers differ.
