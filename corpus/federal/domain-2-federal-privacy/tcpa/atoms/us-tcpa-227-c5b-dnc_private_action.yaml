common_errors:
  - >-
    Pleading a single do-not-call call under § 227(c)(5). The subsection requires more than one call
    within a 12-month period from or on behalf of the same entity.
  - >-
    Overlooking the due-care affirmative defence. It exists for § 227(c)(5) and has no counterpart
    in the § 227(b)(3) action.
  - >-
    Reading $500 as a cap. It is a floor set against actual monetary loss — "whichever is greater" —
    and the paragraph (5) continuation permits trebling for a wilful or knowing violation.
