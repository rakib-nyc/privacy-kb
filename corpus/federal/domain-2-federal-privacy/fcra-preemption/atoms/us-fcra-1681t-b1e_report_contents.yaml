obligation_type: prohibit
summary: >-
  State law relating to information contained in consumer reports is expressly preempted, subject to
  a carve-back for state laws in effect on 30 September 1996.
requirement_detail: >-
  The reference implementation for invariant I5. Preemption here is EXPRESS and SUBJECT-SPECIFIC: it
  reaches state law on the contents of consumer reports (the § 1681c subject matter) and nothing
  else, and it grandfathers state law in effect on a fixed date. A preemption engine that models
  FCRA as a single posture cannot express this — the carve-out map has to be per-subject, with
  dates.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t(b)(1)(E)
  note: >-
    Express, subject-specific, and date-limited. The grandfather clause means the SAME state
    provision can be preempted or preserved depending on when it was in effect — which is why every
    preemption resolution must be time-indexed (invariant I2), not just subject-indexed.
