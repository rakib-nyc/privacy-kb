verbatim_span: >-
  Except as provided in subsections (b) and (c), this subchapter does not annul, alter, affect, or
  exempt any person subject to the provisions of this subchapter from complying with the laws of any
  State with respect to the collection, distribution, or use of any information on consumers, or for
  the prevention or mitigation of identity theft, except to the extent that those laws are
  inconsistent with any provision of this subchapter, and then only to the extent of the
  inconsistency.
