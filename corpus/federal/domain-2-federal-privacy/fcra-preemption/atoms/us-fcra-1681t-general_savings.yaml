summary: >-
  FCRA does not annul or affect state law except to the extent of inconsistency, and then only to
  the extent of the inconsistency — the general savings clause that makes FCRA a floor before the §
  1681t(b) carve-outs are applied.
requirement_detail: >-
  This is the DEFAULT rule and it is a floor: state law survives unless inconsistent, and survives
  even then to the extent it is not inconsistent. Everything preemptive in FCRA is an EXCEPTION to
  this subsection, enumerated in (b) and (c). Reading § 1681t as broadly preemptive inverts its
  structure.
preemption:
  posture: floor
  authority: 15 U.S.C. § 1681t(a)
  note: >-
    The general rule. Subsections (b) and (c) carve specific subject areas OUT of it into express
    preemption.
