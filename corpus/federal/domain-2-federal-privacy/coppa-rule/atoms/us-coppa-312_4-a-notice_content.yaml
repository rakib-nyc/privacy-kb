summary: >-
  An operator must provide notice and obtain verifiable parental consent before collecting, using or
  disclosing personal information from children, and the notice must be clearly and understandably
  written.
requirement_detail: >-
  THE NOTICE AND THE CONSENT ARE ONE SEQUENCE, not two independent duties: § 312.4(a) states them
  together and puts both BEFORE collection. An operator that collects first and notifies after has
  violated the section even if consent eventually arrives. The clarity requirement is substantive —
  a notice that is accurate but not understandable to a parent does not satisfy it.
common_errors:
  - >-
    Treating notice and consent as separable. § 312.4(a) requires both, in that order, before
    collection.
  - Reading the clarity requirement as cosmetic. It is a condition of the notice being adequate.
