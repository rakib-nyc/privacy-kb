verbatim_span: >-
  It shall be the obligation of the operator to provide notice and obtain verifiable parental
  consent prior to collecting, using, or disclosing personal information from children. Such notice
  must be clearly and understandably written, complete, and must contain no unrelated, confusing, or
  contradictory materials.
