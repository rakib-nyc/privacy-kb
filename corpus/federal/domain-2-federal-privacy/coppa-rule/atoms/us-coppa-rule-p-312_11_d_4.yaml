verbatim_span: >-
  No later than July 21, 2025, publicly post on each of the approved safe harbor program's websites
  and online services a list of all current subject operators and, for each such operator, list each
  certified website or online service. Approved safe harbor programs shall update this list every
  six months thereafter to reflect any changes to the approved safe harbor programs' subject
  operators or their applicable websites and online services.
