verbatim_span: >-
  Before allowing other operators, service providers, or third parties to collect or maintain
  personal information from children on the operator's behalf, or before releasing children's
  personal information to such entities, the operator must take reasonable steps to determine that
  such entities are capable of maintaining the confidentiality, security, and integrity of the
  information and must obtain written assurances that such entities will employ reasonable measures
  to maintain the confidentiality, security, and integrity of the information.
