verbatim_span: >-
  Design, implement, and maintain safeguards to control risks identified through the risk
  assessments required under paragraph (b)(2) of this section. Each safeguard must be based on the
  volume and sensitivity of the children's personal information that is at risk, and the likelihood
  that the risk could result in the unauthorized disclosure, misuse, alteration, destruction or
  other compromise of such information;
