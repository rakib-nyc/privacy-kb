verbatim_span: >-
  Where an operator collects an audio file containing a child's voice, and no other personal
  information, for use in responding to a child's specific request and where the operator does not
  use such information for any other purpose, does not disclose it, and deletes it immediately after
  responding to the child's request. In such case, there also shall be no obligation to provide a
  direct notice, but notice shall be required under § 312.4(d).
