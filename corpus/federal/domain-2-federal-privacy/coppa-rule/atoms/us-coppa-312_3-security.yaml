summary: >-
  An operator must establish and maintain reasonable procedures to protect the confidentiality,
  security and integrity of personal information collected from children.
requirement_detail: >-
  A standard, not a specification. It sits alongside the § 312.8 retention and deletion
  requirements; the two are frequently cited together but are distinct obligations.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 6502(d)
  note: >-
    COPPA expressly preempts inconsistent state law on its subject matter. State law on children's
    data that is not inconsistent survives — NY's Child Data Protection Act is the live test and is
    a Priority 3 atom.
enforcement:
  enforcers:
    - ftc
    - state_ag
  private_right_of_action: false
  penalty:
    structure: FTC Act § 5(m) civil penalties for rule violations
    range: null
    note: >-
      Per-violation penalties, inflation-adjusted. COPPA is enforced as a trade regulation rule,
      which is why § 45(m) applies.
