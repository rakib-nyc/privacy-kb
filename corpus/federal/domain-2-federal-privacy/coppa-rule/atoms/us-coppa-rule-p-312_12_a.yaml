verbatim_span: >-
  An interested party may file a written request for Commission approval of parental consent methods
  not currently enumerated in § 312.5(b). To be considered for approval, a party must provide a
  detailed description of the proposed parental consent methods, together with an analysis of how
  the methods meet § 312.5(b)(1). The request shall be filed with the Commission's Office of the
  Secretary. The Commission will publish in the Federal Register a document seeking public comment
  on the request. The Commission shall issue a written determination within 120 days of the filing
  of the request.
