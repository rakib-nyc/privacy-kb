verbatim_span: >-
  An effective, mandatory mechanism for the independent assessment of subject operators' compliance
  with the self-regulatory program guidelines. At a minimum, this mechanism must include a
  comprehensive review by the safe harbor program, to be conducted not less than annually, of each
  subject operator's information privacy and security policies, practices, and representations. The
  assessment mechanism required under this paragraph can be provided by an independent enforcement
  program, such as a seal program.
