summary: >-
  An operator must obtain verifiable parental consent before any collection, use or disclosure of
  personal information from children, including consent to any material change in practices.
requirement_detail: >-
  THE MATERIAL-CHANGE CLAUSE IS THE TRAP. Consent is not obtained once for the relationship: a
  material change in collection, use or disclosure practices requires NEW verifiable parental
  consent for information already held. An operator that lawfully collected under one policy and
  then repurposes the data has collected without consent for the new purpose.
common_errors:
  - >-
    Treating consent as a one-time gate. A material change requires fresh consent, including for
    data already collected.
  - >-
    Assuming a privacy-policy update discharges it. The rule requires verifiable parental consent,
    not notice.
