verbatim_span: >-
  Where the purpose of collecting a parent's online contact information is to provide voluntary
  notice to, and subsequently update the parent about, the child's participation in a website or
  online service that does not otherwise collect, use, or disclose children's personal information.
  In such cases, the parent's online contact information may not be used or disclosed for any other
  purpose. In such cases, the operator must make reasonable efforts, taking into consideration
  available technology, to ensure that the parent receives notice as described in § 312.4(c)(2);
