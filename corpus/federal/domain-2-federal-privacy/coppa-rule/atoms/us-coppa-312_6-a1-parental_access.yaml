summary: >-
  On request, an operator must give a parent a description of the specific types or categories of
  personal information collected from children.
requirement_detail: >-
  THE PARENTAL ACCESS RIGHT, and it sits alongside a deletion right and a right to refuse further
  collection in the rest of § 312.6. It is the closest thing in US federal privacy law to a general
  subject-access right, and it is exercisable by the parent rather than the data subject.
common_errors:
  - Assuming the child exercises it. The right runs to the parent.
  - >-
    Reading it as access to the records themselves. The paragraph requires a description of types or
    categories.
