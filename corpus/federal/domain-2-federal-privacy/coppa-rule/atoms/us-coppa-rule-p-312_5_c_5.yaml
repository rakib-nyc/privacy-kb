verbatim_span: >-
  Where the purpose of collecting a child's and a parent's name and online contact information, is
  to protect the safety of a child, and where such information is not used or disclosed for any
  purpose unrelated to the child's safety. In such cases, the operator must make reasonable efforts,
  taking into consideration available technology, to provide a parent with notice as described in §
  312.4(c)(4);
