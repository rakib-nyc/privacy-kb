verbatim_span: >-
  Industry groups or other persons may apply to the Commission for approval of self-regulatory
  program guidelines (“safe harbor programs”). The application shall be filed with the Commission's
  Office of the Secretary. The Commission will publish in the Federal Register a document seeking
  public comment on the application. The Commission shall issue a written determination within 180
  days of the filing of the application.
