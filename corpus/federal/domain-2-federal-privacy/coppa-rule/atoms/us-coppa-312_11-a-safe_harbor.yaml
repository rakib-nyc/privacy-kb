summary: >-
  Industry groups or other persons may apply to the Commission for approval of self-regulatory
  program guidelines, known as safe harbor programs.
requirement_detail: >-
  THE ONLY APPROVED SELF-REGULATORY SAFE HARBOUR IN US FEDERAL PRIVACY LAW, and it is genuinely
  protective rather than presentational: § 312.11(c) provides that an operator in full compliance
  with approved guidelines is subject to review and disciplinary procedures IN LIEU OF Commission
  enforcement. That makes it the sharpest contrast in this corpus with the CBPR position, where a
  certification claim creates § 5 EXPOSURE rather than relief. Here the scheme is approved by the
  regulator and substitutes for its enforcement; there the scheme binds nobody and the public claim
  is what binds.
common_errors:
  - >-
    Equating it with voluntary certification generally. This one is FTC-approved and substitutes for
    Commission enforcement; a CBPR claim does the opposite and creates § 5 exposure.
  - >-
    Assuming safe harbour means immunity. It substitutes the programme's disciplinary process, and
    only for an operator in FULL compliance.
