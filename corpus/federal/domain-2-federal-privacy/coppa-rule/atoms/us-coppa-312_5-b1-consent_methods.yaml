summary: >-
  An operator must make reasonable efforts to obtain verifiable parental consent, by a method
  reasonably calculated in light of available technology to ensure the person giving consent is the
  child's parent.
requirement_detail: >-
  THE STANDARD IS OUTCOME-BASED, NOT A CHECKLIST. § 312.5(b)(1) requires a method "reasonably
  calculated ... to ensure that the person providing consent is the child's parent", and the
  enumerated methods that follow are safe harbours rather than the definition. Two consequences a
  compliance programme usually misses: the phrase "in light of available technology" makes the
  standard MOVE — a method reasonable in 2013 may not be now — and the Commission's § 312.12
  approval process exists precisely because new methods are meant to be added.
common_errors:
  - Treating the enumerated methods as exhaustive. They are safe harbours under an outcome standard.
  - Assuming email-plus is generally available. It is limited to internal-use disclosures.
