verbatim_span: >-
  means a website or online service that is directed to children under the criteria set forth in
  paragraph (1) of the definition of website or online service directed to children, but that does
  not target children as its primary audience, and does not collect personal information from any
  visitor, other than for the limited purposes set forth in § 312.5(c), prior to collecting age
  information or using another means that is reasonably calculated, in light of available
  technology, to determine whether the visitor is a child. Any collection of age information, or
  other means of determining whether a visitor is a child, must be done in a neutral manner that
  does not default to a set age or encourage visitors to falsify age information.
