summary: >-
  An operator must establish and maintain reasonable procedures to protect the confidentiality,
  security and integrity of personal information collected from children.
requirement_detail: >-
  COPPA CARRIES ITS OWN SECURITY DUTY, which matters because operators reaching children are
  frequently outside every other federal security regime — not financial institutions under GLBA,
  not covered entities under HIPAA. For those operators this section and FTC Act § 5 are the whole
  of federal data-security law, and § 312.8(b) extends the duty to releasing information to third
  parties only where the operator has taken reasonable steps to ensure they can protect it.
common_errors:
  - >-
    Assuming a child-directed app has no federal security obligation absent GLBA or HIPAA. § 312.8
    is one.
  - Reading it as internal only. § 312.8(b) reaches onward disclosure to service providers.
