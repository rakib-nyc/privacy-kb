    verbatim_span: >-
      In addition to the direct notice to the parent, an operator must post a prominent and clearly
      labeled link to an online notice of its information practices with regard to children on the
      home or landing page or screen of its website or online service, and, at each area of the
      website or online service where personal information is collected from children. The link must
      be in close proximity to the requests for information in each such area. An operator of a
      general audience website or online service that has a separate children's area must post a
      link to a notice of its information practices with regard to children on the home or landing
      page or screen of the children's area. To be complete, the online notice of the website or
      online service's information practices must state the following:
