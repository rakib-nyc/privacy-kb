verbatim_span: >-
  The name, address, telephone number, and email address of all operators collecting or maintaining
  personal information from children through the website or online service. Provided that: The
  operators of a website or online service may list the name, address, phone number, and email
  address of one operator who will respond to all inquiries from parents concerning the operators'
  privacy policies and use of children's information, as long as the names of all the operators
  collecting or maintaining personal information from children through the website or online service
  are also listed in the notice;
