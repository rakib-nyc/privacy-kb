obligation_type: prohibit
summary: >-
  An operator may not condition a child's participation in a game, prize offering or other activity
  on the child disclosing more personal information than is reasonably necessary to participate.
requirement_detail: >-
  A data-minimisation rule expressed as a prohibition on conditioning. It bites independently of
  consent: even WITH verifiable parental consent, conditioning participation on excessive collection
  is prohibited.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 6502(d)
  note: >-
    COPPA expressly preempts inconsistent state law on its subject matter. State law on children's
    data that is not inconsistent survives — NY's Child Data Protection Act is the live test and is
    a Priority 3 atom.
