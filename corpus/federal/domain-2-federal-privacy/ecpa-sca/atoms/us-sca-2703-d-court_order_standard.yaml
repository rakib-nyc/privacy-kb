summary: >-
  A § 2703(d) order issues only if the governmental entity offers specific and articulable facts
  showing reasonable grounds to believe the contents or records sought are relevant and material to
  an ongoing criminal investigation; it may not issue to a state authority where state law prohibits
  it, and the provider may move to quash or modify for undue burden.
requirement_detail: >-
  THE MIDDLE TIER OF PROCESS, above a subpoena and below a warrant, and the only point in § 2703
  where a judge makes a substantive finding before non-content records move. The standard — SPECIFIC
  AND ARTICULABLE FACTS showing reasonable grounds to believe the material is RELEVANT AND MATERIAL
  to an ONGOING CRIMINAL INVESTIGATION — is deliberately below probable cause and is not a warrant
  standard, however often a d-order is loosely described as one. Two features matter operationally.
  The provider has an express right to move promptly to quash or modify where the request is
  unusually voluminous or compliance would otherwise be an undue burden, which is the statutory hook
  for the pushback large providers routinely make. And a state authority's order cannot issue if the
  law of that state prohibits it, so state process rules bite as a stricter overlay rather than
  being displaced. Since Carpenter the d-order is no longer a safe default for location data, and
  the choice between a d-order and a warrant has become a constitutional question rather than a
  purely statutory one.
