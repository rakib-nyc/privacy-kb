verbatim_span: >-
  A court order for disclosure under subsection (b) or (c) may be issued by any court that is a
  court of competent jurisdiction and shall issue only if the governmental entity offers specific
  and articulable facts showing that there are reasonable grounds to believe that the contents of a
  wire or electronic communication, or the records or other information sought, are relevant and
  material to an ongoing criminal investigation. In the case of a State governmental authority, such
  a court order shall not issue if prohibited by the law of such State. A court issuing an order
  pursuant to this section, on a motion made promptly by the service provider, may quash or modify
  such order, if the information or records requested are unusually voluminous in nature or
  compliance with such order otherwise would cause an undue burden on such provider.
