common_errors:
  - >-
    Describing it as a probable-cause or warrant standard. It requires specific and articulable
    facts and relevance and materiality to an ongoing criminal investigation, which is a lower
    threshold.
  - >-
    Treating a d-order as unchallengeable. The subsection gives the provider a motion to quash or
    modify on volume or undue-burden grounds.
  - >-
    Overlooking the state-law limit. An order sought by a state governmental authority shall not
    issue if the law of that state prohibits it, so the federal standard is a floor and not the
    operative test everywhere.
