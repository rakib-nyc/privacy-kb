common_errors:
  - >-
    Reading it as an employer exception. It is a PROVIDER exception, and an employer that has
    outsourced mail or messaging to a third party is not the provider of that service.
  - >-
    Assuming it also authorizes disclosure. § 2701(c) removes the ACCESS offence only; a public
    provider's voluntary disclosure is governed by § 2702 and its own exceptions.
  - >-
    Treating provider authorization as user consent. § 2701(c)(2) is the separate user branch and
    reaches only a communication of or intended for that user.
