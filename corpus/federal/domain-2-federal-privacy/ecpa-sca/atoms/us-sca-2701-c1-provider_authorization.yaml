summary: >-
  Section 2701(a) does not apply to conduct authorized by the person or entity providing the wire or
  electronic communications service.
requirement_detail: >-
  THE EMPLOYER'S DOOR OUT OF § 2701, and the reason internal mail systems generate so little Stored
  Communications Act liability. An employer that operates its own mail or messaging system IS the
  provider of that service, so its access to messages stored on it is conduct authorized by the
  provider and the offence does not apply — this is a scope limit that removes the conduct from §
  2701(a), not a defence to be weighed against the employee's expectation of privacy. The limit is
  that it turns on WHO PROVIDES THE SERVICE, never on who owns the device or pays the bill: an
  employer whose staff use a third-party webmail or messaging account is not that service's
  provider, and reaching into those accounts with credentials taken from an employee is the fact
  pattern that actually produces § 2701 liability. Paragraph (2)'s user branch is correspondingly
  narrow — it reaches communications of or intended for that user, so one employee's authorization
  does not open a colleague's mailbox. Being outside § 2701 also settles nothing else: the Wiretap
  Act, state eavesdropping and monitoring statutes, and the employer's own published notice all
  continue to apply to the same programme.
