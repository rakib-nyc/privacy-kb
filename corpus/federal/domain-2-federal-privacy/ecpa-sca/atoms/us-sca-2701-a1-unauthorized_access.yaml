summary: >-
  Whoever intentionally accesses without authorization a facility through which an electronic
  communication service is provided, and thereby obtains, alters or prevents authorized access to a
  wire or electronic communication while it is in electronic storage in that system, is punished
  under § 2701(b).
requirement_detail: >-
  THE ACCESS OFFENCE, and it is a different wrong from § 2702's disclosure prohibition: § 2701
  punishes GETTING IN, § 2702 restrains GIVING OUT, and an actor can commit either without the
  other. Three elements have to line up and each of them narrows the section. The access must be
  INTENTIONAL; it must be to a FACILITY THROUGH WHICH AN ELECTRONIC COMMUNICATION SERVICE IS
  PROVIDED; and the continuation requires that it thereby obtain, alter or prevent authorized access
  to a communication IN ELECTRONIC STORAGE as § 2510(17) defines that term. The facility element
  carries more weight than its wording suggests — a personal laptop or handset is generally not
  itself a facility through which a service is provided, so snooping on a device is usually a
  Computer Fraud and Abuse Act or state-law matter rather than a § 2701 one. Paragraph (2) supplies
  the parallel exceeds-authorization branch, and the opening words send the reader to subsection
  (c), which removes conduct authorized by the provider, by the user whose communication it is, or
  under §§ 2703, 2704 or 2518 — that is the door most employer access walks through. The offence is
  criminal under § 2701(b); § 2707 supplies the chapter's civil action separately.
