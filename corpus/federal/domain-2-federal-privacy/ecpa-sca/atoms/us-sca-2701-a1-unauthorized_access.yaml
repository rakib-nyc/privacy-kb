common_errors:
  - >-
    Merging it with § 2702. This is the access offence, with different defendants, different
    elements and different exceptions; § 2702 governs a public provider's voluntary disclosure.
  - >-
    Applying it to a laptop, phone or ordinary business server. The element is a facility through
    which an electronic communication SERVICE is provided, and courts have generally declined to
    treat an endpoint device as one.
  - >-
    Reading subsection (a) without subsection (c). Access authorized by the service provider, or by
    the user whose communication it is, falls outside the offence entirely rather than being excused
    within it.
