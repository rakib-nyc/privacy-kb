verbatim_span: >-
  A governmental entity may require the disclosure by a provider of electronic communication service
  of the contents of a wire or electronic communication, that is in electronic storage in an
  electronic communications system for one hundred and eighty days or less, only pursuant to a
  warrant issued using the procedures described in the Federal Rules of Criminal Procedure (or, in
  the case of a State court, issued using State warrant procedures and, in the case of a
  court-martial or other proceeding under chapter 47 of title 10 (the Uniform Code of Military
  Justice), issued under section 846 of that title, in accordance with regulations prescribed by the
  President) by a court of competent jurisdiction. A governmental entity may require the disclosure
  by a provider of electronic communications services of the contents of a wire or electronic
  communication that has been in electronic storage in an electronic communications system for more
  than one hundred and eighty days by the means available under subsection (b) of this section.
