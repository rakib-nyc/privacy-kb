common_errors:
  - >-
    Advising that a subpoena reaches contents older than 180 days because the text permits it.
    Warshak and uniform provider policy have made a warrant the operating rule for contents of any
    age.
  - >-
    Confusing it with § 2702. This section governs COMPELLED disclosure to a governmental entity; §
    2702 governs what a provider may volunteer, and each has exceptions the other does not.
  - >-
    Reading the 180-day tier as a technical or security distinction. It is a 1986 proxy for
    abandonment and tracks nothing in modern storage practice.
