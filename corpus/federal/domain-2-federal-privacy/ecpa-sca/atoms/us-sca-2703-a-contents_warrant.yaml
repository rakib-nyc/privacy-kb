summary: >-
  A governmental entity may compel a provider of electronic communication service to disclose the
  contents of a communication in electronic storage for one hundred and eighty days or less only
  pursuant to a warrant; contents held longer may be obtained by the means available under
  subsection (b).
requirement_detail: >-
  THE TIERING PROVISION, and the part of chapter 121 furthest out of step with practice. As written,
  contents in electronic storage for 180 days or less require a warrant on probable cause, while
  contents held longer fall to the lighter § 2703(b) routes — an administrative or grand jury
  subpoena, or a § 2703(d) order, each with prior notice to the subscriber, or a warrant without
  notice. The 180-day line was drawn in 1986, when leaving mail on a server for six months was read
  as abandonment; it corresponds to nothing about how communications are stored now. Two
  developments have overtaken the text without amending it: Warshak (6th Cir. 2010) held that the
  Fourth Amendment requires a warrant for stored email contents irrespective of age, and the major
  providers now demand a warrant for contents by policy nationwide, so the statutory subpoena route
  for older contents is largely theoretical. Carpenter (2018) then unsettled the
  third-party-doctrine premise on which the section's whole graduated structure rests, and the reach
  of that holding beyond cell-site records is still being litigated. Note the direction of the duty:
  § 2703 authorizes compulsion and § 2703(e) gives the provider a good-faith defence for complying,
  so a complying provider is not the right defendant.
