common_errors:
- Assuming a § 2703(d) order suffices for any non-content record. Carpenter requires a warrant for historical cell-site
  location information, and how far that reasoning travels is unresolved.
- Treating the paragraph as a general subscriber-records subpoena power. The subpoena route is § 2703(c)(2) and
  is confined to the enumerated basic subscriber information — name, address, connection records, length and types
  of service, subscriber number and means of payment.
- Expecting a notice duty to the subscriber. § 2703(c)(3) states that none is required for records obtained under
  this subsection.
