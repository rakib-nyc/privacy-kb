summary: A governmental entity may require a provider of electronic communication service or remote computing service
  to disclose a record or other information pertaining to a subscriber or customer, not including the contents of
  communications, only by warrant, by a § 2703(d) order, with the subscriber's consent, by a formal written request
  in a telemarketing-fraud investigation, or under § 2703(c)(2).
requirement_detail: 'THE NON-CONTENT TIER, and the parenthetical is the whole of its scope: this paragraph reaches
  records "not including the contents of communications", which is why its routes are lighter than the warrant §
  2703(a) demands for contents. The list is closed — the chapeau says ONLY WHEN — but it is wide, running from a
  warrant through a § 2703(d) order and subscriber consent down to the basic-subscriber-information subpoena at
  paragraph (2). Paragraph (3) then confirms that no notice to the subscriber or customer is required for any of
  it, which is what makes this the quiet workhorse of digital investigations and what makes the subscriber unlikely
  ever to learn of the request. Carpenter is the crack in the structure: historical cell-site location information
  is non-content and was routinely obtained on a § 2703(d) order until the Court held its acquisition a Fourth Amendment
  search, and the boundaries of that holding for other categories of non-content records remain unsettled. The safe
  statement is that satisfying this paragraph is necessary and is no longer always sufficient.'
