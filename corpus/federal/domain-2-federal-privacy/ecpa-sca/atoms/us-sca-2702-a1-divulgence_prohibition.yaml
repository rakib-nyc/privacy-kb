summary: >-
  A provider of electronic communication service to the public shall not knowingly divulge the
  contents of a communication while in electronic storage by that service.
requirement_detail: >-
  THE PROVIDER-SIDE HALF OF ECPA, and the words doing the work are TO THE PUBLIC. A service that is
  not offered to the public — an employer's internal mail system is the standard example — is
  outside § 2702 entirely, which is why workplace-monitoring analysis cannot start here. Note also
  that § 2702 restrains the PROVIDER while § 2703 governs what the government may compel; a
  disclosure lawful under § 2703 is not a § 2702 violation.
