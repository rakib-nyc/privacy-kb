verbatim_span: >-
  The annual fee, which must be paid by any person prior to obtaining access to the National Do Not
  Call Registry, is $82 for each area code of data accessed, up to a maximum of $22,626; provided,
  however, that there shall be no charge to any person for accessing the first five area codes of
  data, and provided further, that there shall be no charge to any person engaging in or causing
  others to engage in outbound telephone calls to consumers and who is accessing area codes of data
  in the National Do Not Call Registry if the person is permitted to access, but is not required to
  access, the National Do Not Call Registry under 47 CFR 64.1200, or any other Federal regulation or
  law. No person may participate in any arrangement to share the cost of accessing the National Do
  Not Call Registry, including any arrangement with any telemarketer or service provider to divide
  the costs to access the registry among various clients of that telemarketer or service provider.
