verbatim_span: >-
  Written confirmation of the transaction, identified in a clear and conspicuous manner as such on
  the outside of the envelope, sent to the customer or donor via first class mail prior to the
  submission for payment of the customer's or donor's billing information, and that includes all of
  the information contained in §§ 310.3(a)(3)(ii)(A)-(G) and a clear and conspicuous statement of
  the procedures by which the customer or donor can obtain a refund from the seller or telemarketer
  or charitable organization in the event the confirmation is inaccurate; provided, however, that
  this means of authorization shall not be deemed verifiable in instances in which goods or services
  are offered in a transaction involving a free-to-pay conversion and preacquired account
  information.
