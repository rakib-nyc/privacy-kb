verbatim_span: >-
  Access to the National Do Not Call Registry is limited to telemarketers, sellers, others engaged
  in or causing others to engage in telephone calls to consumers, service providers acting on behalf
  of such persons, and any government agency that has law enforcement authority. Prior to accessing
  the National Do Not Call Registry, a person must provide the identifying information required by
  the operator of the registry to collect the fee, and must certify, under penalty of law, that the
  person is accessing the registry solely to comply with the provisions of this part or to otherwise
  prevent telephone calls to telephone numbers on the registry. If the person is accessing the
  registry on behalf of sellers, that person also must identify each of the sellers on whose behalf
  it is accessing the registry, must provide each seller's unique account number for access to the
  national registry, and must certify, under penalty of law, that the sellers will be using the
  information gathered from the registry solely to comply with the provisions of this part or
  otherwise to prevent telephone calls to telephone numbers on the registry.
