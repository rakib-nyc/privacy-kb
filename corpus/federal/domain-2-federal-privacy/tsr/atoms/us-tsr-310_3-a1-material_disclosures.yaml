common_errors:
  - >-
    Collapsing this into the § 310.4(d) call-opening disclosures. § 310.4(d) is about identifying
    the seller and the purpose promptly on an outbound call; § 310.3(a)(1) is about the price and
    terms before consent to pay, and both can be owed on one call.
  - >-
    Disclosing the material terms in a written confirmation. The text fixes the moment as before the
    customer consents to pay, so a post-sale document is late by construction.
  - >-
    Assuming a business-to-business call carries no disclosure duty at all. § 310.6(b)(7) exempts
    such calls from this paragraph but expressly preserves § 310.3(a)(2) and (4), so
    misrepresentation liability survives.
open_questions:
  - >-
    effective_from is the publication date in the part-level source note the eCFR carries for 16
    C.F.R. part 310 ("75 FR 48516, Aug. 10, 2010, unless otherwise noted"), which is also the first
    date in this section's own source note. That is a Federal Register PUBLICATION date, not
    necessarily an effective date, and the do-not-call provisions are older than this codification —
    the source does not state when they first took effect. A query as of a date before 2010-08-10
    will not reach this atom even though the rule existed.
