summary: >-
  Before a customer consents to pay for goods or services offered in a telemarketing transaction,
  the seller or telemarketer must truthfully disclose, clearly and conspicuously, the material
  information listed in § 310.3(a)(1)(i) through (viii).
requirement_detail: >-
  THE TIMING IS THE OBLIGATION. The disclosures must land BEFORE the customer consents to pay, which
  puts them ahead of the point of sale rather than in a confirmation sent afterwards, and the
  failure to make them is itself defined as a deceptive practice by the chapeau — no proof of
  intent, reliance or injury is required. The enumerated items are total cost and quantity, material
  restrictions, any no-refund policy, prize-promotion odds and conditions, the material terms of any
  negative option feature, and specified debt-relief disclosures. Two neighbouring provisions are
  routinely confused with this one: § 310.4(d) requires a PROMPT identification disclosure at the
  top of an outbound call (seller identity, sales purpose, nature of the goods, prize-promotion
  no-purchase statement), which is a different duty with a different trigger; and § 310.3(a)(2)
  prohibits misrepresenting the same subject matter, so silence is caught here and a false statement
  is caught there. The FTC Act § 5 deception standard sits underneath all of it and does not switch
  off.
preemption:
  posture: floor
  authority: 16 C.F.R. § 310.7(b)
  note: >-
    § 310.7(b) states that nothing in that section prohibits a state official from proceeding in
    state court on an alleged violation of any civil or criminal statute of that state, and the part
    contains no express preemption clause. Recorded as floor on that basis. The enabling Act (15
    U.S.C. 6101–6108) is not in this corpus, so any preemptive effect it carries is unresolved here.
    The TCPA and its FCC rules run in parallel and are a separate instrument.
enforcement:
  enforcers:
    - ftc
    - state_ag
    - private_person
  private_right_of_action: true
  penalty:
    structure: >-
      FTC Act civil penalties for rule violations; state and private actions under the Telemarketing
      and Consumer Fraud and Abuse Prevention Act
    range: null
    note: >-
      The part states no penalty figure. § 310.7(a) requires a State or private plaintiff suing
      under the Act to serve written notice on the Commission before filing, which is where the
      private route is visible in the rule text itself; the Act (15 U.S.C. 6101–6108) is not in this
      corpus, so the damages threshold is not recorded here.
