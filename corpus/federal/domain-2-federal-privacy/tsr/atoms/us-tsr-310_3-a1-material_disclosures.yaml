exemptions:
  - id: cfr.16.310.6.b7.business_to_business
    type: activity_level
    scope: >-
      A call between a telemarketer and a BUSINESS to induce that business to buy goods or services,
      or to give a charitable contribution, is exempt from the part — with two carve-backs stated in
      the same paragraph: the misrepresentation prohibitions of § 310.3(a)(2) and (4) still apply,
      and calls inducing the retail sale of nondurable office or cleaning supplies are not exempt
      (for those, § 310.6(b)(7) instead disapplies § 310.4(b)(1)(iii)(B) and § 310.5). The exemption
      turns on WHO IS CALLED and for what, not on the caller's own status, which is why it is
      activity-level and not entity-level.
    source_citation: 16 C.F.R. § 310.6(b)(7)
    verbatim_span: >-
      Telephone calls between a telemarketer and any business to induce the purchase of goods or
      services or a charitable contribution by the business, provided, however that this exemption
      does not apply to:
    burden_of_proof: entity
    applies_if:
      all:
        - entity.call_recipient_is_business == true
        - purpose.induce_business_purchase == true
