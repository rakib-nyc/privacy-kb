verbatim_span: >-
  The disposition of the call, including but not limited to, whether the call was answered,
  connected, dropped, or transferred. If the call was transferred, the record must also include the
  telephone number or IP address that the call was transferred to as well as the company name, if
  the call was transferred to a company different from the seller or telemarketer that placed the
  call; provided, however, that for calls that an individual telemarketer makes by manually entering
  a single telephone number to initiate the call to that number, a seller or telemarketer need not
  retain the records specified in paragraphs (a)(2)(vii) and (a)(2)(x) of this section.
