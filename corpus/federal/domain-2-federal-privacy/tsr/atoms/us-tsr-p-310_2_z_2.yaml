    verbatim_span: >-
      means any information that enables a seller or telemarketer to cause a charge to be placed
      against a customer's or donor's account without obtaining the account number directly from the
      customer or donor during the telemarketing transaction pursuant to which the account will be
      charged. (aa) Previous donor means any person who has made a charitable contribution to a
      particular charitable organization within the 2-year period immediately preceding the date of
      the telemarketing call soliciting on behalf of that charitable organization. (bb) Prize means
      anything offered, or purportedly offered, and given, or purportedly given, to a person by
      chance. For purposes of this definition, chance exists if a person is guaranteed to receive an
      item and, at the time of the offer or purported offer, the telemarketer does not identify the
      specific item that the person will receive. (cc) Prize promotion means:
