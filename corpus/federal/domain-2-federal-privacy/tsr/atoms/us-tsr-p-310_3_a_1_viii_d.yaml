verbatim_span: >-
  to the extent that the debt relief service requests or requires the customer to place funds in an
  account at an insured financial institution, that the customer owns the funds held in the account,
  the customer may withdraw from the debt relief service at any time without penalty, and, if the
  customer withdraws, the customer must receive all funds in the account, other than funds earned by
  the debt relief service in compliance with § 310.4(a)(5)(i)(A) through (C).
