obligation_type: prohibit
summary: >-
  Initiating an outbound telephone call to a number on the Commission's National Do Not Call
  Registry, to induce the purchase of goods or services, is an abusive telemarketing practice unless
  the seller can demonstrate an express written agreement or an established business relationship.
requirement_detail: >-
  THE REGISTRY PROHIBITION, and the sentence is conditional on its face: it ends "unless the seller
  or telemarketer:", and the two routes out are (B)(1) an express agreement in writing of the person
  called, and (B)(2) an established business relationship with that person where the person has not
  separately asked not to be called. Both are modelled as exemptions on this atom. The EBR route is
  the one practitioners misstate: it is not a standing permission, the text conditions it on the
  person not having made a request under paragraph (b)(1)(iii)(A), so a single entity-specific
  do-not-call request extinguishes it while the business relationship continues. Read with the
  chapeau, liability runs both ways — it is a violation for a telemarketer to make the call and for
  a SELLER to cause a telemarketer to make it, so outsourcing the campaign does not move the
  exposure. § 310.4(b)(3) supplies a safe harbour for an isolated error made despite written
  procedures, training, registry scrubbing no more than 31 days old and monitoring; it is an
  affirmative demonstration by the seller, not a presumption. This provision is FTC-side only: the
  TCPA and the FCC rules under it impose a parallel registry regime reaching callers this part does
  not, and an entity can be clear of one and exposed under the other.
preemption:
  posture: floor
  authority: 16 C.F.R. § 310.7(b)
  note: >-
    § 310.7(b) states that nothing in that section prohibits a state official from proceeding in
    state court on an alleged violation of any civil or criminal statute of that state, and the part
    contains no express preemption clause. Recorded as floor on that basis. The enabling Act (15
    U.S.C. 6101–6108) is not in this corpus, so any preemptive effect it carries is unresolved here.
    The TCPA and its FCC rules run in parallel and are a separate instrument.
