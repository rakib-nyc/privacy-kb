exemptions:
  - id: cfr.16.310.4.b1iiiB.2.established_business_relationship
    type: activity_level
    scope: >-
      The seller may call a registered number where it can demonstrate an established business
      relationship with the person AND that person has not stated, under § 310.4(b)(1)(iii)(A), that
      he or she does not wish to receive calls. Two consequences follow from the text: the burden of
      demonstrating the relationship is on the seller, and an entity-specific do-not-call request
      defeats the exception even though the relationship itself survives. The relationship is
      defined at § 310.2(q) and is TIME-LIMITED: 540 days from the person's purchase, rental, lease
      or financial transaction, or 90 days from the person's inquiry or application, each measured
      back from the date of the call. § 310.5(a)(5) requires a record of the person, the last known
      number and the basis for each asserted relationship.
    source_citation: 16 C.F.R. § 310.4(b)(1)(iii)(B)(2)
    verbatim_span: >-
      Can demonstrate that the seller has an established business relationship with such person, and
      that person has not stated that he or she does not wish to receive outbound telephone calls
      under paragraph (b)(1)(iii)(A) of this section
    burden_of_proof: entity
    applies_if:
      all:
        - entity.has_established_business_relationship_with_person == true
        - event.person_stated_entity_specific_do_not_call == false
  - id: cfr.16.310.4.b1iiiB.1.express_written_agreement
    type: activity_level
    scope: >-
      The seller may call a registered number where it can demonstrate that the person gave express
      agreement IN WRITING to be called. The following sentence of the source requires that the
      writing evidence authorisation for calls by or on behalf of a specific party and include the
      number to be called and the person's signature, which the part elsewhere allows to be
      electronic. A general terms-of-service acceptance that names no party and no number does not
      meet it.
    source_citation: 16 C.F.R. § 310.4(b)(1)(iii)(B)(1)
    verbatim_span: >-
      Can demonstrate that the seller has obtained the express agreement, in writing, of such person
      to place calls to that person.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.has_express_written_agreement_to_call == true
  - id: cfr.16.310.6.a.charitable_solicitation
    type: activity_level
    scope: >-
      An outbound call soliciting a charitable contribution is not reached by the National Do Not
      Call Registry prohibition at all. The registry provision is written around calls "to induce
      the purchase of goods or services", and § 310.6(a) says so expressly. This is relief from the
      REGISTRY only: the entity-specific do-not-call duty in § 310.4(b)(1)(iii)(A) and the
      charitable-solicitation disclosures in § 310.4(e) still bind, and a for-profit telefunder
      calling on behalf of a charity is still a telemarketer under this part.
    source_citation: 16 C.F.R. § 310.6(a)
    verbatim_span: >-
      Solicitations to induce charitable contributions via outbound telephone calls are not covered
      by § 310.4(b)(1)(iii)(B) of this part.
    burden_of_proof: entity
    applies_if:
      all:
        - purpose.induce_charitable_contribution == true
  - id: cfr.16.310.6.b7.business_to_business
    type: activity_level
    scope: >-
      A call between a telemarketer and a BUSINESS to induce that business to buy goods or services,
      or to give a charitable contribution, is exempt from the part — with two carve-backs stated in
      the same paragraph: the misrepresentation prohibitions of § 310.3(a)(2) and (4) still apply,
      and calls inducing the retail sale of nondurable office or cleaning supplies are not exempt
      (for those, § 310.6(b)(7) instead disapplies § 310.4(b)(1)(iii)(B) and § 310.5). The exemption
      turns on WHO IS CALLED and for what, not on the caller's own status, which is why it is
      activity-level and not entity-level.
    source_citation: 16 C.F.R. § 310.6(b)(7)
    verbatim_span: >-
      Telephone calls between a telemarketer and any business to induce the purchase of goods or
      services or a charitable contribution by the business, provided, however that this exemption
      does not apply to:
    burden_of_proof: entity
    applies_if:
      all:
        - entity.call_recipient_is_business == true
        - purpose.induce_business_purchase == true
