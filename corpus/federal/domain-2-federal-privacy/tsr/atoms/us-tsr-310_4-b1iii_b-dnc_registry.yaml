common_errors:
  - >-
    Treating an established business relationship as a permanent licence to call. It runs on the §
    310.2(q) clock — 540 days from a transaction, 90 days from an inquiry — and the text also
    conditions it on the person NOT having made an entity-specific request under §
    310.4(b)(1)(iii)(A), so one such request ends it while the relationship continues.
  - >-
    Assuming registry compliance is the whole do-not-call duty. § 310.4(b)(1)(iii)(A) is a separate
    prohibition with no EBR exception, and § 310.4(b)(1)(ii) makes obstructing a request its own
    violation.
  - >-
    Reading this as binding the call centre alone. The chapeau makes it a violation for a SELLER to
    cause a telemarketer to place the call, so the seller is liable for its vendor's campaign.
open_questions:
  - >-
    effective_from is the publication date in the part-level source note the eCFR carries for 16
    C.F.R. part 310 ("75 FR 48516, Aug. 10, 2010, unless otherwise noted"), which is also the first
    date in this section's own source note. That is a Federal Register PUBLICATION date, not
    necessarily an effective date, and the do-not-call provisions are older than this codification —
    the source does not state when they first took effect. A query as of a date before 2010-08-10
    will not reach this atom even though the rule existed.
  - >-
    The two items that complete the "unless" clause of § 310.4(b)(1)(iii)(B) — the
    express-written-agreement route at (B)(1) and the established-business-relationship route at
    (B)(2) — are NOT emitted as leaves by the segmentation, because the renderer puts their
    "(1)"/"(2)" designators on their own lines and the extractor does not recover them. No atom can
    anchor a paragraph_path there today. They are carried here as typed exemptions whose
    verbatim_span was copied by exact match out of the rendered text file, so CI still verifies them
    character-for-character against the source.
