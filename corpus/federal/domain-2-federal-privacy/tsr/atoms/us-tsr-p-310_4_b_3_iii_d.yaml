verbatim_span: >-
  This paragraph (v) shall not apply to any outbound telephone call that delivers a prerecorded
  healthcare message made by, or on behalf of, a covered entity or its business associate, as those
  terms are defined in the HIPAA Privacy Rule, 45 CFR 160.103. P>(2) It is an abusive telemarketing
  act or practice and a violation of this part for any person to sell, rent, lease, purchase, or use
  any list established to comply with § 310.4(b)(1)(iii)(A) or § 310.5, or maintained by the
  Commission pursuant to § 310.4(b)(1)(iii)(B), for any purpose except compliance with the
  provisions of this part or otherwise to prevent telephone calls to telephone numbers on such
  lists.
