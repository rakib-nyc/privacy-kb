    - ftc
    - state_ag
    - private_person
  private_right_of_action: true
  penalty:
    structure: >-
      FTC Act civil penalties for rule violations; state and private actions under the Telemarketing
      and Consumer Fraud and Abuse Prevention Act
    range: null
    note: >-
      The part states no penalty figure. § 310.7(a) requires a State or private plaintiff suing
      under the Act to serve written notice on the Commission before filing, which is where the
      private route is visible in the rule text itself; the Act (15 U.S.C. 6101–6108) is not in this
      corpus, so the damages threshold is not recorded here.
