obligation_type: prohibit
summary: >-
  Once a person has said he or she does not wish to receive calls made by or on behalf of a
  particular seller or charitable organization, initiating an outbound call to that person on that
  seller's or organization's behalf is an abusive telemarketing practice.
requirement_detail: >-
  THE ENTITY-SPECIFIC DO-NOT-CALL DUTY, which is where the internal suppression list comes from, and
  it is independent of the National Registry in three ways that matter. First, it has NO
  established-business-relationship exception — the EBR route in (B)(2) is written against the
  registry prong and is itself defeated by a request made under this one. Second, it reaches
  charitable solicitation: (A) speaks of calls made on behalf of the charitable organization for
  which a contribution is solicited, and the § 310.6(a) carve-out disapplies only the registry prong
  at (B). Third, it is triggered by the person's own statement, so it binds from the moment of the
  request rather than from the next registry download. § 310.4(b)(1)(ii) polices the request channel
  itself, making it a violation to hang up on, charge for, condition or otherwise obstruct such a
  request; and the § 310.4(b)(3) safe harbour requires a written procedure and a list maintained
  under (b)(3)(iii) before an isolated error can be excused.
preemption:
  posture: floor
  authority: 16 C.F.R. § 310.7(b)
  note: >-
    § 310.7(b) states that nothing in that section prohibits a state official from proceeding in
    state court on an alleged violation of any civil or criminal statute of that state, and the part
    contains no express preemption clause. Recorded as floor on that basis. The enabling Act (15
    U.S.C. 6101–6108) is not in this corpus, so any preemptive effect it carries is unresolved here.
    The TCPA and its FCC rules run in parallel and are a separate instrument.
