common_errors:
  - >-
    Treating the National Registry scrub as satisfying this provision. The registry does not carry
    entity-specific requests; a number absent from the registry is still off limits once the person
    has asked the seller not to call.
  - >-
    Assuming charities are outside the do-not-call rules. § 310.6(a) exempts charitable solicitation
    from the REGISTRY prong only; the entity-specific request in (A) names charitable organizations
    expressly.
  - >-
    Filing the request against the call centre rather than the seller. The prohibition is framed
    around calls made by or ON BEHALF OF the seller, so the suppression must follow the seller
    across every vendor it uses.
open_questions:
  - >-
    effective_from is the publication date in the part-level source note the eCFR carries for 16
    C.F.R. part 310 ("75 FR 48516, Aug. 10, 2010, unless otherwise noted"), which is also the first
    date in this section's own source note. That is a Federal Register PUBLICATION date, not
    necessarily an effective date, and the do-not-call provisions are older than this codification —
    the source does not state when they first took effect. A query as of a date before 2010-08-10
    will not reach this atom even though the rule existed.
