verbatim_span: In the event of any dissolution or termination of the seller's or telemarketer's business,
  the principal of that seller or telemarketer must maintain all records required under this section.
  In the event of any sale, assignment, or other change in ownership of the seller's or telemarketer's
  business, the successor business must maintain all records required under this section.
