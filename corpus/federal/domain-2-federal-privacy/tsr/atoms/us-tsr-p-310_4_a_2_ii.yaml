verbatim_span: The seller has provided the person with documentation in the form of a consumer report
  from a consumer reporting agency demonstrating that the promised results have been achieved, such
  report having been issued more than six months after the results were achieved. Nothing in this
  part should be construed to affect the requirement in the Fair Credit Reporting Act, 15 U.S.C. 1681,
  that a consumer report may only be obtained for a specified permissible purpose;
