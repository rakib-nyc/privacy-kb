verbatim_span: >-
  If you no longer meet the requirements of paragraph (e)(1) of this section because you change your
  policies or practices in such a way that § 313.8 requires you to provide a revised privacy notice,
  you must provide an annual privacy notice in accordance with the timing requirement in paragraph
  (a) of this section, treating the revised privacy notice as an initial privacy notice.
