verbatim_span: >-
  You change your policies and practices in such a way that you no longer meet the requirements of
  paragraph (e)(1) of this section effective April 1 of year 1. Assuming you define the
  12-consecutive-month period pursuant to paragraph (a) of this section as a calendar year, if you
  were required to provide a revised privacy notice under § 313.8 and you provided that notice on
  March 1 of year 1, you must provide an annual privacy notice by December 31 of year 2. If you were
  not required to provide a revised privacy notice under § 313.8, you must provide an annual privacy
  notice by July 9 of year 1.
