verbatim_span: >-
  Except as provided by paragraph (e) of this section, you must provide a clear and conspicuous
  notice to customers that accurately reflects your privacy policies and practices not less than
  annually during the continuation of the customer relationship. Annually means at least once in any
  period of 12 consecutive months during which that relationship exists. You may define the
  12-consecutive-month period, but you must apply it to the customer on a consistent basis.
