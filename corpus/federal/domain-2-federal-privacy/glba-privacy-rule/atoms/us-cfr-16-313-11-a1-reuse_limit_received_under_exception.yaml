obligation_type: restrict_use
summary: >-
  Nonpublic personal information received from a nonaffiliated financial institution under a §
  313.14 or § 313.15 exception may be disclosed and used only within the narrow channels listed in §
  313.11(a)(1).
requirement_detail: >-
  THE EXCEPTIONS TRAVEL WITH THE DATA. Information handed over under a §§ 313.14/313.15 exception
  arrives pre-restricted: the recipient may use it only to carry out the activity the exception
  covered. This is what stops the transaction-processing exception from becoming a laundering route
  — the servicer that receives a payment history to service a loan cannot then market from it, and
  neither can its affiliates, because § 313.11(a)(1)(ii) caps them at the recipient's own
  permissions.
exemptions:
  - id: cfr.16.313.1.b.retail_credit_dealer
    type: entity_level
    scope: >-
      A motor vehicle dealer described in 12 U.S.C. 5519(b) — one that directly extends retail
      credit or retail leases whose contracts are NOT routinely assigned to an unaffiliated finance
      or leasing source — is outside 16 C.F.R. part 313 entirely. CONSEQUENCE TEST: if the dealer
      routinely assigns even part of that paper to an unaffiliated finance source, it falls back
      INSIDE the Part for its whole consumer book. The hinge word is "routinely", which is a fact
      about the dealer's practice that the engine cannot infer and must be told. THIS IS NOT RELIEF
      FROM GLBA. It is a jurisdictional allocation: 12 U.S.C. 5519 hands these dealers to the CFPB,
      so Regulation P (12 C.F.R. part 1016) reaches them instead. Reading this exemption as "no
      privacy obligation" is the error it most invites.
    source_citation: 16 C.F.R. § 313.1(b)
    verbatim_span: >-
      Excluded from the coverage of this part are motor vehicle dealers described in 12 U.S.C.
      5519(b) that directly extend to consumers retail credit or retail leases involving motor
      vehicles in which the contract governing such extension of retail credit or retail leases is
      not routinely assigned to an unaffiliated third party finance or leasing source.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_motor_vehicle_dealer == true
        - entity.extends_retail_credit_directly == true
        - entity.routinely_assigns_contracts == false
    reach: instrument
  - id: cfr.16.313.1.b.business_purpose
    type: data_level
    scope: >-
      Information about companies, and about individuals who obtain the financial product or service
      for business, commercial or agricultural purposes, is outside the Part. CONSEQUENCE TEST: a
      dealer that finances a landscaping company's fleet truck is out for THAT data and fully in for
      every personal-use customer on the same lot, on the same day, in the same system. This is the
      entity-level/data-level divider in its plainest form: nothing about the dealer changes, only
      which records are reached.
    source_citation: 16 C.F.R. § 313.1(b)
    verbatim_span: >-
      This part does not apply to information about companies or about individuals who obtain
      financial products or services for business, commercial, or agricultural purposes.
    burden_of_proof: entity
    applies_if:
      any:
        - data.subject_is_company == true
        - data.purpose_of_product in ["business","commercial","agricultural"]
  - id: cfr.16.313.3.n2i.publicly_available
    type: data_level
    scope: >-
      Publicly available information is not nonpublic personal information, so the Part's duties do
      not attach to it — EXCEPT where it appears on a list derived using personally identifiable
      financial information that is not itself publicly available. CONSEQUENCE TEST: a name and
      street address taken from a phone book is out; the same name and address on a list of
      customers 90 days delinquent is back in, because the derivation is what makes the list
      revealing. The carve-out is therefore not a property of the datum, and a predicate that tests
      only "is it public?" would apply it in exactly the case the rule exists to catch.
    source_citation: 16 C.F.R. § 313.3(n)(2)(i)
    verbatim_span: >-
      Publicly available information, except as included on a list described in paragraph (n)(1)(ii)
      of this section; or
    burden_of_proof: entity
    applies_if:
      all:
        - data.is_publicly_available == true
        - data.on_derived_list == false
common_errors:
  - >-
    POST-DODD-FRANK, 16 C.F.R. PART 313 REACHES ESSENTIALLY ONLY MOTOR VEHICLE DEALERS. § 313.1(b)
    narrows the FTC privacy rule to persons under 12 U.S.C. 5519 predominantly engaged in the sale
    or leasing and servicing of motor vehicles. Rulemaking for the rest of the financial sector
    moved to the CFPB, and Regulation P at 12 C.F.R. part 1016 is the operative privacy rule for
    banks, credit unions, brokers and insurers. Citing part 313 at a bank is the single most common
    error about this instrument, and the § 313.1(b) dealer exclusion invites its mirror image: it is
    a JURISDICTIONAL ALLOCATION to the CFPB, not relief from GLBA.
  - >-
    Assuming data received under an exception is unrestricted in the recipient's hands. It is more
    restricted than data received outside one — compare § 313.11(b)(1), which lets the recipient
    redisclose anywhere the source institution lawfully could.
