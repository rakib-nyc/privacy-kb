verbatim_span: >-
  Each agency that proposes to establish or make a significant change in a system of records or a
  matching program shall provide adequate advance notice of any such proposal (in duplicate) to the
  Committee on Government Operations of the House of Representatives, the Committee on Governmental
  Affairs of the Senate, and the Office of Management and Budget in order to permit an evaluation of
  the probable or potential effect of such proposal on the privacy or other rights of individuals.
