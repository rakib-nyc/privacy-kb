common_errors:
- Treating the notice as a formality. It is the document that defines the width of the routine-use exception the
  same agency relies on to disclose.
- Assuming publication is periodic. The trigger is establishment or revision of the system, so an unrevised notice
  on a changed system is itself the violation.
- Confusing it with a privacy impact assessment. A PIA is an E-Government Act artefact; this is a Federal Register
  publication with nine statutorily fixed contents.
open_questions:
- legal-domain v2.6.1 has no performance indicator naming the Privacy Act of 1974. subject.domain III.A.1 is the nearest
  fit and matches where this repo already files government-records disclosure statutes (DPPA, RFPA); it is a placement
  decision, not a claim that the taxonomy leaf names this statute.
confidence: high
preemption:
  posture: none
  authority: 5 U.S.C. § 552a
  note: The Act regulates federal agencies, not private entities, so it displaces nothing at state level and the
    section carries no preemption clause. A state privacy statute and this section do not compete for the same
    conduct; where a state actor is involved it is the state's own records law that governs, not this one.
