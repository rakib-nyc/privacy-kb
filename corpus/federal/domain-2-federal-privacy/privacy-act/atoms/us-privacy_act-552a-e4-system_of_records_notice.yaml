summary: An agency that maintains a system of records must publish a notice of its existence and character in
  the Federal Register on establishment or revision, containing the nine items listed in subparagraphs (A) to
  (I).
requirement_detail: 'THE SYSTEM-OF-RECORDS NOTICE IS THE ONLY PUBLIC INVENTORY OF FEDERAL PERSONAL DATA, and it
  is also the instrument through which the disclosure rule in subsection (b) is loosened. The duty is to "publish
  in the Federal Register upon establishment or revision" — the trigger is the agency''s own act of creating or
  changing the system, not a calendar, so an agency that quietly repurposes an existing system without revising
  its notice is in breach of this paragraph before any disclosure has happened. The nine required contents are
  not boilerplate: (D) is where routine uses are declared, and a disclosure under (b)(3) is lawful only so far
  as the published text reaches it. The practical reading order for an assessment therefore runs backwards from
  the way the statute is drafted — read the agency''s notice first, then test the disclosure against it. Note
  the opening qualifier: the duty is subject to paragraph (11), which is the separate Federal Register process
  for new or revised routine uses.'
