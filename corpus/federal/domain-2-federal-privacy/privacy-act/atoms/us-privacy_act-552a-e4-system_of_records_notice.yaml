  private_right_of_action: true
  penalty:
    structure: Civil action in federal district court under 5 U.S.C. § 552a(g)(1). For the intentional-or-wilful
      violations in (g)(1)(C) and (g)(1)(D) the court awards actual damages with a $1,000 statutory floor, plus
      costs and reasonable attorney fees under (g)(4). Access and amendment suits under (g)(1)(A)-(B) are reviewed
      de novo and yield injunctive relief and fees rather than damages. Wilful disclosure by an officer or employee
      is a misdemeanour under (i)(1), fined not more than $5,000.
    range: null
    note: A PRIVATE RIGHT OF ACTION EXISTS, which is unusual for a federal privacy statute and is the reason Privacy
      Act claims are litigated at all. Damages require intentional or wilful conduct, and the Supreme Court in
      FAA v. Cooper (2012) held that actual damages do not cover mental or emotional distress.
  statute_of_limitations: Two years from the date on which the cause of action arises, under 5 U.S.C. § 552a(g)(5).
