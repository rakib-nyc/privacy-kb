federal_relationship: null
interpreted_by: []
common_errors:
  - >-
    Reading the 10 days as calendar days. The text excludes Saturdays, Sundays and legal public
    holidays.
  - >-
    Treating the 10-day clock as the deadline for deciding the amendment. It is only the deadline
    for acknowledging receipt; the decision duty in (d)(2)(B) is stated as promptly, with no fixed
    period.
  - >-
    Citing 30 days for an amendment response. The 30-day period in (d)(3) governs review of a
    refusal by the agency head and can be extended for good cause.
