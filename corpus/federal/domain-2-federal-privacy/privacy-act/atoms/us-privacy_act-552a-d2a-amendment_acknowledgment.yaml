summary: >-
  An agency must acknowledge receipt of a request to amend a record in writing within 10 days,
  excluding weekends and legal public holidays.
requirement_detail: >-
  THE ACKNOWLEDGEMENT CLOCK IS SEPARATE FROM THE DECISION CLOCK, and conflating the two is the
  standard error. This subparagraph fixes only the deadline for saying the request arrived; the duty
  to correct the record or refuse it is in (d)(2)(B) and carries no number of days at all, only the
  word promptly. The 30-day figure practitioners half-remember belongs to (d)(3), the review of a
  refusal by the head of the agency, and that period is extendable for good cause. The exclusion of
  weekends and holidays is on the face of the text, so a calendar-day calculation understates the
  time available and will produce a false late finding in an audit. Note also what the amendment
  right is for: it reaches accuracy, relevance, timeliness and completeness, not disagreement with a
  judgement the agency was entitled to make.
deadline:
  trigger_event: receipt of an individual's request to amend a record
  duration:
    value: 10
    unit: business_days
  computation: >-
    Ten days from the date of receipt of the request. The statute states the exclusion on its face —
    "excluding Saturdays, Sundays, and legal public holidays" — so the clock runs in business days
    and the day of receipt is the day from which it is measured.
