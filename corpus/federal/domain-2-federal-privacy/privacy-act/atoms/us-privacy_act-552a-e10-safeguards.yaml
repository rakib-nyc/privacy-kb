summary: >-
  An agency must establish appropriate administrative, technical and physical safeguards to ensure
  the security and confidentiality of records and to protect against anticipated threats that could
  result in harm to an individual.
requirement_detail: >-
  THE THREE-PART SAFEGUARDS FORMULA STARTS HERE, in 1974, and every later US security rule reuses it
  — the GLBA Safeguards Rule and the HIPAA Security Rule both organise controls as "administrative,
  technical, and physical safeguards" because this paragraph did first. What distinguishes this
  version is its harm standard: the protection is owed against consequences that include
  embarrassment, inconvenience and unfairness to the individual, not only against unauthorised
  access, which is a broader trigger than most modern security rules use. There is no specified
  control set and no certification, so the duty is assessed as reasonableness against the
  sensitivity of the system. The error to avoid is treating a FISMA authorisation as discharging it:
  FISMA measures the security of the information system, while this paragraph measures the
  protection of the individual whose record is in it, and an agency can hold the first and still
  breach the second.
