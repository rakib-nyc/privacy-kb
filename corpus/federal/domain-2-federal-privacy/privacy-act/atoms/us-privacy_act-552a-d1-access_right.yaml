summary: >-
  On request, an agency must let an individual review his own record and have a copy made of any
  part of it, in a form he can understand, and may let a person of his choosing accompany him.
requirement_detail: >-
  THIS IS THE ACCESS RIGHT THE US GENERALLY LACKS, and it exists only against federal agencies. The
  duty is to permit review and copying "in a form comprehensible to him", which is a usability
  standard rather than a format standard — producing a raw system extract nobody can read does not
  discharge it. Three features separate it from a consumer access request under a state
  comprehensive law: it reaches only the requester's own record in a system of records, it can be
  conditioned on a written statement authorising discussion of the record in front of an
  accompanying person, and it is enforceable by the individual in federal court under (g)(1)(B) with
  de novo review. The usual practitioner error is to treat it as a FOIA request; the two run on
  different tracks, and an agency's exemptions under subsections (j) and (k) are what actually
  determine how much of a record an individual gets.
