verbatim_span: >-
  Each agency record pertaining to an identifiable individual which is transferred to the National
  Archives of the United States as a record which has sufficient historical or other value to
  warrant its continued preservation by the United States Government, on or after the effective date
  of this section, shall, for the purposes of this section, be considered to be maintained by the
  National Archives and shall be exempt from the requirements of this section except subsections
  (e)(4)(A) through (G) and (e)(9) of this section.
