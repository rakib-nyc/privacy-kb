verbatim_span: >-
  An action to enforce any liability created under this section may be brought in the district court
  of the United States in the district in which the complainant resides, or has his principal place
  of business, or in which the agency records are situated, or in the District of Columbia, without
  regard to the amount in controversy, within two years from the date on which the cause of action
  arises, except that where an agency has materially and willfully misrepresented any information
  required under this section to be disclosed to an individual and the information so misrepresented
  is material to establishment of the liability of the agency to the individual under this section,
  the action may be brought at any time within two years after discovery by the individual of the
  misrepresentation. Nothing in this section shall be construed to authorize any civil action by
  reason of any injury sustained as the result of a disclosure of a record prior to September 27,
  1975 .
