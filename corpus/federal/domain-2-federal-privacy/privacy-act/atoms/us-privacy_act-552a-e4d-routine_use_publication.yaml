summary: >-
  The published system-of-records notice must state each routine use of the records, including the
  categories of users and the purpose of the use.
requirement_detail: >-
  THIS SUBPARAGRAPH IS WHERE THE ROUTINE-USE EXCEPTION IS MANUFACTURED. Subsection (b)(3) permits
  disclosure for a routine use described here, so the agency's own Federal Register text is the
  operative document and this is the provision that requires it to exist. What it demands is
  specific: not a routine use in the abstract but "each routine use of the records contained in the
  system" together with the categories of users and the purpose. A notice that names a recipient
  class without a purpose, or a purpose without a recipient class, has not satisfied the
  subparagraph, and a disclosure resting on it is exposed. The auditing move that practitioners miss
  is the arithmetic one: compare the disclosures an agency actually makes against the enumerated
  uses in its notice, because the gap between them is the compliance finding, and it is visible from
  outside the agency.
