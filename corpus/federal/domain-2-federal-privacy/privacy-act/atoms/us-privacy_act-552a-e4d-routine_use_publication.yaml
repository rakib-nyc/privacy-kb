common_errors:
  - >-
    Reading the notice's routine-use list as illustrative. Each routine use has to be stated, so a
    disclosure outside the list is outside (b)(3).
  - >-
    Omitting the categories of users or the purpose. The subparagraph requires both alongside the
    use itself.
  - >-
    Treating this as a drafting duty only. Because (b)(3) incorporates it, a defective notice
    converts routine disclosures into unauthorised ones.
open_questions:
  - >-
    legal-domain v2.6.1 has no performance indicator naming the Privacy Act of 1974. subject.domain III.A.1
    is the nearest fit and matches where this repo already files government-records disclosure
    statutes (DPPA, RFPA); it is a placement decision, not a claim that the taxonomy leaf names this
    statute.
confidence: high
preemption:
  posture: none
  authority: 5 U.S.C. § 552a
  note: >-
    The Act regulates federal agencies, not private entities, so it displaces nothing at state level
    and the section carries no preemption clause. A state privacy statute and this section do not
    compete for the same conduct; where a state actor is involved it is the state's own records law
    that governs, not this one.
enforcement:
  enforcers:
    - private_litigants
    - doj
    - federal_agencies
  private_right_of_action: true
  penalty:
    structure: >-
      Civil action in federal district court under 5 U.S.C. § 552a(g)(1). For the
      intentional-or-wilful violations in (g)(1)(C) and (g)(1)(D) the court awards actual damages
      with a $1,000 statutory floor, plus costs and reasonable attorney fees under (g)(4). Access
      and amendment suits under (g)(1)(A)-(B) are reviewed de novo and yield injunctive relief and
      fees rather than damages. Wilful disclosure by an officer or employee is a misdemeanour under
      (i)(1), fined not more than $5,000.
    range: null
    note: >-
      A PRIVATE RIGHT OF ACTION EXISTS, which is unusual for a federal privacy statute and is the
      reason Privacy Act claims are litigated at all. Damages require intentional or wilful conduct,
      and the Supreme Court in FAA v. Cooper (2012) held that actual damages do not cover mental or
      emotional distress.
  statute_of_limitations: Two years from the date on which the cause of action arises, under 5 U.S.C. § 552a(g)(5).
