verbatim_span: >-
  In any suit brought under the provisions of subsection (g)(1)(B) of this section, the court may
  enjoin the agency from withholding the records and order the production to the complainant of any
  agency records improperly withheld from him. In such a case the court shall determine the matter
  de novo, and may examine the contents of any agency records in camera to determine whether the
  records or any portion thereof may be withheld under any of the exemptions set forth in subsection
  (k) of this section, and the burden is on the agency to sustain its action.
