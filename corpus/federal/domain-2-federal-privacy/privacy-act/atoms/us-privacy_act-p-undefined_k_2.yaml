verbatim_span: >-
  investigatory material compiled for law enforcement purposes, other than material within the scope
  of subsection (j)(2) of this section: Provided, however , That if any individual is denied any
  right, privilege, or benefit that he would otherwise be entitled by Federal law, or for which he
  would otherwise be eligible, as a result of the maintenance of such material, such material shall
  be provided to such individual, except to the extent that the disclosure of such material would
  reveal the identity of a source who furnished information to the Government under an express
  promise that the identity of the source would be held in confidence, or, prior to the effective
  date of this section, under an implied promise that the identity of the source would be held in
  confidence;
