summary: >-
  Disclosure without consent is permitted for a routine use, which subsection (a)(7) defines as a
  use compatible with the purpose of collection and which subsection (e)(4)(D) requires the agency
  to have published in its system-of-records notice.
requirement_detail: >-
  THE MECHANISM AND THE LOOPHOLE ARE THE SAME PROVISION. Routine use is not a category Congress
  fixed; the agency writes its own routine uses and publishes them, so the width of this exception
  is set by the party relying on it. Two conditions travel with it and both are checkable on the
  face of the record: subsection (a)(7) requires the use to be "compatible with the purpose for
  which it was collected", and (e)(4)(D) requires the use to have appeared in the published notice
  before the disclosure, not after it. The compatibility limb is the one that gets skipped —
  practitioners read a routine use out of a system-of-records notice and stop there, when a
  published routine use that is not compatible with the collection purpose is not a lawful routine
  use at all. The practical consequence for an assessment is that the notice, not this section, is
  the document you have to read: a disclosure is lawful under this paragraph only to the extent the
  agency's own published text reaches it.
