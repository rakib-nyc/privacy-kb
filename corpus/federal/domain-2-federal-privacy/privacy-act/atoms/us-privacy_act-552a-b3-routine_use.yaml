common_errors:
  - >-
    Treating a routine use as a fixed statutory category. The agency drafts and publishes its own,
    so the analysis has to start from that agency's system-of-records notice.
  - >-
    Relying on the published notice alone. Publication under (e)(4)(D) is necessary and not
    sufficient — the use must also be compatible with the purpose of collection under (a)(7).
  - >-
    Assuming a routine use can be added to cover a disclosure already made. The paragraph requires
    the use to have been described in the notice, so a later amendment does not cure an earlier
    disclosure.
