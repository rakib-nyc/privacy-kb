common_errors:
- Citing the Privacy Act against a private-sector company. It reaches federal agencies, and a private entity is
  inside it only where subsection (m)(1) applies the section to a contractor operating a system of records for
  an agency.
- Treating any agency-held file as covered. The prohibition runs to a record in a SYSTEM OF RECORDS — retrieved
  by the individual's name or identifier — and agency information not retrieved that way is outside the section.
- Reading the thirteen exceptions as narrow. The routine-use exception at (b)(3) is defined by the agency's own
  published notice, so in practice the agency sets the width of the relief it relies on.
