summary: A federal agency may not disclose a record contained in a system of records without the written request
  or prior written consent of the individual the record is about, unless the disclosure falls within one of thirteen
  enumerated exceptions.
requirement_detail: 'THIS SECTION BINDS FEDERAL AGENCIES AND NOTHING ELSE, and citing it against a private company
  is the most frequent misuse of any statute in US privacy practice — a bank, a hospital, an employer or an app
  is outside it entirely, however federal the subject matter of the data. Two qualifications are dropped almost
  as often as the first point is missed. Subsection (m)(1) pulls a contractor that operates a system of records
  on an agency''s behalf inside the Act by force of the contract, so establishing that the defendant is not itself
  an agency does not end the analysis. And the duty attaches to a record held in a SYSTEM OF RECORDS — a group
  of records retrieved by the individual''s name or identifier under subsection (a)(5) — so agency-held information
  that is never retrieved by identifier is not reached at all, which is where most of the real argument happens.
  The consent limb is narrow on its face: disclosure is permitted on the individual''s written request, or "with
  the prior written consent of, the individual to whom the record pertains", and on nothing looser. The work is
  therefore done by the exceptions, and by the routine-use exception at (b)(3) above all, because the agency writes
  its own routine uses in the notice it publishes under (e)(4)(D).'
deadline: null
exemptions:
- id: usc.5.552a.b1.intra_agency_need_for_the_record
  type: activity_level
  scope: 'Disclosure inside the maintaining agency to officers and employees who need the record to do their jobs.
    This is a need-to-know test, not an employment test: being on the agency''s payroll is not sufficient, and
    an agency that grants blanket internal access to a system of records cannot rely on this paragraph for every
    person who reads it.'
  source_citation: 5 U.S.C. § 552a(b)(1)
  verbatim_span: to those officers and employees of the agency which maintains the record who have a need for
    the record in the performance of their duties;
  burden_of_proof: entity
  applies_if:
    all:
    - practice.disclosure_to_agency_employee_with_need_for_record == true
- id: usc.5.552a.b2.required_under_foia
  type: activity_level
  scope: Disclosure that FOIA requires. The paragraph covers what section 552 REQUIRES, not what it permits, so
    a record that falls inside a FOIA exemption is not reachable through this route — the two statutes interlock
    at the point of compulsion only, and treating a discretionary FOIA release as authorised here is a Privacy
    Act violation.
  source_citation: 5 U.S.C. § 552a(b)(2)
  verbatim_span: required under section 552 of this title ;
  burden_of_proof: entity
  applies_if:
    all:
    - law.foia_disclosure_required == true
- id: usc.5.552a.b3.routine_use
  type: activity_level
  scope: 'The exception that swallows the rule. A routine use is defined by the agency itself and published in
    its own system-of-records notice, so the scope of this relief is set by the discloser rather than by Congress.
    Two conditions are cumulative and are the only real limits: the use must be compatible with the purpose of
    collection under subsection (a)(7), and it must have been described in the published notice under (e)(4)(D)
    BEFORE the disclosure.'
  source_citation: 5 U.S.C. § 552a(b)(3)
  verbatim_span: for a routine use as defined in subsection (a)(7) of this section and described under subsection
    (e)(4)(D) of this section;
  burden_of_proof: entity
  applies_if:
    all:
    - purpose.is_published_routine_use == true
- id: usc.5.552a.b7.law_enforcement_request
  type: activity_level
  scope: 'Disclosure to another agency or governmental instrumentality for a civil or criminal law enforcement
    activity. It is not self-executing: the activity must be authorised by law AND the head of the requesting
    body must have made a written request specifying the particular portion wanted and the activity it is wanted
    for. An oral or unspecific request does not qualify.'
  source_citation: 5 U.S.C. § 552a(b)(7)
  verbatim_span: to another agency or to an instrumentality of any governmental jurisdiction within or under the
    control of the United States for a civil or criminal law enforcement activity if the activity is authorized
    by law, and if the head of the agency or instrumentality has made a written request to the agency which maintains
    the record specifying the particular portion desired and the law enforcement activity for which the record
    is sought;
  burden_of_proof: entity
  applies_if:
    all:
    - purpose.is_civil_or_criminal_law_enforcement_activity == true
    - event.written_request_from_agency_head_received == true
