summary: >-
  A telecommunications carrier that obtains customer proprietary network information by virtue of
  providing a telecommunications service may use, disclose or permit access to it only as required
  by law, with customer approval, or in providing the service from which it is derived.
requirement_detail: >-
  CPNI IS A SEPARATE REGIME FROM EVERYTHING ELSE IN THIS CORPUS, and its default is the opposite of
  the FTC's. § 222(c)(1) permits use only in three named circumstances rather than prohibiting
  unfair or deceptive use, so a carrier needs an affirmative basis rather than an absence of
  deception. The FCC rather than the FTC enforces it, and FTC Act § 45(a)(2) excludes common
  carriers from Commission jurisdiction — which is why the § 5 backstop does NOT reach carrier
  conduct in its common-carriage capacity.
