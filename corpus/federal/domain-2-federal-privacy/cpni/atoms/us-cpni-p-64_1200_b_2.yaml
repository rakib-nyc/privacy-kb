verbatim_span: During or after the message, state clearly the telephone number (other than that of
  the autodialer or prerecorded message player that placed the call) of such business, other entity,
  or individual. The telephone number provided may not be a 900 number or any other number for which
  charges exceed local or long distance transmission charges. For telemarketing messages and messages
  made pursuant to an exemption under paragraphs (a)(3)(ii) through (v) of this section to residential
  telephone subscribers, such telephone number must permit any individual to make a do-not-call request
  during regular business hours; and
