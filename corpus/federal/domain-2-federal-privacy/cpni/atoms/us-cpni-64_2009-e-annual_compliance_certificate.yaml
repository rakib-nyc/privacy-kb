common_errors:
  - >-
    Filing a bare certificate. The rule also requires the explanatory statement, the data-broker
    actions and the complaint summary, and an incomplete filing is treated as a violation.
  - >-
    Having counsel or a compliance manager sign. The rule requires an officer acting as agent of the
    carrier and asserting personal knowledge.
  - >-
    Assuming the duty falls only on large carriers. It runs to every telecommunications carrier
    subject to subpart U, and the Enforcement Bureau's omnibus orders have overwhelmingly hit small
    ones.
