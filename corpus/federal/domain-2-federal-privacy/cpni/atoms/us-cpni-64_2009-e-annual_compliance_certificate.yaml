summary: >-
  An officer of a telecommunications carrier must sign and file an annual CPNI compliance
  certificate with the Enforcement Bureau on or before March 1 in EB Docket No. 06-36, stating
  personal knowledge that adequate operating procedures exist, with an explanatory statement, any
  actions taken against data brokers, and a summary of unauthorised-release complaints.
requirement_detail: >-
  THE ANNUAL CERTIFICATE IS THE MOST FREQUENTLY ENFORCED CPNI OBLIGATION IN THE CORPUS, AND IT IS
  ENFORCED FOR NON-FILING RATHER THAN FOR THE UNDERLYING PRIVACY FAILURE — the Enforcement Bureau
  has issued omnibus forfeiture orders against hundreds of carriers in a single proceeding for
  missing the March 1 date. Two features make it unusually exposed. First, it is signed by an
  OFFICER as agent of the carrier and asserts PERSONAL KNOWLEDGE, so a certificate filed on the
  strength of a subordinate's assurance is a defective filing rather than a late one, and a
  knowingly false certificate is a separate violation. Second, the accompanying statement must
  explain how the procedures ensure compliance "or is not in compliance" — the rule contemplates a
  carrier certifying non-compliance, which means the honest filing and the clean filing are not the
  same document. The certificate also carries two disclosures nothing else in subpart U requires:
  actions taken against data brokers, and a summary of every customer complaint about unauthorised
  CPNI release in the past year, which turns the annual filing into the Commission's standing intake
  for pretexting intelligence. It covers the PREVIOUS calendar year, so the March 1 filing reports
  on a period already closed.
