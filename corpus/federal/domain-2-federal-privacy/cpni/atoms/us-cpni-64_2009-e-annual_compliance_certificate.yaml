verbatim_span: >-
  A telecommunications carrier must have an officer, as an agent of the carrier, sign and file with
  the Commission a compliance certificate on an annual basis. The officer must state in the
  certification that he or she has personal knowledge that the company has established operating
  procedures that are adequate to ensure compliance with the rules in this subpart. The carrier must
  provide a statement accompanying the certificate explaining how its operating procedures ensure
  that it is or is not in compliance with the rules in this subpart. In addition, the carrier must
  include an explanation of any actions taken against data brokers and a summary of all customer
  complaints received in the past year concerning the unauthorized release of CPNI. This filing must
  be made annually with the Enforcement Bureau on or before March 1 in EB Docket No. 06-36, for data
  pertaining to the previous calendar year.
