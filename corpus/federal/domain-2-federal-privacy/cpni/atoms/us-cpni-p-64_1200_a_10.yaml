verbatim_span: A called party may revoke prior express consent, including prior express written consent,
  to receive calls or text messages made pursuant to paragraphs (a)(1) through (3) and (c)(2) of this
  section by using any reasonable method to clearly express a desire not to receive further calls
  or text messages from the caller or sender. Any revocation request made using an automated, interactive
  voice or key press-activated opt-out mechanism on a call; using the words “stop,” “quit,” “end,”
  “revoke,” “opt out,” “cancel,” or “unsubscribe” sent in reply to an incoming text message; or pursuant
  to a website or telephone number designated by the caller to process opt-out requests constitutes
  a reasonable means per se to revoke consent. If a called party uses any such method to revoke consent,
  that consent is considered definitively revoked and the caller may not send additional robocalls
  and robotexts. If a reply to an incoming text message uses words other than “stop,” “quit,” “end,”
  “revoke,” “opt out,” “cancel,” or “unsubscribe,” the caller must treat that reply text as a valid
  revocation request if a reasonable person would understand those words to have conveyed a request
  to revoke consent. Should the text initiator choose to use a texting protocol that does not allow
  reply texts, it must provide a clear and conspicuous disclosure on each text to the consumer that
  two-way texting is not available due to technical limitations of the texting protocol, and clearly
  and conspicuously provide on each text reasonable alternative ways to revoke consent. All requests
  to revoke prior express consent or prior express written consent made in any reasonable manner must
  be honored within a reasonable time not to exceed ten business days from receipt of such request.
  Callers or senders of text messages covered by paragraphs (a)(1) through (3) and (c)(2) of this
  section may not designate an exclusive means to request revocation of consent.
