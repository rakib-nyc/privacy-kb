  authority: 47 U.S.C. § 222
  note: >-
    Subpart U implements 47 U.S.C. § 222 and states no express preemption outside § 64.2011(f).
    Recorded as a floor pending a provision-level analysis; the Communications Act's own limits on
    State regulation of interstate service, not this rule, are what constrain a more demanding State
    notice requirement.
