summary: >-
  Customer notification soliciting CPNI approval must provide sufficient information to enable the
  customer to make an informed decision whether to permit the carrier to use, disclose or permit
  access to that customer's CPNI.
requirement_detail: >-
  THIS PARAGRAPH IS THE STANDARD, AND (c)(1) THROUGH (c)(10) ARE ITS FLOOR RATHER THAN ITS CEILING —
  a notice that recites all ten items and still leaves the customer unable to decide fails paragraph
  (c). The enumerated items are more prescriptive than an ordinary privacy notice: (c)(1) requires
  the notice to state that the carrier has a DUTY under federal law to protect CPNI confidentiality,
  (c)(3) requires it to say that denying approval will not affect the provision of service, and
  (c)(8) affirmatively PROHIBITS language discouraging a customer from freezing third-party access.
  That last one is the reason a marketing-drafted CPNI notice so often fails: the rule regulates
  persuasion, not just content. The 30-day opt-out waiting period and the biennial re-notice sit in
  paragraph (d), the opt-in route in (e), and the one-time oral route in (f), so paragraph (c) is
  the content standard common to all three approval mechanisms rather than a rule about any one of
  them. Because § 222(c)(1) permits use only with customer approval or within the enumerated
  purposes, a defective notice does not merely breach § 64.2008 — it invalidates the approval and
  converts every downstream use into a statutory violation.
