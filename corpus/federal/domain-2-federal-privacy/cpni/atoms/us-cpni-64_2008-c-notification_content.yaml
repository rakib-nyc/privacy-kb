common_errors:
  - >-
    Treating (c)(1)–(c)(10) as a checklist that discharges paragraph (c). The enumerated items are
    minimums under a sufficiency standard.
  - >-
    Adding language that encourages the customer not to freeze third-party access. Paragraph (c)(8)
    prohibits it outright.
  - >-
    Scoping the duty to opt-out notices. Paragraph (c) governs the content of every CPNI approval
    notification, including the opt-in route under (e) and the one-time oral route under (f).
