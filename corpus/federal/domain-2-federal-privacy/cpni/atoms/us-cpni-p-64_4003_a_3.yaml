    verbatim_span: >-
      When a customer contacts an IXC to establish interexchange service on a presubscribed basis,
      the IXC selected must submit the customer's properly verified PIC Order ( see 47 CFR
      64.1120(a)) to the customer's LEC, instructing the LEC to install or change the PIC for the
      customer's line(s) to that IXC. The notification provided by the IXC to the LEC must contain
      all of the information necessary to properly execute the Order including but not limited to:
