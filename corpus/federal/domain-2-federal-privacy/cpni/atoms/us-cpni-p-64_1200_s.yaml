verbatim_span: >-
  A terminating mobile wireless provider must, upon receipt of a Notification of Illegal Texts from
  the Commission through its Enforcement Bureau, take the actions described in this paragraph (s),
  including, when required, blocking all texts from the identified number or numbers. The
  Enforcement Bureau will issue a Notification of Illegal Texts that identifies the number(s) used
  and the date(s) the texts were sent or received; provides the basis for the Enforcement Bureau's
  determination that the identified texts are unlawful; cites the statutory or regulatory provisions
  the identified texts violate; directs the provider receiving the notice that it must comply with
  this section; and provide a point of contact to be used by a subscriber to a listed number to
  dispute blocking. The Enforcement Bureau's Notification of Illegal Texts shall give the identified
  provider a reasonable amount of time to comply with the notice. The Enforcement Bureau shall make
  the Notification of Illegal Texts available in EB Docket No. 23-418 at
  https://www.fcc.gov/ecfs/search/search-filings. The provider must include a certification that it
  is blocking all texts from the number or numbers and will continue to do so unless the provider
  learns that the number has been reassigned, in which case the provider shall promptly notify the
  Enforcement Bureau of this fact and include any information it has obtained that demonstrates that
  the number has been reassigned. If, at any time in the future, the provider determines that the
  number has been reassigned, it shall notify the Enforcement Bureau and cease blocking. The
  provider is not required to monitor for number reassignments.
