    verbatim_span: >-
      The carrier identification code of the IXC. If a customer changes PICs but retains the same
      LEC, the LEC is responsible for notifying both the old PIC and new PIC of the PIC change. The
      notification also must contain information, if relevant and to the extent that it is
      available, reflecting the fact that a customer's PIC removal was the result of:
    path:
      - d
      - '5'
    citation: 47 C.F.R. § 64.4002(d)(5)
  - position: precedes
    relation: scopes
    verbatim_span: >-
      When a LEC has removed at its local switch a presubscribed customer from an IXC's network in
      response to a customer order, upon receipt of a properly verified PIC order submitted by
      another IXC, or in response to a notification from the customer's current IXC relating to the
      customer's request to change his or her PIC to No-PIC, the LEC must notify the customer's
      former IXC of this event. The LEC must provide to the IXC the customer account information
      that is necessary to allow for proper final billing of the customer by the IXC including but
      not limited to:
    path:
      - d
    citation: 47 C.F.R. § 64.4002(d)
