verbatim_span: >-
  If the provider's investigation determines that the identified traffic is not illegal, it shall
  provide an explanation as to why the provider reasonably concluded that the identified traffic is
  not illegal and what steps it took to reach that conclusion. Absent such a showing, or if the
  Enforcement Bureau determines based on the evidence that the traffic is illegal despite the
  provider's assertions, the identified traffic will be deemed illegal. If the notified provider
  determines during this investigation that it did not serve as the gateway provider or originating
  provider for any of the identified traffic, it shall provide an explanation as to how it reached
  that conclusion and, if it is a non-gateway intermediate or terminating provider for the
  identified traffic, it must identify the upstream provider(s) from which it received the
  identified traffic and, if possible, take lawful steps to mitigate this traffic. If the
  Enforcement Bureau finds that an approved plan is not blocking substantially similar traffic, the
  identified provider shall modify its plan to block such traffic. If the Enforcement Bureau finds
  that the identified provider continues to allow suspected illegal traffic onto the U.S. network,
  it may proceed under paragraph (n)(2)(ii) or (iii) of this section, as appropriate.
