verbatim_span: >-
  This clause shall not apply in the case of an unsolicited advertisement that is sent based on an
  established business relationship with the recipient that was in existence before July 9, 2005 if
  the sender also possessed the facsimile machine number of the recipient before July 9, 2005. There
  shall be a rebuttable presumption that if a valid established business relationship was formed
  prior to July 9, 2005, the sender possessed the facsimile number prior to such date as well; and
