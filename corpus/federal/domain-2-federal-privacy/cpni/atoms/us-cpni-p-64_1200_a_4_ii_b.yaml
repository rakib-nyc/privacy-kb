verbatim_span: >-
  A directory, advertisement, or site on the Internet to which the recipient voluntarily agreed to
  make available its facsimile number for public distribution. If a sender obtains the facsimile
  number from the recipient's own directory, advertisement, or Internet site, it will be presumed
  that the number was voluntarily made available for public distribution, unless such materials
  explicitly note that unsolicited advertisements are not accepted at the specified facsimile
  number. If a sender obtains the facsimile number from other sources, the sender must take
  reasonable steps to verify that the recipient agreed to make the number available for public
  distribution.
