    verbatim_span: >-
      A residential telephone subscriber who has registered his or her telephone number on the
      national do-not-call registry of persons who do not wish to receive telephone solicitations
      that is maintained by the Federal Government. Such do-not-call registrations must be honored
      indefinitely, or until the registration is cancelled by the consumer or the telephone number
      is removed by the database administrator. Any person or entity making telephone solicitations
      (or on whose behalf telephone solicitations are made) will not be liable for violating this
      requirement if:
