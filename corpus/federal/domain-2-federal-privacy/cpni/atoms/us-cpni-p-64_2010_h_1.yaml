verbatim_span: >-
  A CMRS provider shall use secure methods to authenticate a customer that are reasonably designed
  to confirm the customer's identity before executing a SIM change request, except to the extent
  otherwise required by 47 U.S.C. 345 (Safe Connections Act of 2022) or subpart II of this part.
  Authentication methods shall not rely on readily available biographical information, account
  information, recent payment information, or call detail information unless otherwise permitted
  under 47 U.S.C. 345 or subpart II of this part. A CMRS provider shall regularly, but not less than
  annually, review and, as necessary, update its customer authentication methods to ensure that its
  authentication methods continue to be secure. A CMRS provider shall establish safeguards and
  processes so that employees who receive inbound customer communications are unable to access CPNI
  in the course of that customer interaction until after the customer has been properly
  authenticated.
