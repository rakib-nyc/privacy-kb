  - position: precedes
    relation: scopes
    verbatim_span: >-
      When a customer changes LECs, the customer's former LEC must notify the customer's PIC(s) of
      the customer's change in LEC and, if known, the identity of the customer's new LEC. If the
      customer also makes a PIC change, the customer's former LEC must also notify the customer's
      former PIC(s) of the change. When a customer only changes LECs, the new LEC must notify the
      customer's current PIC(s) that the customer's PIC selection has not changed. If the customer
      also makes a PIC change, the new LEC must notify the customer's new PIC of the customer's PIC
      selection. If the customer's former LEC is unable to identify the customer's new LEC, the
      former LEC must notify the customer's PIC(s) of a local service disconnection as described in
      paragraph (f).
    path:
      - g
    citation: 47 C.F.R. § 64.4002(g)
