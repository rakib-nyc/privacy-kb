verbatim_span: >-
  Each terminating provider that blocks calls pursuant to this section or utilizes caller ID
  authentication information in determining how to deliver calls must provide a single point of
  contact, readily available on the terminating provider's public-facing website, for receiving call
  blocking error complaints and verifying the authenticity of the calls of a calling party that is
  adversely affected by information provided by caller ID authentication. The terminating provider
  must resolve disputes pertaining to caller ID authentication information within a reasonable time
  and, at a minimum, provide a status update within 24 hours. When a caller makes a credible claim
  of erroneous blocking and the terminating provider determines that the calls should not have been
  blocked, or the call delivery decision is not appropriate, the terminating provider must promptly
  cease the call treatment for that number unless circumstances change. The terminating provider may
  not impose any charge on callers for reporting, investigating, or resolving either category of
  complaints, so long as the complaint is made in good faith.
