  verbatim_span: 'Upon receipt of a Notice of Suspected Illegal Traffic from the Commission through
    its Enforcement Bureau, take the applicable actions with respect to the identified traffic described
    in paragraphs (n)(2)(i) through (iii) of this section. The provider will not be held liable under
    the Communications Act or the Commission''s rules in this chapter for providers that inadvertently
    block lawful traffic as part of the requirement to block substantially similar traffic so long
    as it is blocking consistent with the requirements of paragraphs (n)(2)(i) through (iii). For
    purposes of this paragraph (n)(2), identified traffic means the illegal traffic identified in
    the Notification of Suspected Illegal Traffic issued by the Enforcement Bureau. The following
    procedures shall apply:'
