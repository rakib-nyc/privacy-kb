verbatim_span: If the provider does not provide an adequate response to the Initial Determination
  Order within the timeframe permitted in that Order or continues to originate substantially similar
  traffic onto the U.S. network, the Enforcement Bureau shall issue a Final Determination Order finding
  that the provider is not in compliance with this section. The Final Determination Orders shall be
  published in EB Docket No. 22-174 at https://www.fcc.gov/ecfs/search/search-filings. A Final Determination
  Order may be issued up to one year after the release date of the Initial Determination Order, and
  may be based on either an immediate failure to comply with this section or a determination that
  the provider has failed to meet its ongoing obligation under this section to block substantially
  similar traffic.
