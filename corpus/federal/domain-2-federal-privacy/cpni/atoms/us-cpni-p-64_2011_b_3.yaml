verbatim_span: >-
  If the relevant investigating agency determines that public disclosure or notice to customers
  would impede or compromise an ongoing or potential criminal investigation or national security,
  such agency may direct the carrier not to so disclose or notify for an initial period of up to 30
  days. Such period may be extended by the agency as reasonably necessary in the judgment of the
  agency. If such direction is given, the agency shall notify the carrier when it appears that
  public disclosure or notice to affected customers will no longer impede or compromise a criminal
  investigation or national security. The agency shall provide in writing its initial direction to
  the carrier, any subsequent extension, and any notification that notice will no longer impede or
  compromise a criminal investigation or national security and such writings shall be
  contemporaneously logged on the same reporting facility that contains records of notifications
  filed by carriers.
