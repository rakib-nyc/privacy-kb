verbatim_span: >-
  If the carrier believes that there is an extraordinarily urgent need to notify any class of
  affected customers sooner than otherwise allowed under paragraph (b)(1) of this section, in order
  to avoid immediate and irreparable harm, it shall so indicate in its notification and may proceed
  to immediately notify its affected customers only after consultation with the relevant
  investigating agency. The carrier shall cooperate with the relevant investigating agency's request
  to minimize any adverse effects of such customer notification.
