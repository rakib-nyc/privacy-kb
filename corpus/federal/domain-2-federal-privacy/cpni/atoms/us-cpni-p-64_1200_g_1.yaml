verbatim_span: >-
  When providing local exchange service, provide an annual notice, via an insert in the subscriber's
  bill, of the right to give or revoke a notification of an objection to receiving telephone
  solicitations pursuant to the national do-not-call database maintained by the federal government
  and the methods by which such rights may be exercised by the subscriber. The notice must be clear
  and conspicuous and include, at a minimum, the Internet address and toll-free number that
  residential telephone subscribers may use to register on the national database.
