    relation: scopes
    verbatim_span: >-
      When an end user customer contacts an IXC to discontinue interexchange service on a
      presubscribed basis, the IXC must confirm that it is the customer's desire to have no PIC and,
      if that is the case, the IXC must notify the customer's LEC. The IXC also is encouraged to
      instruct the customer to notify his LEC. An IXC may satisfy this requirement by establishing a
      three-way call with the customer and the customer's LEC to confirm that it is the customer's
      desire to have no PIC and, where appropriate, to provide the customer the opportunity to
      withdraw any PIC freeze that may be in place. The notification provided by the IXC to the LEC
      must contain the customer account information necessary to properly execute the cancellation
      Order including but not limited to:
    path:
