verbatim_span: >-
  A one-time text message confirming a request to revoke consent from receiving any further calls or
  text messages does not violate paragraphs (a)(1) and (2) of this section as long as the
  confirmation text merely confirms the text recipient's revocation request and does not include any
  marketing or promotional information, and is the only additional message sent to the called party
  after receipt of the revocation request. If the confirmation text is sent within five minutes of
  receipt, it will be presumed to fall within the consumer's prior express consent. If it takes
  longer, however, the sender will have to make a showing that such delay was reasonable. To the
  extent that the text recipient has consented to several categories of text messages from the text
  sender, the confirmation message may request clarification as to whether the revocation request
  was meant to encompass all such messages; the sender must cease all further texts for which
  consent is required absent further clarification that the recipient wishes to continue to receive
  certain text messages.
