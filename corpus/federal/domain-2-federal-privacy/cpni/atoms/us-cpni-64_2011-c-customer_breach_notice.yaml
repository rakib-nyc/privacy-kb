common_errors:
  - >-
    Reading the seven-business-day figure as the customer notice deadline. It is the outer limit for
    notifying the USSS and FBI under (b), and separately a minimum wait before customers may be told
    under (b)(1).
  - >-
    Concluding that no federal deadline means no deadline. State breach statutes run in parallel
    and, outside the paragraph (b)(1) waiting period, paragraph (f) leaves them operative.
  - >-
    Notifying customers before the (b) process is complete. Paragraph (a) prohibits it, whether the
    carrier acts voluntarily or under state or local law.
open_questions: []
confidence: high
preemption:
  posture: express_partial
  authority: 47 C.F.R. § 64.2011(f)
  note: >-
    Paragraph (f) preserves State law except to the extent of an inconsistency. Because (c) fixes no
    period, a State outer deadline is not inconsistent with it and continues to govern — subject to
    the (b)(1) waiting period, which is inconsistent with any State rule requiring earlier customer
    notice and displaces it for that period.
