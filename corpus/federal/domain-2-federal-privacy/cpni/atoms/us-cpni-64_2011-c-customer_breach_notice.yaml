summary: >-
  After completing the law-enforcement notification process in § 64.2011(b), a telecommunications
  carrier must notify its customers of a breach of those customers' CPNI.
requirement_detail: >-
  CUSTOMER NOTICE UNDER THIS SECTION IS SEQUENCED, NOT SCHEDULED, and that is the single most
  important operational fact about it. Paragraph (c) supplies no period at all: the only clock in
  the section runs the other way, as the seven-full-business-day bar in (b)(1) on telling customers
  anything. A carrier reading (c) for a deadline and finding none often concludes it has time, when
  the real risk is the opposite — the State breach statutes that paragraph (f) leaves standing do
  impose outer deadlines, and the federal waiting period can consume most of a thirty-day State
  clock before customer notice becomes lawful. The rule also fixes no content and no delivery method
  for the customer notice, so State law supplies both in practice. Read with paragraph (a), the
  sequence is absolute: no customer notice and no public disclosure of any kind, voluntary or
  state-mandated, until the paragraph (b) law-enforcement process is complete, with (b)(2) the only
  route to earlier notice and it requires an extraordinarily urgent need to avoid immediate and
  irreparable harm.
deadline: null
no_deadline_stated: >-
  The rule fixes a WAITING PERIOD before customer notice and no outer limit after it. Checked every
  paragraph of § 64.2011 as published in the fetched eCFR text of 47 C.F.R. part 64 (versioner
  snapshot 2026-08-17): (a) bars notice until the law-enforcement process is complete, (b)(1)
  imposes the seven-full-business-day wait, (b)(2) and (b)(3) address early notice and
  law-enforcement-directed delay, (c) states the duty with no period, (d) is recordkeeping, (e) is
  the breach definition and (f) is the State-law clause. No period is stated anywhere in the section
  for the customer notice itself.
