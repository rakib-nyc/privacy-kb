verbatim_span: >-
  A telecommunications carrier shall notify law enforcement of a breach of its customers' CPNI as
  provided in this section. The carrier shall not notify its customers or disclose the breach
  publicly, whether voluntarily or under state or local law or these rules, until it has completed
  the process of notifying law enforcement pursuant to paragraph (b) of this section.
