summary: >-
  Every telecommunications carrier has a duty to protect the confidentiality of proprietary
  information of and relating to other carriers, equipment manufacturers, and customers.
requirement_detail: >-
  THE GENERAL DUTY THAT SITS ABOVE THE CPNI RULES. § 222(a) is broader than § 222(c) in two ways
  that matter: it reaches proprietary information generally rather than CPNI specifically, and it
  reaches information about OTHER CARRIERS and equipment manufacturers, not only customers. The FCC
  has used it as an independent basis for data-security enforcement where the conduct did not fit
  the § 222(c) use restrictions.
common_errors:
  - Reading § 222 as being only about CPNI. Subsection (a) is a general confidentiality duty.
  - Assuming it protects customers only. It expressly reaches other carriers and manufacturers.
