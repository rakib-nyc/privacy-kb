    verbatim_span: >-
      Abandon more than three percent of all telemarketing calls that are answered live by a person,
      as measured over a 30-day period for a single calling campaign. If a single calling campaign
      exceeds a 30-day period, the abandonment rate shall be calculated separately for each
      successive 30-day period or portion thereof that such calling campaign continues. A call is
      “abandoned” if it is not connected to a live sales representative within two (2) seconds of
      the called person's completed greeting.
