verbatim_span: >-
  A call for telemarketing purposes that delivers an artificial or prerecorded voice message to a
  residential telephone line or to any of the lines or telephone numbers described in paragraphs
  (a)(1)(i) through (iii) of this section after the subscriber to such line has granted prior
  express written consent for the call to be made shall not be considered an abandoned call if the
  message begins within two (2) seconds of the called person's completed greeting.
