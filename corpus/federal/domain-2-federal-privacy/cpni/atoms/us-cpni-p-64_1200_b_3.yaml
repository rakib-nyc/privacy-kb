verbatim_span: >-
  In every case where the artificial or prerecorded-voice telephone message is made pursuant to an
  exemption under paragraphs (a)(3)(ii) through (v) of this section or includes or introduces an
  advertisement or constitutes telemarketing and is delivered to a residential telephone line or any
  of the lines or telephone numbers described in paragraphs (a)(1)(i) through (iii) of this section,
  provide an automated, interactive voice- and/or key press-activated opt-out mechanism for the
  called person to make a do-not-call request, including brief explanatory instructions on how to
  use such mechanism, within two (2) seconds of providing the identification information required in
  paragraph (b)(1) of this section. When the called person elects to opt out using such mechanism,
  the mechanism must automatically record the called person's number to the caller's do-not-call
  list and immediately terminate the call. When the artificial or prerecorded-voice telephone
  message is left on an answering machine or a voice mail service, such message must also provide a
  toll free number that enables the called person to call back at a later time and connect directly
  to the automated, interactive voice- and/or key press-activated opt-out mechanism and
  automatically record the called person's number to the caller's do-not-call list.
