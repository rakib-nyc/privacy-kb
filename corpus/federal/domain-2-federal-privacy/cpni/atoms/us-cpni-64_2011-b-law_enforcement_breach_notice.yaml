obligation_type: notify
summary: >-
  A telecommunications carrier must electronically notify the United States Secret Service and the
  Federal Bureau of Investigation through the central reporting facility as soon as practicable and
  in no event later than seven business days after reasonable determination of a CPNI breach.
requirement_detail: >-
  THE CPNI BREACH RULE INVERTS THE ORDER EVERY STATE BREACH STATUTE USES: LAW ENFORCEMENT FIRST,
  CUSTOMERS SECOND, AND CUSTOMERS ONLY AFTER A MANDATORY WAIT. Paragraph (a) forbids customer or
  public notice until the (b) process is complete, and (b)(1) then bars customer notice
  "notwithstanding any state law to the contrary" until seven full business days have passed after
  the USSS and FBI filings. A carrier that runs its ordinary state breach playbook will therefore
  violate the federal rule by notifying customers on time. The clock here starts at "reasonable
  determination of the breach", not at discovery of the incident, so the investigation that
  establishes whether CPNI was accessed sits before the seven days rather than inside them — and the
  "as soon as practicable" clause means the seven days is a ceiling a carrier can still breach by
  sitting on a determination it has already made. Scope is narrower than instinct suggests:
  paragraph (e) defines a breach as intentional unauthorised access, use or disclosure, so a
  negligent exposure with no intentional access is outside this section while remaining squarely
  inside most state statutes. Paragraphs (b)(2) and (b)(3) are the two release valves — urgent
  customer notice to avoid immediate irreparable harm, and law-enforcement-directed delay.
deadline:
  trigger_event: Reasonable determination by the carrier that a breach of customers' CPNI has occurred
  duration:
    value: 7
    unit: business_days
  computation: >-
    Counted in business days from the carrier's reasonable determination of the breach, not from
    discovery of the underlying incident. "As soon as practicable" governs independently, so seven
    business days is the outer limit rather than the permitted period. A separate
    seven-full-business-day waiting period then runs from the USSS and FBI notifications before
    customers may be told (paragraph (b)(1)).
