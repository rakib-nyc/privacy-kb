common_errors:
  - >-
    Notifying customers on the state-law schedule. Paragraph (a) and (b)(1) bar customer or public
    notice until law enforcement has been notified and seven full business days have passed.
  - >-
    Starting the clock at discovery. The rule runs from reasonable determination of the breach, and
    "as soon as practicable" still binds a carrier that determines early.
  - >-
    Applying the rule to every CPNI exposure. Paragraph (e) defines breach as INTENTIONAL
    unauthorised access, use or disclosure, which is narrower than the state-law definitions running
    in parallel.
open_questions: []
confidence: high
preemption:
  posture: express_partial
  authority: 47 C.F.R. § 64.2011(f)
  note: >-
    Paragraph (f) states that the section does not supersede any State statute, regulation, order or
    interpretation except to the extent of an inconsistency, and then only to that extent. Paragraph
    (b)(1) supplies the concrete inconsistency: it displaces contrary State law on the timing of
    customer notice for the duration of the waiting period. Everywhere else the section behaves as a
    floor.
enforcement:
  enforcers:
    - fcc
  private_right_of_action: false
  penalty:
    structure: >-
      FCC forfeiture under 47 U.S.C. § 503(b), and consent decrees with compliance plans, which is
      how the Enforcement Bureau has resolved most CPNI matters.
    range: null
    note: >-
      FTC Act § 5 does not backstop this conduct: 15 U.S.C. § 45(a)(2) excludes common carriers
      acting as such from FTC jurisdiction. State UDAP and State breach statutes remain available
      subject to paragraph (f).
  statute_of_limitations: null
