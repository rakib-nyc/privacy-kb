    verbatim_span: >-
      No person or entity shall initiate any artificial or prerecorded-voice telephone call pursuant
      to an exemption under paragraphs (a)(3)(ii) through (v) of this section or any call for
      telemarketing purposes to a residential telephone subscriber unless such person or entity has
      instituted procedures for maintaining a list of persons who request not to receive such calls
      made by or on behalf of that person or entity. The procedures instituted must meet the
