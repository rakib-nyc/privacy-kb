verbatim_span: >-
  A sender that receives a request not to send future unsolicited advertisements that complies with
  paragraph (a)(4)(v) of this section must honor that request within the shortest reasonable time
  from the date of such request, not to exceed 30 days, and is prohibited from sending unsolicited
  advertisements to the recipient unless the recipient subsequently provides prior express
  invitation or permission to the sender. The recipient's opt-out request terminates the established
  business relationship exemption for purposes of sending future unsolicited advertisements. If such
  requests are recorded or maintained by a party other than the sender on whose behalf the
  unsolicited advertisement is sent, the sender will be liable for any failures to honor the opt-out
  request.
