verbatim_span: A mobile wireless provider must provide a point of contact or ensure its aggregator
  partners or blocking contractors that block text messages on its network provide a point of contact
  to resolve complaints about erroneous blocking from message senders that can document that their
  messages have been blocked. Such point of contact may be the same point of contact for voice call
  blocking error complaints.
