verbatim_span: >-
  If the provider fails to respond to the Notification of Suspected Illegal Traffic, the Enforcement
  Bureau determines that the response is insufficient, the Enforcement Bureau determines that the
  provider is continuing to originate substantially similar traffic or allow substantially similar
  traffic onto the U.S. network after the timeframe specified in the Notification of Suspected
  Illegal Traffic, or the Enforcement Bureau determines based on the evidence that the traffic is
  illegal despite the provider's assertions, the Enforcement Bureau shall issue an Initial
  Determination Order to the provider stating the Bureau's initial determination that the provider
  is not in compliance with this section. The Initial Determination Order shall include the
  Enforcement Bureau's reasoning for its determination and give the provider a minimum of 14 days to
  provide a final response prior to the Enforcement Bureau making a final determination on whether
  the provider is in compliance with this section.
