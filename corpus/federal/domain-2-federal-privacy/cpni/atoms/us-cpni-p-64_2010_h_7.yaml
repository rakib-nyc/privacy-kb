verbatim_span: A CMRS provider shall develop and implement training for employees to specifically
  address fraudulent SIM change attempts, complaints, and remediation. Training shall include, at
  a minimum, how to identify potentially fraudulent SIM change requests, how to identify when a customer
  may be the victim of SIM swap fraud, and how to direct potential victims and individuals making
  potentially fraudulent requests to employees specifically trained to handle such incidents.
