  verbatim_span: A provider of commercial mobile radio service (CMRS), as defined in 47 CFR 20.3,
    including resellers of wireless service, shall only effectuate SIM change requests in accordance
    with this section. For purposes of this section, SIM means a physical or virtual card associated
    with a device that stores unique information that can be identified to a specific mobile network.
