verbatim_span: Telecommunications carriers must notify customers immediately whenever a password,
  customer response to a back-up means of authentication for lost or forgotten password, online account,
  or address of record is created or changed. This notification is not required when the customer
  initiates service, including the selection of a password at service initiation. This notification
  may be through a carrier-originated voicemail or text message to the telephone number of record,
  or by mail to the address of record, and must not reveal the changed information or be sent to the
  new account information.
