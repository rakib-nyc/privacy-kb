common_errors:
  - >-
    Citing § 1514A as a confidentiality rule. It is an anti-retaliation provision; the
    anonymous-submission requirement for accounting complaints sits in the Securities Exchange Act
    and not in this section.
  - >-
    Assuming only reports to the SEC or to law enforcement are protected. Subparagraph (C) covers a
    report to "a person with supervisory authority over the employee".
  - >-
    Withdrawing protection once the allegation is found unsubstantiated. The chapeau turns on what
    the employee reasonably believes, not on whether a violation occurred.
open_questions:
  - >-
    18 U.S.C. § 1514A(b) and (c) — the complaint procedure, the de novo district court route and the
    remedies — are not extracted as atoms, so procedure and quantum cannot be resolved from this
    record.
confidence: high
preemption:
  posture: floor
  authority: 18 U.S.C. § 1514A(d)
  note: >-
    Subsection (d), headed Rights Retained by Employee in the fetched source, preserves the rights,
    privileges and remedies of an employee under other federal or state law and under any collective
    bargaining agreement. State whistleblower statutes and common-law wrongful-discharge claims
    therefore run alongside this section rather than being displaced by it. Subsection (d) has not
    been extracted as its own atom.
enforcement:
  enforcers:
    - dol
    - private_litigants
  private_right_of_action: true
  penalty:
    structure: >-
      Complaint to the Secretary of Labor, administered by OSHA, with a right to bring a de novo
      action in federal district court if the Secretary has not issued a final decision within 180
      days and the delay is not the claimant's bad faith. Relief is make-whole: reinstatement with
      seniority, back pay with interest, and special damages including litigation costs and fees.
    range: null
    note: >-
      The remedies at 18 U.S.C. § 1514A(c) and the procedure at (b) have NOT been extracted as
      atoms. Treat the description above as a pointer to those subsections and the quantum as
      UNASSESSED.
  statute_of_limitations: >-
    180 days after the violation occurs or after the employee became aware of it, under 18 U.S.C. §
    1514A(b)(2)(D); the period was raised from 90 days by Pub. L. 111–203 in 2010. That subparagraph
    is not extracted as an atom.
