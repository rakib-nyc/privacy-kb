summary: >-
  A covered issuer may not discharge, demote, suspend, threaten, harass or otherwise discriminate
  against an employee because the employee provided information about conduct the employee
  reasonably believes violates the enumerated fraud provisions to a person with supervisory
  authority over the employee, or to another person working for the employer with authority to
  investigate, discover or terminate misconduct.
requirement_detail: >-
  THE PRIVACY CONSEQUENCE OF § 1514A IS AN INVESTIGATION-HANDLING CONSTRAINT, and it is routinely
  stated backwards. Subparagraph (C) protects information given to "a person with supervisory
  authority over the employee" and to any "other person working for the employer who has the
  authority to investigate, discover, or terminate misconduct", so the protected population is full
  of people who never contacted a regulator — and the internal case file is exactly where their
  identity is written down. The section does not, in terms, impose confidentiality; what it does is
  make disclosure of the reporter's identity to the business unit under investigation the
  evidentiary bridge between the report and any later adverse action, which is why controlling
  circulation of the file is a litigation-exposure decision and not a housekeeping one.
  Practitioners then tell employees the hotline is anonymous as a matter of law: the
  anonymous-submission requirement for accounting complaints is in section 10A(m)(4) of the
  Securities Exchange Act, not here, and this section protects named reporters rather than
  concealing them. Note the standard in the chapeau — conduct "which the employee reasonably
  believes constitutes a violation" — so a report that proves unfounded is still protected, and an
  investigation memo recording that the allegation failed does not withdraw the protection.
