preemption:
  posture: express_partial
  authority: 31 U.S.C. § 5318(g)(3)(A)
  note: >-
    The safe harbour in (g)(3)(A) immunises the institution against liability under any law or
    regulation of the United States, any constitution, law or regulation of any State, and any
    contract or other legally enforceable agreement, both for the disclosure and for the failure to
    notify its subject. So a state notice duty or a contractual promise to tell the customer cannot
    be enforced against the institution for staying silent here. It is express and partial, not
    field: every other state or federal privacy duty the institution owes survives untouched.
