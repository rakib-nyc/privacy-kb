obligation_type: assess
summary: >-
  An actor withholding electronic health information to prevent harm is within the exception only if
  it holds a reasonable belief that the practice will substantially reduce a risk of harm, and meets
  the scope, determination and harm-type conditions.
requirement_detail: >-
  The preventing-harm exception is the narrower of the two reconciliations, and it is anchored to
  HIPAA rather than free-standing. The actor must hold a reasonable belief that the practice will
  SUBSTANTIALLY REDUCE a risk of harm — belief rather than certainty, but a belief about substantial
  reduction of an identified risk, not a general unease — and paragraph (b) caps the practice at "no
  broader than necessary" to reduce that risk. Paragraph (c) fixes how the risk may be established:
  an individualized determination in the exercise of professional judgment by a licensed health care
  professional with a current or prior clinician-patient relationship, or data known or reasonably
  suspected to be misidentified, mismatched or corrupt. Paragraph (d) then borrows the Privacy
  Rule's own denial grounds — the type of harm must be one that could support denying an individual
  access to PHI under 45 C.F.R. § 164.524(a)(3) — so an actor cannot invent a harm theory HIPAA
  would not accept, and the two rules stay aligned instead of pulling apart. The practical
  consequence is that a blanket clinical hold on every test result until a clinician reviews it
  fails paragraph (b) and paragraph (c)(1) at once, however genuine the worry behind it, because it
  is neither narrow nor individualized.
preemption:
  posture: none
  authority: 45 C.F.R. § 171.103(a); 45 C.F.R. § 171.202(b)
  note: >-
    Part 171 contains no express preemption provision and displaces no State privacy law. It runs in
    the opposite direction from every other instrument here: a State law that REQUIRES withholding
    takes the practice outside the definition of information blocking entirely, because § 171.103(a)
    excepts what is required by law. A State law that merely PERMITS withholding does not, since
    permission is not requirement — and that gap is where actors get caught, because the practice is
    then information blocking unless it fits an exception in full.
enforcement:
  enforcers:
    - hhs_oig
    - cms
  private_right_of_action: false
  penalty:
    structure: >-
      Health IT developers of certified health IT, health information networks and health
      information exchanges face civil money penalties under section 3022 of the Public Health
      Service Act, 42 U.S.C. 300jj-52, which § 171.100(a) names as the authority for this part.
      Health care providers face disincentives instead: subpart E provides that an appropriate
      agency may impose disincentives on a provider OIG determines has committed information
      blocking, and § 171.1001 sets out the CMS disincentives, including loss of meaningful EHR user
      status and removal from the Medicare Shared Savings Program for at least one year.
