verbatim_span: >-
  The actor engaging in the practice must hold a reasonable belief that the practice will
  substantially reduce a risk of harm to a patient or another natural person that would otherwise
  arise from the access, exchange, or use of electronic health information affected by the practice.
  For purposes of this section, “patient” means a natural person who is the subject of the
  electronic health information affected by the practice.
