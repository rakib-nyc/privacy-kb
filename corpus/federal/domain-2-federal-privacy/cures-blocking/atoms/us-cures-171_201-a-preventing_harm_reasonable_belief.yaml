common_errors:
  - >-
    Using preventing-harm for a privacy problem. The subject of this exception is harm to a patient
    or another natural person; an unsatisfied legal precondition belongs in § 171.202(b) and a
    general privacy preference belongs in neither.
  - >-
    Relying on an organisational policy alone where paragraph (c)(1) applies. The professional
    judgment must come from a licensed health care professional with a current or prior
    clinician-patient relationship with the patient whose information is affected.
  - >-
    Requiring an individualized clinician determination in every case. Paragraphs (d)(3) and (d)(4)
    apply regardless of whether the risk is consistent with paragraph (c)(1) or (c)(2), while (d)(1)
    and (d)(2) do require the (c)(1) determination — reading one rule across all four produces both
    false positives and false negatives.
