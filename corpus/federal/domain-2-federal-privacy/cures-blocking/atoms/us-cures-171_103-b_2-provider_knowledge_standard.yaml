obligation_type: prohibit
summary: >-
  A health care provider commits information blocking only where it knows that the practice is
  unreasonable and is likely to interfere with access, exchange or use of electronic health
  information.
requirement_detail: >-
  The knowledge standards are deliberately asymmetric and the asymmetry decides most real cases. A
  provider is reached only where it "knows that such practice is unreasonable and is likely to
  interfere" — actual knowledge, and an unreasonableness element on top — while paragraph (b)(1)
  reaches a developer, network or exchange where it knows OR SHOULD KNOW that the practice is likely
  to interfere, with no unreasonableness element at all. So a provider that withholds on a
  colourable reading of 42 C.F.R. part 2 or of State minor-consent law is unlikely to meet the
  standard even if the reading turns out to be wrong, while a developer that ships a default
  configuration suppressing results is exposed without any intent to block. The two also land
  differently on the enforcement side: OIG determinations against providers route to agency
  disincentives under subpart E, whereas developers, networks and exchanges face civil money
  penalties. Advice that states one standard for all four actor types is wrong for three of them.
preemption:
  posture: none
  authority: 45 C.F.R. § 171.103(a); 45 C.F.R. § 171.202(b)
  note: >-
    Part 171 contains no express preemption provision and displaces no State privacy law. It runs in
    the opposite direction from every other instrument here: a State law that REQUIRES withholding
    takes the practice outside the definition of information blocking entirely, because § 171.103(a)
    excepts what is required by law. A State law that merely PERMITS withholding does not, since
    permission is not requirement — and that gap is where actors get caught, because the practice is
    then information blocking unless it fits an exception in full.
enforcement:
  enforcers:
    - hhs_oig
    - cms
  private_right_of_action: false
  penalty:
    structure: >-
      Health IT developers of certified health IT, health information networks and health
      information exchanges face civil money penalties under section 3022 of the Public Health
      Service Act, 42 U.S.C. 300jj-52, which § 171.100(a) names as the authority for this part.
      Health care providers face disincentives instead: subpart E provides that an appropriate
      agency may impose disincentives on a provider OIG determines has committed information
      blocking, and § 171.1001 sets out the CMS disincentives, including loss of meaningful EHR user
      status and removal from the Medicare Shared Savings Program for at least one year.
    range: null
    note: >-
      The CMP amount is fixed by statute and by 42 C.F.R. part 1003, neither of which is in the
      fetched part; do not state a figure from this record.
  statute_of_limitations: null
