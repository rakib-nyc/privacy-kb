common_errors:
  - >-
    Applying the constructive knowledge standard to providers. Paragraph (b)(1) applies knows or
    should know to developers, networks and exchanges; paragraph (b)(2) requires a provider to know.
  - >-
    Dropping the unreasonableness element. For a provider, knowing that a practice is likely to
    interfere is not enough — the provider must know the practice is unreasonable as well, which is
    why a documented legal basis for withholding matters even when it is later rejected.
  - >-
    Assuming a provider that also develops or operates health IT gets the provider standard for
    everything. The standard follows the capacity in which the actor engaged in the practice, and an
    organisation can be more than one type of actor under § 171.102.
