common_errors:
  - >-
    Invoking the exception without the affirmative steps. Identifying an unsatisfied precondition is
    the beginning of the analysis; the tailoring, the policy or case-by-case documentation and the
    assistance under paragraph (b)(2) are all conditions, and failing one loses the whole exception.
  - >-
    Using the privacy exception where no law imposes a precondition. An internal policy, a
    contractual restriction or a general privacy concern is not a State or Federal legal
    precondition, and a practice resting on one belongs in a different exception or nowhere.
  - >-
    Steering the individual away from consenting. Paragraph (b)(2)(ii) forbids improper
    encouragement or inducement to withhold, so a consent script that emphasises risk in order to
    reduce sharing converts a compliant refusal into information blocking.
