obligation_type: assess
summary: >-
  An actor that declines to fulfil a request because a State or Federal privacy precondition is
  unsatisfied is within the privacy exception only if the practice is tailored and documented and
  the actor helps the individual satisfy the precondition.
requirement_detail: >-
  This is the hinge between the privacy corpus and the duty to share. Where another State or Federal
  law imposes a precondition on access, exchange or use — the part 2 written consent is the paradigm
  case — an actor may decline the request without committing information blocking, but only on
  conditions, and they are conjunctive. The practice must be tailored to the precondition not
  satisfied and applied in a consistent and non-discriminatory manner, and it must either conform to
  written organisational policies specifying the criteria for satisfying the precondition and the
  steps the actor will take, or be documented case by case with the criteria used, those not met,
  and why. Paragraph (b)(2) is the part that surprises people: where the precondition is a consent
  or authorization and the actor holds a defective one, the actor must use reasonable efforts within
  its control to give the individual a conforming form or other assistance, and must not "improperly
  encourage or induce the individual to withhold the consent" — so the lawful response to a part 2
  record request is not silence, it is going and getting the consent. Paragraph (b)(3) handles the
  multi-law case by deeming uniform policies addressed to the more restrictive preconditions
  sufficient, which is what makes a single national consent workflow defensible.
preemption:
  posture: none
  authority: 45 C.F.R. § 171.103(a); 45 C.F.R. § 171.202(b)
  note: >-
    Part 171 contains no express preemption provision and displaces no State privacy law. It runs in
    the opposite direction from every other instrument here: a State law that REQUIRES withholding
    takes the practice outside the definition of information blocking entirely, because § 171.103(a)
    excepts what is required by law. A State law that merely PERMITS withholding does not, since
    permission is not requirement — and that gap is where actors get caught, because the practice is
    then information blocking unless it fits an exception in full.
enforcement:
  enforcers:
    - hhs_oig
    - cms
  private_right_of_action: false
  penalty:
    structure: >-
      Health IT developers of certified health IT, health information networks and health
      information exchanges face civil money penalties under section 3022 of the Public Health
      Service Act, 42 U.S.C. 300jj-52, which § 171.100(a) names as the authority for this part.
      Health care providers face disincentives instead: subpart E provides that an appropriate
      agency may impose disincentives on a provider OIG determines has committed information
      blocking, and § 171.1001 sets out the CMS disincentives, including loss of meaningful EHR user
      status and removal from the Medicare Shared Savings Program for at least one year.
    range: null
