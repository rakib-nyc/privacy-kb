exemptions: []
common_errors:
  - >-
    Assuming an actor outside HIPAA is outside part 171. Section 171.101(a) reaches health care
    providers, health IT developers of certified health IT, health information exchanges and health
    information networks as defined in § 171.102, so a developer that is neither a covered entity
    nor a business associate is squarely inside it.
  - >-
    Treating a privacy rationale as a defence in itself. Unless another law REQUIRES the practice, a
    privacy-motivated refusal is information blocking unless it satisfies every condition of a named
    exception, however sincere the motive.
  - >-
    Collapsing the two knowledge standards in paragraph (b). A health care provider is reached only
    where it knows the practice is unreasonable and likely to interfere; a developer, network or
    exchange is reached where it knows or should know, with no unreasonableness element at all.
