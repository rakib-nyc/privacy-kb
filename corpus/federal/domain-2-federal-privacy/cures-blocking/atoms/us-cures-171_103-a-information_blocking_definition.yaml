obligation_type: prohibit
summary: >-
  A practice that is likely to interfere with access, exchange or use of electronic health
  information is information blocking where the actor has the knowledge the rule specifies, unless
  it is required by law or covered by an exception.
requirement_detail: >-
  Information blocking runs in the opposite direction from every other instrument in this corpus: it
  is a duty to SHARE, and an actor violates it by being too protective. The definition has two limbs
  and both must be met — a practice likely to interfere with access, exchange or use of electronic
  health information, and the actor-specific knowledge standard in paragraph (b) — and the first
  limb is qualified from the outset, "except as required by law or covered by an exception set forth
  in subparts B, C, or D of this part". That qualifier is the whole reconciliation with the privacy
  corpus, and it makes ORDER matter: a practice another law compels, such as the § 2.13(a)
  prohibition on disclosing part 2 records without consent, is not information blocking at all and
  needs no exception, whereas a practice the actor CHOOSES in order to protect privacy is
  information blocking unless it meets every condition of § 171.202 or § 171.201. There is no
  balancing test in between; § 171.200 requires the applicable conditions of an exception to be
  satisfied at all relevant times, so a practice that drifts out of conformance loses the exception
  retroactively for the period of the drift.
preemption:
  posture: none
  authority: 45 C.F.R. § 171.103(a); 45 C.F.R. § 171.202(b)
  note: >-
    Part 171 contains no express preemption provision and displaces no State privacy law. It runs in
    the opposite direction from every other instrument here: a State law that REQUIRES withholding
    takes the practice outside the definition of information blocking entirely, because § 171.103(a)
    excepts what is required by law. A State law that merely PERMITS withholding does not, since
    permission is not requirement — and that gap is where actors get caught, because the practice is
    then information blocking unless it fits an exception in full.
enforcement:
  enforcers:
    - hhs_oig
    - cms
  private_right_of_action: false
  penalty:
    structure: >-
      Health IT developers of certified health IT, health information networks and health
      information exchanges face civil money penalties under section 3022 of the Public Health
      Service Act, 42 U.S.C. 300jj-52, which § 171.100(a) names as the authority for this part.
      Health care providers face disincentives instead: subpart E provides that an appropriate
      agency may impose disincentives on a provider OIG determines has committed information
      blocking, and § 171.1001 sets out the CMS disincentives, including loss of meaningful EHR user
      status and removal from the Medicare Shared Savings Program for at least one year.
    range: null
    note: >-
      The CMP amount is fixed by statute and by 42 C.F.R. part 1003, neither of which is in the
      fetched part; do not state a figure from this record.
  statute_of_limitations: null
