verbatim_span: When implemented for the purpose of reducing the risk of potential exposure to legal
  action for one or more licensed health care professionals, other health care providers, or other
  persons involved in providing or facilitating reproductive health care that is lawful under the
  circumstances in which such health care is provided, the practice must affect only access, exchange,
  or use of specific electronic health information that the actor believes could expose a care provider(s)
  and facilitator(s) to legal action because the information shows, or would carry a substantial risk
  of supporting a reasonable inference, that they provide or facilitate, or have provided or have
  facilitated, reproductive health care.
