common_errors:
  - >-
    Applying the 30-day clock from the date of the BREACH. It runs from DISCOVERY, and (j)(2)
    defines discovery as the first day the event is known to you.
  - >-
    Assuming any security event triggers notice. The 500-consumer threshold is a real floor for the
    FTC duty.
  - >-
    Treating FTC notice as discharging state breach-notification duties. It does not — state
    obligations run in parallel and many have shorter clocks.
open_questions:
  - >-
    The 500-consumer threshold applies to the FTC notice only. It says nothing about state
    notification duties, which have their own and often lower thresholds.
