summary: >-
  On discovering a notification event involving the information of at least 500 consumers, a
  financial institution must notify the FTC as soon as possible and no later than 30 days after
  discovery.
requirement_detail: >-
  Two conditions gate the duty: a notification event as defined at (j)(2), AND at least 500
  consumers' information involved. Below that threshold the rule imposes no FTC notice. Notice is
  electronic, on a form on the FTC's website, and must carry the six contents at (j)(1)(i)-(vi).
preemption:
  posture: floor
  authority: 15 U.S.C. § 6807
  note: >-
    GLBA § 507 preserves more protective state law: a state statute or regulation is preempted only
    to the extent it is INCONSISTENT with the subtitle, and a more protective provision is not
    inconsistent. So state security requirements run in parallel. NY SHIELD's compliance-deemed
    pathway for GLBA-regulated entities is the practical expression of that, and is a Priority 3
    atom.
