summary: >-
  The risk assessment underpinning the information security program must be written, and must
  include stated criteria for evaluating, categorising and mitigating risk.
requirement_detail: >-
  The writing requirement is the operative bite: an unwritten risk assessment does not satisfy §
  314.4(b) however thorough. The three required contents are enumerated at (b)(1)(i)-(iii) —
  evaluation and categorisation criteria, confidentiality/integrity/availability assessment
  criteria, and requirements describing how risks will be mitigated or accepted.
preemption:
  posture: floor
  authority: 15 U.S.C. § 6807
  note: >-
    GLBA § 507 preserves more protective state law: a state statute or regulation is preempted only
    to the extent it is INCONSISTENT with the subtitle, and a more protective provision is not
    inconsistent. So state security requirements run in parallel. NY SHIELD's compliance-deemed
    pathway for GLBA-regulated entities is the practical expression of that, and is a Priority 3
    atom.
