verbatim_span: >-
  You shall develop, implement, and maintain a comprehensive information security program that is
  written in one or more readily accessible parts and contains administrative, technical, and
  physical safeguards that are appropriate to your size and complexity, the nature and scope of your
  activities, and the sensitivity of any customer information at issue. The information security
  program shall include the elements set forth in § 314.4 and shall be reasonably designed to
  achieve the objectives of this part, as set forth in paragraph (b) of this section.
