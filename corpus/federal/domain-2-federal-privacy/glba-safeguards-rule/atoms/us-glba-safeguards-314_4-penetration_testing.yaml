summary: >-
  For information systems, monitoring and testing must include either continuous monitoring, or
  annual penetration testing plus biannual vulnerability assessments.
requirement_detail: >-
  A genuine either/or, and the alternative chosen changes the compliance calendar entirely.
  Continuous monitoring displaces the periodic testing regime; absent it, § 314.4(d)(2)(i)-(ii)
  require annual penetration testing and vulnerability assessments at least every six months.
preemption:
  posture: floor
  authority: 15 U.S.C. § 6807
  note: >-
    GLBA § 507 preserves more protective state law: a state statute or regulation is preempted only
    to the extent it is INCONSISTENT with the subtitle, and a more protective provision is not
    inconsistent. So state security requirements run in parallel. NY SHIELD's compliance-deemed
    pathway for GLBA-regulated entities is the practical expression of that, and is a Priority 3
    atom.
