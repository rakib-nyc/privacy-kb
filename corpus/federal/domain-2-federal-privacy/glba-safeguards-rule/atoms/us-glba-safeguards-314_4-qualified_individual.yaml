summary: >-
  A financial institution must designate a qualified individual responsible for overseeing,
  implementing and enforcing its information security program.
requirement_detail: >-
  A named-accountability requirement. The Qualified Individual may sit at an affiliate or service
  provider, but § 314.4(a)(1)-(3) keep responsibility with the institution: it retains compliance
  responsibility, must designate a senior member of its own personnel to direct and oversee the
  Qualified Individual, and must require the provider to maintain its own program. Delegation of the
  ROLE is permitted; delegation of RESPONSIBILITY is not.
preemption:
  posture: floor
  authority: 15 U.S.C. § 6807
  note: >-
    GLBA § 507 preserves more protective state law: a state statute or regulation is preempted only
    to the extent it is INCONSISTENT with the subtitle, and a more protective provision is not
    inconsistent. So state security requirements run in parallel. NY SHIELD's compliance-deemed
    pathway for GLBA-regulated entities is the practical expression of that, and is a Priority 3
    atom.
