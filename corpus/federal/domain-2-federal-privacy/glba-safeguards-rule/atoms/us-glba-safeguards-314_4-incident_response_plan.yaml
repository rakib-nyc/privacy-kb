common_errors:
  - >-
    Treating the plan as optional for smaller institutions. The § 314.6 exemption is narrow and
    keyed to the number of consumers whose information is maintained.
  - >-
    Confusing the incident response plan (§ 314.4(h)) with the FTC notification duty (§ 314.4(j)).
    They are separate obligations with separate triggers.
