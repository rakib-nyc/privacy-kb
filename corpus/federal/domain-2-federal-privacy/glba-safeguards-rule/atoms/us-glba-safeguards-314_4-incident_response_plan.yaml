summary: >-
  A financial institution must establish a written incident response plan for security events
  materially affecting the confidentiality, integrity or availability of customer information.
requirement_detail: >-
  Written plan required, with seven enumerated contents at (h)(1)-(7): goals, internal response
  processes, roles and decision-making authority, external and internal communications, remediation
  requirements, documentation and reporting, and post-incident evaluation and revision of the plan
  itself.
preemption:
  posture: floor
  authority: 15 U.S.C. § 6807
  note: >-
    GLBA § 507 preserves more protective state law: a state statute or regulation is preempted only
    to the extent it is INCONSISTENT with the subtitle, and a more protective provision is not
    inconsistent. So state security requirements run in parallel. NY SHIELD's compliance-deemed
    pathway for GLBA-regulated entities is the practical expression of that, and is a Priority 3
    atom.
