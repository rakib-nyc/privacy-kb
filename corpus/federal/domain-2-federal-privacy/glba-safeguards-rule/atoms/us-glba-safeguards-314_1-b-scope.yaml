verbatim_span: >-
  This part applies to the handling of customer information by all financial institutions over which
  the Federal Trade Commission (“FTC” or “Commission”) has jurisdiction. Namely, this part applies
  to those “financial institutions” over which the Commission has rulemaking authority pursuant to
  section 501(b) of the Gramm-Leach-Bliley Act. An entity is a “financial institution” if its
  business is engaging in an activity that is financial in nature or incidental to such financial
  activities as described in section 4(k) of the Bank Holding Company Act of 1956, 12 U.S.C.
  1843(k), which incorporates activities enumerated by the Federal Reserve Board in 12 CFR 225.28
  and 225.86. The “financial institutions” subject to the Commission's enforcement authority are
  those that are not otherwise subject to the enforcement authority of another regulator under
  section 505 of the Gramm-Leach-Bliley Act, 15 U.S.C. 6805. More specifically, those entities
  include, but are not limited to, mortgage lenders, “pay day” lenders, finance companies, mortgage
  brokers, account servicers, check cashers, wire transferors, travel agencies operated in
  connection with financial services, collection agencies, credit counselors and other financial
  advisors, tax preparation firms, non-federally insured credit unions, investment advisors that are
  not required to register with the Securities and Exchange Commission, and entities acting as
  finders. They are referred to in this part as “You.” This part applies to all customer information
  in your possession, regardless of whether such information pertains to individuals with whom you
  have a customer relationship, or pertains to the customers of other financial institutions that
  have provided such information to you.
