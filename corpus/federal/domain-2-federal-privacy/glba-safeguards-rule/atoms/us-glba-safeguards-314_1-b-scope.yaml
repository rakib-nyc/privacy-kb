exemptions:
  - id: cfr.16.314.6.under_5000_consumers
    type: size_threshold
    reach: obligation
    scope: >-
      A financial institution maintaining customer information concerning FEWER THAN 5,000 consumers
      is excused from four specific requirements: the written risk assessment (§ 314.4(b)(1)),
      continuous monitoring or annual penetration testing plus biannual vulnerability assessments (§
      314.4(d)(2)), the written incident response plan (§ 314.4(h)), and the annual report to the
      board (§ 314.4(i)). CONSEQUENCE TEST: reach is obligation and the list is exhaustive.
      Everything else in § 314.4 still applies — a qualified individual, access controls,
      encryption, MFA, training, service-provider oversight. An institution reading this as "the
      Safeguards Rule does not apply to small firms" has misread a four-item carve-out as an
      exemption. And the threshold counts CONSUMERS whose information is MAINTAINED, not customers
      or annual transactions, so it moves as data accumulates rather than as the business grows.
    source_citation: 16 C.F.R. § 314.6
    verbatim_span: >-
      Section 314.4(b)(1), (d)(2), (h), and (i) do not apply to financial institutions that maintain
      customer information concerning fewer than five thousand consumers.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.consumers_with_information_maintained < 5000
summary: >-
  The Safeguards Rule applies to the handling of customer information by all financial institutions
  over which the FTC has jurisdiction.
requirement_detail: >-
  SCOPE IS WHERE THE SAFEGUARDS RULE AND THE PRIVACY RULE DIVERGE, and confusing them is the most
  consequential GLBA error in this corpus. 16 C.F.R. part 313 was narrowed by Dodd-Frank to motor
  vehicle dealers; part 314 was NOT. The Safeguards Rule still reaches every financial institution
  under FTC jurisdiction — mortgage brokers, payday lenders, tax preparers, collection agencies,
  investment advisers not SEC-registered, and since 2021 entities engaged in finder activities. So
  an entity can be outside the FTC privacy rule and squarely inside the FTC security rule, and the §
  313.1(b) dealer exclusion says nothing about part 314.
common_errors:
  - >-
    Assuming the Dodd-Frank narrowing of part 313 also narrowed part 314. It did not — the
    Safeguards Rule still reaches every financial institution under FTC jurisdiction.
  - >-
    Reading § 314.6 as a small-business exemption from the rule. It removes FOUR named requirements
    and leaves the rest of § 314.4 in force.
  - >-
    Counting customers or revenue for the 5,000 threshold. It counts consumers whose information is
    MAINTAINED.
