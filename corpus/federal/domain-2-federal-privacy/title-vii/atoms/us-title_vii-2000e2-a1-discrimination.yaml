summary: >-
  It is an unlawful employment practice for an employer to fail or refuse to hire, to discharge, or
  otherwise to discriminate against any individual with respect to compensation, terms, conditions
  or privileges of employment because of that individual's race, color, religion, sex or national
  origin.
requirement_detail: >-
  THIS IS THE STATUTE AN AI HIRING TOOL IS JUDGED UNDER, and at federal level there is no other one.
  Nothing in the paragraph mentions software, a model or a score: the operative words are "to fail
  or refuse to hire" and the five protected bases, so a vendor's ranking engine that filters
  applicants is measured by what it does and not by whether anyone intended a protected
  characteristic to matter. The first error practitioners make is waiting for an AI-specific federal
  statute before running the analysis — the EEOC's guidance on automated employment decision tools
  is agency guidance that interprets this text and adds nothing to it, and it must be cited as
  guidance rather than blended into the statute. The second is treating the vendor as the regulated
  party: the prohibition runs to the employer, and buying a screen from a third party does not move
  the duty. Note the reach beyond hiring — "compensation, terms, conditions, or privileges of
  employment" is where productivity scoring, shift allocation and monitoring of incumbent employees
  land, in the same sentence. The 15-employee coverage threshold is in the definition of employer at
  42 U.S.C. § 2000e(b), which this corpus does not hold, so this atom does not encode it.
