common_errors:
  - >-
    Waiting for an AI statute before analysing an algorithmic screen. A tool that refuses to hire on
    a protected basis is already an unlawful employment practice under this paragraph.
  - >-
    Reading the prohibition as addressed to the tool vendor. It is addressed to the employer;
    procurement does not transfer it.
  - >-
    Confining the paragraph to hiring. It also reaches compensation, terms, conditions, or
    privileges of employment, which is where employee monitoring and scoring sit.
open_questions:
  - >-
    The 15-employee threshold and the definition of employer at 42 U.S.C. § 2000e(b) are not
    extracted, so applicability here is stated for employers generally.
confidence: high
preemption:
  posture: floor
  authority: null
  note: >-
    Title VII's savings clause is 42 U.S.C. § 2000e-7, which has not been extracted; nothing in the
    section quoted here displaces state law, and state fair-employment statutes with lower employee
    thresholds or additional protected classes are the ordinary case. Recorded as floor on that
    basis, pending extraction of § 2000e-7.
