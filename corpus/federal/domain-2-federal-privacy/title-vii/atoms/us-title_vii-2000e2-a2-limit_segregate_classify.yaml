summary: >-
  It is an unlawful employment practice for an employer to limit, segregate or classify employees or
  applicants for employment in any way that would deprive or tend to deprive any individual of
  employment opportunities or otherwise adversely affect their status as an employee, because of
  race, color, religion, sex or national origin.
requirement_detail: >-
  THIS IS THE LIMB AN ALGORITHMIC SCREEN ACTUALLY LANDS ON, and confusing it with (a)(1) changes the
  analysis. Paragraph (a)(1) is about refusing a person; this paragraph is about a practice that
  classifies, and a model that ranks or filters a pool is a classification in the ordinary sense of
  the word. The phrase "deprive or tend to deprive any individual of employment opportunities" is
  doing the work: the tendency of the practice is enough, so exposure exists before any particular
  applicant can be shown to have been rejected, which is the argument for validating a tool before
  deployment rather than auditing it afterwards. Practitioners then misplace the burden — showing
  impact is one thing, and the employer's job-relatedness and business-necessity answer is framed by
  42 U.S.C. § 2000e-2(k), which this corpus does not hold, not by this paragraph. Finally, the words
  about applicants were added in 1972; the paragraph as originally enacted named only employees,
  which is why some older authority reads oddly against the current text.
