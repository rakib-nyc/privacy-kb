common_errors:
  - >-
    Analysing an automated screen only under (a)(1). Refusal to hire is (a)(1); a practice that
    classifies a pool and tends to deprive individuals of opportunities is (a)(2).
  - >-
    Assuming intent must be shown. The paragraph turns on what the practice would do, and the
    disparate-impact framework sits at 42 U.S.C. § 2000e-2(k).
  - >-
    Accepting a vendor's fairness certificate as the defence. The statutory answer to a demonstrated
    impact is job-relatedness and business necessity under § 2000e-2(k), which is not extracted here
    and cannot be confirmed from this atom.
open_questions:
  - >-
    42 U.S.C. § 2000e-2(k), the disparate-impact burden framework added in 1991, is not extracted.
    Any impact analysis run from this atom is incomplete without it.
