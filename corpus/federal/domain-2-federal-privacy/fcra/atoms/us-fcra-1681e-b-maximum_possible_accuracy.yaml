summary: >-
  When preparing a consumer report a consumer reporting agency must follow reasonable procedures to
  assure maximum possible accuracy of the information about the consumer.
requirement_detail: >-
  THE MOST LITIGATED PROVISION IN FCRA. The standard is procedural, not a warranty: the duty is to
  follow REASONABLE PROCEDURES to assure maximum possible accuracy, so an inaccurate report is not
  automatically a violation and an accurate one is not automatically a defence. The pair of
  qualifiers pulls in opposite directions on purpose — "maximum possible" sets the target and
  "reasonable procedures" sets the obligation — and most disputes are about where between them a
  given practice sits.
common_errors:
  - Reading it as strict liability for inaccuracy. The duty attaches to procedures.
  - >-
    Reading "reasonable procedures" as the whole standard. The procedures must be reasonable FOR
    ASSURING MAXIMUM POSSIBLE ACCURACY, which is a higher target than reasonable accuracy.
