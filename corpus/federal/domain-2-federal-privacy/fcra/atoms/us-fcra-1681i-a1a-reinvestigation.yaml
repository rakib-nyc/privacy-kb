    - ftc
    - cfpb
    - state_ag
  private_right_of_action: true
  penalty:
    structure: >-
      Willful noncompliance under § 1681n: actual damages or statutory damages of $100 to $1,000,
      punitive damages, costs and attorney's fees. Negligent noncompliance under § 1681o: actual
      damages, costs and fees.
    range:
      min: 100
      unit: usd_statutory_per_violation
    note: >-
      FCRA is one of the few federal privacy statutes with a real private right of action, which is
      why it generates far more litigation than GLBA or HIPAA. THE PRIVATE RIGHT IS ROLE-DEPENDENT:
      see the furnisher atoms, where § 1681s-2(c) removes private enforcement of subsection (a)
      entirely while leaving subsection (b) privately enforceable.
  statute_of_limitations: >-
    § 1681p: the earlier of two years after the plaintiff discovers the violation or five years
    after it occurs.
