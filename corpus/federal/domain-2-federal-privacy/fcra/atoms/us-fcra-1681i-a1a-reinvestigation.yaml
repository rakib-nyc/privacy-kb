verbatim_span: >-
  Subject to subsection (f) and except as provided in subsection (g), if the completeness or
  accuracy of any item of information contained in a consumer’s file at a consumer reporting agency
  is disputed by the consumer and the consumer notifies the agency directly, or indirectly through a
  reseller, of such dispute, the agency shall, free of charge, conduct a reasonable reinvestigation
  to determine whether the disputed information is inaccurate and record the current status of the
  disputed information, or delete the item from the file in accordance with paragraph (5), before
  the end of the 30-day period beginning on the date on which the agency receives the notice of the
  dispute from the consumer or reseller.
