deadline:
  trigger_event: receipt of the consumer dispute
  duration:
    value: 30
    unit: calendar_days
  computation: >-
    Thirty days from receipt of the dispute, free of charge. EXTENDABLE TO 45 under § 1681i(a)(1)(B)
    if the consumer supplies relevant information during the 30-day period — and the extension is
    switched OFF by § 1681i(a)(1)(C) once the information is found inaccurate or incomplete, or the
    agency determines it cannot be verified. The extension is a ceiling that must be earned by a
    consumer act, never a default allowance.
  tolling:
    - condition: >-
        the consumer reporting agency receives information from the consumer during the 30-day
        period that is relevant to the reinvestigation
      extends_by:
        value: 15
        unit: calendar_days
      unless: >-
        during the 30-day period the information is found inaccurate or incomplete, or the agency
        determines it cannot be verified (§ 1681i(a)(1)(C))
      authority: 15 U.S.C. § 1681i(a)(1)(B)
summary: >-
  On a consumer dispute, a consumer reporting agency must conduct a reasonable reinvestigation free
  of charge and record the current status of, or delete, the disputed information within 30 days.
requirement_detail: >-
  THE OPERATIONAL CORE OF FCRA COMPLIANCE, and a genuinely multi-stage clock. The base period is 30
  days from receipt. § 1681i(a)(1)(B) extends it by up to 15 more IF the consumer supplies relevant
  information inside the first 30 — the extension is earned by the consumer's act, not available on
  request. § 1681i(a)(1)(C) then removes the extension in the very cases where the agency has
  already learned enough: once the item is found inaccurate or incomplete, or is determined
  unverifiable, the agency does not get the extra time. Note the trigger reaches disputes notified
  DIRECTLY or INDIRECTLY THROUGH A RESELLER, so a reseller in the chain does not insulate the
  agency.
common_errors:
  - >-
    Treating 45 days as the deadline. The period is 30; the extension must be EARNED by the consumer
    supplying relevant information inside the 30, and § 1681i(a)(1)(C) takes it away again once the
    item is found inaccurate, incomplete or unverifiable.
  - Charging for the reinvestigation. The subparagraph says "free of charge".
  - >-
    Assuming a dispute routed through a reseller does not count. The text reaches disputes notified
    directly OR indirectly through a reseller.
