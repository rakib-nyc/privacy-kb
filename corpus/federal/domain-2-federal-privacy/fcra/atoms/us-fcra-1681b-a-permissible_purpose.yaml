obligation_type: prohibit
summary: >-
  A consumer reporting agency may furnish a consumer report only in the circumstances enumerated in
  § 1681b(a), and in no others.
requirement_detail: >-
  THE FIRST QUESTION IN ALMOST EVERY FCRA MATTER, and it is a CLOSED LIST. The chapeau says "under
  the following circumstances and no other" — there is no residual reasonableness or
  legitimate-interest route, which is the structural difference between FCRA and every
  consent-or-interest-balancing regime a reader may be importing from elsewhere. The permissible
  purposes cover court orders and grand jury subpoenas, the consumer's own written instructions, and
  the § 1681b(a)(3) list — credit, employment, insurance underwriting, government licensing, and a
  legitimate business need in connection with a consumer-initiated transaction. Permissible purpose
  is assessed at the moment of furnishing and per report, not per relationship.
common_errors:
  - 'Treating permissible purpose as a balancing test. The chapeau forecloses it: "and no other".'
  - >-
    Assuming a business relationship supplies a purpose. § 1681b(a)(3)(F) requires a legitimate
    business need in connection with a transaction INITIATED BY the consumer, or review of an
    account the consumer holds — not a general commercial interest.
  - >-
    Confusing the CRA's duty here with the USER's duty. This subsection binds the agency that
    furnishes; § 1681b(f) separately prohibits a user from obtaining a report without a purpose.
