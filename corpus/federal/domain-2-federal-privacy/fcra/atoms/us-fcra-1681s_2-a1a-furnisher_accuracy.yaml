obligation_type: prohibit
summary: >-
  A furnisher must not report information to a consumer reporting agency that it knows or has
  reasonable cause to believe is inaccurate.
requirement_detail: >-
  THE FURNISHER-SIDE ACCURACY DUTY, and its enforcement is the point. § 1681s-2(c) and (d) remove
  PRIVATE enforcement of subsection (a) entirely: it is enforceable only by the regulators and state
  officials. A consumer harmed by a knowingly inaccurate furnishing has no direct claim under this
  subsection and must route through § 1681s-2(b), which requires a dispute filed with the CRA first.
  That asymmetry inside a single section is the FCRA structure most often stated wrongly, and it
  changes the advice completely.
common_errors:
  - >-
    Telling a consumer they can sue a furnisher for inaccurate reporting under subsection (a). They
    cannot — § 1681s-2(c) bars it. The route is a dispute to the CRA, then subsection (b).
  - >-
    Treating "knows or has reasonable cause to believe" as actual knowledge. Reasonable cause is an
    objective standard and does most of the work.
