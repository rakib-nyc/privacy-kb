deadline:
  trigger_event: determination that the dispute is frivolous or irrelevant
  duration:
    value: 5
    unit: business_days
  computation: >-
    Five BUSINESS days after MAKING the determination — not after receiving the dispute. An agency
    that terminates a reinvestigation on day 28 and notifies on day 40 has met the 30-day
    reinvestigation period and missed this one.
summary: >-
  An agency that determines a dispute is frivolous or irrelevant must notify the consumer of that
  determination within five business days of making it.
requirement_detail: >-
  THE ESCAPE FROM THE REINVESTIGATION DUTY HAS ITS OWN CLOCK, and it runs from a different event. §
  1681i(a)(3)(A) lets an agency terminate a reinvestigation it reasonably determines is frivolous or
  irrelevant — including where the consumer failed to supply enough information to investigate. But
  terminating starts a five-business-day notice obligation measured from the DETERMINATION, so the
  two clocks in this section run from different triggers and can be missed independently.
common_errors:
  - Running the five days from receipt of the dispute. It runs from the DETERMINATION.
  - >-
    Treating termination as the end of the matter. It substitutes one duty for another rather than
    removing both.
