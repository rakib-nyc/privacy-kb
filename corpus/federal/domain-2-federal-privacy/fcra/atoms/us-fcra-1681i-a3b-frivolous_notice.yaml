verbatim_span: >-
  Upon making any determination in accordance with subparagraph (A) that a dispute is frivolous or
  irrelevant, a consumer reporting agency shall notify the consumer of such determination not later
  than 5 business days after making such determination, by mail or, if authorized by the consumer
  for that purpose, by any other means available to the agency.
