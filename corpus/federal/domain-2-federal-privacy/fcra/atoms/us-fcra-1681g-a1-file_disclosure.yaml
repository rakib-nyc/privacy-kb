obligation_type: disclose
summary: >-
  On request and proper identification, a consumer reporting agency must clearly and accurately
  disclose to the consumer all information in the consumer's file at the time of the request.
requirement_detail: >-
  THE FILE-DISCLOSURE RIGHT, and it is the practical entry point to every other FCRA remedy: a
  consumer cannot dispute under § 1681i without first seeing the file, and cannot show a § 1681e(b)
  accuracy failure without knowing what was reported. The word FILE is doing work — it is defined at
  § 1681a(g) as all information on the consumer RETAINED BY the agency and available to be
  furnished, which is broader than the report actually sent to any user. Note the truncation
  carve-out at (a)(1)(A): the consumer may require the first five digits of a social security number
  be withheld, which is a rare instance of a disclosure duty the consumer can narrow.
common_errors:
  - >-
    Equating the file with the report. § 1681a(g) defines the file as what the agency RETAINS and
    could furnish, which is broader than any single report.
  - >-
    Treating it as a standalone right. It is the predicate for the § 1681i dispute process and for
    proving a § 1681e(b) claim.
