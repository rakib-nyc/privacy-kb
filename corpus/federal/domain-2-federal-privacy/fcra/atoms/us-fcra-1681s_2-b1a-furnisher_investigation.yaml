obligation_type: assess
summary: >-
  On receiving notice of a dispute from a consumer reporting agency under § 1681i(a)(2), a furnisher
  must conduct an investigation with respect to the disputed information.
requirement_detail: >-
  THE PRIVATELY ENFORCEABLE FURNISHER DUTY, and the reason the trigger matters so much. It arises
  only on notice FROM A CONSUMER REPORTING AGENCY — a consumer complaining directly to the furnisher
  does not start it. That single fact decides most furnisher cases: a consumer who writes to the
  creditor rather than disputing through the CRA has not triggered the only furnisher obligation
  they can personally enforce. Contrast subsection (a), which imposes a broader accuracy duty that
  no private plaintiff may enforce at all.
common_errors:
  - >-
    THE TRIGGER IS NOTICE FROM THE CRA, NOT FROM THE CONSUMER. § 1681s-2(b) arises only on notice
    under § 1681i(a)(2), so a consumer who writes to the creditor rather than disputing through a
    consumer reporting agency has not triggered the ONLY furnisher duty they can personally enforce.
    This single fact decides most furnisher litigation, and it is the thing consumers and their
    counsel get wrong most often. If this obligation shows as undetermined, the missing fact is the
    CRA dispute notice — it is NOT a finding that the furnisher is outside the statute.
  - >-
    Merging the two furnisher subsections. (a) is broader and not privately enforceable; (b) is
    narrower, trigger-dependent, and is the one a consumer can sue on.
