summary: >-
  Before procuring a consumer report for employment purposes, a clear and conspicuous written
  disclosure must be made to the consumer in a document consisting SOLELY of the disclosure.
requirement_detail: >-
  THE STANDALONE REQUIREMENT IS THE MOST LITIGATED PROVISION IN EMPLOYMENT SCREENING, and the
  operative words are "in a document that consists solely of the disclosure". Burying it in an
  application form, or adding a liability waiver to it, defeats the provision even where the
  disclosure itself is perfectly clear — and that is the usual FCRA class action against employers
  rather than against agencies. § 1681b(b)(2)(A)(ii) then requires separate written authorisation,
  which MAY sit on the same document. So the rule is: nothing else on the disclosure, except the
  authorisation.
common_errors:
  - >-
    Combining the disclosure with an application or a waiver. The document must consist SOLELY of
    the disclosure.
  - >-
    Assuming § 1681m adverse-action notice is the whole employment duty. The pre-adverse-action step
    at § 1681b(b)(3) comes first and is separate.
open_questions: []
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t
  note: >-
    FCRA preempts by enumerated subject. State background-check statutes commonly add duties here,
    and whether they survive is a subject-by-subject question under § 1681t(b).
enforcement:
  enforcers:
