obligation_type: obtain_consent
summary: >-
  Release of an employee's drug or alcohol test information to a third party requires specific
  written consent: a statement signed by the employee agreeing to release a particular piece of
  information to a particular, explicitly identified person or organization at a particular time.
  Blanket releases are prohibited.
requirement_detail: >-
  THIS IS A STRICTER CONSENT STANDARD THAN THE EMPLOYER WOULD OTHERWISE OWE, and it is why part 40
  belongs in a privacy corpus at all. The definition demands "a statement signed by the employee"
  covering "a particular piece of information to a particular, explicitly identified, person or
  organization at a particular time" — three particulars and a signature, which together defeat the
  consent architecture most HR and consortium/third-party-administrator systems actually run. A
  C/TPA membership agreement authorising release to member employers, or an onboarding form
  consenting to release of all test results, is precisely the blanket release the paragraph names,
  and it says such releases "are prohibited under this part" rather than merely ineffective — so the
  defect is not curable by arguing the employee understood what they signed. The general rule this
  paragraph defines a term for is the undesignated opening sentence of § 40.321, which bars a
  service agent or employer in the DOT testing process from releasing individual test results or
  medical information about an employee to third parties without that consent. Practitioners import
  HIPAA habits here and get it wrong twice over: the employment record is outside protected health
  information, so HIPAA is not the governing regime, and a HIPAA authorization is not drafted to
  name a single item, a single recipient and a single time.
