verbatim_span: >-
  “Specific written consent” means a statement signed by the employee that he or she agrees to the
  release of a particular piece of information to a particular, explicitly identified, person or
  organization at a particular time. “Blanket releases,” in which an employee agrees to a release of
  a category of information ( e.g., all test results) or to release information to a category of
  parties ( e.g., other employers who are members of a C/TPA, companies to which the employee may
  apply for employment), are prohibited under this part.
