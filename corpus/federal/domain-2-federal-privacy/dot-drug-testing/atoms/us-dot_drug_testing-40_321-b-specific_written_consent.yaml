common_errors:
  - >-
    Relying on an onboarding or C/TPA blanket consent. A release covering a category of information,
    or a category of recipients, is what this paragraph prohibits.
  - >-
    Substituting a HIPAA authorization. Employment records sit outside protected health information,
    and the authorization form is not built to the three particulars this definition requires.
  - >-
    Treating a blanket release as merely voidable. The paragraph prohibits it outright, so acting on
    one is a violation and not a defect in the consent.
open_questions:
