common_errors:
  - >-
    Reading paragraph (a) alone as the exception. The permission to release without consent is
    conditioned by this paragraph, which limits the recipient and requires a stipulation.
  - >-
    Circulating the file to insurers, opposing counsel or an internal distribution list. The release
    runs to the decisionmaker in the proceeding.
  - >-
    Treating the stipulation as boilerplate the employer signs. It binds the decisionmaker to limit
    onward availability to parties to the proceeding, so it has to be obtained.
