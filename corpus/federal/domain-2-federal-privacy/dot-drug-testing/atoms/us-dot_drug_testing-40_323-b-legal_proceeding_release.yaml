summary: >-
  Where the employer releases test information without the employee's consent in a legal proceeding,
  it may release the information only to the decisionmaker in that proceeding, and only with a
  binding stipulation that the decisionmaker will make it available only to parties to the
  proceeding.
requirement_detail: >-
  THE CONSENT-FREE ROUTE IS NARROWER THAN THE PERMISSION IT SITS UNDER, and that is the point of
  this paragraph. Paragraph (a) allows release without consent in certain legal proceedings; this
  paragraph then confines the release to "the decisionmaker in the proceeding" and conditions it on
  "a binding stipulation that the decisionmaker to whom it is released will make it available only
  to parties to the proceeding". So the employer's own litigation counsel does not become a general
  distribution point, and handing the laboratory data package to opposing counsel or to an insurer
  without the stipulation is outside the permission even where the proceeding plainly qualifies. The
  error practitioners make is reading (a) as a self-contained exception and stopping there — (a) is
  a permission to release and (b) is the condition on which it may be exercised, and the two must be
  quoted together. Note also that the stipulation is placed on the recipient rather than on the
  employer, so obtaining it is an active step in the litigation and not a clause in an internal
  policy.
