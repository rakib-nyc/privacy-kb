verbatim_span: >-
  As an MRO or service agent you must provide, within 10 business days of receiving a written
  request from an employee, copies of any records pertaining to the employee's use of alcohol and/or
  drugs, including records of the employee's DOT-mandated drug and/or alcohol tests. You may charge
  no more than the cost of preparation and reproduction for copies of these records.
