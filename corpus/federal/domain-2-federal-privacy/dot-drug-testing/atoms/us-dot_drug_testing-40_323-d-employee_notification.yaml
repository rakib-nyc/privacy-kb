common_errors:
  - >-
    Assuming no notice is owed because the release did not need consent. The duty attaches to any
    information released under the section, consent or not.
  - >-
    Placing the duty on the employer alone. It is written to the employer or service agent, so a
    laboratory or C/TPA that releases the information owes it too.
  - >-
    Treating service of court papers as the notification. The employee must be told in writing what
    was released.
