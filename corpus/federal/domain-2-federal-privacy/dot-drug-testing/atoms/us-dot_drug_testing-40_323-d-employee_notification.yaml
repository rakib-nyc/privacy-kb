summary: >-
  An employer or service agent that releases test information under § 40.323 must immediately notify
  the employee in writing of any information it released.
requirement_detail: >-
  A DISCLOSURE MADE WITHOUT CONSENT STILL HAS TO BE TOLD TO THE DATA SUBJECT, which is the
  transparency half of subpart P and the half most often missed. The paragraph addresses the
  employer and the service agent alike, so the laboratory or C/TPA that produced the data package
  owes the notice independently of the employer, and both can be in breach over a single release.
  The notice must be in writing and immediate, and it attaches to any information released under the
  section — including the releases paragraph (a) permits without consent, which is exactly when an
  employer assumes no notice is due because the employee has no say. Practitioners also read it as
  satisfied by the litigation itself: service of a pleading on the employee is not a notification by
  the employer of what it released, and the obligation is to state the information released rather
  than the fact that a proceeding is on foot.
deadline: null
no_deadline_stated: >-
  The paragraph requires notification immediately and fixes no period. Nothing in § 40.323 or in the
  rest of subpart P as fetched converts that into a number of days or hours, and no citation note
  attaches a rulemaking gloss to the section. Inventing a figure would be fabrication, so the
  trigger is recorded here and the clock is left uncomputed.
