obligation_type: prohibit
summary: >-
  Unfair or deceptive acts or practices in or affecting commerce are unlawful. This is the general
  federal privacy backstop.
requirement_detail: >-
  THE BACKSTOP THAT NEVER SWITCHES OFF (invariant I6). § 5 has no sector, no data type, no size
  threshold and no notice trigger: it reaches any person, partnership or corporation in or affecting
  commerce, subject only to the § 45(a)(2) carve-outs. In privacy it operates mainly through
  DECEPTION — a material misrepresentation or omission about privacy practices, judged from the
  perspective of a reasonable consumer. Its most important property for this system is that a
  published privacy notice becomes an enforceable commitment through it: the promise is not law, and
  departing from the promise is.
exemptions:
  - id: usc.15.45.a2.jurisdictional_carveouts
    type: entity_level
    reach: instrument
    scope: >-
      § 45(a)(2) removes whole classes of actor from the Commissions reach: banks, savings and loan
      institutions, Federal credit unions, common carriers subject to the Acts to regulate commerce,
      air carriers, and packers and stockyards entities. CONSEQUENCE TEST: this is the ONLY way an
      entity escapes invariant I6s federal half, and it is decisive rather than partial — if the
      entity is inside a carve-out, § 5 does not reach it and its prudential or sectoral regulator
      does instead. It is NOT relief from the conduct standard: a banks deceptive privacy claim is
      still actionable, by the OCC or the CFPB rather than the FTC. The common-carrier carve-out is
      ACTIVITY-SENSITIVE in practice and the hardest of the set — it has been litigated over whether
      it follows the entity or the common-carriage activity, so an entity that is a carrier for some
      services and not others must be assessed on the specific conduct, not the corporate label.
    source_citation: 15 U.S.C. § 45(a)(2)
    verbatim_span: >-
      The Commission is hereby empowered and directed to prevent persons, partnerships, or
      corporations, except banks, savings and loan institutions described in section 57a(f)(3) of
      this title , Federal credit unions described in section 57a(f)(4) of this title , common
      carriers subject to the Acts to regulate commerce, air carriers and foreign air carriers
      subject to part A of subtitle VII of title 49, and persons, partnerships, or corporations
      insofar as they are subject to the Packers and Stockyards Act, 1921, as amended [ 7 U.S.C. 181
      et seq.], except as provided in section 406(b) of said Act [ 7 U.S.C. 227(b) ], from using
      unfair methods of competition in or affecting commerce and unfair or deceptive acts or
      practices in or affecting commerce.
    burden_of_proof: entity
    applies_if:
      any:
        - entity.is_bank == true
        - entity.is_savings_and_loan == true
        - entity.is_federal_credit_union == true
        - entity.is_common_carrier == true
        - entity.is_air_carrier == true
        - entity.is_packers_and_stockyards_entity == true
related: []
common_errors:
  - >-
    Assuming § 5 needs a sectoral hook. It has none; it is what fills the space when no sectoral
    statute applies.
  - >-
    Assuming a private plaintiff can sue under § 5. There is no private right of action — the state
    UDAP statute is the private vehicle, and its elements differ.
  - >-
    Citing FTC v. Wyndham or § 13(b) for monetary relief without noting AMG Capital Management v.
    FTC (2021), which held § 13(b) does not authorise equitable monetary relief.
