common_errors:
- Reporting that a voluntary framework creates no obligation and stopping. The claim of adherence creates
  the obligation, through § 5.
- Attaching the enforceability to the framework record. It belongs to § 5; duplicating it would state
  one proposition N times and let the copies diverge.
open_questions: []
span_truncation_note: Quotes only the DECEPTIVE-PRACTICES limb of § 5(a)(1). The unfair-methods-of-competition
  limb is in the same sentence and is not what a public-commitment theory rests on; us.usc.15.45.a1.deception
  carries the provision whole. Two records applying one sentence must not quote it identically — see gate
  41.
