obligation_type: prohibit
summary: A public claim of adherence to a privacy framework, code or certification scheme is a representation,
  and departing from it materially is deception under § 5.
requirement_detail: 'THE EXPOSURE COMES FROM THE CLAIM, NOT FROM THE FRAMEWORK. A voluntary framework
  binds nobody by itself — a voluntary framework document is addressed to states and member economies
  and offers an organisation nothing to join, so it carries no enforceability pathway of its own. What
  an organisation CAN do is say publicly that it adheres, and that statement is a representation about
  its privacy practices. Materially departing from it is deception. This is why a CBPR-certified organisation
  does not have "no binding obligation": the obligation is not in the scheme, it is here, triggered by
  the certification claim. Modelled once, on § 5, rather than copied onto every framework record where
  the copies would drift.'
exemptions:
- id: usc.15.45.a2.jurisdictional_carveouts
  type: entity_level
  reach: instrument
  scope: '§ 45(a)(2) removes whole classes of actor from the Commissions reach: banks, savings and loan
    institutions, Federal credit unions, common carriers subject to the Acts to regulate commerce, air
    carriers, and packers and stockyards entities. CONSEQUENCE TEST: this is the ONLY way an entity escapes
    invariant I6s federal half, and it is decisive rather than partial — if the entity is inside a carve-out,
    § 5 does not reach it and its prudential or sectoral regulator does instead. It is NOT relief from
    the conduct standard: a banks deceptive privacy claim is still actionable, by the OCC or the CFPB
    rather than the FTC. The common-carrier carve-out is ACTIVITY-SENSITIVE in practice and the hardest
    of the set — it has been litigated over whether it follows the entity or the common-carriage activity,
    so an entity that is a carrier for some services and not others must be assessed on the specific conduct,
    not the corporate label.'
  source_citation: 15 U.S.C. § 45(a)(2)
  verbatim_span: The Commission is hereby empowered and directed to prevent persons, partnerships, or
    corporations, except banks, savings and loan institutions described in section 57a(f)(3) of this title
    , Federal credit unions described in section 57a(f)(4) of this title , common carriers subject to
    the Acts to regulate commerce, air carriers and foreign air carriers subject to part A of subtitle
    VII of title 49, and persons, partnerships, or corporations insofar as they are subject to the Packers
    and Stockyards Act, 1921, as amended [ 7 U.S.C. 181 et seq.], except as provided in section 406(b)
    of said Act [ 7 U.S.C. 227(b) ], from using unfair methods of competition in or affecting commerce
    and unfair or deceptive acts or practices in or affecting commerce.
  burden_of_proof: entity
  applies_if:
    any:
    - entity.is_bank == true
    - entity.is_savings_and_loan == true
    - entity.is_federal_credit_union == true
    - entity.is_common_carrier == true
    - entity.is_air_carrier == true
    - entity.is_packers_and_stockyards_entity == true
