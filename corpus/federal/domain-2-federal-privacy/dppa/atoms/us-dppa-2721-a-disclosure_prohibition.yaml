summary: A State department of motor vehicles, and any officer, employee or contractor, shall not knowingly
  disclose personal information obtained in connection with a motor vehicle record.
requirement_detail: A PROHIBITION ON A GOVERNMENT BODY THAT REACHES PRIVATE RECIPIENTS DOWNSTREAM. § 2721(a)
  binds the DMV, but § 2722 makes it unlawful for ANY person to obtain or disclose the information for
  a purpose not permitted, so a data broker that resurfaces DMV data is reached even though it is not
  a DMV. The permitted-purpose list in § 2721(b) is closed, and the statute was upheld against a Tenth
  Amendment challenge in Reno v. Condon.
