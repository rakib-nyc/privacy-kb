summary: >-
  It is unlawful for ANY person knowingly to obtain or disclose personal information from a motor
  vehicle record for a use not permitted under § 2721(b).
requirement_detail: >-
  THIS IS WHAT MAKES THE DPPA REACH THE PRIVATE SECTOR. § 2721(a) binds the DMV; § 2722(a) binds any
  person, so a data broker, an investigator or a marketer that obtains DMV-sourced data for an
  impermissible use is liable without ever being a government body. § 2724 supplies a private action
  with liquidated damages of $2,500, which is why DPPA litigation targets downstream recipients
  rather than states.
common_errors:
  - Assuming only the DMV is liable. § 2722(a) reaches any person.
  - >-
    Treating lawful acquisition as the end of it. The prohibition is on obtaining OR disclosing for
    an impermissible USE, so a permitted-purpose acquisition followed by an impermissible use is
    still a violation.
