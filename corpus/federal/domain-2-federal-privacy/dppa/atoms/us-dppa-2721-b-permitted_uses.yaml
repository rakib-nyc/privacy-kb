verbatim_span: 'Personal information referred to in subsection (a) shall be disclosed for use in connection
  with matters of motor vehicle or driver safety and theft, motor vehicle emissions, motor vehicle product
  alterations, recalls, or advisories, performance monitoring of motor vehicles and dealers by motor vehicle
  manufacturers, and removal of non-owner records from the original owner records of motor vehicle manufacturers
  to carry out the purposes of titles I and IV of the Anti Car Theft Act of 1992, the Automobile Information
  Disclosure Act ( 15 U.S.C. 1231 et seq.), the Clean Air Act ( 42 U.S.C. 7401 et seq.), and chapters
  301, 305, and 321–331 of title 49, and, subject to subsection (a)(2), may be disclosed as follows:'
