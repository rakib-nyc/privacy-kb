summary: Personal information from a motor vehicle record shall be disclosed for matters of motor vehicle
  and driver safety and theft, emissions, product recalls and related purposes, and may be disclosed for
  the fourteen enumerated permissible uses.
requirement_detail: 'A CLOSED LIST WITH A MANDATORY CORE. The chapeau distinguishes disclosures that SHALL
  be made — safety, theft, emissions, recalls — from the fourteen that MAY be, and the distinction is
  routinely lost. Two of the permissible uses do most of the practical work and most of the litigation:
  (b)(4) for use in connection with civil, criminal or arbitral proceedings, and (b)(12) for bulk marketing,
  which alone requires express consent. Reno v. Condon upheld the scheme against a Tenth Amendment challenge.'
common_errors:
- Treating all fourteen uses as optional. The chapeau makes the safety and theft purposes mandatory.
- Assuming marketing is generally permitted. (b)(12) requires express consent, unlike the others.
