verbatim_span: >-
  An authorized recipient of personal information (except a recipient under subsection (b)(11) or
  (12)) may resell or redisclose the information only for a use permitted under subsection (b) (but
  not for uses under subsection (b)(11) or (12)). An authorized recipient under subsection (b)(11)
  may resell or redisclose personal information for any purpose. An authorized recipient under
  subsection (b)(12) may resell or redisclose personal information pursuant to subsection (b)(12).
  Any authorized recipient (except a recipient under subsection (b)(11)) that resells or rediscloses
  personal information covered by this chapter must keep for a period of 5 years records identifying
  each person or entity that receives information and the permitted purpose for which the
  information will be used and must make such records available to the motor vehicle department upon
  request.
