common_errors:
  - >-
    Assuming every in-scope creditor owes a programme. The duty attaches only to one that offers or
    maintains covered accounts; without them, only the § 681.1(c) determination is owed.
  - >-
    Treating appendix A as mandatory content. § 681.1(f) requires the guidelines to be CONSIDERED
    and the appropriate ones included, so wholesale adoption and wholesale omission are both
    unreasoned.
  - >-
    Stopping at adoption. The paragraph requires the programme to be developed and implemented, and
    § 681.1(e) adds board or senior-management approval, training and service-provider oversight as
    continuing administration.
open_questions:
  - >-
    effective_from is the publication date in § 681.1's own eCFR source note ("[74 FR 22645, May 14,
    2009, as amended at 77 FR 72715, Dec. 6, 2012]"), which is when the section as quoted was
    published in its current place. The part-level source note is earlier — "72 FR 63771, Nov. 9,
    2007" — so an identity-theft programme duty existed before this date in a differently numbered
    provision, and a query as of a date in 2008 will not reach this atom. Both are Federal Register
    PUBLICATION dates, not stated effective or mandatory-compliance dates; the source does not give
    those.
