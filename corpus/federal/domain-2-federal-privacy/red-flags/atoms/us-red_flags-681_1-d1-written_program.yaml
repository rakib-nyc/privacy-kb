summary: >-
  A financial institution or creditor that offers or maintains one or more covered accounts must
  develop and implement a written Identity Theft Prevention Program designed to detect, prevent and
  mitigate identity theft in connection with the opening of a covered account or any existing
  covered account.
requirement_detail: >-
  THE PROGRAMME DUTY, and its trigger is the covered account rather than the entity type: an
  in-scope creditor with no covered account owes the § 681.1(c) determination and no programme.
  Three features of the text carry the analysis. It must be WRITTEN, so an undocumented practice
  does not comply. It must be both developed AND IMPLEMENTED, which is where enforcement lands — a
  binder adopted and never run is the characteristic failure. And it is expressly calibrated:
  appropriate to the size and complexity of the institution and the nature and scope of its
  activities, which is what makes a one-page programme adequate for a small creditor and inadequate
  for a large one. The programme's contents are set out in (d)(2), its governance — board approval,
  senior-management involvement, staff training and oversight of service providers — in (e), and (f)
  requires the entity to consider the appendix A guidelines and include those that are appropriate,
  which makes the appendix an input to be reasoned about rather than a checklist to be adopted.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t
  note: >-
    This part implements FCRA § 615(e) (15 U.S.C. 1681m(e)) and sits inside the FCRA framework, so
    the express and partial preemption map of § 1681t governs whether a given state identity-theft
    requirement survives. Not resolved on this atom — see the FCRA preemption instrument.
enforcement:
  enforcers:
    - ftc
    - state_ag
  private_right_of_action: false
  penalty:
    structure: FCRA administrative enforcement (15 U.S.C. 1681s) by the FTC
    range: null
    note: >-
      The part states no penalty figure. § 681.1(a) fixes the enforcement channel by defining the
      covered population as those subject to FTC administrative enforcement of the FCRA under 15
      U.S.C. 1681s(a)(1); banks, credit unions and other institutions answer to their own
      regulators' parallel rules instead.
