verbatim_span: >-
  Each financial institution or creditor that offers or maintains one or more covered accounts must
  develop and implement a written Identity Theft Prevention Program (Program) that is designed to
  detect, prevent, and mitigate identity theft in connection with the opening of a covered account
  or any existing covered account. The Program must be appropriate to the size and complexity of the
  financial institution or creditor and the nature and scope of its activities.
