summary: >-
  16 C.F.R. § 681.1 applies to financial institutions and creditors that are subject to
  administrative enforcement of the FCRA by the Federal Trade Commission under 15 U.S.C.
  1681s(a)(1).
requirement_detail: >-
  WHO OWES THE PROGRAMME IS THE LIVE QUESTION, and this sentence answers half of it. Coverage is
  drawn by ENFORCEMENT CHANNEL, not by industry: a person is inside this part only if the FTC
  administratively enforces the FCRA against it, which is why a bank or federal credit union —
  supervised by a banking agency — complies with that agency's parallel red flags rule and not with
  16 C.F.R. part 681. "Creditor" is not left at large either: § 681.1(b)(5) takes it from 15 U.S.C.
  1681m(e)(4), the definition Congress narrowed by the Red Flag Program Clarification Act of 2010
  after the FTC read the earlier text to sweep in doctors, lawyers and other professionals who bill
  after service. The second half of the question is in § 681.1(c) and (d)(1): being a financial
  institution or creditor is necessary but not sufficient, because the written programme is owed
  only by one that offers or maintains COVERED ACCOUNTS. An entity that is in scope here and holds
  no covered account owes the periodic determination in (c) and nothing further.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t
  note: >-
    This part implements FCRA § 615(e) (15 U.S.C. 1681m(e)) and sits inside the FCRA framework, so
    the express and partial preemption map of § 1681t governs whether a given state identity-theft
    requirement survives. Not resolved on this atom — see the FCRA preemption instrument.
enforcement:
  enforcers:
    - ftc
    - state_ag
  private_right_of_action: false
  penalty:
    structure: FCRA administrative enforcement (15 U.S.C. 1681s) by the FTC
    range: null
    note: >-
      The part states no penalty figure. § 681.1(a) fixes the enforcement channel by defining the
      covered population as those subject to FTC administrative enforcement of the FCRA under 15
      U.S.C. 1681s(a)(1); banks, credit unions and other institutions answer to their own
      regulators' parallel rules instead.
  statute_of_limitations: null
