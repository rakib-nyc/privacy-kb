common_errors:
  - >-
    Reading "creditor" at large. § 681.1(b)(5) imports 15 U.S.C. 1681m(e)(4), which excludes a
    person who advances funds only for expenses incidental to a service that person provides — the
    point of the 2010 clarification after the FTC's broader reading.
  - >-
    Applying this part to banks and credit unions. They are outside FTC administrative enforcement
    of the FCRA and owe the materially identical rule issued by their own prudential regulator
    instead.
  - >-
    Treating scope as the whole test. Coverage under (a) plus covered accounts under (b)(3) is what
    triggers the written programme; scope alone triggers only the (c) determination.
open_questions:
  - >-
    effective_from is the publication date in § 681.1's own eCFR source note ("[74 FR 22645, May 14,
    2009, as amended at 77 FR 72715, Dec. 6, 2012]"), which is when the section as quoted was
    published in its current place. The part-level source note is earlier — "72 FR 63771, Nov. 9,
    2007" — so an identity-theft programme duty existed before this date in a differently numbered
    provision, and a query as of a date in 2008 will not reach this atom. Both are Federal Register
    PUBLICATION dates, not stated effective or mandatory-compliance dates; the source does not give
    those.
