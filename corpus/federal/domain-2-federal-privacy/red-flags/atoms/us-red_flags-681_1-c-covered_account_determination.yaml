common_errors:
  - >-
    Skipping the determination once the answer is "no covered accounts". The duty to determine is
    owed by every entity in scope and is periodic, so the conclusion has to be revisited and
    evidenced.
  - >-
    Reading covered accounts as consumer accounts only. § 681.1(b)(3)(ii) reaches ANY account with a
    reasonably foreseeable identity-theft risk, including business accounts, and the risk assessment
    in (c) exists for that limb.
  - >-
    Treating the three listed factors as the whole assessment. The text says the determination is
    made "taking into consideration" them, which is a minimum rather than a checklist.
open_questions:
  - >-
    effective_from is the publication date in § 681.1's own eCFR source note ("[74 FR 22645, May 14,
    2009, as amended at 77 FR 72715, Dec. 6, 2012]"), which is when the section as quoted was
    published in its current place. The part-level source note is earlier — "72 FR 63771, Nov. 9,
    2007" — so an identity-theft programme duty existed before this date in a differently numbered
    provision, and a query as of a date in 2008 will not reach this atom. Both are Federal Register
    PUBLICATION dates, not stated effective or mandatory-compliance dates; the source does not give
    those.
