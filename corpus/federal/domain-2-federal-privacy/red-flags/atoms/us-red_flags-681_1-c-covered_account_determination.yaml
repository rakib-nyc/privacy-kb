summary: >-
  Every financial institution or creditor in scope must periodically determine whether it offers or
  maintains covered accounts, and must reach that determination for § 681.1(b)(3)(ii) accounts
  through a risk assessment considering how its accounts are opened, how they are accessed, and its
  previous experiences with identity theft.
requirement_detail: >-
  THIS DUTY IS OWED BY EVERY ENTITY IN SCOPE, including one that concludes it has no covered
  accounts, and it is the step most often skipped because it produces no programme. Two things
  follow from the text. It is PERIODIC, so a single determination made when the rule was new has
  expired; and the risk assessment is required specifically for the (b)(3)(ii) limb — any other
  account carrying a reasonably foreseeable risk of identity theft — because the (b)(3)(i) limb,
  consumer accounts permitting multiple payments or transactions, is definitional and needs no risk
  judgement. The three enumerated factors are the floor of that assessment, not the whole of it: the
  paragraph says "taking into consideration". The practical consequence is that a
  business-account-only creditor is not automatically outside the rule, since (b)(3)(ii) is not
  limited to personal, family or household accounts.
preemption:
  posture: express_partial
  authority: 15 U.S.C. § 1681t
  note: >-
    This part implements FCRA § 615(e) (15 U.S.C. 1681m(e)) and sits inside the FCRA framework, so
    the express and partial preemption map of § 1681t governs whether a given state identity-theft
    requirement survives. Not resolved on this atom — see the FCRA preemption instrument.
enforcement:
  enforcers:
    - ftc
    - state_ag
  private_right_of_action: false
  penalty:
    structure: FCRA administrative enforcement (15 U.S.C. 1681s) by the FTC
    range: null
    note: >-
      The part states no penalty figure. § 681.1(a) fixes the enforcement channel by defining the
      covered population as those subject to FTC administrative enforcement of the FCRA under 15
      U.S.C. 1681s(a)(1); banks, credit unions and other institutions answer to their own
      regulators' parallel rules instead.
  statute_of_limitations: null
