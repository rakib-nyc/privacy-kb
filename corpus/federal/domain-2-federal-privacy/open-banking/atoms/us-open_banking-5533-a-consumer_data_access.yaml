common_errors:
  - >-
    Saying that § 5533 requires a covered person to share data with third-party aggregators. The
    text gives the CONSUMER a right to be given information; whether a consumer-authorised third
    party stands in the consumer's shoes is set by the Bureau's rules under this section, not by the
    statute.
  - >-
    Treating it as a retention or record-keeping duty. Subsection (c) says the opposite — nothing in
    the section imposes a duty to maintain or keep information about a consumer.
  - >-
    Assuming fraud and AML records are in scope. (b)(2) removes "any information collected by the
    covered person for the purpose of preventing fraud or money laundering", which is often exactly
    the material a consumer wants when contesting a closed or frozen account.
open_questions:
  - >-
    THE IMPLEMENTING RULE IS NOT RECORDED HERE. This atom models the STATUTE only. The Bureau's rule
    under this section has been in flux, and its content, its legal status and its compliance dates
    were not fetched, hashed or verified in this pass. Any question about what a covered person must
    actually build, or about third-party access, must be treated as UNANSWERED rather than answered
    from this atom — and nothing here should be read as a statement about that rule's status.
  - >-
    Whether "covered person" here carries the same reach as in 12 U.S.C. § 5531 is not established
    by this section's own text; the definition sits elsewhere in Title X and is not extracted.
