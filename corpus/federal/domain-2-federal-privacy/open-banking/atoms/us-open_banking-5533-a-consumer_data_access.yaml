summary: >-
  Subject to Bureau rules, a covered person must make available to a consumer on request, in an
  electronic form usable by consumers, the information it holds concerning the consumer financial
  product or service that consumer obtained from it.
requirement_detail: >-
  THE STATUTORY BASIS FOR US OPEN BANKING, AND IT IS NARROWER THAN THE LABEL. The section never uses
  the phrase: what it grants is a right, running only against the covered person the consumer
  actually dealt with, to be given "information in the control or possession of the covered person
  concerning the consumer financial product or service that the consumer obtained from such covered
  person", on request and "in an electronic form usable by consumers". The right is expressly
  Subject to rules prescribed by the Bureau, so the text alone does not tell a covered person what
  to build; (d) separately directs the Bureau to prescribe standards promoting standardized,
  machine-readable formats. Four carve-outs in (b) narrow it, and (c) is the structural limit that
  matters most — the section imposes no duty to maintain or keep any information about a consumer,
  so the right reaches only what the covered person happens to hold. That makes this an ACCESS
  right, not a retention, portability or third-party-sharing mandate: any duty to transmit data to
  an aggregator or a competitor on the consumer's instruction rests on the Bureau's rules under this
  section, not on this text.
exemptions:
  - id: usc.12.5533.b1.confidential_commercial_information
    type: data_level
    scope: >-
      A covered person may not be required to make available any confidential commercial
      information, and the text names the paradigm case: an algorithm used to derive credit scores
      or other risk scores or predictors. This is the carve-out that defeats the most common request
      in practice — a consumer asking why a decision went against them gets the inputs the covered
      person holds, never the model.
    source_citation: 12 U.S.C. § 5533(b)(1)
    verbatim_span: >-
      any confidential commercial information, including an algorithm used to derive credit scores
      or other risk scores or predictors;
    burden_of_proof: entity
    applies_if:
      any:
        - data.is_confidential_commercial_information == true
        - data.is_scoring_algorithm == true
  - id: usc.12.5533.b2.fraud_and_aml_information
    type: data_level
    scope: >-
      Information collected to prevent fraud or money laundering, or to detect or report unlawful or
      potentially unlawful conduct, is outside the right. This is where § 5533 and 31 U.S.C. §
      5318(g) meet: the BSA bars telling the customer a suspicious activity report exists, and this
      paragraph makes sure the access right cannot be used to extract the same fact by another
      route.
    source_citation: 12 U.S.C. § 5533(b)(2)
    verbatim_span: >-
      any information collected by the covered person for the purpose of preventing fraud or money
      laundering, or detecting, or making any report regarding other unlawful or potentially
      unlawful conduct;
    burden_of_proof: entity
    applies_if:
      any:
        - data.collected_for_fraud_prevention == true
        - data.collected_for_aml_purpose == true
  - id: usc.12.5533.b3.confidential_under_other_law
    type: data_level
    scope: >-
      Information any other provision of law requires to be kept confidential is outside the right.
      This is a conflict-resolution rule rather than a policy choice: it makes the access right
      yield to every confidentiality regime elsewhere in this corpus rather than forcing the covered
      person to choose which statute to break.
    source_citation: 12 U.S.C. § 5533(b)(3)
    verbatim_span: any information required to be kept confidential by any other provision of law; or
    burden_of_proof: entity
    applies_if:
      all:
        - data.confidential_under_other_law == true
  - id: usc.12.5533.b4.not_retrievable_in_ordinary_course
    type: data_level
    scope: >-
      Information the covered person cannot retrieve in the ordinary course of its business with
      respect to that information is outside the right. Read with (c), which imposes no duty to
      maintain records, this sets the ceiling on the whole section: the consumer gets what the
      covered person can already reach, and neither building new retrieval capability nor retaining
      data longer is required by the text.
    source_citation: 12 U.S.C. § 5533(b)(4)
    verbatim_span: >-
      any information that the covered person cannot retrieve in the ordinary course of its business
      with respect to that information.
    burden_of_proof: entity
    applies_if:
      all:
        - data.retrievable_in_ordinary_course == false
