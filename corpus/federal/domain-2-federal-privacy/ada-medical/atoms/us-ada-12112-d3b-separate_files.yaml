summary: Information obtained about the medical condition or history of an applicant must be collected
  and maintained on separate forms and in separate medical files, and treated as a confidential medical
  record.
requirement_detail: 'THE PROVISION THAT GOVERNS WHAT HIPAA''S EMPLOYMENT-RECORDS EXCLUSION LEAVES OUT,
  and it is a storage requirement rather than a use restriction — separate forms, separate files. A health
  system that concludes its HR medical files are "not PHI" and therefore need no special handling has
  identified the right fact and drawn the wrong conclusion: 45 C.F.R. § 160.103 excludes them from HIPAA
  and § 12112(d)(3)(B) requires exactly this of them. The two provisions should always be read as a pair.'
common_errors:
- Concluding that non-PHI employee medical data needs no special handling. This requires separate files
  and confidential treatment.
- Applying it only to applicants. § 12112(d)(4)(B) extends the same treatment to employees.
