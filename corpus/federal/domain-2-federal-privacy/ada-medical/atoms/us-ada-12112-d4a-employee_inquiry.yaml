summary: >-
  A covered entity shall not require a medical examination or make inquiries as to whether an
  employee has a disability, or its nature or severity, unless job-related and consistent with
  business necessity.
requirement_detail: >-
  THE ADA REGULATES MEDICAL INFORMATION AS AN EMPLOYMENT PRACTICE, and it fills exactly the gap the
  HIPAA employment-records exclusion opens. A hospital's HR file on its own nurse is not PHI under
  45 C.F.R. § 160.103, and it IS governed here: § 12112(d)(3)(B) requires it be kept on separate
  forms in separate files and treated as a confidential medical record. Reading "not PHI" as "not
  regulated" misses this, and the two provisions should be read as a pair.
