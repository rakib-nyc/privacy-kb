summary: >-
  Informed consent must include a statement describing the extent, if any, to which confidentiality
  of records identifying the subject will be maintained.
requirement_detail: >-
  THIS IS THE PRIVACY NOTICE INSIDE THE CONSENT FORM, and its drafting is more honest than most
  privacy notices because of two words. The element is a statement describing the extent "to which
  confidentiality of records identifying the subject" will be kept — and the phrase if any is in the
  regulation, which contemplates research where confidentiality is NOT maintained and requires that
  to be said rather than glossed. A form promising confidentiality without qualification is
  therefore the defect to look for, since federal audit rights, mandatory reporting duties and
  sponsor access almost always qualify it in fact. The element is drafted at the level of records
  identifying the subject, so de-identification plans, retention periods and who may re-identify
  belong here. Because § 46.116(f)(2) lets an IRB omit or alter elements in paragraph (b) but never
  the general requirements in paragraph (a), this element is waivable in a way the consent
  requirement itself is not — a distinction worth holding onto when reviewing an IRB determination.
