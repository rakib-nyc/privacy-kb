common_errors:
  - >-
    Promising confidentiality without limits. The element asks for the extent, if any, to which it
    will be maintained, and audit, reporting and sponsor access usually limit it.
  - >-
    Treating this element as unwaivable. Section 46.116(f)(2) allows an IRB to omit or alter
    elements in paragraph (b); it may not alter the paragraph (a) requirements.
  - >-
    Substituting the HIPAA authorization's confidentiality language. The two documents have
    different required contents and one does not satisfy the other.
open_questions: []
confidence: high
preemption:
  posture: floor
  authority: 45 C.F.R. § 46.101(f)
  note: >-
    Section 46.101(f) states that the policy does not affect state or local laws or regulations,
    including tribal law, that provide additional protections for human subjects, and 46.101(e)
    requires compliance with more protective federal law. The Common Rule is therefore a floor in
    both directions, which is why a HIPAA authorisation and an IRB-approved consent are cumulative
    rather than alternative.
enforcement:
  enforcers:
    - hhs_ohrp
    - federal_agencies
  private_right_of_action: false
  penalty:
    structure: >-
      Administrative, through the funding relationship. The federal department or agency conducting
      or supporting the research enforces against the institution's assurance; for HHS-supported
      research this is the Office for Human Research Protections, whose sanctions run from a
      determination letter and corrective action plan to restriction or withdrawal of the assurance,
      which stops federally supported research at the institution.
    range: null
    note: >-
      NO PRIVATE RIGHT OF ACTION under the Common Rule. A subject's own remedy is a state-law claim
      in negligence or battery, or a state research-consent statute preserved by § 46.101(f); the
      regulation supplies the standard of care rather than the cause of action.
  statute_of_limitations: null
