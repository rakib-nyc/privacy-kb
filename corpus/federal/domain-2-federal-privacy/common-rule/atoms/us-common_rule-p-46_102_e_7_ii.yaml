verbatim_span: >-
  Upon consultation with appropriate experts, assess whether there are analytic technologies or
  techniques that should be considered by investigators to generate “identifiable private
  information,” as defined in paragraph (e)(5) of this section, or an “identifiable biospecimen,” as
  defined in paragraph (e)(6) of this section. This assessment shall take place within 1 year and
  regularly thereafter (at least every 4 years). This process will be conducted by collaboration
  among the Federal departments and agencies implementing this policy. Any such technologies or
  techniques will be included on a list of technologies or techniques that produce identifiable
  private information or identifiable biospecimens. This list will be published in the Federal
  Register after notice and an opportunity for public comment. The Secretary, HHS, shall maintain
  the list on a publicly accessible Web site.
