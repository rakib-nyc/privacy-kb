verbatim_span: In addition to the determinations required under other applicable sections of this
  subpart, the IRB shall determine, in accordance with and to the extent that consent is required
  by § 46.116 of the pre-2018 Requirements or the 2018 Requirements, as applicable, that adequate
  provisions are made for soliciting the permission of each child's parents or guardian. Where parental
  permission is to be obtained, the IRB may find that the permission of one parent is sufficient for
  research to be conducted under § 46.404 or § 46.405. Where research is covered by §§ 46.406 and
  46.407 and permission is to be obtained from parents, both parents must give their permission unless
  one parent is deceased, unknown, incompetent, or not reasonably available, or when only one parent
  has legal responsibility for the care and custody of the child.
