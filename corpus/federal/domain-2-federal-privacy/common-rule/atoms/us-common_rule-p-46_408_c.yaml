verbatim_span: In addition to the provisions for waiver contained in § 46.116 of the pre-2018 Requirements
  or the 2018 Requirements, as applicable, if the IRB determines that a research protocol is designed
  for conditions or for a subject population for which parental or guardian permission is not a reasonable
  requirement to protect the subjects (for example, neglected or abused children), it may waive the
  consent requirements in § 46.116 of the pre-2018 Requirements or 2018 Requirements, as applicable,
  and paragraph (b) of this section, provided an appropriate mechanism for protecting the children
  who will participate as subjects in the research is substituted, and provided further that the waiver
  is not inconsistent with Federal, State, or local law. The choice of an appropriate mechanism would
  depend upon the nature and purpose of the activities described in the protocol, the risk and anticipated
  benefit to the research subjects, and their age, maturity, status, and condition.
