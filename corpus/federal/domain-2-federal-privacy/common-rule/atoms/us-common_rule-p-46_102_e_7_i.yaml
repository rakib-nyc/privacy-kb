verbatim_span: >-
  Upon consultation with appropriate experts (including experts in data matching and
  re-identification), reexamine the meaning of “identifiable private information,” as defined in
  paragraph (e)(5) of this section, and “identifiable biospecimen,” as defined in paragraph (e)(6)
  of this section. This reexamination shall take place within 1 year and regularly thereafter (at
  least every 4 years). This process will be conducted by collaboration among the Federal
  departments and agencies implementing this policy. If appropriate and permitted by law, such
  Federal departments and agencies may alter the interpretation of these terms, including through
  the use of guidance.
