verbatim_span: >-
  If the research is approved under paragraph (a) of this section, the IRB shall require appointment
  of an advocate for each child who is a ward, in addition to any other individual acting on behalf
  of the child as guardian or in loco parentis. One individual may serve as advocate for more than
  one child. The advocate shall be an individual who has the background and experience to act in,
  and agrees to act in, the best interests of the child for the duration of the child's
  participation in the research and who is not associated in any way (except in the role as advocate
  or member of the IRB) with the research, the investigator(s), or the guardian organization.
