verbatim_span: >-
  Unless otherwise required by law, department or agency heads may waive the applicability of some
  or all of the provisions of this policy to specific research activities or classes of research
  activities otherwise covered by this policy, provided the alternative procedures to be followed
  are consistent with the principles of the Belmont Report. 63 Except when otherwise required by
  statute or Executive Order, the department or agency head shall forward advance notices of these
  actions to the Office for Human Research Protections, Department of Health and Human Services
  (HHS), or any successor office, or to the equivalent office within the appropriate Federal
  department or agency, and shall also publish them in the Federal Register or in such other manner
  as provided in department or agency procedures. The waiver notice must include a statement that
  identifies the conditions under which the waiver will be applied and a justification as to why the
  waiver is appropriate for the research, including how the decision is consistent with the
  principles of the Belmont Report.
