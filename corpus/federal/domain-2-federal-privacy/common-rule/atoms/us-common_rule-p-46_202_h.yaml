verbatim_span: as it pertains to the neonate, means being able, after delivery, to survive (given
  the benefit of available medical therapy) to the point of independently maintaining heartbeat and
  respiration. The Secretary may from time to time, taking into account medical advances, publish
  in the Federal Register guidelines to assist in determining whether a neonate is viable for purposes
  of this subpart. If a neonate is viable then it may be included in research only to the extent permitted
  and in accordance with the requirements of the pre-2018 Requirements or the 2018 Requirements, as
  applicable, and subpart D of this part.
