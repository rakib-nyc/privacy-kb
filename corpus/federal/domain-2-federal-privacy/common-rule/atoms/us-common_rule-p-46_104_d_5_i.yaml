    verbatim_span: >-
      Except as described in paragraph (a) of this section, the following categories of human
      subjects research are exempt from this policy:
    path:
      - d
    citation: 45 C.F.R. § 46.104(d)
  - position: precedes
    relation: scopes
    verbatim_span: >-
      Research and demonstration projects that are conducted or supported by a Federal department or
      agency, or otherwise subject to the approval of department or agency heads (or the approval of
      the heads of bureaus or other subordinate agencies that have been delegated authority to
      conduct the research and demonstration projects), and that are designed to study, evaluate,
      improve, or otherwise examine public benefit or service programs, including procedures for
      obtaining benefits or services under those programs, possible changes in or alternatives to
      those programs or procedures, or possible changes in methods or levels of payment for benefits
      or services under those programs. Such projects include, but are not limited to, internal
      studies by Federal employees, and studies under contracts or consulting arrangements,
      cooperative agreements, or grants. Exempt projects also include waivers of otherwise mandatory
      requirements using authorities such as sections 1115 and 1115A of the Social Security Act, as
      amended.
