verbatim_span: >-
  Certain types of applications for grants, cooperative agreements, or contracts are submitted to
  Federal departments or agencies with the knowledge that subjects may be involved within the period
  of support, but definite plans would not normally be set forth in the application or proposal.
  These include activities such as institutional type grants when selection of specific projects is
  the institution's responsibility; research training grants in which the activities involving
  subjects remain to be selected; and projects in which human subjects' involvement will depend upon
  completion of instruments, prior animal studies, or purification of compounds. Except for research
  waived under § 46.101(i) or exempted under § 46.104, no human subjects may be involved in any
  project supported by these awards until the project has been reviewed and approved by the IRB, as
  provided in this policy, and certification submitted, by the institution, to the Federal
  department or agency component supporting the research.
