summary: >-
  An IRB may approve research only if it determines that, when appropriate, there are adequate
  provisions to protect the privacy of subjects and to maintain the confidentiality of data.
requirement_detail: >-
  PRIVACY IS AN APPROVAL CRITERION, WHICH MAKES THE IRB A PRIVACY REGULATOR. The chapeau of §
  46.111(a) requires the IRB to determine that ALL of the listed requirements are satisfied before
  it may approve, so a protocol with weak data handling is not merely criticised — it cannot
  lawfully be approved. The criterion draws a distinction practitioners collapse: privacy OF
  SUBJECTS is about the circumstances of the interaction, such as where an interview happens and who
  can overhear it, while confidentiality OF DATA is about what happens to the records afterwards. A
  protocol that encrypts its database and recruits subjects in an open ward has satisfied the second
  and failed the first. Two qualifiers do real work. When appropriate concedes that some research
  raises no privacy question at all, so this is not a universal encryption mandate. And adequate is
  not defined here: § 46.111(a)(7)(i) commits the Secretary of HHS to issue guidance on what counts
  as adequate, which under invariant I7 is guidance and not regulation — the binding text is the
  sentence in (a)(7) itself.
