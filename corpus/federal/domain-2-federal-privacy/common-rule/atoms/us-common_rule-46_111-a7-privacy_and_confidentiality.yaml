common_errors:
  - >-
    Treating privacy and confidentiality as one criterion. Privacy concerns the interaction with the
    subject; confidentiality concerns the records, and the provision requires both.
  - >-
    Reading the criterion as advisory. The chapeau requires the IRB to determine that all the listed
    requirements are satisfied in order to approve, so this is a condition of approval.
  - >-
    Citing HHS guidance under (a)(7)(i) as the standard. Guidance assists the IRB; the binding
    requirement is the sentence in (a)(7).
open_questions: []
