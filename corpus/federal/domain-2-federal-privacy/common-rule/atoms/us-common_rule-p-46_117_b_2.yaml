verbatim_span: >-
  A short form written informed consent form stating that the elements of informed consent required
  by § 46.116 have been presented orally to the subject or the subject's legally authorized
  representative, and that the key information required by § 46.116(a)(5)(i) was presented first to
  the subject, before other information, if any, was provided. The IRB shall approve a written
  summary of what is to be said to the subject or the legally authorized representative. When this
  method is used, there shall be a witness to the oral presentation. Only the short form itself is
  to be signed by the subject or the subject's legally authorized representative. However, the
  witness shall sign both the short form and a copy of the summary, and the person actually
  obtaining consent shall sign a copy of the summary. A copy of the summary shall be given to the
  subject or the subject's legally authorized representative, in addition to a copy of the short
  form.
