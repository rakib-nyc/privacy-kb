verbatim_span: >-
  Each institution engaged in research that is covered by this policy, with the exception of
  research eligible for exemption under § 46.104, and that is conducted or supported by a Federal
  department or agency, shall provide written assurance satisfactory to the department or agency
  head that it will comply with the requirements of this policy. In lieu of requiring submission of
  an assurance, individual department or agency heads shall accept the existence of a current
  assurance, appropriate for the research in question, on file with the Office for Human Research
  Protections, HHS, or any successor office, and approved for Federal-wide use by that office. When
  the existence of an HHS-approved assurance is accepted in lieu of requiring submission of an
  assurance, reports (except certification) required by this policy to be made to department and
  agency heads shall also be made to the Office for Human Research Protections, HHS, or any
  successor office. Federal departments and agencies will conduct or support research covered by
  this policy only if the institution has provided an assurance that it will comply with the
  requirements of this policy, as provided in this section, and only if the institution has
  certified to the department or agency head that the research has been reviewed and approved by an
  IRB (if such certification is required by § 46.103(d)).
