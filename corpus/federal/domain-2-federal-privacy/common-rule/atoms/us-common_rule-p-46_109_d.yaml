verbatim_span: >-
  An IRB shall notify investigators and the institution in writing of its decision to approve or
  disapprove the proposed research activity, or of modifications required to secure IRB approval of
  the research activity. If the IRB decides to disapprove a research activity, it shall include in
  its written notification a statement of the reasons for its decision and give the investigator an
  opportunity to respond in person or in writing.
