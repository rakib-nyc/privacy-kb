common_errors:
  - >-
    Assuming a HIPAA authorization discharges the Common Rule. They are separate instruments with
    separate elements, and § 46.101(e) requires compliance with the more protective federal rule.
  - >-
    Reading the consent requirement as federal-law-only. It requires consent that is legally
    effective, which imports state rules on capacity and on legally authorized representatives.
  - >-
    Consenting subjects after enrolment or after the data were collected. Consent is owed before
    involvement; existing data go through the § 46.116(f) waiver or a § 46.104 exemption.
