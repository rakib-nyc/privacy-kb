obligation_type: obtain_consent
summary: >-
  Before involving a human subject in covered research, an investigator must obtain the legally
  effective informed consent of the subject or the subject's legally authorized representative.
requirement_detail: >-
  RESEARCH-CONTEXT PRIVACY LIVES HERE, NOT IN HIPAA, and the two are cumulative rather than
  alternative. HIPAA reaches a covered entity's protected health information; this policy reaches
  the research activity itself, whoever runs it, once the institution is engaged in research
  conducted or supported by a federal department or agency that has adopted the policy. The
  requirement is "legally effective informed consent", which imports state law on capacity and on
  who may act as a legally authorized representative — so the same protocol can be compliant in one
  state and defective in another, and this is the point non-specialists miss. Consent must be
  obtained BEFORE involvement, which makes retrospective consent for data already collected
  impossible under this paragraph; the routes for existing data are the § 46.116(f) waiver or a §
  46.104 exemption, and each has to be reached deliberately rather than assumed. Note finally what §
  46.116(f)(2) protects: an IRB may alter or omit elements of consent, but it may not alter the
  general requirements in paragraph (a) themselves.
deadline: null
exemptions:
  - id: cfr.45.46_116.f1.irb_waiver_of_consent
    type: activity_level
    scope: >-
      An IRB may waive the requirement to obtain informed consent for research under paragraphs (a)
      through (c), but only where it finds and documents the five criteria in (f)(3) — minimal risk,
      impracticability without the waiver, impracticability without identifiable data, no adverse
      effect on subjects' rights and welfare, and debriefing where appropriate. This is a
      determination the IRB must make and record, not a status the investigator can assert, and it
      is the correct route for secondary use of existing identifiable data.
    source_citation: 45 C.F.R. § 46.116(f)(1)
    verbatim_span: >-
      An IRB may waive the requirement to obtain informed consent for research under paragraphs (a)
      through (c) of this section, provided the IRB satisfies the requirements of paragraph (f)(3)
      of this section. If an individual was asked to provide broad consent for the storage,
      maintenance, and secondary research use of identifiable private information or identifiable
      biospecimens in accordance with the requirements at paragraph (d) of this section, and refused
      to consent, an IRB cannot waive consent for the storage, maintenance, or secondary research
      use of the identifiable private information or identifiable biospecimens.
    burden_of_proof: entity
    applies_if:
      all:
        - event.irb_waived_informed_consent == true
  - id: cfr.45.46_104.d.exempt_research_categories
    type: activity_level
    scope: >-
      Section 46.104(d) removes eight categories of human-subjects research from the policy
      altogether, including much educational, survey, benign behavioural and secondary-use research.
      This is relief from the POLICY, not merely from the consent section, so an exempt project owes
      neither IRB review nor consent under this part — which is why the exemption determination is
      the highest-leverage decision in the whole framework, and why several of the categories in
      (d)(7) and (d)(8) are conditioned on broad consent and a limited IRB review despite being
      called exempt.
    source_citation: 45 C.F.R. § 46.104(d)
    verbatim_span: >-
      Except as described in paragraph (a) of this section, the following categories of human
      subjects research are exempt from this policy:
    burden_of_proof: entity
    applies_if:
      all:
        - practice.research_is_46_104_exempt_category == true
