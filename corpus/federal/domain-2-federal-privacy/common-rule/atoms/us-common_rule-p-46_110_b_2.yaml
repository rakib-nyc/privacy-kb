verbatim_span: >-
  Under an expedited review procedure, the review may be carried out by the IRB chairperson or by
  one or more experienced reviewers designated by the chairperson from among members of the IRB. In
  reviewing the research, the reviewers may exercise all of the authorities of the IRB except that
  the reviewers may not disapprove the research. A research activity may be disapproved only after
  review in accordance with the nonexpedited procedure set forth in § 46.108(b).
