verbatim_span: >-
  For research subject to the 2018 Requirements and this subpart, the exemptions at § 46.104(d)(1),
  (4), (5), (6), (7), and (8) of the 2018 Requirements are applicable to this subpart. The
  exemptions at § 46.104(d)(2)(i) and (ii) of the 2018 Requirements may only apply to research
  subject to this subpart that involves educational tests or the observation of public behavior when
  the investigator(s) do not participate in the activities being observed. The exemptions at §
  46.104(d)(2)(iii) and (d)(3) of the 2018 Requirements may not be applied to research subject to
  this subpart.
