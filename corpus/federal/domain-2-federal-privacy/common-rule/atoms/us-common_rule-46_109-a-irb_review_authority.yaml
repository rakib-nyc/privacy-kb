verbatim_span: >-
  An IRB shall review and have authority to approve, require modifications in (to secure approval),
  or disapprove all research activities covered by this policy, including exempt research activities
  under § 46.104 for which limited IRB review is a condition of exemption (under §
  46.104(d)(2)(iii), (d)(3)(i)(C), and (d)(7), and (8)).
