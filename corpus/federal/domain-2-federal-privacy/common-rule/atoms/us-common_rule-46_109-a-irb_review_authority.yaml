summary: >-
  An IRB reviews and has authority to approve, require modifications in, or disapprove all research
  activities covered by the policy, including exempt activities for which limited IRB review is a
  condition of the exemption.
requirement_detail: >-
  THIS PARAGRAPH IS WHY THE COMMON RULE HAS TEETH AT ALL: the IRB's power is not advisory but a
  power to disapprove, and the § 46.111 criteria — privacy and confidentiality among them — are what
  it exercises that power against. The reach is broader than the word exempt suggests. The paragraph
  extends review to exempt research "for which limited IRB review is a condition of exemption",
  which is the trap in § 46.104(d)(2)(iii), (d)(3)(i)(C), (d)(7) and (d)(8): those categories are
  exempt from the policy generally and still require an IRB to make the § 46.111(a)(7) privacy and
  confidentiality determination, so a self-declared exemption there is not a route around privacy
  review. The distinction to keep is institutional rather than legal: the IRB is a body the
  institution constitutes, so its determination binds through the institution's assurance with the
  funding agency, not through any duty owed directly to the subject.
deadline: null
