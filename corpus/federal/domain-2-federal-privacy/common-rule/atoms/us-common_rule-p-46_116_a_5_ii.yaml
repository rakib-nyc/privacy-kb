    verbatim_span: >-
      General requirements for informed consent, whether written or oral, are set forth in this
      paragraph and apply to consent obtained in accordance with the requirements set forth in
      paragraphs (b) through (d) of this section. Broad consent may be obtained in lieu of informed
      consent obtained in accordance with paragraphs (b) and (c) of this section only with respect
      to the storage, maintenance, and secondary research uses of identifiable private information
      and identifiable biospecimens. Waiver or alteration of consent in research involving public
      benefit and service programs conducted by or subject to the approval of state or local
      officials is described in paragraph (e) of this section. General waiver or alteration of
      informed consent is described in paragraph (f) of this section. Except as provided elsewhere
      in this policy:
