summary: It is an unlawful employment practice for an employer to request, require or purchase genetic
  information with respect to an employee or a family member, subject to enumerated exceptions.
requirement_detail: GINA PROHIBITS ACQUISITION, NOT MERELY USE, which makes it structurally unlike Title
  VII and unlike most of this corpus. An employer that requests genetic information and never acts on
  it has still violated § 2000ff-1(b). "Genetic information" includes FAMILY MEDICAL HISTORY, so the most
  common violation is not a genetic test at all — it is a wellness questionnaire or a fitness-for-duty
  exam that asks about relatives' conditions. The inadvertent-acquisition exception at (b)(1) is narrow
  and is the reason employer instructions to providers matter.
