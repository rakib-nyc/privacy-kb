deadline: null
summary: >-
  It is an unlawful employment practice for an employer to fail or refuse to hire, to discharge, or
  otherwise to discriminate against an employee because of genetic information.
requirement_detail: >-
  THE USE PROHIBITION, and it is the half people expect GINA to be. Recorded alongside the
  ACQUISITION prohibition at § 2000ff-1(b) precisely because the acquisition half is the one that
  produces violations: an employer that never discriminates can still breach GINA by asking. Keeping
  both as separate atoms is what lets the corpus answer "we do not use it" correctly — that answers
  (a) and says nothing about (b).
common_errors:
  - Answering a GINA question with "we never act on it". That addresses subsection (a) only.
  - Assuming Title VII covers it. GINA exists because it did not.
