summary: >-
  An employer possessing genetic information about an employee must maintain it on separate forms
  and in separate medical files, and treat it as a confidential medical record.
requirement_detail: >-
  THE THIRD SEPARATE-FILES DUTY IN THIS CORPUS, and reading the three together is the point. ADA §
  12112(d)(3)(B) requires it of medical information, GINA § 2000ff-5(a) of genetic information, and
  HIPAA excludes employment records from PHI entirely. An employer holding a wellness questionnaire
  that asks about relatives has genetic information under GINA, medical information under the ADA,
  and nothing under HIPAA — one file, three regimes, and the one people reach for first is the one
  that does not apply.
common_errors:
  - >-
    Storing genetic information with the ADA medical file. Both require separation, and GINA treats
    the ADA file as compliant only if it also meets this section.
  - Assuming HIPAA governs it because it is health data. Employment records are excluded from PHI.
