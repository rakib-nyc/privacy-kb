verbatim_span: >-
  If an employer, employment agency, labor organization, or joint labor-management committee
  possesses genetic information about an employee or member, such information shall be maintained on
  separate forms and in separate medical files and be treated as a confidential medical record of
  the employee or member. An employer, employment agency, labor organization, or joint
  labor-management committee shall be considered to be in compliance with the maintenance of
  information requirements of this subsection with respect to genetic information subject to this
  subsection that is maintained with and treated as a confidential medical record under section
  12112(d)(3)(B) of this title .
