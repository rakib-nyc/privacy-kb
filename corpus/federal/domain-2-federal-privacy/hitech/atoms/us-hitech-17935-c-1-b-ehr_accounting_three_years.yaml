obligation_type: disclose
summary: >-
  Where a covered entity uses or maintains an electronic health record, treatment, payment and
  operations disclosures lose their exclusion from the accounting of disclosures, and the individual
  may obtain an accounting of them for the three years before the request.
requirement_detail: >-
  45 C.F.R. § 164.528 excludes disclosures to carry out treatment, payment and health care
  operations from the accounting an individual can demand, which is what makes the accounting right
  narrow in practice. Subparagraph (c)(1)(A) withdraws that exclusion for disclosures made through
  an electronic health record, and (c)(1)(B) sets the price of doing so: the window for those EHR
  disclosures is "only the three years prior to the date on which the accounting is requested",
  against the six years § 164.528 otherwise runs. One request can therefore produce two accountings
  over two windows, and the entity must be able to distinguish an EHR disclosure from any other in
  its logs to answer at all. Paragraph (2) makes the CONTENT of each entry depend on regulations the
  Secretary is directed to promulgate, and paragraph (4) keys application to when the covered entity
  acquired an electronic health record — 1 January 2014 for entities that had one as of 1 January
  2009, the later of 1 January 2011 or acquisition for everyone else, with (4)(C) letting the
  Secretary push both dates back.
preemption:
  posture: floor
  authority: 42 U.S.C. § 1320d-7; 45 C.F.R. § 160.203
  note: >-
    HITECH subtitle D is enforced through the HIPAA framework and inherits its preemption posture: a
    more stringent contrary State law survives. A State law giving the patient a broader right to
    restrict disclosure than § 17935(a) therefore runs in parallel, and compliance with the federal
    restriction does not discharge it.
enforcement:
  enforcers:
    - hhs_ocr
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Civil money penalties under 42 U.S.C. § 1320d-5, tiered by culpability, and criminal liability
      under 42 U.S.C. § 1320d-6. HITECH added State attorney general civil actions on behalf of
      State residents.
    range: null
    note: >-
      No private right of action. Patients reach the same conduct through State negligence,
      confidentiality and UDAP theories, so the State backstop never switches off.
  statute_of_limitations: null
