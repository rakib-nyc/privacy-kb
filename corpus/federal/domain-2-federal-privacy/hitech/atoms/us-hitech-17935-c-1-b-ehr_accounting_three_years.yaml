exemptions: []
common_errors:
  - >-
    Applying the six-year accounting period to EHR disclosures. Subparagraph (c)(1)(B) fixes three
    years for the disclosures whose exclusion (c)(1)(A) removes.
  - >-
    Dating the duty from HITECH's general subtitle D effective date. Paragraph (4) sets
    entity-specific dates turned on EHR acquisition and lets the Secretary set later ones, so two
    covered entities can owe this duty from different years.
  - >-
    Building an accounting log from the statute alone. Paragraph (2) leaves what is collected about
    each disclosure to regulations, so the field list is not derivable from § 17935.
open_questions:
  - >-
    Whether the Secretary has promulgated the regulations required by paragraph (c)(2), and whether
    any later effective date was set under paragraph (c)(4)(C), cannot be determined from the
    fetched text. Both bear directly on whether this duty is operable, so an accounting query should
    surface this as unresolved rather than answered.
