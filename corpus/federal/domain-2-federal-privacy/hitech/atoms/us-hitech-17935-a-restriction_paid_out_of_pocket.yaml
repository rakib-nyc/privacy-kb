obligation_type: restrict_use
summary: A covered entity must comply with an individual's requested restriction on disclosing protected
  health information to a health plan for payment or health care operations where the item or service
  was paid out of pocket in full.
requirement_detail: 'This is the rare provision where the individual, not the covered entity, decides.
  Under 45 C.F.R. § 164.522(a)(1)(ii) a covered entity is ordinarily free to refuse a requested restriction,
  and § 17935(a) removes that discretion — "notwithstanding paragraph (a)(1)(ii) of such section" — for
  one fact pattern only. The two conditions are cumulative: the disclosure must be to a health plan for
  payment or health care operations and not for treatment, AND the information must pertain solely to
  an item or service paid out of pocket in full. That makes it an engineering duty rather than a paperwork
  one, because the provider has to segregate the self-paid encounter in the record and suppress it on
  claims and on any plan-directed disclosure while continuing to disclose everything else. The carve-out
  "except as otherwise required by law" in paragraph (a)(1) leaves compelled disclosures untouched, so
  a State reporting mandate still overrides the restriction the patient bought.'
preemption:
  posture: floor
  authority: 42 U.S.C. § 1320d-7; 45 C.F.R. § 160.203
  note: 'HITECH subtitle D is enforced through the HIPAA framework and inherits its preemption posture:
    a more stringent contrary State law survives. A State law giving the patient a broader right to restrict
    disclosure than § 17935(a) therefore runs in parallel, and compliance with the federal restriction
    does not discharge it.'
enforcement:
  enforcers:
  - hhs_ocr
  - state_ag
  private_right_of_action: false
  penalty:
    structure: Civil money penalties under 42 U.S.C. § 1320d-5, tiered by culpability, and criminal liability
      under 42 U.S.C. § 1320d-6. HITECH added State attorney general civil actions on behalf of State
      residents.
    range: null
    note: No private right of action. Patients reach the same conduct through State negligence, confidentiality
      and UDAP theories, so the State backstop never switches off.
  statute_of_limitations: null
