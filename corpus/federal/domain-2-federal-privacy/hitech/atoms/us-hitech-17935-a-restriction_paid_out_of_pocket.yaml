exemptions:
- id: usc.42.17935.a.1.otherwise_required_by_law
  type: activity_level
  scope: 'Where other law compels the disclosure, the mandatory restriction does not reach it. CONSEQUENCE
    TEST: the covered entity stays bound for every voluntary payment or operations disclosure to the plan;
    only the compelled disclosure escapes. Typed activity_level rather than data_level because it carves
    out a class of CONDUCT, not a class of record — the same self-paid encounter is restricted when the
    provider bills the plan and unrestricted when a State mandate requires the report.'
  source_citation: 42 U.S.C. § 17935(a)(1)
