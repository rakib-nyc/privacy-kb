common_errors:
- Reading this as a general right to restrict. The right to REQUEST a restriction under 45 C.F.R. § 164.522(a)(1)(i)(A)
  is unchanged and the covered entity may still refuse it; only the out-of-pocket-in-full disclosure to
  a health plan became mandatory.
- Applying the restriction to treatment disclosures. Paragraph (a)(1) reaches a disclosure to a health
  plan for payment or health care operations and expressly excludes one carried out for treatment, so
  a referral to a treating specialist is outside it.
- Treating the restriction as attaching to the whole record. It attaches only where the information pertains
  solely to the item or service paid in full, so bundled encounters and downstream summaries that mix
  restricted and unrestricted services are the operational failure point.
