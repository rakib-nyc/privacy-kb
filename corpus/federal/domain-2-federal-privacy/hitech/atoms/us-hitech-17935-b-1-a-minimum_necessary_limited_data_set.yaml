obligation_type: restrict_use
summary: >-
  A covered entity is treated as complying with the HIPAA minimum necessary standard only if it
  limits the information to a limited data set to the extent practicable, and to the minimum
  necessary only where the limited data set will not serve.
requirement_detail: >-
  HITECH did not restate the minimum necessary standard; it changed what SATISFIES it. Compliance
  with 45 C.F.R. § 164.502(b)(1) is conditional — the entity is treated as compliant only if it
  limits the information "to the extent practicable" to the limited data set defined in §
  164.514(e)(2), and may fall back to the minimum necessary only "if needed by such entity". That
  inverts the default: the de-identified-but-for-dates limited data set is the presumptive unit of
  disclosure and the case-by-case minimum-necessary judgment is the exception that has to be
  justified. Subparagraph (C) then sunsets subparagraph (A) on the effective date of the Secretary's
  guidance under subparagraph (B), so whether this atom still operates turns on a fact the section
  does not contain, and it is recorded in force because the sunset is conditional rather than dated.
  Paragraph (2) settles who decides: the covered entity or business associate MAKING the disclosure,
  not the party requesting it.
preemption:
  posture: floor
  authority: 42 U.S.C. § 1320d-7; 45 C.F.R. § 160.203
  note: >-
    HITECH subtitle D is enforced through the HIPAA framework and inherits its preemption posture: a
    more stringent contrary State law survives. A State law giving the patient a broader right to
    restrict disclosure than § 17935(a) therefore runs in parallel, and compliance with the federal
    restriction does not discharge it.
enforcement:
  enforcers:
    - hhs_ocr
    - state_ag
  private_right_of_action: false
  penalty:
    structure: >-
      Civil money penalties under 42 U.S.C. § 1320d-5, tiered by culpability, and criminal liability
      under 42 U.S.C. § 1320d-6. HITECH added State attorney general civil actions on behalf of
      State residents.
    range: null
    note: >-
      No private right of action. Patients reach the same conduct through State negligence,
      confidentiality and UDAP theories, so the State backstop never switches off.
  statute_of_limitations: null
