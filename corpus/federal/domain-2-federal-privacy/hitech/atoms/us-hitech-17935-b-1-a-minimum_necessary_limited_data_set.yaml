verbatim_span: >-
  Subject to subparagraph (B), a covered entity shall be treated as being in compliance with section
  164.502(b)(1) of title 45, Code of Federal Regulations, with respect to the use, disclosure, or
  request of protected health information described in such section, only if the covered entity
  limits such protected health information, to the extent practicable, to the limited data set (as
  defined in section 164.514(e)(2) of such title) or, if needed by such entity, to the minimum
  necessary to accomplish the intended purpose of such use, disclosure, or request, respectively.
