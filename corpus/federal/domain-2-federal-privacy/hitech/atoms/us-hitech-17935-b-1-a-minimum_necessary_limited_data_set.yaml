common_errors:
  - >-
    Reading § 17935(b) as a free-standing minimum necessary rule. It operates on 45 C.F.R. §
    164.502(b)(1), and paragraph (b)(3) carries the § 164.502(b)(2) exceptions across, so
    disclosures to a provider for treatment remain outside the standard entirely.
  - >-
    Letting the requester define the minimum necessary. Paragraph (2) puts that determination on the
    disclosing covered entity or business associate, which is why a payer's demand for a full chart
    is not self-justifying.
  - >-
    Treating the limited data set as one option among equals. The statute makes it the first resort
    and the minimum necessary the fallback, so a disclosure log that never shows a limited data set
    is evidence of the wrong default.
open_questions:
  - >-
    Subparagraph (C) makes subparagraph (A) sunset when the Secretary issues the guidance required
