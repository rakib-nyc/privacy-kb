verbatim_span: >-
  For purposes of paragraph (a)(1) of this section, §§ 164.406(a), and 164.408(a), a breach shall be
  treated as discovered by a covered entity as of the first day on which such breach is known to the
  covered entity, or, by exercising reasonable diligence would have been known to the covered
  entity. A covered entity shall be deemed to have knowledge of a breach if such breach is known, or
  by exercising reasonable diligence would have been known, to any person, other than the person
  committing the breach, who is a workforce member or agent of the covered entity (determined in
  accordance with the federal common law of agency).
