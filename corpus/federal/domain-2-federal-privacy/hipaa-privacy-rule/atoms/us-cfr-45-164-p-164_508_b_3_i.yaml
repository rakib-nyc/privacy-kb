verbatim_span: >-
  An authorization for the use or disclosure of protected health information for a research study
  may be combined with any other type of written permission for the same or another research study.
  This exception includes combining an authorization for the use or disclosure of protected health
  information for a research study with another authorization for the same research study, with an
  authorization for the creation or maintenance of a research database or repository, or with a
  consent to participate in research. Where a covered health care provider has conditioned the
  provision of research-related treatment on the provision of one of the authorizations, as
  permitted under paragraph (b)(4)(i) of this section, any compound authorization created under this
  paragraph must clearly differentiate between the conditioned and unconditioned components and
  provide the individual with an opportunity to opt in to the research activities described in the
  unconditioned authorization.
