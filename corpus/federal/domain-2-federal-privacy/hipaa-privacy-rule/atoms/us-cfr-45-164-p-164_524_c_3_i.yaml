verbatim_span: >-
  The covered entity must provide the access as requested by the individual in a timely manner as
  required by paragraph (b)(2) of this section, including arranging with the individual for a
  convenient time and place to inspect or obtain a copy of the protected health information, or
  mailing the copy of the protected health information at the individual's request. The covered
  entity may discuss the scope, format, and other aspects of the request for access with the
  individual as necessary to facilitate the timely provision of access.
