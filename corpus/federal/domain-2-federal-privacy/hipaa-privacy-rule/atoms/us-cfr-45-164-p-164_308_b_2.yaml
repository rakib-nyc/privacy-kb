verbatim_span: >-
  A business associate may permit a business associate that is a subcontractor to create, receive,
  maintain, or transmit electronic protected health information on its behalf only if the business
  associate obtains satisfactory assurances, in accordance with § 164.314(a), that the subcontractor
  will appropriately safeguard the information.
