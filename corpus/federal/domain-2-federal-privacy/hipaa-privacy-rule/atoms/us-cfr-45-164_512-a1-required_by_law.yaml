obligation_type: permit
summary: >-
  A covered entity may use or disclose protected health information to the extent the use or
  disclosure is required by law, limited to the relevant requirements of that law.
requirement_detail: >-
  THE PERMISSION IS BOUNDED BY THE LAW THAT COMPELS IT. "To the extent that" and "limited to the
  relevant requirements of such law" mean the mandate defines the scope: a subpoena for one record
  does not permit disclosing a file. Disclosing more than the compelling law requires is not
  protected by this paragraph. "Required by law" is a defined term at § 164.103 and is narrower than
  lawful. It means a mandate enforceable in court, not a request an entity is permitted to honour. A
  voluntary response to a law enforcement request is not "required by law" and must find its
  permission elsewhere, which is what paragraph (f) is for.
exemptions: []
common_errors:
  - >-
    Treating any lawful request as "required by law". The defined term requires a mandate
    enforceable in court, not permission to disclose.
  - >-
    Disclosing the whole record where the mandate reaches part of it. The permission is limited to
    what the compelling law requires.
