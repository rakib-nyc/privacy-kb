obligation_type: disclose
summary: >-
  A covered entity must act on a request for an accounting of disclosures no later than 60 days
  after receiving it.
requirement_detail: >-
  THE CLOCK RUNS FROM RECEIPT, not from the period the accounting covers. Sixty calendar days, not
  business days. Acting on the request is not the same as delivering the accounting. The
  subparagraphs that follow define what acting consists of, and § 164.528(c)(2) permits one
  extension of no more than 30 days if the entity gives the individual a written statement of the
  reason and the date by which it will provide the accounting. An entity that takes the extension
  without providing that written statement has not earned it.
exemptions: []
common_errors:
  - Assuming a 30-day clock by analogy to § 164.524 access requests. Accounting is 60 days.
  - Taking the extension without giving the written statement § 164.528(c)(2) conditions it on.
open_questions:
  - § 164.528(c)(2), which sets the conditions on the single 30-day extension, is not in the corpus.
deadline:
  trigger_event: receipt_of_accounting_request
  duration:
    value: 60
    unit: calendar_days
  computation: >-
    No later than 60 days after receipt of the request. The span states the outer limit; the
    subparagraphs that follow set out what acting on the request consists of, and § 164.528(c)(2)
    provides a single 30-day extension with written notice of the reason and the expected date.
  tolling: []
context_not_required: >-
  Self-contained. The span carries the duty, the clock and the trigger. The subparagraphs it points
  to describe what acting consists of and do not alter the 60 days.
