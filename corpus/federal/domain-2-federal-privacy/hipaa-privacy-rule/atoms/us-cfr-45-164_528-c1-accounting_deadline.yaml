  note: >-
    HIPAA is a FLOOR, not a ceiling. A contrary State law that is MORE STRINGENT than the Privacy
    Rule is not preempted, so state duties run in parallel and the shorter clock governs in
    practice. Treating HIPAA compliance as discharging state obligations is the standard error.
