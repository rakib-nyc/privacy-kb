verbatim_span: >-
  If a business associate is required by law to perform a function or activity on behalf of a
  covered entity or to provide a service described in the definition of business associate in §
  160.103 of this subchapter to a covered entity, such covered entity may disclose protected health
  information to the business associate to the extent necessary to comply with the legal mandate
  without meeting the requirements of this paragraph and § 164.314(a)(1), if applicable, provided
  that the covered entity attempts in good faith to obtain satisfactory assurances as required by
  paragraph (e)(2) of this section and § 164.314(a)(1), if applicable, and, if such attempt fails,
  documents the attempt and the reasons that such assurances cannot be obtained.
