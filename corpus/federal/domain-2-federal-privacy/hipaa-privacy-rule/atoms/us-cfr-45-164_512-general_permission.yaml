summary: >-
  A covered entity may use or disclose protected health information without the individual's written
  authorization, and without giving the individual an opportunity to agree or object, in the
  situations this section covers.
requirement_detail: >-
  THIS IS THE PROVISION THAT ANSWERS WHETHER AN AUTHORIZATION IS NEEDED AT ALL. Section 164.502(a)
  states the prohibition and § 164.508 states the authorization requirement; this section is the
  exception both are subject to. Reading the first two without this one produces the common and
  consequential error of telling a covered entity it needs an authorization for a disclosure the
  Rule permits outright. EACH PERMISSION IS CONDITIONAL. The section permits nothing at large — it
  opens twelve specific situations, each with its own conditions in its own paragraph, and the span
  is expressly "subject to the applicable requirements of this section and § 164.509". A permission
  identified here is the beginning of the analysis, not the end of it. The 2024 reproductive-health
  rule carved § 164.502(a)(5)(iii) out of the front of it, so a disclosure otherwise permitted here
  is still prohibited where that paragraph reaches. Note the closing sentence: where this section
  requires the entity to inform the individual, or permits the individual to agree, both may be done
  VERBALLY. Written process is not required for these situations.
exemptions: []
common_errors:
  - Treating § 164.508 as the whole answer on authorization. It is subject to this section.
  - >-
    Reading a permission here as unconditional. Each paragraph carries its own conditions, and the
    chapeau makes the whole section subject to them.
  - >-
    Assuming a written record of the individual's agreement is required. The section permits it
    verbally.
