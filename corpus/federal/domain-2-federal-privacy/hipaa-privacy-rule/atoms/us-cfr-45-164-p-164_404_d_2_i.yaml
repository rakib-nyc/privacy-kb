    verbatim_span: >-
      In the case in which there is insufficient or out-of-date contact information that precludes
      written notification to the individual under paragraph (d)(1)(i) of this section, a substitute
      form of notice reasonably calculated to reach the individual shall be provided. Substitute
      notice need not be provided in the case in which there is insufficient or out-of-date contact
      information that precludes written notification to the next of kin or personal representative
      of the individual under paragraph (d)(1)(ii).
