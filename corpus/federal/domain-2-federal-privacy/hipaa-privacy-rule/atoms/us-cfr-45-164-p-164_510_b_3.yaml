verbatim_span: >-
  If the individual is not present, or the opportunity to agree or object to the use or disclosure
  cannot practicably be provided because of the individual's incapacity or an emergency
  circumstance, the covered entity may, in the exercise of professional judgment, determine whether
  the disclosure is in the best interests of the individual and, if so, disclose only the protected
  health information that is directly relevant to the person's involvement with the individual's
  care or payment related to the individual's health care or needed for notification purposes. A
  covered entity may use professional judgment and its experience with common practice to make
  reasonable inferences of the individual's best interest in allowing a person to act on behalf of
  the individual to pick up filled prescriptions, medical supplies, X-rays, or other similar forms
  of protected health information.
