verbatim_span: >-
  If under applicable law a person has authority to act on behalf of an individual who is an adult
  or an emancipated minor in making decisions related to health care, a covered entity must treat
  such person as a personal representative under this subchapter, with respect to protected health
  information relevant to such personal representation.
