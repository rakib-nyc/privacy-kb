obligation_type: disclose
summary: >-
  An individual has a right to an accounting of disclosures of their protected health information
  made in the six years before the request, subject to enumerated exceptions.
requirement_detail: >-
  THE EXCEPTIONS ARE THE SUBSTANCE OF THIS RIGHT. The span ends at "except for disclosures:" and the
  list that follows removes the categories that account for most disclosures a covered entity makes
  — among them treatment, payment and health care operations. An accounting is therefore not a log
  of everything; it is a log of what is left after the carve-outs. The look-back is six years from
  the DATE OF THE REQUEST, not from the disclosure. The exception list is at § 164.528(a)(1)(i) to
  (ix) and is not in the corpus. Telling an individual what will and will not appear in their
  accounting requires reading it.
exemptions: []
common_errors:
  - >-
    Treating the accounting as covering all disclosures. Treatment, payment and operations
    disclosures are excepted, and they are most of them.
  - Running the six years from the disclosure. It runs back from the date of the request.
open_questions:
  - >-
    The exceptions at § 164.528(a)(1)(i) to (ix) are not in the corpus, so which disclosures fall
    outside a given accounting cannot be determined here.
no_deadline_stated: This provision states a permission or a standard, not a clock.
context_not_required: >-
  The span states the right, its six-year look-back and the fact that exceptions follow. It does not
  depend on a chapeau; the exceptions it points to are recorded in span_truncation_note and
  open_questions.
span_truncation_note: >-
  The span stops at the words "except for disclosures:" because the enumerated exceptions are
  separate leaves. It is cut there deliberately rather than one clause earlier: stopping at "six
  years prior to the date on which the accounting is requested" would state an unqualified right,
  which is the opposite of the rule.
