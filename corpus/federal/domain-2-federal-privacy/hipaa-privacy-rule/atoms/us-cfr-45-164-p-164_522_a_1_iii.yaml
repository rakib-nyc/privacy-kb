verbatim_span: >-
  A covered entity that agrees to a restriction under paragraph (a)(1)(i) of this section may not
  use or disclose protected health information in violation of such restriction, except that, if the
  individual who requested the restriction is in need of emergency treatment and the restricted
  protected health information is needed to provide the emergency treatment, the covered entity may
  use the restricted protected health information, or may disclose such information to a health care
  provider, to provide such treatment to the individual.
