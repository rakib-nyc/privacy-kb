  164.520, and makes corresponding changes to its policies and procedures, it may make the changes
  effective for protected health information that it created or received prior to the effective date
  of the notice revision, if the covered entity has, in accordance with § 164.520(b)(1)(v)(C),
  included in the notice a statement reserving its right to make such a change in its privacy
  practices; or
