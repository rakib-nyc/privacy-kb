summary: >-
  A covered entity may disclose protected health information as authorized by, and to the extent
  necessary to comply with, workers' compensation and similar no-fault programs.
requirement_detail: >-
  Two limits sit in the words. "As authorized by" ties the permission to the programme's own law,
  and "to the extent necessary to comply" bounds the volume — this is not a general permission to
  send a claims administrator a file. The programme must be established by law and must provide
  benefits for work-related injury or illness WITHOUT REGARD TO FAULT. A disclosure to an employer
  outside such a programme is not covered by this paragraph; the workforce-member permission at
  (b)(1)(v) is a different route with different conditions.
exemptions: []
common_errors:
  - >-
    Reading it as a general permission to disclose to an employer. It reaches a no-fault statutory
    benefits programme, not the employment relationship.
