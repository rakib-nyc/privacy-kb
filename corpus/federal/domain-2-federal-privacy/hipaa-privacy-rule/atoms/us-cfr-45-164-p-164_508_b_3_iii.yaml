verbatim_span: >-
  An authorization under this section, other than an authorization for a use or disclosure of
  psychotherapy notes, may be combined with any other such authorization under this section, except
  when a covered entity has conditioned the provision of treatment, payment, enrollment in the
  health plan, or eligibility for benefits under paragraph (b)(4) of this section on the provision
  of one of the authorizations. The prohibition in this paragraph on combining authorizations where
  one authorization conditions the provision of treatment, payment, enrollment in a health plan, or
  eligibility for benefits under paragraph (b)(4) of this section does not apply to a compound
  authorization created in accordance with paragraph (b)(3)(i) of this section.
