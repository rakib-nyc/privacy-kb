verbatim_span: >-
  A privacy board may use an expedited review procedure if the research involves no more than
  minimal risk to the privacy of the individuals who are the subject of the protected health
  information for which use or disclosure is being sought. If the privacy board elects to use an
  expedited review procedure, the review and approval of the alteration or waiver of authorization
  may be carried out by the chair of the privacy board, or by one or more members of the privacy
  board as designated by the chair; and
