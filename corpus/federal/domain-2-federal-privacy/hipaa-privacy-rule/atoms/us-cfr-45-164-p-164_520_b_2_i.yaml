verbatim_span: >-
  In addition to the information required by paragraph (b)(1) of this section, if a covered entity
  elects to limit the uses or disclosures that it is permitted to make under this subpart, the
  covered entity may describe its more limited uses or disclosures in its notice, provided that the
  covered entity may not include in its notice a limitation affecting its right to make a use or
  disclosure that is required by law or permitted by § 164.512(j)(1)(i).
