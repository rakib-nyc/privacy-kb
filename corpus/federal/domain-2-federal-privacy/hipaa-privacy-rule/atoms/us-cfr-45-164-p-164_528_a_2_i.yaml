verbatim_span: >-
  The covered entity must temporarily suspend an individual's right to receive an accounting of
  disclosures to a health oversight agency or law enforcement official, as provided in § 164.512(d)
  or (f), respectively, for the time specified by such agency or official, if such agency or
  official provides the covered entity with a written statement that such an accounting to the
  individual would be reasonably likely to impede the agency's activities and specifying the time
  for which such a suspension is required.
