verbatim_span: >-
  If any provision of the HIPAA Privacy Rule to Support Reproductive Health Care Privacy is held to
  be invalid or unenforceable facially, or as applied to any person, plaintiff, or circumstance, it
  shall be construed to give maximum effect to the provision permitted by law, unless such holding
  shall be one of utter invalidity or unenforceability, in which case the provision shall be
  severable from this part and shall not affect the remainder thereof or the application of the
  provision to other persons not similarly situated or to other dissimilar circumstances.
