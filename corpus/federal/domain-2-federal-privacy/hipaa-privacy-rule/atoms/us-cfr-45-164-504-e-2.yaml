summary: >-
  A contract between a covered entity and a business associate must contain the terms enumerated in
  § 164.504(e)(2).
requirement_detail: >-
  THE FLOW-DOWN MECHANISM, and it is what makes HIPAA reach entities that never touch a patient. The
  contract must establish permitted uses, bar the associate from using PHI otherwise, and — since
  the HITECH amendments — the associate is directly liable for much of the Security Rule and parts
  of the Privacy Rule regardless of what the contract says. So a missing or defective BAA is a
  violation by the covered entity; it is not a shield for either party.
common_errors:
  - >-
    Believing a BAA transfers liability. It allocates duties; the covered entity remains liable for
    its own failure to obtain satisfactory assurances.
  - >-
    Assuming a business associate is only contractually bound. Since HITECH it is directly liable to
    HHS for much of the rules.
