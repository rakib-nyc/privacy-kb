verbatim_span: >-
  A health plan that posts its notice on its web site in accordance with paragraph (c)(3)(i) of this
  section must prominently post the change or its revised notice on its web site by the effective
  date of the material change to the notice, and provide the revised notice, or information about
  the material change and how to obtain the revised notice, in its next annual mailing to
  individuals then covered by the plan.
