verbatim_span: >-
  A covered entity must have and apply appropriate sanctions against members of its workforce who
  fail to comply with the privacy policies and procedures of the covered entity or the requirements
  of this subpart or subpart D of this part. This standard does not apply to a member of the covered
  entity's workforce with respect to actions that are covered by and that meet the conditions of §
  164.502(j) or paragraph (g)(2) of this section.
