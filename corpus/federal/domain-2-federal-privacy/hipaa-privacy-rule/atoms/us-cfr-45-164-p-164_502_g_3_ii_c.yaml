verbatim_span: >-
  Where the parent, guardian, or other person acting in loco parentis, is not the personal
  representative under paragraphs (g)(3)(i)(A), (B), or (C) of this section and where there is no
  applicable access provision under State or other law, including case law, a covered entity may
  provide or deny access under § 164.524 to a parent, guardian, or other person acting in loco
  parentis, if such action is consistent with State or other applicable law, provided that such
  decision must be made by a licensed health care professional, in the exercise of professional
  judgment.
