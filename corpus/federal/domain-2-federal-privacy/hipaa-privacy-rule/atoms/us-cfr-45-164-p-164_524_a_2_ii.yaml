verbatim_span: >-
  A covered entity that is a correctional institution or a covered health care provider acting under
  the direction of the correctional institution may deny, in whole or in part, an inmate's request
  to obtain a copy of protected health information, if obtaining such copy would jeopardize the
  health, safety, security, custody, or rehabilitation of the individual or of other inmates, or the
  safety of any officer, employee, or other person at the correctional institution or responsible
  for the transporting of the inmate.
