verbatim_span: >-
  A covered entity may use or disclose protected health information to a public or private entity
  authorized by law or by its charter to assist in disaster relief efforts, for the purpose of
  coordinating with such entities the uses or disclosures permitted by paragraph (b)(1)(ii) of this
  section. The requirements in paragraphs (b)(2), (b)(3), or (b)(5) of this section apply to such
  uses and disclosures to the extent that the covered entity, in the exercise of professional
  judgment, determines that the requirements do not interfere with the ability to respond to the
  emergency circumstances.
