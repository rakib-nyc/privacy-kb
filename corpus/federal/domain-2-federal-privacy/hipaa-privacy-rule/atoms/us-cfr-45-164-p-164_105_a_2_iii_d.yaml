verbatim_span: >-
  The covered entity is responsible for designating the components that are part of one or more
  health care components of the covered entity and documenting the designation in accordance with
  paragraph (c) of this section, provided that, if the covered entity designates one or more health
  care components, it must include any component that would meet the definition of a covered entity
  or business associate if it were a separate legal entity. Health care component(s) also may
  include a component only to the extent that it performs covered functions.
