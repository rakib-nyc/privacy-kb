verbatim_span: >-
  A covered entity that is a government agency administering a government program providing public
  benefits may disclose protected health information relating to the program to another covered
  entity that is a government agency administering a government program providing public benefits if
  the programs serve the same or similar populations and the disclosure of protected health
  information is necessary to coordinate the covered functions of such programs or to improve
  administration and management relating to the covered functions of such programs.
