verbatim_span: >-
  A covered health care provider must inform an individual of the protected health information that
  it may include in a directory and the persons to whom it may disclose such information (including
  disclosures to clergy of information regarding religious affiliation) and provide the individual
  with the opportunity to restrict or prohibit some or all of the uses or disclosures permitted by
  paragraph (a)(1) of this section.
