verbatim_span: >-
  If a person performs duties for both the health care component in the capacity of a member of the
  workforce of such component and for another component of the entity in the same capacity with
  respect to that component, such workforce member must not use or disclose protected health
  information created or received in the course of or incident to the member's work for the health
  care component in a way prohibited by subpart E of this part.
