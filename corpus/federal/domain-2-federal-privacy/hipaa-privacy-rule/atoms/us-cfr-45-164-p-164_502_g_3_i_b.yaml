    verbatim_span: >-
      If under applicable law a parent, guardian, or other person acting in loco parentis has
      authority to act on behalf of an individual who is an unemancipated minor in making decisions
      related to health care, a covered entity must treat such person as a personal representative
      under this subchapter, with respect to protected health information relevant to such personal
      representation, except that such person may not be a personal representative of an
      unemancipated minor, and the minor has the authority to act as an individual, with respect to
      protected health information pertaining to a health care service, if:
