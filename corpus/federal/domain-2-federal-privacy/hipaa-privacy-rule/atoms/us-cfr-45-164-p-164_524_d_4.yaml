verbatim_span: >-
  If the individual has requested a review of a denial under paragraph (a)(4) of this section, the
  covered entity must designate a licensed health care professional, who was not directly involved
  in the denial to review the decision to deny access. The covered entity must promptly refer a
  request for review to such designated reviewing official. The designated reviewing official must
  determine, within a reasonable period of time, whether or not to deny the access requested based
  on the standards in paragraph (a)(3) of this section. The covered entity must promptly provide
  written notice to the individual of the determination of the designated reviewing official and
  take other action as required by this section to carry out the designated reviewing official's
  determination.
