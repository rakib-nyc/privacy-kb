verbatim_span: Substance use disorder treatment records received from programs subject to 42 CFR part
  2, or testimony relaying the content of such records, shall not be used or disclosed in civil, criminal,
  administrative, or legislative proceedings against the individual unless based on written consent,
  or a court order after notice and an opportunity to be heard is provided to the individual or the
  holder of the record, as provided in 42 CFR part 2. A court order authorizing use or disclosure
  must be accompanied by a subpoena or other legal requirement compelling disclosure before the requested
  record is used or disclosed; or
