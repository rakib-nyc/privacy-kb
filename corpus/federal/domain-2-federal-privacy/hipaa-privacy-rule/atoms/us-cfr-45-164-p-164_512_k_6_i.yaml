verbatim_span: >-
  A health plan that is a government program providing public benefits may disclose protected health
  information relating to eligibility for or enrollment in the health plan to another agency
  administering a government program providing public benefits if the sharing of eligibility or
  enrollment information among such government agencies or the maintenance of such information in a
  single or combined data system accessible to all such government agencies is required or expressly
  authorized by statute or regulation.
