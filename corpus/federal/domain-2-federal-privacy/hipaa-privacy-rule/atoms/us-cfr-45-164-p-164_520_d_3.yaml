verbatim_span: >-
  The covered entities included in the joint notice must provide the notice to individuals in
  accordance with the applicable implementation specifications of paragraph (c) of this section.
  Provision of the joint notice to an individual by any one of the covered entities included in the
  joint notice will satisfy the provision requirement of paragraph (c) of this section with respect
  to all others covered by the joint notice.
