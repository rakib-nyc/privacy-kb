verbatim_span: >-
  Notwithstanding any other provisions of this part, a covered entity, or business associate with
  respect to a subcontractor, may disclose protected health information to a business associate and
  may allow a business associate to create, receive, maintain, or transmit protected health
  information on its behalf pursuant to a written contract or other written arrangement with such
  business associate that does not comply with §§ 164.308(b), 164.314(a), 164.502(e), and
  164.504(e), only in accordance with paragraph (e) of this section.
