verbatim_span: >-
  If access is denied on a ground permitted under paragraph (a)(3) of this section, the individual
  has the right to have the denial reviewed by a licensed health care professional who is designated
  by the covered entity to act as a reviewing official and who did not participate in the original
  decision to deny. The covered entity must provide or deny access in accordance with the
  determination of the reviewing official under paragraph (d)(4) of this section.
