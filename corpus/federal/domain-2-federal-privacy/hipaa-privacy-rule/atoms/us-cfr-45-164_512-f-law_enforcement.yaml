summary: >-
  A covered entity may disclose protected health information to a law enforcement official for a law
  enforcement purpose, if the conditions in paragraphs (f)(1) through (f)(6) are met.
requirement_detail: >-
  NO AUTHORIZATION IS REQUIRED FOR A DISCLOSURE THAT MEETS THESE CONDITIONS, which is the answer §
  164.502(a) and § 164.508 alone appear to contradict. THE PERMISSION IS CONDITIONAL AND THE
  CONDITIONS DIFFER BY SITUATION. Paragraphs (f)(1) through (f)(6) each govern a different
  circumstance — compulsory process, a request to identify or locate a suspect or missing person,
  information about a victim, a suspected death, evidence of a crime on the premises, and a medical
  emergency. The right question is never whether police may be given records, but which paragraph
  governs and whether its conditions are met. IT IS A PERMISSION, NOT A MANDATE. Nothing here
  obliges a covered entity to disclose. Where another law compels the disclosure, the permission is
  paragraph (a)(1)'s, and its scope is bounded by that law. The corpus holds this paragraph and not
  (f)(1) to (f)(6). A determination that a specific disclosure is permitted requires reading the
  applicable one against the primary source.
exemptions: []
common_errors:
  - >-
    Reading this as permitting disclosure to law enforcement on request. Each paragraph sets
    conditions, and several require specific process or a specific purpose.
  - Treating the permission as a requirement. It permits; it does not compel.
  - >-
    Using this paragraph where another law compels the disclosure. That is paragraph (a)(1), whose
    scope is limited to what the compelling law requires.
open_questions:
  - >-
    Paragraphs (f)(1) through (f)(6) are not in the corpus, so the conditions that govern any
    particular law enforcement disclosure cannot be checked here.
no_deadline_stated: This provision states a permission or a standard, not a clock.
context_not_required: >-
  Paragraph (f) is the top-level statement of the law-enforcement permission. It names the entity,
  the recipient, the purpose, and that the conditions are in (f)(1) to (f)(6) — so the span does not
  overstate the permission by omitting them.
