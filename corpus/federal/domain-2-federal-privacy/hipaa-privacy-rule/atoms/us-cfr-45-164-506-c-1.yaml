deadline: null
summary: >-
  A covered entity may use or disclose protected health information for its own treatment, payment,
  or health care operations.
requirement_detail: >-
  THE PERMISSION THAT MAKES HEALTHCARE POSSIBLE, and the one most often described as requiring
  consent. It does not. § 164.502(a) makes prohibition the default and this is the affirmative
  permission that lifts it for TPO — no authorization, no consent, no opportunity to agree or
  object. That is why an analysis that starts from "we need consent to share PHI" gets the
  architecture backwards: consent is the exception route under § 164.508, and TPO is the ordinary
  one.
common_errors:
  - Believing TPO requires patient consent or authorization. It requires neither.
  - >-
    Assuming TPO covers marketing. § 164.508(a)(3) requires an authorization for most marketing, and
    marketing is defined so as not to fall inside health care operations.
