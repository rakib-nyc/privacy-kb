exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Individually identifiable health information in EMPLOYMENT RECORDS held by the covered entity
      in its role as employer is not protected health information. CONSEQUENCE TEST: the hospital
      remains a covered entity in full. The same nurse's chart, held because she is a patient, is
      PHI; her pre-employment physical and her FMLA paperwork, held because she is an employee, are
      not — same entity, same person, same clinical facts, different capacity. THIS IS THE CANONICAL
      entity-level/data-level divider, and the error it invites is symmetrical: reading it as
      entity_level would exempt the hospital from HIPAA outright, and ignoring it treats every HR
      file in a health system as PHI. Note also what it does NOT do — the records are unprotected by
      HIPAA, not unregulated: the ADA, GINA and state law reach them, and HIPAA saying nothing is
      not the same as permission.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
  - id: cfr.45.160.103.phi.ferpa_education_records
    type: data_level
    scope: >-
      Health information in education records covered by FERPA is not PHI. CONSEQUENCE TEST: a
      university health plan stays a covered entity for its plan records while the same student's
      treatment records held by the student health service as education records fall outside HIPAA
      and inside FERPA. The carve-out routes the data to a DIFFERENT regime rather than out of
      regulation, which is why an analysis that stops at "not PHI" answers the wrong question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(i)
    verbatim_span: >-
      In education records covered by the Family Educational Rights and Privacy Act, as amended, 20
      U.S.C. 1232g;
    burden_of_proof: entity
    applies_if:
      all:
        - data.is_ferpa_education_record == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
  - id: cfr.45.160.103.phi.deceased_over_50_years
    type: data_level
    scope: >-
      Information regarding a person deceased more than 50 years is not PHI. CONSEQUENCE TEST: the
      covered entity stays covered and every other record stays protected; only that decedent's
      information leaves. Typed data_level and NOT temporal even though a clock decides it: temporal
      relief in this schema means the instrument does not reach the entity as of the queried date,
      and here the instrument reaches the entity fully — a single archive can hold records on both
      sides of the 50-year line at the same instant.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iv)
    verbatim_span: Regarding a person who has been deceased for more than 50 years.
    burden_of_proof: entity
    applies_if:
      all:
        - data.subject_deceased_more_than_50_years == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
