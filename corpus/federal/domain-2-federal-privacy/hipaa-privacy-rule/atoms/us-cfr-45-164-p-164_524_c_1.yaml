verbatim_span: >-
  The covered entity must provide the access requested by individuals, including inspection or
  obtaining a copy, or both, of the protected health information about them in designated record
  sets. If the same protected health information that is the subject of a request for access is
  maintained in more than one designated record set or at more than one location, the covered entity
  need only produce the protected health information once in response to a request for access.
