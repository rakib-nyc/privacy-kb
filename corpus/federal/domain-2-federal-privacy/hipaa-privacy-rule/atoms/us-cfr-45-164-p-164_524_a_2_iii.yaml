verbatim_span: >-
  An individual's access to protected health information created or obtained by a covered health
  care provider in the course of research that includes treatment may be temporarily suspended for
  as long as the research is in progress, provided that the individual has agreed to the denial of
  access when consenting to participate in the research that includes treatment, and the covered
  health care provider has informed the individual that the right of access will be reinstated upon
  completion of the research.
