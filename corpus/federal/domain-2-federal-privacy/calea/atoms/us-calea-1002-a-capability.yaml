summary: A telecommunications carrier must ensure its equipment, facilities and services are capable of
  isolating and delivering intercepted communications and call-identifying information to the government
  pursuant to lawful authorization.
requirement_detail: 'SURVEILLANCE CAPABILITY AS A DESIGN MANDATE, which is the opposite posture from every
  privacy-by-design obligation in this corpus. § 1002(a) does not regulate what a carrier may do with
  data; it requires the network to be BUILT so interception is possible. The privacy consequence is structural
  rather than conduct-based: a capability built for lawful access exists for unlawful access too, and
  no provision of this section conditions the duty on the volume or likelihood of actual interception
  requests.'
common_errors:
- Reading it as an interception authority. It is a capability requirement; the authority to intercept
  comes from Title III or FISA.
- Assuming it reaches information services. The section is addressed to telecommunications carriers, and
  the scope question is contested.
open_questions:
- § 1002(b) contains limitations, including on decryption and on information services, which are not extracted.
  An analysis of what a carrier need NOT deliver is incomplete without them.
