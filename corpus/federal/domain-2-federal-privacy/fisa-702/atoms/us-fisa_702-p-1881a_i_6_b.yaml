verbatim_span: >-
  The Government or an electronic communication service provider receiving a directive issued
  pursuant to paragraph (1) may file a petition for a writ of certiorari for review of a decision of
  the Court of Review issued under subparagraph (A). The record for such review shall be transmitted
  under seal to the Supreme Court of the United States, which shall have jurisdiction to review such
  decision.
