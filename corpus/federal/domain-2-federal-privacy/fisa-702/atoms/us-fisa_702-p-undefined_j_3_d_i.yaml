verbatim_span: >-
  Except as provided in clause (ii), if the Court orders a correction of a deficiency in a
  certification or procedures under subparagraph (B), no information obtained or evidence derived
  pursuant to the part of the certification or procedures that has been identified by the Court as
  deficient concerning any United States person shall be received in evidence or otherwise disclosed
  in any trial, hearing, or other proceeding in or before any court, grand jury, department, office,
  agency, regulatory body, legislative committee, or other authority of the United States, a State,
  or political subdivision thereof, and no information concerning any United States person acquired
  pursuant to such part of such certification or procedures shall subsequently be used or disclosed
  in any other manner by Federal officers or employees without the consent of the United States
  person, except with the approval of the Attorney General if the information indicates a threat of
  death or serious bodily harm to any person.
