verbatim_span: >-
  If the Attorney General and the Director of National Intelligence seek to reauthorize or replace
  an authorization issued under subsection (a) by filing a certification pursuant to subparagraph
  (A), that authorization, and any directives issued thereunder and any order related thereto, shall
  remain in effect, notwithstanding the expiration provided for in subsection (a), until the Court
  issues an order with respect to such certification under paragraph (3) at which time the
  provisions of that paragraph and paragraph (4) shall apply with respect to such certification.
