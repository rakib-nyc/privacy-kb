summary: An acquisition authorized under § 1881a(a) is subject to the limitations enumerated in subsection
  (b).
requirement_detail: 'THE LIMITS MATTER MORE THAN THE GRANT FOR THIS CORPUS. § 702 authorises targeting
  of non-US persons reasonably believed to be outside the United States, and subsection (b) is where the
  boundaries sit — including that an acquisition may not intentionally target a person known at the time
  to be located in the United States. This is the provision European regulators actually analyse: the
  Schrems litigation turned on whether these limitations plus the available redress amount to protection
  essentially equivalent to EU law, and that is a DOCTRINAL conclusion about the statute rather than anything
  the statute says.'
common_errors:
- Citing § 702 as authority to target US persons. Subsection (b)(1) forecloses intentional targeting of
  a person known to be in the United States.
- Reading adequacy conclusions into the text. Schrems II is case law about this statute, not a provision
  of it.
open_questions:
- Subsection (b) enumerates further limitations that are not separately extracted, and the querying and
  minimisation procedures live elsewhere in the section. An adequacy-style analysis needs both and this
  atom carries neither.
