common_errors:
  - >-
    Concluding that a health app is unregulated because it is not a HIPAA covered entity. That is
    precisely the population § 318.1(a) names, and the FTC — not HHS — takes the notice.
  - >-
    Applying FTC Act jurisdictional limits to this part. § 318.1(a) says it applies "irrespective of
    any jurisdictional tests in the Federal Trade Commission (FTC) Act", so foreign vendors and
    entities outside ordinary FTC reach are covered.
  - >-
    Reading the HIPAA carve-out as data-level. For a covered entity the exclusion is flat and
    entity-level on this text; the "to the extent that" qualifier attaches only to business
    associate activities, so an entity that is a business associate in one line of business is still
    a PHR vendor in another.
open_questions:
  - >-
    effective_from is taken from the rule's own applicability date at § 318.8: "This part shall
    apply to breaches of security that are discovered on or after September 24, 2009." The text
    quoted here is the CURRENT text, which the part-level source note shows was amended at 89 FR
    47054 (May 30, 2024). The source states neither that amendment's effective date nor which
    provisions it changed, so this atom cannot distinguish the 2009 text from the amended text on a
    date query, and any § 318.2 definition relied on downstream should be checked against the
    amendment before being applied to a pre-2024 breach.
  - >-
    Invariant I4's worked example — a HIPAA covered entity exempt for PHI but not for the wellness
    data its consumer app collects — does not follow from this sentence as written. § 318.1(a)
    excludes HIPAA-covered entities without a "to the extent" qualifier, and the § 318.2 definitions
    of "vendor of personal health records" and "PHR related entity" repeat the same unqualified
    exclusion. Recorded as an entity-level exemption on that text. The app-side data of a covered
    entity would then fall to FTC Act § 5 and state law rather than to this part; that reading is
    not resolved against FTC guidance here.
