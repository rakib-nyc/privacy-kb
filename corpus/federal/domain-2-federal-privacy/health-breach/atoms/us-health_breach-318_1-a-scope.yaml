no_deadline_stated: >-
  § 318.1(a) is a purpose-and-scope provision and fixes no period. The clock for every notice this
  part requires is in § 318.4: without unreasonable delay and no later than 60 calendar days after
  discovery for individuals, media and third party service providers (§ 318.4(a)), contemporaneous
  FTC notice at 500 or more individuals and an annual log below that (§ 318.4(b)).
exemptions:
  - id: cfr.16.318.1.a.hipaa_covered_entity
    type: entity_level
    scope: >-
      A HIPAA-covered entity is outside 16 C.F.R. part 318 ALTOGETHER; its breach duties are 45
      C.F.R. §§ 164.400–414 instead. Note the asymmetry in the sentence: the exclusion for covered
      entities is unqualified, while the exclusion for anyone else runs only "to the extent that" it
      acts as a business associate — so a vendor that is a business associate for one line of
      business remains a vendor of personal health records for its own consumer offering. THIS IS
      NOT RELIEF FROM BREACH NOTIFICATION. It is an allocation between two regimes, and the wrong
      one is worse than none: HHS, not the FTC, receives the notice.
    source_citation: 16 C.F.R. § 318.1(a)
    verbatim_span: >-
      This part does not apply to HIPAA-covered entities, or to any other entity to the extent that
      it engages in activities as a business associate of a HIPAA-covered entity.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_hipaa_covered_entity == true
    reach: instrument
