summary: >-
  The Health Breach Notification Rule applies to foreign and domestic vendors of personal health
  records, PHR related entities and third party service providers that maintain information of U.S.
  citizens or residents, and does not apply to HIPAA-covered entities or to any entity to the extent
  it acts as a business associate.
requirement_detail: >-
  THIS IS THE RULE THAT COVERS THE GAP HIPAA LEAVES. A consumer health app — a period tracker, a
  fitness or sleep tracker, a direct-to-consumer test — collects information that would be PHI in a
  clinical setting, but its developer is not a covered entity under 45 C.F.R. § 160.103 and is not a
  business associate of one, so nothing in 45 C.F.R. parts 160 or 164 reaches it. Part 318 does, and
  the trigger is what the entity OFFERS rather than what sector it says it is in: the § 318.2
  definitions turn on offering or maintaining a personal health record, and § 318.2 defines "health
  care services or supplies" as any online service such as a website, mobile application or
  internet-connected device providing mechanisms to track diseases, health conditions, treatment,
  medications, vital signs, fitness, fertility, sexual health, sleep, mental health, diet or other
  health-related tools. Follow the § 318.2 chain before calling an app a VENDOR, though: a personal
  health record must have the technical capacity to draw information from MULTIPLE SOURCES, so a
  single-source app may instead be a PHR related entity, which owes the same notices by a different
  route. Two further points a legal-domain-trained reader should hold onto. First, the jurisdictional reach
  is unusual — the part applies "irrespective of any jurisdictional tests in the Federal Trade
  Commission (FTC) Act", so the § 45(a)(2) carve-outs that limit the Disposal Rule and the
  Safeguards Rule do not limit this one, and foreign vendors holding data on U.S. citizens or
  residents are in. Second, "breach of security" is defined in § 318.2 as acquisition without the
  individual's authorization and expressly includes an unauthorized acquisition resulting from an
  unauthorized DISCLOSURE, with unauthorized access presumed to be unauthorized acquisition unless
  the entity has reliable evidence otherwise. Sharing identifiable health data with an advertising
  platform without authorisation is therefore reached; it does not take an intrusion.
preemption:
  posture: floor
  authority: 16 C.F.R. § 318.1(b); 42 U.S.C. § 17951
  note: >-
    § 318.1(b) states only that the part preempts State law "as set forth in section 13421 of the
    American Recovery and Reinvestment Act of 2009, 42 U.S.C 17951". The extent of that preemption
    is fixed by a statute that is not in this corpus; § 17951 is the ARRA provision applying the
    HIPAA contrary-and-more-stringent framework, which is why this is recorded as a floor. Treat the
    posture as declared but unresolved, and check state breach-notification law rather than assuming
    displacement — the NY SHIELD Act reaches the same entities.
