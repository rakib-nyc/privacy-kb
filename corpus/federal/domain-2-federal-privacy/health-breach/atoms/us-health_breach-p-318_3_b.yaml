verbatim_span: >-
  A third party service provider shall, following the discovery of a breach of security, provide
  notice of the breach to an official designated in a written contract by the vendor of personal
  health records or the PHR related entity to receive such notices or, if such a designation is not
  made, to a senior official at the vendor of personal health records or PHR related entity to which
  it provides services, and obtain acknowledgment from such official that such notice was received.
  Such notification shall include the identification of each customer of the vendor of personal
  health records or PHR related entity whose unsecured PHR identifiable health information has been,
  or is reasonably believed to have been, acquired during such breach. For purposes of ensuring
  implementation of this paragraph (b), vendors of personal health records and PHR related entities
  shall notify third party service providers of their status as vendors of personal health records
  or PHR related entities subject to this part. While some third party service providers may access
  unsecured PHR identifiable health information in the course of providing services, this does not
  render the third party service provider a PHR related entity.
