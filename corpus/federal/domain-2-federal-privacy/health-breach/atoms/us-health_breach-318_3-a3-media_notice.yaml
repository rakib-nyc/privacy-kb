common_errors:
  - >-
    Counting 500 across the whole breach. The text counts residents of a State or jurisdiction, so
    the test is applied state by state.
  - >-
    Confusing this threshold with the FTC-notice threshold. § 318.4(b) uses 500 or more INDIVIDUALS
    to decide whether FTC notice is contemporaneous or annual; this paragraph uses 500 residents of
    one State to decide whether media notice is owed.
  - >-
    Carrying HIPAA's threshold across. 45 C.F.R. § 164.406 says MORE THAN 500 residents; this
    paragraph says 500 OR MORE, and the difference decides a breach affecting exactly 500 residents
    of a state.
  - >-
    Waiting for a confirmed count. The paragraph is triggered where the information "is, or is
    reasonably believed to have been, acquired", and the 60-day ceiling in § 318.4(a) keeps running
    while the investigation continues.
open_questions:
  - >-
    effective_from is taken from the rule's own applicability date at § 318.8: "This part shall
    apply to breaches of security that are discovered on or after September 24, 2009." The text
    quoted here is the CURRENT text, which the part-level source note shows was amended at 89 FR
    47054 (May 30, 2024). The source states neither that amendment's effective date nor which
    provisions it changed, so this atom cannot distinguish the 2009 text from the amended text on a
    date query, and any § 318.2 definition relied on downstream should be checked against the
    amendment before being applied to a pre-2024 breach.
