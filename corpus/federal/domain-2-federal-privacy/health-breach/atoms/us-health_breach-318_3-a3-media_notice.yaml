summary: >-
  Where the unsecured PHR identifiable health information of 500 or more residents of a State or
  jurisdiction is, or is reasonably believed to have been, acquired in a breach, the vendor or PHR
  related entity must also notify prominent media outlets serving that State or jurisdiction.
requirement_detail: >-
  THE 500 IS COUNTED PER STATE OR JURISDICTION, not across the breach, which is the arithmetic most
  often got wrong: a breach affecting 5,000 users spread thinly over fifty states may trigger no
  media notice, while one affecting 500 users in a single state does. The threshold is also met on
  reasonable BELIEF — "is, or is reasonably believed to have been, acquired" — so uncertainty about
  the exact figure does not defer the duty. This is a per-state obligation layered on top of the
  individual notice in (a)(1), never a substitute for it, and § 318.5(b) requires it to be given by
  notice to prominent media outlets serving that State or jurisdiction. Note that a DIFFERENT 500
  threshold governs the FTC notice: under § 318.4(b), FTC notice for a breach involving 500 or more
  INDIVIDUALS is contemporaneous with the individual notice, while breaches under that figure may be
  logged and sent annually. The shape resembles HIPAA's media notice at 45 C.F.R. § 164.406, but the
  triggers are NOT identical: § 164.406 reads "more than 500 residents" while this paragraph reads
  "500 or more residents", so a breach touching exactly 500 residents of one state requires media
  notice here and would not under HIPAA. The regulator differs too — these notices run to the FTC,
  not to HHS.
preemption:
  posture: floor
  authority: 16 C.F.R. § 318.1(b); 42 U.S.C. § 17951
  note: >-
    § 318.1(b) states only that the part preempts State law "as set forth in section 13421 of the
    American Recovery and Reinvestment Act of 2009, 42 U.S.C 17951". The extent of that preemption
    is fixed by a statute that is not in this corpus; § 17951 is the ARRA provision applying the
    HIPAA contrary-and-more-stringent framework, which is why this is recorded as a floor. Treat the
    posture as declared but unresolved, and check state breach-notification law rather than assuming
    displacement — the NY SHIELD Act reaches the same entities.
