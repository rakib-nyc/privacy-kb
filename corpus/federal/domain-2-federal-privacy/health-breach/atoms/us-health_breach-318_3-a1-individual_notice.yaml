  private_right_of_action: false
  penalty:
    structure: >-
      Violation treated as an unfair or deceptive act or practice in violation of a rule under FTC
      Act § 18 (15 U.S.C. 57a), carrying civil penalties as adjusted for inflation
    range: null
    note: >-
      § 318.7 states the treatment expressly, which matters because it makes civil penalties
      available for a FIRST violation — unlike a § 5 case, where the FTC ordinarily needs an order
      before penalties attach. The penalty amount is set by 16 C.F.R. § 1.98 as adjusted and is not
      stated in this part.
