obligation_type: notify
summary: >-
  Following discovery of a breach of security of unsecured PHR identifiable health information, a
  vendor of personal health records or PHR related entity must notify each U.S. citizen or resident
  whose information was acquired by an unauthorized person.
requirement_detail: >-
  THE INDIVIDUAL NOTICE, and the trigger differs from HIPAA's in a way that changes the analysis.
  There is no risk-of-harm assessment here: the duty attaches when unsecured information "was
  acquired by an unauthorized person", where 45 C.F.R. § 164.402 lets a covered entity rebut the
  presumption of a breach through a four-factor risk assessment. Whose breach it is also differs by
  role — a vendor notifies for information in a personal health record it maintains or offers, a PHR
  related entity for information obtained through its product or service, and a third party service
  provider does not notify individuals at all but notifies a designated or senior official at the
  vendor it serves and must obtain acknowledgement (§ 318.3(b)). The clock runs from DISCOVERY,
  which § 318.3(c) deems to be the first day the breach is known or reasonably should have been
  known to any employee, officer or agent other than the person who committed it, and § 318.4(c)
  puts the burden of demonstrating that every notification was made on the entity. Notice to the FTC
  is separate and simultaneous at 500 or more individuals (§§ 318.3(a)(2), 318.4(b)); method and
  content are prescribed by §§ 318.5 and 318.6.
preemption:
  posture: floor
  authority: 16 C.F.R. § 318.1(b); 42 U.S.C. § 17951
  note: >-
    § 318.1(b) states only that the part preempts State law "as set forth in section 13421 of the
    American Recovery and Reinvestment Act of 2009, 42 U.S.C 17951". The extent of that preemption
    is fixed by a statute that is not in this corpus; § 17951 is the ARRA provision applying the
    HIPAA contrary-and-more-stringent framework, which is why this is recorded as a floor. Treat the
    posture as declared but unresolved, and check state breach-notification law rather than assuming
    displacement — the NY SHIELD Act reaches the same entities.
enforcement:
  enforcers:
