common_errors:
  - >-
    Importing HIPAA's risk-of-harm rebuttal. § 318.3(a)(1) turns on acquisition by an unauthorized
    person, with no four-factor assessment of the kind 45 C.F.R. § 164.402 allows.
  - >-
    Running the 60 days from the incident. § 318.4(a) runs it from discovery, and § 318.3(c) deems
    discovery to occur when any employee, officer or agent other than the wrongdoer knew or
    reasonably should have known.
  - >-
    Expecting a service provider to notify consumers. Under § 318.3(b) a third party service
    provider notifies the vendor or PHR related entity it serves, and must obtain acknowledgement of
    that notice; the consumer-facing duty stays with the vendor.
open_questions:
  - >-
    effective_from is taken from the rule's own applicability date at § 318.8: "This part shall
    apply to breaches of security that are discovered on or after September 24, 2009." The text
