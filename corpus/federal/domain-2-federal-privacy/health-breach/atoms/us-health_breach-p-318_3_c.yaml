verbatim_span: >-
  A breach of security shall be treated as discovered as of the first day on which such breach is
  known or reasonably should have been known to the vendor of personal health records, PHR related
  entity, or third party service provider, respectively. Such vendor, entity, or third party service
  provider shall be deemed to have knowledge of a breach if such breach is known, or reasonably
  should have been known, to any person, other than the person committing the breach, who is an
  employee, officer, or other agent of such vendor of personal health records, PHR related entity,
  or third party service provider.
