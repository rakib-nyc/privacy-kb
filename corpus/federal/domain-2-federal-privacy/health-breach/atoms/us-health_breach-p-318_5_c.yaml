verbatim_span: >-
  Vendors of personal health records and PHR related entities shall provide notice to the Federal
  Trade Commission following the discovery of a breach of security, as described in § 318.4(b)
  (regarding timing of notice to FTC). If the breach involves the unsecured PHR identifiable health
  information of fewer than 500 individuals, the vendor of personal health records or PHR related
  entity may maintain a log of any such breach and submit such a log annually to the Federal Trade
  Commission as described in § 318.4(b) (regarding timing of notice to FTC), documenting breaches
  from the preceding calendar year. All notices pursuant to this paragraph (c) shall be provided
  according to instructions at the Federal Trade Commission's website.
