  - position: precedes
    relation: scopes
    verbatim_span: >-
      If, after making reasonable efforts to contact all individuals to whom notice is required
      under § 318.3(a), through the means provided in paragraph (a)(1) of this section, the vendor
      of personal health records or PHR related entity finds that contact information for ten or
      more individuals is insufficient or out-of-date, the vendor of personal health records or PHR
      related entity shall provide substitute notice, which shall be reasonably calculated to reach
      the individuals affected by the breach, in the following form:
