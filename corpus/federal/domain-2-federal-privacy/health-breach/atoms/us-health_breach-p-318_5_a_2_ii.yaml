verbatim_span: >-
  In major print or broadcast media, including major media in geographic areas where the individuals
  affected by the breach likely reside. Such a notice in media or web posting shall include a
  toll-free phone number, which shall remain active for at least 90 days, where an individual can
  learn if the individual's unsecured PHR identifiable health information may have been included in
  the breach.
