verbatim_span: >-
  Written notice at the last known address of the individual. Written notice may be sent by
  electronic mail if the individual has specified electronic mail as the primary method of
  communication. Any written notice sent by electronic mail must be Clear and Conspicuous. Where
  notice via electronic mail is not available or the individual has not specified electronic mail as
  the primary method of communication, a vendor of personal health records or PHR related entity may
  provide notice by first-class mail at the last known address of the individual. If the individual
  is deceased, the vendor of personal health records or PHR related entity that discovered the
  breach must provide such notice to the next of kin of the individual if the individual had
  provided contact information for his or her next of kin, along with authorization to contact them.
  The notice may be provided in one or more mailings as information is available.
