verbatim_span: >-
  All notifications required under § 318.5(c) (regarding notice to FTC) involving the unsecured PHR
  identifiable health information of 500 or more individuals shall be provided contemporaneously
  with the notice required by paragraph (a) of this section. All logged notifications required under
  § 318.5(c) (regarding notice to FTC) involving the unsecured PHR identifiable health information
  of fewer than 500 individuals may be sent annually to the Federal Trade Commission no later than
  60 calendar days following the end of the calendar year.
