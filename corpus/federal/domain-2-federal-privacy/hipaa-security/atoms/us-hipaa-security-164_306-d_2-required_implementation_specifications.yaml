      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Assuming every specification can be risk-justified away. Required specifications have no
    reasonableness escape hatch; only addressable ones do.
  - >-
    Treating the Required/Addressable labels as OCR guidance rather than regulatory text fixed by §
    164.306(d)(1).
  - >-
    Reading a standard with no listed specifications as optional. The standard binds on its own
    words.
