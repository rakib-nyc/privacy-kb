obligation_type: secure
summary: >-
  Where a standard in §§ 164.308-164.316 carries required implementation specifications, the entity
  must implement them.
requirement_detail: >-
  "Required" means implement, with no assessment step and no substitution: the paragraph has no
  reasonableness qualifier of any kind, which is precisely what distinguishes it from the
  addressable regime at (d)(3). The status is read off the regulation itself — (d)(1) provides that
  the word "Required" appears in parentheses after the specification's title — so this is not an OCR
  gloss that an entity can argue with. It matters most where the required specifications cluster:
  the entire security management process at § 164.308(a)(1)(ii) (risk analysis, risk management,
  sanction policy, information system activity review) is Required, as are disposal and media re-use
  at § 164.310(d)(2)(i)-(ii), unique user identification and emergency access at §
  164.312(a)(2)(i)-(ii), and the whole of the documentation standard at § 164.316(b)(2). Flexibility
  under § 164.306(b) still governs HOW each is done, but not WHETHER. A standard with no
  implementation specifications at all — audit controls at § 164.312(b), for instance — is itself
  mandatory in its own terms; the absence of specifications is not an absence of duty.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
