obligation_type: secure
summary: >-
  The entity must implement policies and procedures limiting physical access to its electronic
  information systems and the facilities housing them, while allowing properly authorised access.
requirement_detail: >-
  The facility access controls standard is the physical half of the Security Rule and it does not
  evaporate when systems move to the cloud: the duty runs to "its electronic information systems and
  the facility or facilities in which they are housed", so an entity whose servers sit in a vendor
  data centre discharges this through the business associate relationship and its own diligence
  rather than being excused from it. The clause is two-sided — restrict unauthorised access AND
  ensure authorised access is allowed — which is why a control that locks staff out during an
  emergency is a defect under this standard rather than an excess of caution. All four
  implementation specifications beneath it at § 164.310(a)(2) (contingency operations, facility
  security plan, access control and validation procedures, maintenance records) are ADDRESSABLE, so
  each is governed by § 164.306(d)(3) and each declined control needs its documented reasoning. The
  standard itself, by contrast, is not addressable: an entity must have facility access policies and
  procedures whatever it concludes about the four specifications. Note also that § 164.310(b)-(c)
  reach "all workstations" that access ePHI, which is how the physical safeguards follow a remote
  workforce home.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Assuming cloud hosting removes the physical safeguards standard. It relocates the controls; it
    does not delete the duty.
  - >-
    Treating the standard as addressable because all four of its implementation specifications are.
    The standard binds; only the specifications are conditional.
  - >-
    Reading the standard as one-directional. It also requires that properly authorised access be
    allowed, which is what contingency operations at (a)(2)(i) exists to preserve.
