obligation_type: secure
summary: >-
  Covered entities and business associates must ensure the confidentiality, integrity and
  availability of all electronic protected health information they create, receive, maintain or
  transmit.
requirement_detail: >-
  This is the general requirement the rest of subpart C implements; §§ 164.308, 164.310, 164.312,
  164.314 and 164.316 are the means, and § 164.306(a) is the end they are measured against. Three
  points are load-bearing. First, the duty names business associates alongside covered entities, so
  a vendor owes the Security Rule directly and not merely through its business associate agreement.
  Second, the verbs "creates, receives, maintains, or transmits" reach data in motion and data held
  on someone else's infrastructure, so an entity cannot scope its programme to the systems it
  happens to own. Third, AVAILABILITY is a named objective on equal footing with confidentiality —
  ransomware that locks records without exfiltrating them is a failure of this paragraph even if no
  one outside ever reads the data. The subpart reaches electronic PHI only; paper records are
  covered by the Privacy Rule's safeguard standard at § 164.530(c), which is a different obligation
  with a different text.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Treating the Privacy Rule's administrative-safeguard standard as satisfying subpart C. They are
    separate obligations and OCR charges them separately.
  - >-
    Scoping the programme to stored data. "Creates, receives, maintains, or transmits" also captures
    transmission and data resident in a vendor environment.
  - >-
    Reading security as confidentiality only, and so treating an availability failure — ransomware,
    destroyed backups — as outside HIPAA.
