preemption:
  posture: floor
  authority: 45 C.F.R. § 160.203
  note: >-
    HIPAA is a FLOOR, not a ceiling. A contrary State law that is MORE STRINGENT than the Security
    Rule survives, so state data-security duties — the NY SHIELD Act's reasonable safeguards among
    them — run in parallel and the stricter one governs. Reading a Security Rule risk analysis as
    discharging a state security-programme statute is the standard error; the Security Rule's own
    flexibility language makes it especially tempting, because an entity that has "addressed" a
    specification may still fall below a state floor that names the control outright.
