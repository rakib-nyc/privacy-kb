obligation_type: assess
summary: >-
  For an addressable implementation specification the entity must assess whether it is reasonable
  and appropriate, implement it if it is, and otherwise document why not and implement an equivalent
  alternative measure if reasonable and appropriate.
requirement_detail: >-
  ADDRESSABLE DOES NOT MEAN OPTIONAL, and this is the single most consequential misreading of the
  Security Rule. The word triggers a duty in three limbs: ASSESS whether the specification is a
  reasonable and appropriate safeguard in this environment, judged by its likely contribution to
  protecting ePHI; IMPLEMENT it if it is; and if it is not, DOCUMENT why not and implement an
  equivalent alternative measure if that is reasonable and appropriate. Doing nothing and writing
  nothing is available under none of the three limbs — even the narrow case where neither the
  specification nor an alternative is reasonable still requires the written analysis under
  (ii)(B)(1). The assessment is entity-specific and evidence-driven: it is not a policy statement
  but a record of why, given this environment and this risk analysis, the control does or does not
  earn its place. That record is a documented "action, activity or assessment" and so falls under §
  164.316(b)(1)(ii), which means it must be retained for six years under § 164.316(b)(2)(i) and
  reviewed periodically under (b)(2)(iii). Practically, an addressable specification is HARDER to
  decline than to implement, because declining generates a permanent, discoverable artefact that OCR
  will read first and that a plaintiff will read next.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Reading "addressable" as "optional" or "recommended". It is a conditional duty with a mandatory
    assessment and a mandatory record.
  - >-
    Declining a specification without documenting the reasoning, or documenting the reasoning
    without considering an equivalent alternative. (ii)(B) requires both halves.
  - >-
    Making the addressability call once, at implementation, and never revisiting it. § 164.306(e)
    requires review and modification of the measures as needed.
