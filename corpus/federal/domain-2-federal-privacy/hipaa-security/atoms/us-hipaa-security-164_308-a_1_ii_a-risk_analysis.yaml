      on whether the entity knew or was wilfully neglectful. State attorneys general may sue under
      42 U.S.C. § 1320d-5(d) (HITECH).
    range: null
    note: >-
      No private right of action. The Security Rule nonetheless drives private exposure indirectly:
      plaintiffs plead it as the standard of care in negligence, and state UDAP and
      breach-notification claims reach the same conduct.
  statute_of_limitations: null
