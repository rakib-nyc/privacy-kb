subject:
  domain: II.B.1
  lifecycle:
    - IV
applies_if:
  all:
    - any:[entity.is_hipaa_covered_entity == true, entity.is_hipaa_business_associate == true]
    - data.is_ephi == true
obligation_type: assess
summary: >-
  The entity must conduct an accurate and thorough assessment of the potential risks and
  vulnerabilities to the confidentiality, integrity and availability of the ePHI it holds.
requirement_detail: >-
  This is the provision OCR cites most often, and its two adjectives do the work: the assessment
  must be ACCURATE and THOROUGH. Thorough is enterprise-wide by its terms — the span reaches ePHI
  "held by the covered entity or business associate", not ePHI in whichever system the entity chose
  to scope — so an analysis limited to the EHR while medical devices, backups, laptops, email and
  vendor-hosted environments go unexamined does not satisfy it. It is Required, not addressable, so
  no reasonableness argument reaches it. It is also the analytical predicate for everything
  downstream: risk management at (ii)(B) demands measures "sufficient to reduce risks and
  vulnerabilities to a reasonable and appropriate level to comply with § 164.306(a)", and the
  addressability decisions under § 164.306(d)(3) are made "with reference to the likely contribution
  to protecting" ePHI — neither is possible without a current inventory of risks. Finally it is not
  a one-off: § 164.306(e) requires review and modification of the security measures as needed, and §
  164.308(a)(8) requires periodic technical and non-technical evaluation in response to
  environmental or operational change.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Substituting a gap assessment against the rule's standards for a risk analysis. A checklist of
    which standards are implemented is not an assessment of threats and vulnerabilities to ePHI.
  - >-
    Scoping to the EHR. The text reaches all ePHI the entity holds, including devices, backups,
    email and vendor-hosted systems.
  - >-
    Treating the analysis as a one-time deliverable rather than a maintained one, contrary to §
    164.306(e) and § 164.308(a)(8).
