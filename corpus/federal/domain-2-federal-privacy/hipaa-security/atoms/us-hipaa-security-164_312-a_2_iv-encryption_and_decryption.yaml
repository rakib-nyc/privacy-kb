obligation_type: secure
summary: >-
  Under the access control standard, the entity must implement a mechanism to encrypt and decrypt
  ePHI — an ADDRESSABLE implementation specification, not a required one.
requirement_detail: >-
  There is no flat command in HIPAA to encrypt ePHI, and this is the fact that most often surprises
  practitioners: the run-in title of this specification reads "Encryption and decryption
  (Addressable)", so § 164.306(d)(3) governs it. That is not permission to leave data in the clear.
  It means the entity must assess encryption against its own risk analysis, implement it where
  reasonable and appropriate, and otherwise document why not and deploy an equivalent alternative —
  and for laptops, portable media and mobile devices that assessment essentially never comes out
  against encryption, which is why unencrypted-device cases settle badly. Two separate encryption
  specifications exist and they are frequently conflated: this one sits under access control and
  covers ePHI the systems maintain, while § 164.312(e)(2)(ii) sits under transmission security and
  covers ePHI in transit "whenever deemed appropriate". Both are addressable and each needs its own
  analysis; addressing one does not address the other. Encryption also has a consequence outside
  subpart C entirely: subpart D's notification duties attach to breaches of UNSECURED protected
  health information, so the same decision that is only addressable here can determine whether a
  lost laptop is a notifiable breach at all.
exemptions:
  - id: cfr.45.160.103.phi.employment_records
    type: data_level
    scope: >-
      Electronic protected health information is defined at 45 C.F.R. § 160.103 as information
      within paragraphs (1)(i) or (1)(ii) of the definition of protected health information, so
      every carve-out from PHI is also a carve-out from ePHI and from this subpart. Individually
      identifiable health information held by the covered entity in its role as EMPLOYER is not PHI
      and therefore not ePHI. CONSEQUENCE TEST: the entity remains fully bound by the Security Rule
      for its clinical systems; the HRIS holding the same employees' occupational-health files is
      outside subpart C. This is data_level, not entity_level — a hospital does not stop owing risk
      analysis because it also runs a payroll system. The carve-out is also not deregulation: the
      ADA, GINA, state law and FTC Act § 5 still reach those records, and a security incident in the
      HR system is a state breach-notification question rather than a § 164.308(a)(6) question.
    source_citation: 45 C.F.R. § 160.103 (definition of "protected health information") (2)(iii)
    verbatim_span: In employment records held by a covered entity in its role as employer; and
    burden_of_proof: entity
    applies_if:
      all:
        - data.in_employment_record == true
        - entity.holds_as_employer == true
    source_ref:
      raw_file: corpus/federal/domain-2-federal-privacy/hipaa-privacy-rule/raw/45-cfr-160.xml
      raw_sha256: 9916d549267c2f3f629b2157d6e0887b73570f9eddace67b626c40f51a6c9c72
      instrument_id: us.cfr.45.160
common_errors:
  - >-
    Reading "addressable" as optional and leaving devices unencrypted with no documented assessment.
    That is a § 164.306(d)(3) violation independent of any breach.
  - >-
    Believing HIPAA mandates encryption outright. It does not — which is exactly why the documented
    assessment carries the weight.
  - >-
    Treating encryption at rest under (a)(2)(iv) as covering transmission. § 164.312(e)(2)(ii) is a
    separate addressable specification.
