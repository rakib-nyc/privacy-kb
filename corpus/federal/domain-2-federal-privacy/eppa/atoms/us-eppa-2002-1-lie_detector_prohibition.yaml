summary: >-
  It is unlawful for a covered employer, directly or indirectly, to require, request, suggest or
  cause any employee or prospective employee to take or submit to any lie detector test.
requirement_detail: >-
  EPPA BANS A COLLECTION METHOD OUTRIGHT, which makes it structurally unlike almost everything else
  in this corpus: the sectoral statutes around it regulate what may be done with data lawfully
  obtained, while this paragraph forbids the obtaining. The verbs are what practitioners
  underestimate — "require, request, suggest, or cause" — so a manager who floats a polygraph in an
  interview as a way for the employee to clear their name has already violated it, and the words
  directly or indirectly reach a request routed through a staffing agency or a security consultant
  rather than made in the employer's own name. The exceptions are not in this paragraph: the chapeau
  carries them by cross-reference to sections 2006 and 2007 of this title, neither of which is held
  in this corpus, so an ongoing-investigation or security-services claim cannot be resolved from
  this atom. Note also that the defined term is lie detector and not polygraph; the definition sits
  at 29 U.S.C. § 2001 and is likewise not extracted, so do not assume the paragraph is limited to a
  polygraph machine.
