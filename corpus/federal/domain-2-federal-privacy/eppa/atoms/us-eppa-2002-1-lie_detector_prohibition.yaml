common_errors:
  - >-
    Treating a suggestion as lawful because nothing was required. The prohibited verbs are "require,
    request, suggest, or cause".
  - >-
    Relying on an exception without reading it. The exceptions live in 29 U.S.C. §§ 2006 and 2007,
    which this corpus does not hold; nothing in this paragraph establishes one.
  - >-
    Assuming EPPA settles the question. Its relationship to stricter state polygraph statutes turns
    on 29 U.S.C. § 2009, which is not extracted.
open_questions:
  - >-
    29 U.S.C. §§ 2001, 2006 and 2007 — the definitions and the exemptions — are not extracted. Scope
    and exemption questions cannot be closed from this atom.
