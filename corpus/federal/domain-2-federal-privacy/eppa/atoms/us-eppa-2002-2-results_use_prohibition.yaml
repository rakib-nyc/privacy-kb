common_errors:
  - >-
    Limiting the paragraph to tests the employer arranged. It reaches the results of any lie
    detector test of any employee or prospective employee.
  - >-
    Treating receipt of a third-party report as passive. Accepting and referring to the results are
    prohibited in the same terms as using them.
  - >-
    Asking an applicant about a past test during an interview. The text makes it unlawful to
    "inquire concerning the results", so the inquiry is the violation.
