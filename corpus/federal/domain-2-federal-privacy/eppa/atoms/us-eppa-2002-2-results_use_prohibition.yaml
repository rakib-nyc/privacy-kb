summary: >-
  It is unlawful for a covered employer to use, accept, refer to or inquire concerning the results
  of any lie detector test of any employee or prospective employee.
requirement_detail: >-
  PARAGRAPH (2) CLOSES THE LOOP PARAGRAPH (1) OPENS, and its reach is wider than most readers
  expect. Paragraph (1) stops the employer causing the test; this one stops the employer touching
  the result, and it covers the results of "any lie detector test of any employee or prospective
  employee" — not merely a test the employer arranged. A result volunteered by the applicant,
  produced for a former employer, generated in a law-enforcement setting or surfaced inside a
  background-screening file is therefore off limits, and because the verb list includes "inquire
  concerning the results" the question is unlawful before any answer arrives. The practical failure
  mode is vendor management rather than testing policy: an investigative background report may
  summarise a polygraph, and accepting it is itself the violation, so the screening contract and the
  intake procedure are where this paragraph is complied with or breached. Read with paragraph (1),
  EPPA regulates both the collection and the downstream use of a single category of data, which is a
  rarer shape in federal privacy law than the use-only restrictions that surround it here.
deadline: null
