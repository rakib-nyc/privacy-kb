preemption:
  posture: floor
  authority: null
  note: >-
    EPPA's savings clause is 29 U.S.C. § 2009, which has not been extracted. Nothing in the section
    quoted here displaces state law, and the exceptions cross-referenced in the chapeau are federal
    permissions rather than a bar on stricter state rules — several states prohibit employer
    polygraph testing more broadly than EPPA does. Recorded as floor on that basis, pending
    extraction of § 2009.
