common_errors:
  - >-
    Running the annual notice and treating the job as done. A substantive change in the policies
    triggers a separate notice within a reasonable period.
  - >-
    Applying subsection (c) to colleges. The definition of local educational agency in (c)(6)(C)
    excludes postsecondary institutions.
  - >-
    Collapsing this notice with the scheduled-activity notification in (c)(2)(B). They are different
    notices about different things and both are owed.
