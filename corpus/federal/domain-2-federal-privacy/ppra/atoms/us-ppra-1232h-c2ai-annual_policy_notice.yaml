summary: >-
  A local educational agency must give parents notice of its student-privacy policies at least
  annually at the beginning of the school year, and within a reasonable period after any substantive
  change to them.
requirement_detail: >-
  THE ANNUAL NOTICE IS THE OPERATIONAL SPINE OF SUBSECTION (c) AND IT HAS TWO CLOCKS, not one. The
  recurring clock is fixed and auditable — the notice goes out "at least annually, at the beginning
  of the school year" — while the second is event-driven and deliberately unquantified, running from
  a substantive change in the policies. Schools reliably build the first and forget the second, so a
  mid-year change to a survey or marketing practice goes out with no notice at all, and that is the
  finding an auditor should look for. The duty attaches to a local educational agency, which
  subsection (c)(6)(C) defines to exclude postsecondary institutions, so a university is outside
  this notice regime entirely. Note also that this obligation is about the POLICIES adopted under
  (c)(1); the separate duty in (c)(2)(B) to notify parents of the specific dates on which the listed
  activities are scheduled is a different notice with its own annual clock, and satisfying one does
  not satisfy the other.
deadline:
  trigger_event: >-
    the beginning of each school year, and any substantive change in the policies adopted under 20
    U.S.C. § 1232h(c)(1)
  duration:
    value: 1
    unit: years
  computation: >-
    Notice at least once per year, timed to "the beginning of the school year". A substantive change
    starts a second, separate obligation which the statute times only as a reasonable period after
    the change and does not reduce to a number of days.
