preemption:
  posture: floor
  authority: 20 U.S.C. § 1232h(c)(4)(B)(i)
  note: >-
    Subsection (c)(4)(B)(i) states that the provisions of subsection (c) shall not be construed to
    preempt applicable provisions of State law that require parental notification, so a stricter
    state student-privacy notice regime survives. New York's Education Law § 2-d is the live example
    in this corpus's state layer.
enforcement:
  enforcers:
    - ed
  private_right_of_action: false
  penalty:
    structure: >-
      Administrative. Subsection (f) directs the Secretary to establish or designate an office and
      review board within the Department of Education to investigate, process, review and adjudicate
      violations; subsection (e) conditions the Secretary's enforcement action on a failure to
      comply that cannot be secured by voluntary means. The ultimate sanction is withdrawal of
      federal education funds, as with FERPA.
    range: null
    note: >-
      NO PRIVATE RIGHT OF ACTION. Like FERPA, PPRA is a spending-clause condition enforced
      administratively, so a parent's route is a complaint to the Department's Student Privacy
      Policy Office, not a lawsuit.
  statute_of_limitations: null
