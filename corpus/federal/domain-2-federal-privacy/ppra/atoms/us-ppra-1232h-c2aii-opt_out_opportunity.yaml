no_deadline_stated: >-
  No period is stated for the opt-out offer itself. Subsection (c)(2)(A)(ii) fixes the content of
  the offer and not its timing; the only clock in (c)(2)(A) sits in clause (i) and governs the
  notice, and (c)(2)(B) separately requires annual notification of the dates on which the listed
  activities are scheduled. Checked (c)(2)(A), (c)(2)(B), (c)(2)(C) and (c)(3); none fixes a period
  for the opt-out.
