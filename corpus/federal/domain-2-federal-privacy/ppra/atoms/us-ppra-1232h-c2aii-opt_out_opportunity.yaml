common_errors:
  - >-
    Describing all of PPRA as a consent statute. Subsection (b) requires consent; subsection (c)
    requires only an opportunity to opt out.
  - >-
    Assuming the parent always holds the right. It transfers to the student at 18 or on emancipation
    under (c)(5)(B), and clause (C)(i) adds a student opt-out at an appropriate age for the
    marketing activity.
  - >-
    Treating an opt-out offered after the activity as compliant. The clause fixes no timing of its
    own, so the annual policy notice under clause (i) is what makes the offer usable.
