summary: >-
  The policies must offer parents — and, for a marketing-related activity, a student of an
  appropriate age — an opportunity to opt the student out of the activities listed in subparagraph
  (C).
requirement_detail: >-
  SUBSECTION (c) IS OPT-OUT WHILE SUBSECTION (b) IS OPT-IN, and reading the two as one regime is the
  most common PPRA error. Where a required survey reveals one of the eight protected categories, (b)
  demands consent before it happens; where the activity is one of those listed in (c)(2)(C) —
  marketing-related collection, a survey containing any of the same eight items, or a non-emergency
  invasive physical examination — the school need only offer a chance to "opt the student out of
  participation". The opt-out therefore does the work in most real cases, because most school
  surveys are not compulsory. Note who holds the right: it runs to the parent, and transfers to the
  student at 18 or on emancipation under (c)(5)(B), with an additional student opt-out for the
  marketing activity in clause (C)(i) at an appropriate age. The provision fixes the content of the
  offer and not its timing, so an agency that buries the opt-out in a document issued after the
  activity has been run has met the words and defeated the purpose — which is why the annual notice
  clock in clause (i) is the one an auditor should test against.
