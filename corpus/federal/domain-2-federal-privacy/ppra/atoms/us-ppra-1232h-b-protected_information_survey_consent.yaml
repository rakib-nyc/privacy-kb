summary: A student may not be required, as part of an applicable program, to submit to a survey, analysis or evaluation
  revealing any of the eight enumerated categories without prior consent — written consent of the parent where
  the student is an unemancipated minor.
requirement_detail: 'THIS IS THE OPT-IN HALF OF PPRA AND IT COVERS WHAT FERPA DOES NOT. FERPA governs the education
  record a school already holds; this subsection governs the act of collecting from the student in the first place,
  through a survey, analysis or evaluation, and it bites on eight enumerated subjects — political beliefs, mental
  or psychological problems, sex behaviour, illegal or demeaning behaviour, critical appraisals of close family,
  privileged relationships, religious belief and income. The consent standard is asymmetric and this is where
  the statute is routinely misdescribed: for an unemancipated minor the requirement is "the prior written consent
  of the parent", but where the student is an adult or an emancipated minor the text asks only for "the prior
  consent of the student" and does not say written. Two limits matter as much as the trigger. The prohibition
  attaches to a survey a student is REQUIRED to submit to as part of an applicable program, so a genuinely voluntary
  instrument falls outside this subsection and into the notice-and-opt-out regime of subsection (c); and the income
  category is qualified on its face, excluding income information required by law to determine programme eligibility.
  Under (c)(5)(A)(i) this section does not supersede FERPA, so the two run together rather than one displacing
  the other.'
