  authority: 20 U.S.C. § 1232h(c)(4)(B)(i)
  note: Subsection (c)(4)(B)(i) states that the provisions of subsection (c) shall not be construed to preempt
    applicable provisions of State law that require parental notification, so a stricter state student-privacy
    notice regime survives. New York's Education Law § 2-d is the live example in this corpus's state layer.
