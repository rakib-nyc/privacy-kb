  private_right_of_action: false
  penalty:
    structure: Administrative. Subsection (f) directs the Secretary to establish or designate an office and review
      board within the Department of Education to investigate, process, review and adjudicate violations; subsection
      (e) conditions the Secretary's enforcement action on a failure to comply that cannot be secured by voluntary
      means. The ultimate sanction is withdrawal of federal education funds, as with FERPA.
    range: null
    note: NO PRIVATE RIGHT OF ACTION. Like FERPA, PPRA is a spending-clause condition enforced administratively,
      so a parent's route is a complaint to the Department's Student Privacy Policy Office, not a lawsuit.
