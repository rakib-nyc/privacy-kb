common_errors:
- Saying PPRA always requires prior WRITTEN consent. Written consent is specified for the parent of an unemancipated
  minor; for an adult or emancipated student the text requires prior consent without saying written.
- Applying subsection (b) to every school survey. It reaches a survey a student is required to submit to as part
  of an applicable program and that reveals one of the eight listed categories; anything else is governed by the
  subsection (c) notice and opt-out regime.
- Treating PPRA as displaced by FERPA, or as covering the same ground. FERPA governs records the school holds;
  PPRA governs collection from students, and (c)(5)(A)(i) says this section does not supersede FERPA.
