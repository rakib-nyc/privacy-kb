summary: >-
  Any person who maintains or possesses consumer information for a business purpose must properly
  dispose of it by taking reasonable measures to protect against unauthorized access or use in
  connection with its disposal.
requirement_detail: >-
  The duty attaches on disposal, not on collection or storage. Its standard is 'reasonable measures'
  against unauthorized access to or use of the information IN CONNECTION WITH ITS DISPOSAL — a
  narrower target than general data security. The rule states no method; § 682.3(b) supplies
  examples that are expressly illustrative rather than exhaustive.
preemption:
  posture: floor
  authority: 15 U.S.C. § 1681t
  note: >-
    FCRA preemption is express and partial. This rule implements FACTA § 216 and sits inside the
    FCRA framework, so the § 1681t carve-out map governs whether a given state disposal requirement
    survives. Not resolved on this atom — see the preemption instrument record.
