common_errors:
  - >-
    Reading § 682.3(b)'s five examples as a compliance checklist. The stem says they are
    'illustrative only and are not exclusive or exhaustive methods'; doing all five is not
    automatically reasonable, and doing none of them is not automatically unreasonable.
  - >-
    Treating this as a general data-security duty. It reaches disposal specifically — the Safeguards
    Rule is where the ongoing security obligation lives.
  - >-
    Assuming it applies only to consumer reporting agencies. It reaches ANY person who maintains
    consumer information for a business purpose, which is far broader.
open_questions:
  - >-
    'Reasonable measures' is a standard, not a rule, and the text supplies no threshold. That
    indeterminacy is in the source and is not resolved here.
