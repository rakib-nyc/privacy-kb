summary: >-
  An illustrative — NOT mandatory — example of reasonable disposal: due diligence on, and a contract
  with, a record-destruction company, with ongoing monitoring of its compliance.
requirement_detail: >-
  This is NOT a freestanding obligation. Its governing stem, recorded in operative_context, states
  that the enumerated items 'are illustrative only and are not exclusive or exhaustive methods for
  complying with the rule in this part.' Quoted alone this paragraph reads as a mandate to conduct
  due diligence and contract with a destruction vendor; that reading is wrong. It describes ONE way
  the § 682.3(a) standard can be met.
