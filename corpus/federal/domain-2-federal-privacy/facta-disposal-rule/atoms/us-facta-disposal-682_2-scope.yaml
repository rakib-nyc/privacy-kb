summary: >-
  The rule applies to any person over which the FTC has jurisdiction that, for a business purpose,
  maintains or otherwise possesses consumer information.
requirement_detail: >-
  Scope provision. Applicability turns on TWO conditions that must both hold: FTC jurisdiction over
  the person, and maintaining or possessing consumer information for a business purpose. The first
  incorporates the FTC Act § 45(a)(2) carve-outs by reference — a bank possessing consumer
  information is outside THIS rule and inside the banking agencies' parallel disposal rules.
