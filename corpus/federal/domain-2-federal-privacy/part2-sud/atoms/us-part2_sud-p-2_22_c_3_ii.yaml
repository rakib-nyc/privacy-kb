verbatim_span: >-
  A part 2 program may provide the notice required by this section to a patient by email, if the
  patient agrees to electronic notice and such agreement has not been withdrawn. If the part 2
  program knows that the email transmission has failed, a paper copy of the notice must be provided
  to the patient. Provision of electronic notice by the part 2 program will satisfy the provision
  requirements of this paragraph (c) when timely made in accordance with paragraph (c)(1) or (2) of
  this section.
