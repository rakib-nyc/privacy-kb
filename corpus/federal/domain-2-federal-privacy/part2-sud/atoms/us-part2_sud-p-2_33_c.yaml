verbatim_span: >-
  Lawful holders, other than covered entities and business associates, who wish to redisclose
  patient identifying information pursuant to paragraph (b)(3) of this section must have in place a
  written contract or comparable legal instrument with the contractor or voluntary legal
  representative, which provides that the contractor, subcontractor, or voluntary legal
  representative is fully bound by the provisions of this part upon receipt of the patient
  identifying information. In making any such redisclosures, the lawful holder must furnish such
  recipients with the notice required under § 2.32; require such recipients to implement appropriate
  safeguards to prevent unauthorized uses and disclosures; and require such recipients to report any
  unauthorized uses, disclosures, or breaches of patient identifying information to the lawful
  holder. The lawful holder may only redisclose information to the contractor or subcontractor or
  voluntary legal representative that is necessary for the contractor, subcontractor, or voluntary
  legal representative to perform its duties under the contract or comparable legal instrument.
  Contracts may not permit a contractor, subcontractor, or voluntary legal representative to
  redisclose information to a third party unless that third party is a contract agent of the
  contractor or subcontractor, helping them provide services described in the contract, and only as
  long as the agent only further discloses the information back to the contractor or lawful holder
  from which the information originated.
