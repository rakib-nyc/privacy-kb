verbatim_span: >-
  Within one year of the discontinuation or acquisition of the program, all electronic media on
  which the patient records or patient identifying information resided prior to being transferred to
  the device specified in paragraph (b)(2)(i)(A) of this section or the original and backup
  electronic media specified in paragraph (b)(2)(i)(B) of this section, including email and other
  electronic communications, must be sanitized to render the patient identifying information
  non-retrievable in a manner consistent with the discontinued program's or acquiring program's
  policies and procedures established under § 2.16.
