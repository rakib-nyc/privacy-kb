verbatim_span: >-
  Patient identifying information may be disclosed to medical personnel of the Food and Drug
  Administration (FDA) who assert a reason to believe that the health of any individual may be
  threatened by an error in the manufacture, labeling, or sale of a product under FDA jurisdiction,
  and that the information will be used for the exclusive purpose of notifying patients or their
  physicians of potential dangers.
