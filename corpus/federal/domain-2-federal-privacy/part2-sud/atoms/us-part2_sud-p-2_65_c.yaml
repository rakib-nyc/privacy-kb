verbatim_span: >-
  Any oral argument, review of evidence, or hearing on the application shall be held in the judge's
  chambers or in some other manner which ensures that patient identifying information is not
  disclosed to anyone other than a party to the proceedings, the patient, or the person holding the
  records. The proceeding may include an examination by the judge of the patient records referred to
  in the application.
