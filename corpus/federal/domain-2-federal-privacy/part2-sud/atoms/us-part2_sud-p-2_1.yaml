verbatim_span: >-
  Title 42, United States Code, section 290dd-2(g) authorizes the Secretary to prescribe regulations
  to carry out the purposes of section 290dd-2. Such regulations may contain such definitions, and
  may provide for such safeguards and procedures, including procedures and criteria for the issuance
  and scope of orders under subsection 290dd-2(b)(2)(C), as in the judgment of the Secretary are
  necessary or proper to effectuate the purposes of section 290dd-2, to prevent circumvention or
  evasion thereof, or to facilitate compliance therewith.
