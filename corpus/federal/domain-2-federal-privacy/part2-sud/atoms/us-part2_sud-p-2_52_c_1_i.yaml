verbatim_span: >-
  Have the request reviewed and approved by an Institutional Review Board (IRB) registered with the
  Department of Health and Human Services, Office for Human Research Protections in accordance with
  45 CFR part 46 to ensure that patient privacy is considered and the need for identifiable data is
  justified. Upon request, the researcher may be required to provide evidence of the IRB approval of
  the research project that contains the data linkage component.
