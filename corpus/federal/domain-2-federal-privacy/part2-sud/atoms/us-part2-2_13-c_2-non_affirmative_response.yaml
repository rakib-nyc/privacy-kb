verbatim_span: >-
  Any answer to a request for a disclosure of patient records which is not permissible under the
  regulations in this part must be made in a way that will not affirmatively reveal that an
  identified individual has been, or is being, diagnosed or treated for a substance use disorder. An
  inquiring party may be provided a copy of the regulations in this part and advised that they
  restrict the disclosure of substance use disorder patient records, but may not be told
  affirmatively that the regulations restrict the disclosure of the records of an identified
  patient.
