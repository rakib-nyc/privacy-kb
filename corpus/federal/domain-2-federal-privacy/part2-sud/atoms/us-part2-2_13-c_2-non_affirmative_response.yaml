      The presence of an identified patient in a health care facility or component of a health care
      facility that is publicly identified as a place where only substance use disorder diagnosis,
      treatment, or referral for treatment is provided may be acknowledged only if the patient's
      written consent is obtained in accordance with subpart C of this part or if an authorizing
      court order is entered in accordance with subpart E of this part. The regulations permit
      acknowledgment of the presence of an identified patient in a health care facility or part of a
      health care facility if the health care facility is not publicly identified as only a
      substance use disorder diagnosis, treatment, or referral for treatment facility, and if the
      acknowledgment does not reveal that the patient has a substance use disorder.
