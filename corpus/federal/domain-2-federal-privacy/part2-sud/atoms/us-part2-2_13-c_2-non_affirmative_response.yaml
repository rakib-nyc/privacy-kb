obligation_type: prohibit
summary: >-
  An answer to a request that part 2 does not permit must not affirmatively reveal that an
  identified individual has been or is being diagnosed or treated for a substance use disorder.
requirement_detail: >-
  The refusal itself is a disclosure, and this is where part 2 diverges most visibly from ordinary
  practice. A HIPAA covered entity may tell a requester that it holds records and needs an
  authorization; a part 2 programme may not, because confirming the file exists confirms the
  diagnosis. The permitted response is the one the text specifies: the inquirer may be given a copy
  of the regulations and told that they restrict disclosure of substance use disorder records in
  general, but "may not be told affirmatively that the regulations restrict the disclosure of the
  records of an identified patient". The consequence is operational rather than rhetorical — a
  programme has to answer the same way about a patient it has never seen, or the distinction between
  the two answers becomes the disclosure. This is also the provision that collides with the
  information blocking rule: a flat refusal to confirm looks from the outside like interference
  under 45 C.F.R. § 171.103(a), which is why the actor has to reach the § 171.202(b) privacy
  exception and use reasonable efforts to obtain a conforming consent rather than simply going
  quiet.
preemption:
  posture: floor
  authority: 42 C.F.R. § 2.20
  note: >-
    Section 2.20 states that 42 U.S.C. 290dd-2 does not preempt the field: a State law PROHIBITING a
    use or disclosure that part 2 permits still governs, while no State law may authorize or compel
    a use or disclosure that part 2 forbids. So the ratchet runs one way — part 2 is a floor against
    State permission and a ceiling on nothing.
enforcement:
  enforcers:
    - hhs_ocr
    - doj
  private_right_of_action: false
  penalty:
    structure: >-
      Section 2.3(a) applies the HIPAA penalties — sections 1176 and 1177 of the Social Security
      Act, 42 U.S.C. 1320d-5 and 1320d-6 — to violations of 42 U.S.C. 290dd-2(a)-(d), and § 2.3(c)
      applies 45 C.F.R. part 160 subparts C, D and E to noncompliance with part 2 in the same manner
      as to covered entities.
    range: null
    note: >-
      Enforcement was formerly criminal fines under 42 U.S.C. 290dd-2(f) alone. The current text
      routes part 2 through the HIPAA enforcement machinery, which means OCR investigation, civil
      money penalties and the § 2.4 complaint process — a materially larger exposure than the
      pre-alignment position.
  statute_of_limitations: null
