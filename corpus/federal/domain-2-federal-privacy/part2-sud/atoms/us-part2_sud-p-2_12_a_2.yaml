verbatim_span: >-
  The restriction on use or disclosure of information to initiate or substantiate any criminal
  charges against a patient or to conduct any criminal investigation of a patient (42 U.S.C.
  290dd-2(c)) applies to any information, whether or not recorded, which is substance use disorder
  information obtained by a federally assisted substance use disorder program after March 20, 1972
  (part 2 program), or is alcohol use disorder information obtained by a federally assisted alcohol
  use disorder or substance use disorder program after May 13, 1974 (part 2 program); or if obtained
  before the pertinent date, is maintained by a part 2 program after that date as part of an ongoing
  treatment episode which extends past that date; for the purpose of treating a substance use
  disorder, making a diagnosis for the treatment, or making a referral for the treatment.
