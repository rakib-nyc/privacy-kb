obligation_type: prohibit
summary: >-
  Records subject to part 2 may be used or disclosed only as part 2 permits, may not be used or
  disclosed in any proceeding conducted by any federal, state or local authority, and any permitted
  use or disclosure must be limited to the information necessary for its purpose.
requirement_detail: >-
  This is the provision that makes part 2 STRICTER than HIPAA on the same underlying record. The
  Privacy Rule permits a covered entity to use or disclose PHI for treatment, payment and health
  care operations without the individual's authorization; § 2.13(a) permits a use or disclosure of a
  part 2 record only as the regulations in this part allow, and subpart C routes those same three
  purposes through the patient's written consent under § 2.31. The CARES Act alignment visible in
  the current text did NOT remove that consent requirement: it permits a single consent to cover all
  future uses and disclosures for treatment, payment and health care operations (§ 2.31(a)(5)(ii))
  and lets a HIPAA-regulated recipient redisclose under the HIPAA rules (§ 2.31(a)(4)(iii)), which
  changes the FORM and the DURABILITY of consent, not its necessity. The second sentence adds a
  minimum-necessary rule of its own — every permitted use or disclosure must be "limited to that
  information which is necessary to carry out the purpose of the use or disclosure" — and the first
  sentence carries a litigation bar the Privacy Rule has no analogue for, which is why a subpoena
  that would satisfy 45 C.F.R. § 164.512(e) does not reach a part 2 record. An entity subject to
  both regimes satisfies the stricter one or it is not compliant.
preemption:
  posture: floor
  authority: 42 C.F.R. § 2.20
  note: >-
    Section 2.20 states that 42 U.S.C. 290dd-2 does not preempt the field: a State law PROHIBITING a
    use or disclosure that part 2 permits still governs, while no State law may authorize or compel
    a use or disclosure that part 2 forbids. So the ratchet runs one way — part 2 is a floor against
    State permission and a ceiling on nothing.
enforcement:
  enforcers:
    - hhs_ocr
    - doj
  private_right_of_action: false
  penalty:
    structure: >-
      Section 2.3(a) applies the HIPAA penalties — sections 1176 and 1177 of the Social Security
      Act, 42 U.S.C. 1320d-5 and 1320d-6 — to violations of 42 U.S.C. 290dd-2(a)-(d), and § 2.3(c)
      applies 45 C.F.R. part 160 subparts C, D and E to noncompliance with part 2 in the same manner
      as to covered entities.
    range: null
    note: >-
      Enforcement was formerly criminal fines under 42 U.S.C. 290dd-2(f) alone. The current text
      routes part 2 through the HIPAA enforcement machinery, which means OCR investigation, civil
      money penalties and the § 2.4 complaint process — a materially larger exposure than the
      pre-alignment position.
  statute_of_limitations: null
