verbatim_span: >-
  The patient records subject to the regulations in this part may be used or disclosed only as
  permitted by the regulations in this part and may not otherwise be used or disclosed in any civil,
  criminal, administrative, or legislative proceedings conducted by any Federal, state, or local
  authority. Any use or disclosure made under the regulations in this part must be limited to that
  information which is necessary to carry out the purpose of the use or disclosure.
