exemptions:
  - id: cfr.42.2.12.c.3.internal_program_communications
    type: activity_level
    scope: >-
      Communications among personnel who need the information for duties arising out of diagnosis,
      treatment or referral, within a part 2 program or between the program and an entity with
      direct administrative control over it, are outside the restrictions. CONSEQUENCE TEST: the
      program stays fully covered and every outbound disclosure still needs consent; only this
      internal traffic is relieved. Typed activity_level because the relief attaches to the
      communication, not to the record — the identical record disclosed one step further, to the
      parent organisation's marketing function, is prohibited again.
    source_citation: 42 C.F.R. § 2.12(c)(3)
    verbatim_span: >-
      The restrictions on use and disclosure in the regulations in this part do not apply to
      communications of information between or among personnel having a need for the information in
      connection with their duties that arise out of the provision of diagnosis, treatment, or
      referral for treatment of patients with substance use disorders if the communications are:
    burden_of_proof: entity
    applies_if:
      all:
        - practice.is_internal_part2_program_communication == true
  - id: cfr.42.2.12.c.4.qualified_service_organization
    type: activity_level
    scope: >-
      Communications between a part 2 program and a qualified service organization, of information
      the QSO needs to provide services to or on behalf of the program, are outside the
      restrictions. This is part 2's analogue to the HIPAA business associate route and it is
      narrower: the relief is limited to what the QSO NEEDS for the services, and the QSO agreement
      itself binds the organisation back into part 2 for anything else. CONSEQUENCE TEST: no consent
      is needed for the vendor feed; consent is still needed for everything the vendor is not
      performing.
    source_citation: 42 C.F.R. § 2.12(c)(4)
    verbatim_span: >-
      The restrictions on use and disclosure in the regulations in this part do not apply to the
      communications between a part 2 program and a qualified service organization of information
      needed by the qualified service organization to provide services to or on behalf of the
      program.
    burden_of_proof: entity
    applies_if:
      all:
        - practice.is_qualified_service_organization_communication == true
  - id: cfr.42.2.12.c.6.child_abuse_reporting
    type: activity_level
    scope: >-
      Reporting suspected child abuse and neglect under State law is outside the restrictions.
      CONSEQUENCE TEST — and this is the half that gets dropped: the relief covers the REPORT and
      nothing else. The original records stay fully restricted, including for the civil or criminal
      proceedings that grow out of the report, so a programme that treats the mandatory report as
      unlocking the file for the ensuing custody case has misread the exception.
    source_citation: 42 C.F.R. § 2.12(c)(6)
    verbatim_span: >-
      The restrictions on use and disclosure in the regulations in this part do not apply to the
      reporting under state law of incidents of suspected child abuse and neglect to the appropriate
      state or local authorities. However, the restrictions continue to apply to the original
      substance use disorder patient records maintained by the part 2 program including their use
      and disclosure for civil or criminal proceedings which may arise out of the report of
      suspected child abuse and neglect.
    burden_of_proof: entity
    applies_if:
      all:
        - practice.is_state_child_abuse_report == true
  - id: cfr.42.2.12.c.1.va_title_38_records
    type: data_level
    scope: >-
      Information on substance use disorder patients maintained in connection with the Department of
      Veterans Affairs' provision of care under Title 38 is not governed by part 2; 38 U.S.C. 7332
      and the VA's own regulations govern instead. CONSEQUENCE TEST: the records are not
      unregulated, they are regulated elsewhere, and 38 U.S.C. 7332 is in several respects stricter
      still. Typed data_level because the VA remains capable of holding part 2 records in other
      capacities.
    source_citation: 42 C.F.R. § 2.12(c)(1)
    verbatim_span: >-
      These regulations do not apply to information on substance use disorder patients maintained in
      connection with the Department of Veterans Affairs' provision of hospital care, nursing home
      care, domiciliary care, and medical services under Title 38, U.S.C. Those records are governed
      by 38 U.S.C. 7332 and regulations issued under that authority by the Secretary of Veterans
      Affairs.
    burden_of_proof: entity
    applies_if:
      all:
        - data.is_va_title_38_record == true
  - id: cfr.42.2.12.e.2.not_a_part_2_program
    type: entity_level
    reach: instrument
    scope: >-
      If the diagnosis, treatment or referral was not provided by a part 2 program, the patient's
      record is outside part 2 altogether. CONSEQUENCE TEST: there is no part 2 compliance programme
      to build — no consent form, no redisclosure notice, no § 2.16 policies — because the
      instrument does not reach the entity at all, which is why reach is instrument and not
      obligation. The trap is the second sentence: federal money reaching the PATIENT is not federal
      assistance to the PROGRAM, so a court-placed patient whose care a federal agency pays for is
      still outside part 2 unless the program itself is federally assisted under § 2.12(b). Note
      what the relief does NOT do — the same records remain PHI in the hands of a covered entity, so
      exiting part 2 routes the analysis back to the Privacy Rule rather than out of regulation.
    source_citation: 42 C.F.R. § 2.12(e)(2)
    verbatim_span: >-
      If a patient's substance use disorder diagnosis, treatment, or referral for treatment is not
      provided by a part 2 program, that patient's record is not covered by the regulations in this
      part. Thus, it is possible for an individual patient to benefit from federal support and not
      be covered by the confidentiality regulations because the program in which the patient is
      enrolled is not federally assisted as defined in paragraph (b) of this section. For example,
      if a federal court placed an individual in a private for-profit program and made a payment to
      the program on behalf of that individual, that patient's record would not be covered by the
      regulations in this part unless the program itself received federal assistance as defined by
      paragraph (b) of this section.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_part2_program == false
common_errors:
  - >-
    Accepting a HIPAA authorization for a part 2 record. Subpart C consent carries elements §
    164.508 does not require, and § 2.31(c)(2) bars disclosure on a consent that on its face
    substantially fails to conform to § 2.31(a).
  - >-
    Reading the CARES Act alignment as putting part 2 records on HIPAA's treatment, payment and
    operations footing. It permits ONE consent for those purposes; it does not permit disclosure
    without one.
  - >-
    Producing records under a subpoena, or under a court order that is not an authorizing court
    order under subpart E. Section 2.13(a) bars use in any proceeding conducted by any federal,
    state or local authority, and § 2.13(b) applies the restriction whatever justification the
    requester asserts.
