obligation_type: obtain_consent
summary: >-
  A part 2 consent may be paper or electronic and must contain the enumerated elements, including
  the recipient, each purpose, the right to revoke, an expiration date or event, and the signature
  and date.
requirement_detail: >-
  A part 2 consent is not a HIPAA authorization with a different name, and the differences are the
  ones that bite in integration work. It must identify the person or class authorized to MAKE the
  disclosure as well as the recipient, and where the recipient is an intermediary it must name the
  intermediary and either its member participants or a general designation limited to participants
  with a treating provider relationship — a requirement 45 C.F.R. § 164.508 has no counterpart to
  and the reason HIE participation needs bespoke consent language. Paragraph (a)(5)(ii) is the CARES
  Act change: the statement "for treatment, payment, and health care operations" is a sufficient
  description of purpose when a patient consents once for all such future uses, which is what makes
  a single durable consent possible where part 2 previously forced per-disclosure consent. Paragraph
  (a)(4)(iii) is the other half of that bargain — where the recipient is a covered entity or
  business associate taking the record for those purposes, the consent must say the record may be
  redisclosed under the HIPAA rules, EXCEPT for uses and disclosures in proceedings against the
  patient, so the litigation bar survives the handoff into HIPAA-land. The consent must also carry
  the revocation right subject to reliance already placed on it, and an expiration date or event.
preemption:
  posture: floor
  authority: 42 C.F.R. § 2.20
  note: >-
    Section 2.20 states that 42 U.S.C. 290dd-2 does not preempt the field: a State law PROHIBITING a
    use or disclosure that part 2 permits still governs, while no State law may authorize or compel
    a use or disclosure that part 2 forbids. So the ratchet runs one way — part 2 is a floor against
    State permission and a ceiling on nothing.
enforcement:
  enforcers:
    - hhs_ocr
    - doj
  private_right_of_action: false
  penalty:
    structure: >-
      Section 2.3(a) applies the HIPAA penalties — sections 1176 and 1177 of the Social Security
      Act, 42 U.S.C. 1320d-5 and 1320d-6 — to violations of 42 U.S.C. 290dd-2(a)-(d), and § 2.3(c)
      applies 45 C.F.R. part 160 subparts C, D and E to noncompliance with part 2 in the same manner
      as to covered entities.
    range: null
    note: >-
      Enforcement was formerly criminal fines under 42 U.S.C. 290dd-2(f) alone. The current text
      routes part 2 through the HIPAA enforcement machinery, which means OCR investigation, civil
      money penalties and the § 2.4 complaint process — a materially larger exposure than the
      pre-alignment position.
  statute_of_limitations: null
