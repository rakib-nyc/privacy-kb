exemptions:
  - id: cfr.42.2.12.e.2.not_a_part_2_program
    type: entity_level
    reach: instrument
    scope: >-
      If the diagnosis, treatment or referral was not provided by a part 2 program, the patient's
      record is outside part 2 altogether. CONSEQUENCE TEST: there is no part 2 compliance programme
      to build — no consent form, no redisclosure notice, no § 2.16 policies — because the
      instrument does not reach the entity at all, which is why reach is instrument and not
      obligation. The trap is the second sentence: federal money reaching the PATIENT is not federal
      assistance to the PROGRAM, so a court-placed patient whose care a federal agency pays for is
      still outside part 2 unless the program itself is federally assisted under § 2.12(b). Note
      what the relief does NOT do — the same records remain PHI in the hands of a covered entity, so
      exiting part 2 routes the analysis back to the Privacy Rule rather than out of regulation.
    source_citation: 42 C.F.R. § 2.12(e)(2)
    verbatim_span: >-
      If a patient's substance use disorder diagnosis, treatment, or referral for treatment is not
      provided by a part 2 program, that patient's record is not covered by the regulations in this
      part. Thus, it is possible for an individual patient to benefit from federal support and not
      be covered by the confidentiality regulations because the program in which the patient is
      enrolled is not federally assisted as defined in paragraph (b) of this section. For example,
      if a federal court placed an individual in a private for-profit program and made a payment to
      the program on behalf of that individual, that patient's record would not be covered by the
      regulations in this part unless the program itself received federal assistance as defined by
      paragraph (b) of this section.
    burden_of_proof: entity
    applies_if:
      all:
        - entity.is_part2_program == false
common_errors:
  - >-
    Reusing a § 164.508 authorization form. It will lack the person authorized to make the
    disclosure, the intermediary designation and the part 2 redisclosure statement, and § 2.31(c)(2)
    bars disclosure on a consent that substantially fails to conform on its face.
  - >-
    Believing the single treatment, payment and operations consent ends part 2 segregation. It ends
    the need for a fresh consent each time; the record still cannot be used against the patient in a
    proceeding, which is why § 2.31(a)(4)(iii) carves that use out of the redisclosure permission.
  - >-
    Treating revocation as absolute. The consent must state the right to revoke in writing EXCEPT to
    the extent the holder has already acted in reliance on it.
