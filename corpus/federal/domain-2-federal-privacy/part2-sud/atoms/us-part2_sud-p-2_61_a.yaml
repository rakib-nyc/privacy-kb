verbatim_span: >-
  An order of a court of competent jurisdiction entered under this subpart is a unique kind of court
  order. Its only purpose is to authorize a use or disclosure of patient information which would
  otherwise be prohibited by 42 U.S.C. 290dd-2 and the regulations in this part. Such an order does
  not compel use or disclosure. A subpoena or a similar legal mandate must be issued to compel use
  or disclosure. This mandate may be entered at the same time as and accompany an authorizing court
  order entered under the regulations in this part.
