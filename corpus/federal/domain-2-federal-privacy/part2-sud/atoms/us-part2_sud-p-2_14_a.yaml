verbatim_span: >-
  If a minor patient acting alone has the legal capacity under the applicable state law to apply for
  and obtain substance use disorder treatment, any written consent for use or disclosure authorized
  under subpart C of this part may be given only by the minor patient. This restriction includes,
  but is not limited to, any disclosure of patient identifying information to the parent or guardian
  of a minor patient for the purpose of obtaining financial reimbursement. The regulations in this
  paragraph (a) do not prohibit a part 2 program from refusing to provide treatment until the minor
  patient consents to a use or disclosure that is necessary to obtain reimbursement, but refusal to
  provide treatment may be prohibited under a state or local law requiring the program to furnish
  the service irrespective of ability to pay.
