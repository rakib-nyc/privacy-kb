verbatim_span: >-
  An order authorizing the use or disclosure of patient records, or testimony relaying the
  information contained in those records, to investigate or prosecute a patient in connection with a
  criminal proceeding may be applied for by the person holding the records or by any law enforcement
  or prosecutorial official who is responsible for conducting investigative or prosecutorial
  activities with respect to the enforcement of criminal laws, including administrative and
  legislative criminal proceedings. The application may be filed separately, as part of an
  application for a subpoena or other compulsory process, or in a pending criminal action. An
  application must use a fictitious name such as John Doe, to refer to any patient and may not
  contain or otherwise use or disclose patient identifying information unless the court has ordered
  the record of the proceeding sealed from public scrutiny.
