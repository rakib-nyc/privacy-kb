obligation_type: obtain_consent
summary: >-
  A part 2 program must obtain consent for any use or disclosure of SUD counseling notes,
  notwithstanding any other provision of the consent subpart, subject only to enumerated exceptions.
requirement_detail: >-
  SUD counseling notes are part 2's answer to psychotherapy notes and they are the exception to the
  exception. The opening words matter: the consent duty applies notwithstanding any provision of
  this subpart, so the single durable treatment, payment and operations consent that paragraph
  (a)(5)(ii) permits does NOT reach counseling notes — they need their own consent, obtained
  separately. The carve-outs are narrow and closed: use by the originator for treatment, use in the
  programme's own supervised training, defence of a legal action brought BY the patient, and the
  specific provisions listed in (b)(1)(ii). Paragraph (2) then blocks the usual workaround — a
  consent for counseling notes "may only be combined with another written consent for a use or
  disclosure of SUD counseling notes" — so the notes consent cannot ride on a general form.
  Paragraph (3) forbids conditioning treatment, payment, health plan enrolment or benefits
  eligibility on giving it, which makes a refusal costless to the patient and is the design point
  most often lost when consent flows are built for throughput.
preemption:
  posture: floor
  authority: 42 C.F.R. § 2.20
  note: >-
    Section 2.20 states that 42 U.S.C. 290dd-2 does not preempt the field: a State law PROHIBITING a
    use or disclosure that part 2 permits still governs, while no State law may authorize or compel
    a use or disclosure that part 2 forbids. So the ratchet runs one way — part 2 is a floor against
    State permission and a ceiling on nothing.
enforcement:
  enforcers:
    - hhs_ocr
    - doj
  private_right_of_action: false
  penalty:
    structure: >-
      Section 2.3(a) applies the HIPAA penalties — sections 1176 and 1177 of the Social Security
      Act, 42 U.S.C. 1320d-5 and 1320d-6 — to violations of 42 U.S.C. 290dd-2(a)-(d), and § 2.3(c)
      applies 45 C.F.R. part 160 subparts C, D and E to noncompliance with part 2 in the same manner
      as to covered entities.
    range: null
    note: >-
      Enforcement was formerly criminal fines under 42 U.S.C. 290dd-2(f) alone. The current text
      routes part 2 through the HIPAA enforcement machinery, which means OCR investigation, civil
      money penalties and the § 2.4 complaint process — a materially larger exposure than the
      pre-alignment position.
  statute_of_limitations: null
