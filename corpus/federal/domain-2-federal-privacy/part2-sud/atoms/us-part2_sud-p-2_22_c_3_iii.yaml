verbatim_span: >-
  For purposes of paragraph (c)(2)(i) of this section, if the first service delivery to an
  individual is delivered electronically, the part 2 program must provide electronic notice
  automatically and contemporaneously in response to the individual's first request for service. The
  requirements in paragraph (c)(2)(ii) of this section apply to electronic notice.
