verbatim_span: >-
  If the recipient is a covered entity or business associate to whom a record (or information
  contained in a record) is disclosed for purposes of treatment, payment, or health care operations,
  a written consent must include the statement that the patient's record (or information contained
  in the record) may be redisclosed in accordance with the permissions contained in the HIPAA
  regulations, except for uses and disclosures for civil, criminal, administrative, and legislative
  proceedings against the patient.
