verbatim_span: >-
  Subject to the limitations in paragraph (b) of this section, a part 2 program must provide to a
  patient, upon request, an accounting of all disclosures made with consent under § 2.31 in the 3
  years prior to the date of the request (or a shorter time period chosen by the patient). The
  accounting of disclosures must meet the requirements of 45 CFR 164.528(a)(2) and (b) through (d).
