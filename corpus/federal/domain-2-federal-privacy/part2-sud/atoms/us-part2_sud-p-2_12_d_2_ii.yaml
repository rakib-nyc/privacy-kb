verbatim_span: >-
  Notwithstanding paragraph (d)(2)(i)(C) of this section, a treating provider who is not subject to
  this part may record information about a SUD and its treatment that identifies a patient. This is
  permitted and does not constitute a record that has been redisclosed under this part. The act of
  recording information about a SUD and its treatment does not by itself render a medical record
  which is created by a treating provider who is not subject to this part, subject to the
  restrictions of this part.
