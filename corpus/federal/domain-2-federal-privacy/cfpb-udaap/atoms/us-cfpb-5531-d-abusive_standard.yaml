common_errors:
- Importing the unfairness injury test into abusive. Nothing in § 5531(d) requires substantial injury
  or a cost-benefit balance; the (d)(2) limbs rest on "takes unreasonable advantage of" alone.
- Assuming the FTC can plead the same theory. § 45(a)(1) declares only unfair and deceptive acts unlawful
  and § 45(n) defines only unfairness, so the FTC Act has no abusive prong — the 'abusive telemarketing
  acts or practices' category in the Telemarketing Sales Rule is a separate, rule-specific standard, not
  this one.
- Reading (d)(2)(C) as rhetorical. It makes "the reasonable reliance by the consumer on a covered person
  to act in the interests of the consumer" a standalone trigger, so a relationship of trust can carry
  a claim with no misstatement and no quantified injury behind it.
open_questions:
- What "unreasonable advantage" requires beyond the listed vulnerabilities is not defined in the section.
  The Bureau's interpretive statements on the abusive standard are agency_guidance under invariant I7
  and are not extracted here; do not blend them into this citation.
