  note: 'Title X of Dodd-Frank operates as a floor: it does not displace state consumer-protection law
    that gives greater protection, and state attorneys general may enforce Title X itself. The savings
    provision that establishes this sits outside § 5531 and is NOT extracted in this corpus, so the posture
    is recorded here and its text is not quoted. New York GBL § 349 is the live example — it reaches the
    same conduct, adds a private right of action the Bureau statute does not have, and since 2025 carries
    its own abusive prong.'
