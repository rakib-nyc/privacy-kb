obligation_type: prohibit
summary: 'The abusive standard: the Bureau may declare an act abusive where it materially interferes with
  a consumer''s ability to understand a term or condition, or takes unreasonable advantage of a consumer''s
  lack of understanding, inability to protect their interests, or reasonable reliance on the covered person.'
requirement_detail: 'THE THIRD PRONG, AND THE ONE THE FTC ACT DOES NOT HAVE. Read against § 5531(c), the
  abusive standard is defined by what it omits: no injury element, no substantiality requirement and no
  balance against countervailing benefits appears anywhere in (d), and its limbs are disjunctive where
  the (c)(1) limbs are cumulative. (d)(1) reaches conduct that "materially interferes with the ability
  of a consumer to understand a term or condition" of the product, so no misrepresentation is needed and
  design or presentation can be the whole of the claim. (d)(2) reaches conduct that "takes unreasonable
  advantage of" one of three vulnerabilities, and the third — "the reasonable reliance by the consumer
  on a covered person to act in the interests of the consumer" — makes a relationship of trust an independent
  trigger in a statute that imposes no fiduciary duty. Two further textual differences from (c): (d) carries
  no counterpart to the requirement that the Bureau have a reasonable basis to conclude the limbs are
  met, and it is scoped to acts "in connection with the provision of a consumer financial product or service"
  rather than to a transaction with a consumer or the offering of one. New York copied this structure
  into GBL § 349 in 2025 and broadened it, swapping the Bureau statute''s consumer and covered person
  for any person — so the state version reaches entities the Bureau cannot, and unlike § 5531 it is privately
  enforceable.'
exemptions: []
