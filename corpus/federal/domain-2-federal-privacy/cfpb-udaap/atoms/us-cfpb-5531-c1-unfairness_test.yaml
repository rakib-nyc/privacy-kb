common_errors:
- Treating § 5531(c)(1) and 15 U.S.C. § 45(n) as one test. The Bureau's version turns on whether it "has
  a reasonable basis to conclude that" the limbs hold, and it drops the word 'themselves' that § 45(n)
  attaches to reasonable avoidability.
- 'Calling unfairness the Bureau''s broadest tool. It is the narrowest prong in this section: it alone
  requires substantial injury and a balance against countervailing benefits, neither of which appears
  in the abusive standard at § 5531(d).'
- Applying the test to any business. It reaches only acts "in connection with a transaction with a consumer
  for a consumer financial product or service", and Title X removes whole classes of actor from the Bureau's
  authority in sections not extracted here.
open_questions:
- Coverage exclusions from the Bureau's authority (merchants and retailers, motor-vehicle dealers and
  others) sit outside § 5531 and are NOT extracted in this corpus, so this atom models no entity-level
  exemption. Treat any question about whether the Bureau reaches a given entity as unanswered until those
  sections are fetched and verified.
- The section's source credit shows Pub. L. 111-203, July 21, 2010, and no amendment. effective_from records
  that date. Dodd-Frank made subtitle C operative on the designated transfer date, which is fixed in a
  different section and is not in this source.
