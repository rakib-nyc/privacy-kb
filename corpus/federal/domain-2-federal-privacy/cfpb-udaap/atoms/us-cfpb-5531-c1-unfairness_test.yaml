obligation_type: prohibit
summary: The Bureau may declare an act or practice unfair only where it has a reasonable basis to conclude
  that the act causes or is likely to cause substantial injury to consumers that is not reasonably avoidable
  and is not outweighed by countervailing benefits.
requirement_detail: 'THE BUREAU''S UNFAIRNESS TEST IS THE FTC''S, WITH TWO TEXTUAL DIFFERENCES. The substantive
  limbs track 15 U.S.C. § 45(n) closely: substantial injury "not reasonably avoidable by consumers" in
  (c)(1)(A), and injury "not outweighed by countervailing benefits to consumers or to competition" in
  (c)(1)(B), both of which must hold. First difference: § 45(n) requires injury not reasonably avoidable
  by consumers themselves, and (c)(1)(A) omits that word — whether the omission does any work is unsettled,
  but the texts are not identical and FTC precedent should be checked against the Bureau''s wording rather
  than assumed to carry over. Second and larger: § 45(n) conditions the Commission''s authority on what
  the act or practice does, while (c)(1) conditions the Bureau''s on whether it "has a reasonable basis
  to conclude that" the limbs are met, which is a standard addressed to the agency''s own record rather
  than to the conduct. The reach is also sectoral rather than general — the test bites only on acts "in
  connection with a transaction with a consumer for a consumer financial product or service", where §
  45(n) reaches any act in or affecting commerce.'
