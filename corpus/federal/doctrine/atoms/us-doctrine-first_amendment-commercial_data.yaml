common_errors:
- Reading Sorrell as making data privacy law unconstitutional. It struck a statute that discriminated
  by speaker and content; general privacy rules are analysed differently.
- Ignoring it when drafting sector-specific rules. Speaker-based distinctions are where the risk concentrates.
open_questions:
- UNVERIFIED under invariant I1 — must not be surfaced. Recorded so the corpus can flag that a proposed
  restriction has a First Amendment dimension, not so it can be cited.
doctrine_statement: Restrictions on the sale, disclosure and use of data may be treated as regulating
  speech, and a restriction that discriminates by speaker or by content faces heightened scrutiny. This
  constrains how narrowly a privacy statute may target particular users of information.
