common_errors:
- Citing Carpenter as though it abolished the third-party doctrine. It declined to extend it to historical
  cell-site location information and expressly reserved other applications.
- Treating a statutory access route as constitutionally sufficient. RFPA and the SCA supply procedure;
  the Fourth Amendment question is separate and can be stricter.
open_questions:
- UNVERIFIED under invariant I1 and therefore MUST NOT be surfaced in any output. Supreme Court opinions
  have no structured source in this pipeline and this record quotes no text. It exists so the corpus can
  say the constitutional question is separate from the statutory one — not so it can be cited.
doctrine_statement: Information voluntarily conveyed to a third party has historically carried no reasonable
  expectation of privacy, and Carpenter declined to extend that reasoning to historical cell-site location
  records — holding their acquisition a Fourth Amendment search. The boundary between the two is unsettled
  and is decided case by case.
source_authority: U.S. Const. amend. IV; Carpenter v. United States, 585 U.S. 296 (2018); United States
