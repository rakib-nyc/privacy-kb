common_errors:
- Assuming a residency-based trigger is per se extraterritorial. National Pork Producers rejected a broad
  extraterritoriality principle, leaving Pike balancing.
- Reading it as a preemption doctrine. It constrains states in the ABSENCE of federal action, which is
  the opposite posture from preemption.
