doctrine_statement: A state law that discriminates against or unduly burdens interstate commerce may be
  invalid even absent federal legislation. For state privacy statutes the live question is extraterritorial
  reach — a statute attaching to the residency of a data subject regulates conduct wholly outside the
  state — though National Pork Producers narrowed the extraterritoriality theory considerably.
source_authority: U.S. Const. art. I, § 8, cl. 3; National Pork Producers Council v. Ross, 598 U.S. 356
  (2023); Pike v. Bruce Church, Inc., 397 U.S. 137 (1970)
