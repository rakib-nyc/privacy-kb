verbatim_span: >-
  Pending judicial review, the respondent may file a request for stay of the effective date of any
  penalty with the ALJ. The request must be accompanied by a copy of the notice of appeal filed with
  the Federal court. The filing of the request automatically stays the effective date of the penalty
  until such time as the ALJ rules upon the request.
