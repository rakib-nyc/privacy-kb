verbatim_span: >-
  The Board must rule on the motion for reconsideration not later than 30 days from the date the
  opposition brief is due. If the Board denies the motion, the decision issued under paragraph (i)
  of this section becomes the final decision of the Secretary on the date of service of the ruling.
  If the Board grants the motion, the Board will issue a reconsidered decision, after such
  procedures as the Board determines necessary to address the effect of any error. The Board's
  decision on reconsideration becomes the final decision of the Secretary on the date of service of
  the decision, except with respect to a decision to remand to the ALJ.
