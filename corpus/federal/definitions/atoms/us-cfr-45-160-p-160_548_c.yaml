verbatim_span: >-
  A notice of appeal must be accompanied by a written brief specifying exceptions to the initial
  decision and reasons supporting the exceptions. Any party may file a brief in opposition to the
  exceptions, which may raise any relevant issue not addressed in the exceptions, within 30 days of
  receiving the notice of appeal and the accompanying brief. The Board may permit the parties to
  file reply briefs.
