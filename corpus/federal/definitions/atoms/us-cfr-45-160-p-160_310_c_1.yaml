verbatim_span: >-
  A covered entity or business associate must permit access by the Secretary during normal business
  hours to its facilities, books, records, accounts, and other sources of information, including
  protected health information, that are pertinent to ascertaining compliance with the applicable
  administrative simplification provisions. If the Secretary determines that exigent circumstances
  exist, such as when documents may be hidden or destroyed, a covered entity or business associate
  must permit access by the Secretary at any time and without notice.
