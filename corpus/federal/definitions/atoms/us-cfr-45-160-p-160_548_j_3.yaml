verbatim_span: >-
  A party may file a motion for reconsideration with the Board before the date the decision becomes
  final under paragraph (j)(1) of this section. A motion for reconsideration must be accompanied by
  a written brief specifying any alleged error of fact or law and, if the party is relying on
  additional evidence, explaining why the evidence was not previously available. Any party may file
  a brief in opposition within 15 days of receiving the motion for reconsideration and the
  accompanying brief unless this time limit is extended by the Board for good cause shown. Reply
  briefs are not permitted.
