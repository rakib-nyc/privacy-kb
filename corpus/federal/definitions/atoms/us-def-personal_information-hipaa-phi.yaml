open_questions:
  - >-
    NO natural_person_only ELEMENT IS TAGGED, and the absence is deliberate. FCRA states the limit
    outright — "The term ‘consumer’ means an individual" — and GLBA's scope provision reaches
    "individuals who obtain financial products or services primarily for personal, family or
    household purposes". HIPAA states no equivalent. 45 C.F.R. § 160.103 defines "Person" to INCLUDE
    a corporation, partnership, trust or estate, and defines "Individual" circularly as "the person
    who is the subject of protected health information". The natural-person limit is therefore
    implicit in the subject matter — only a human being has a physical or mental health condition —
    rather than stated. Read the computed difference accordingly: it records that HIPAA does not SAY
    this, not that HIPAA covers companies. Tagging the element anyway would have made the comparison
    read better and made it wrong.
