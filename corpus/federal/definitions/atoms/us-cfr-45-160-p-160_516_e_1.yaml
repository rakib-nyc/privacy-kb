verbatim_span: >-
  When a request for production of documents has been received, within 30 days the party receiving
  that request must either fully respond to the request, or state that the request is being objected
  to and the reasons for that objection. If objection is made to part of an item or category, the
  part must be specified. Upon receiving any objections, the party seeking production may then,
  within 30 days or any other time frame set by the ALJ, file a motion for an order compelling
  discovery. The party receiving a request for production may also file a motion for protective
  order any time before the date the production is due.
