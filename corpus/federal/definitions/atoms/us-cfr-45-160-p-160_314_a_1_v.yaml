verbatim_span: >-
  If the subpoena is addressed to an entity, describe with reasonable particularity the subject
  matter on which testimony is required. In that event, the entity must designate one or more
  natural persons who will testify on its behalf, and must state as to each such person that
  person's name and address and the matters on which he or she will testify. The designated person
  must testify as to matters known or reasonably available to the entity.
