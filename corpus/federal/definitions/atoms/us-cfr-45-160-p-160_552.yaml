verbatim_span: >-
  No error in either the admission or the exclusion of evidence, and no error or defect in any
  ruling or order or in any act done or omitted by the ALJ or by any of the parties is ground for
  vacating, modifying or otherwise disturbing an otherwise appropriate ruling or order or act,
  unless refusal to take such action appears to the ALJ or the Board inconsistent with substantial
  justice. The ALJ and the Board at every stage of the proceeding must disregard any error or defect
  in the proceeding that does not affect the substantial rights of the parties.
