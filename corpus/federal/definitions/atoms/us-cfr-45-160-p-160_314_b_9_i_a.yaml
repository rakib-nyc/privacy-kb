verbatim_span: >-
  Where the witness will be provided a copy of the transcript, the transcript will be submitted to
  the witness for signature. The witness may submit to the Secretary written proposed corrections to
  the transcript, with such corrections attached to the transcript. If the witness does not return a
  signed copy of the transcript or proposed corrections within 30 days (computed in the same manner
  as prescribed under § 160.526 of this part) of its being submitted to him or her for signature,
  the witness will be deemed to have agreed that the transcript is true and accurate.
