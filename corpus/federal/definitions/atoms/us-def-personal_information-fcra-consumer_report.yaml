elements:
  - id: fcra.e1
    kind: includes
    concept: subject_credit_character
    verbatim_span: >-
      The term “consumer report” means any written, oral, or other communication of any information
      by a consumer reporting agency bearing on a consumer’s credit worthiness, credit standing,
      credit capacity, character, general reputation, personal characteristics, or mode of living
      which is used or expected to be used or collected in whole or in part for the purpose of
      serving as a factor in establishing the consumer’s eligibility for—
    gloss: >-
      Far broader subject matter than GLBA: character, general reputation and mode of living are not
      financial facts.
    condition: null
  - id: fcra.e2
    kind: requires
    concept: source_consumer_reporting_agency
    verbatim_span: communication of any information by a consumer reporting agency
    gloss: >-
      The same words from a non-CRA are not a consumer report. This is the most consequential
      element in the definition.
    condition: null
  - id: fcra.e3
    kind: requires
    concept: purpose_eligibility_use
    verbatim_span: >-
      which is used or expected to be used or collected in whole or in part for the purpose of
      serving as a factor in establishing the consumer’s eligibility for—
    gloss: >-
      FCRA is the only one of the three defined by PURPOSE. Identical content is or is not a
      consumer report depending on what it is used for.
    condition: null
  - id: fcra.e4
    kind: includes
    concept: media_agnostic
    verbatim_span: any written, oral, or other communication
    gloss: null
    condition: null
  - id: fcra.e5
    kind: excludes
    concept: carveout_first_party_experience
    verbatim_span: >-
      report containing information solely as to transactions or experiences between the consumer
      and the person making the report;
    gloss: null
    condition: null
  - id: fcra.e6
    kind: excludes
    concept: carveout_affiliate_sharing
    verbatim_span: >-
      communication of other information among persons related by common ownership or affiliated by
      corporate control, if it is clearly and conspicuously disclosed to the consumer that the
      information may be communicated among such persons and the consumer is given the opportunity,
      before the time that the information is initially communicated, to direct that such
      information not be communicated among such persons;
    gloss: null
    condition: >-
      only if disclosed clearly and conspicuously and the consumer is given an opportunity to opt
      out
  - id: fcra.e7
    kind: excludes
    concept: carveout_medical_from_report
    verbatim_span: medical information;
    gloss: >-
      Medical information is excluded from consumer reports on stated conditions — the inverse
      posture from HIPAA, where health content is the subject.
    condition: subject to the conditions in § 1681a(d)(3)
  - id: fcra.e8
    kind: requires
    concept: natural_person_only
    verbatim_span: The term “consumer” means an individual.
    gloss: null
    condition: null
