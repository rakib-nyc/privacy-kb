verbatim_span: >-
  If the respondent does not request a hearing within the time prescribed by § 160.504 of this part
  and the matter is not settled pursuant to § 160.416, the Secretary will impose the proposed
  penalty or any lesser penalty permitted by 42 U.S.C. 1320d-5. The Secretary will notify the
  respondent by certified mail, return receipt requested, of any penalty that has been imposed and
  of the means by which the respondent may satisfy the penalty, and the penalty is final on receipt
  of the notice. The respondent has no right to appeal a penalty under § 160.548 of this part with
  respect to which the respondent has not timely requested a hearing.
