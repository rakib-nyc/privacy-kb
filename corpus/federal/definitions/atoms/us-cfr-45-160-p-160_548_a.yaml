verbatim_span: >-
  Any party may appeal the decision of the ALJ to the Board by filing a notice of appeal with the
  Board within 30 days of the date of service of the ALJ decision. The Board may extend the initial
  30 day period for a period of time not to exceed 30 days if a party files with the Board a request
  for an extension within the initial 30 day period and shows good cause.
