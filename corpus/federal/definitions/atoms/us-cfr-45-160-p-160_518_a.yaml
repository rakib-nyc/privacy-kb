verbatim_span: >-
  The parties must exchange witness lists, copies of prior written statements of proposed witnesses,
  and copies of proposed hearing exhibits, including copies of any written statements that the party
  intends to offer in lieu of live testimony in accordance with § 160.538, not more than 60, and not
  less than 15, days before the scheduled hearing, except that if a respondent intends to introduce
  the evidence of a statistical expert, the respondent must provide the Secretarial party with a
  copy of the statistical expert's report not less than 30 days before the scheduled hearing.
