    verbatim_span: Personally identifiable financial information; and
    gloss: The core inclusion is personally identifiable FINANCIAL information.
    condition: null
  - id: glba.e2
    kind: requires
    concept: source_customer_relationship
    verbatim_span: 'means any information:'
    gloss: >-
      Information counts because it was obtained in connection with providing a financial product or
      service, not because of what it says.
    condition: null
  - id: glba.e3
    kind: includes
    concept: derived_list_inclusion
    verbatim_span: >-
      Any list, description, or other grouping of consumers (and publicly available information
      pertaining to them) that is derived using any personally identifiable financial information
      that is not publicly available.
    gloss: >-
      A derived list is covered even though its contents are public — the derivation is what makes
      it revealing.
    condition: null
  - id: glba.e4
    kind: excludes
    concept: carveout_publicly_available
    verbatim_span: >-
      Publicly available information, except as included on a list described in paragraph (n)(1)(ii)
      of this section; or
    gloss: null
    condition: except as included on a derived list under (n)(1)(ii)
  - id: glba.e5
    kind: excludes
    concept: carveout_business_purpose
    verbatim_span: >-
      This part does not apply to information about companies or about individuals who obtain
      financial products or services for business, commercial, or agricultural purposes.
    gloss: Scope provision rather than the definition proper, but it decides the same question.
    condition: null
  - id: glba.e6
    kind: requires
    concept: natural_person_only
    verbatim_span: >-
      This part applies only to nonpublic personal information about individuals who obtain
      financial products or services primarily for personal, family or household purposes
    gloss: null
    condition: null
