        - excludes:carveout_medical_from_report
        - includes:media_agnostic
        - includes:subject_credit_character
        - requires:purpose_eligibility_use
        - requires:source_consumer_reporting_agency
      shared:
        - requires:natural_person_only
  - id: us.def.personal_information.hipaa.phi
    difference: >-
      "nonpublic personal information" (16 C.F.R. § 313.3(n)(1)) vs "protected health information"
      (45 C.F.R. § 160.103). Only nonpublic personal information: excludes carveout business
      purpose; excludes carveout publicly available; includes derived list inclusion; includes
      subject financial; requires natural person only; requires source customer relationship. Only
      protected health information: excludes carveout education record; excludes carveout employment
      record; excludes carveout long deceased; includes media agnostic; includes subject health;
      requires identifies individual; requires source covered actor. NOTHING is shared between them
      — the same phrase names two disjoint concepts.
    computed:
