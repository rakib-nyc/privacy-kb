  - id: us.def.personal_information.fcra.consumer_report
    difference: >-
      "nonpublic personal information" (16 C.F.R. § 313.3(n)(1)) vs "consumer report" (15 U.S.C. §
      1681a(d)(1)). Only nonpublic personal information: excludes carveout business purpose;
      excludes carveout publicly available; includes derived list inclusion; includes subject
      financial; requires source customer relationship. Only consumer report: excludes carveout
      affiliate sharing; excludes carveout first party experience; excludes carveout medical from
      report; includes media agnostic; includes subject credit character; requires purpose
      eligibility use; requires source consumer reporting agency. Shared: requires natural person
      only.
