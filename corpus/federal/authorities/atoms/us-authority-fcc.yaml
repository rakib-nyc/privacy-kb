common_errors:
  - >-
    Treating the FCC's privacy authority as uniform. § 227 (TCPA) carries a private right of action
    with statutory damages; § 222 (CPNI) does not. The exposure profiles are completely different.
  - >-
    Assuming the FTC can reach a common carrier. § 45(a)(2) carves them out; the FCC is the
    enforcer.
  - >-
    Overlooking that the TCPA private right of action, not FCC enforcement, is what generates most
    real-world liability.
