common_errors:
  - >-
    Treating CFPB UDAAP as identical to FTC § 5. It adds a THIRD prong — abusiveness under § 5531(d)
    — which has no FTC Act analogue and reaches conduct that is neither unfair nor deceptive.
  - >-
    Assuming the CFPB and FTC cannot both reach the same conduct. They have overlapping jurisdiction
    over non-bank consumer financial companies.
  - >-
    Reading § 5531(c) unfairness as different from FTC unfairness. The text tracks § 45(n) closely —
    substantial injury, not reasonably avoidable, not outweighed by countervailing benefits.
open_questions:
  - >-
    The abusiveness standard in § 5531(d) is the distinctive prong and deserves its own atom at
    Priority 1 II.C. Not extracted here — this record establishes the authority, not the obligation.
