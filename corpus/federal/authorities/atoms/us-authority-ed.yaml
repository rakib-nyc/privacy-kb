common_errors:
  - >-
    Treating FERPA as a data-protection statute with penalties. It is a funding condition; the
    sanction is loss of federal funds, which has essentially never been imposed.
  - Assuming students or parents can sue under FERPA. They cannot — Gonzaga v. Doe.
  - >-
    Applying FERPA to an institution that receives no applicable federal funding. The obligation
    attaches to the funding, not to the data.
