common_errors:
  - >-
    Assuming the FTC reaches banks and common carriers. § 45(a)(2) carves them out expressly, which
    is why HIPAA, GLBA banking and FCC-regulated carriers have different enforcers.
  - >-
    Quoting the $10,000 figure from § 45(l) or § 45(m) as the current penalty. It is
    inflation-adjusted by rule and the operative number is much higher.
  - >-
    Treating § 5 as creating a private right of action. It does not; the state UDAP statute is the
    private vehicle.
open_questions:
  - >-
    The carve-out list is entity-level, not activity-level: a carved-out entity is outside § 5 for
    the carved-out capacity, and the FTC has asserted authority over non-carrier activities of
    carrier-affiliated entities. Resolve against primary authority before relying on it in either
    direction.
