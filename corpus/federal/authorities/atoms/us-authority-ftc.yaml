summary: >-
  The FTC is empowered to prevent unfair or deceptive acts or practices in or affecting commerce,
  for every person, partnership or corporation except the enumerated carve-outs.
authority:
  id: us.authority.ftc
  name: Federal Trade Commission
  short_name: FTC
  kind: federal_agency
  statutory_source:
    - 15 U.S.C. § 45 (FTC Act § 5) — unfair or deceptive acts or practices
    - 15 U.S.C. § 45(n) — the statutory unfairness test
    - 15 U.S.C. § 46 — investigative powers
    - 15 U.S.C. § 57a — Magnuson-Moss rulemaking
  jurisdiction: US-FED
  sector_reach:
    - all commerce not otherwise carved out
    - consumer protection generally
    - data brokers
    - advertising and marketing
    - children's online services (COPPA)
    - consumer reporting (FCRA)
    - non-bank financial (GLBA Safeguards)
  excluded_from_reach:
    - banks
    - savings and loan institutions described in 15 U.S.C. § 57a(f)(3)
    - Federal credit unions described in 15 U.S.C. § 57a(f)(4)
    - common carriers subject to the Acts to regulate commerce
    - air carriers and foreign air carriers subject to part A of subtitle VII of title 49
    - persons subject to the Packers and Stockyards Act, 1921, except as provided in § 406(b)
  enforcement_powers:
    - administrative cease-and-desist proceedings
    - civil actions for penalties for violating a final order (15 U.S.C. § 45(l))
    - civil penalties for knowing violation of a trade regulation rule (15 U.S.C. § 45(m)(1)(A))
    - consent orders and settlements
    - compulsory process and investigative subpoenas (§ 46)
  rulemaking_authority:
    has: true
    basis: 15 U.S.C. § 57a
    procedure: Magnuson-Moss rulemaking — materially more burdensome than APA § 553 notice-and-comment
    note: >-
      The procedural burden is why the FTC has historically built privacy doctrine through
      enforcement orders rather than rules. That is a fact about the statute, not a preference.
  penalty_authority:
    structure: civil penalty per violation
    range: null
    inflation_adjusted: true
    note: >-
      § 45(l) and § 45(m)(1)(A) both state $10,000 on their face. The operative figure is far
      higher: it is adjusted annually for inflation under the Federal Civil Penalties Inflation
      Adjustment Act and published by rule. NEVER quote the statutory figure as the current one.
  private_right_of_action:
    exists: false
    basis: null
    note: >-
      FTC Act § 5 confers no private right of action. Consumers reach the same conduct through state
      UDAP statutes, which is why invariant I6 pairs § 5 with state UDAP rather than treating § 5 as
      sufficient.
    drives_litigation_risk: false
