common_errors:
  - >-
    Treating unfairness as an open-ended standard. § 45(n) makes it a three-part test and each
    element is a real limit.
  - >-
    Leading with public policy. The statute says public policy considerations 'may not serve as a
    primary basis' for an unfairness determination.
  - >-
    Conflating unfairness with deception. Deception is a separate theory, developed through the
    Commission's Deception Policy Statement and its orders rather than defined in the statute.
open_questions:
  - >-
    DECEPTION HAS NO STATUTORY TEST. § 45(a)(1) declares deceptive acts unlawful but nowhere defines
    deception; the operative standard is the Commission's own policy statement and its enforcement
    record. That is an authority_tier: agency_guidance and enforcement_action question, not a
    statute question, and it is why the deception standard cannot be extracted as a statutory atom.
    Flagged for the Priority 1 II.A session.
