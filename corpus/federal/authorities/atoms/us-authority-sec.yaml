verbatim_span: >-
  The Commission may, in its discretion, make such investigations as it deems necessary to determine
  whether any person has violated, is violating, or is about to violate any provision of this
  chapter, the rules or regulations thereunder, the rules of a national securities exchange or
  registered securities association of which such person is a member or a person associated, or, as
  to any act or practice, or omission to act, while associated with a member, formerly associated
  with a member, the rules of a registered clearing agency in which such person is a participant,
  or, as to any act or practice, or omission to act, while a participant, was a participant, the
  rules of the Public Company Accounting Oversight Board, of which such person is a registered
  public accounting firm, a person associated with such a firm, or, as to any act, practice, or
  omission to act, while associated with such firm, a person formerly associated with such a firm,
  or the rules of the Municipal Securities Rulemaking Board, and may require or permit any person to
  file with it a statement in writing, under oath or otherwise as the Commission shall determine, as
  to all the facts and circumstances concerning the matter to be investigated. The Commission is
  authorized in its discretion, to publish information concerning any such violations, and to
  investigate any facts, conditions, practices, or matters which it may deem necessary or proper to
  aid in the enforcement of such provisions, in the prescribing of rules and regulations under this
  chapter, or in securing information to serve as a basis for recommending further legislation
  concerning the matters to which this chapter relates.
