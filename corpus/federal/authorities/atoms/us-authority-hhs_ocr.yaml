summary: >-
  HHS may impose civil money penalties on a person who violates a HIPAA administrative
  simplification provision, tiered by the person's culpability.
authority:
  id: us.authority.hhs_ocr
  name: U.S. Department of Health and Human Services, Office for Civil Rights
  short_name: HHS OCR
  kind: federal_agency
  statutory_source:
    - 42 U.S.C. § 1320d-5 — civil money penalties
    - 42 U.S.C. § 1320d-6 — criminal penalties (referred to DOJ)
    - 42 U.S.C. § 1320d-2 — standards
  jurisdiction: US-FED
  sector_reach:
    - HIPAA covered entities
    - HIPAA business associates
    - protected health information
  excluded_from_reach:
    - >-
      entities that are neither covered entities nor business associates — a consumer health app
      outside HIPAA is FTC territory, not OCR's
  enforcement_powers:
    - civil money penalties tiered by culpability
    - corrective action plans and resolution agreements
    - compliance reviews and complaint investigations
  rulemaking_authority:
    has: true
    basis: 42 U.S.C. § 1320d-2 and HITECH
    procedure: APA § 553 notice-and-comment
    note: >-
      The Privacy, Security and Breach Notification Rules are legislative rules with the force of
      law.
  penalty_authority:
    structure: >-
      tiered by culpability — did not know / reasonable cause / wilful neglect corrected / wilful
      neglect uncorrected
    range: null
    inflation_adjusted: true
    note: >-
      Statutory figures in § 1320d-5(a)(3) are annually inflation-adjusted by rule. Verify the
      current figures; never quote the statutory number as operative.
  private_right_of_action:
    exists: false
    basis: null
    note: >-
      HIPAA confers no private right of action. Plaintiffs reach the same conduct through state
      negligence and state UDAP, sometimes using HIPAA as the standard of care — which is a
      different thing from enforcing HIPAA.
    drives_litigation_risk: false
  own_enforcement_power: true
  operates_through: null
