common_errors:
  - >-
    Assuming HIPAA gives patients a private right of action. It does not; state law claims are the
    private vehicle.
  - >-
    Treating state Attorneys General as unable to enforce HIPAA. HITECH gave state AGs authority to
    bring civil actions on behalf of residents.
  - Quoting the statutory penalty figures as current. They are inflation-adjusted annually by rule.
open_questions:
  - >-
    Criminal enforcement under § 1320d-6 is prosecuted by DOJ, not OCR. The authority record for
    DOJ's role is not yet written.
