common_errors:
  - >-
    Treating EEOC guidance as a legislative rule. Much of its AI-in-hiring output is guidance
    without force of law — I7 applies.
  - Missing the exhaustion requirement. A private plaintiff must file a charge before suing.
  - >-
    Assuming the ADA's confidentiality duty for medical records is a privacy statute obligation. It
    sits inside an anti-discrimination statute, which changes both the enforcer and the remedy.
