    relation: sourcing_posture_rule
source_defects: []
common_errors:
  - >-
    Assuming the US Code is the law. For a non-positive-law title it is prima facie evidence of the
    law; the Statutes at Large is the law.
  - >-
    Treating positive-law status as an authority_tier question. It is a SOURCING property — it says
    how confident you are that the text you quoted is the enacted text, not how much the instrument
    binds.
open_questions:
  - >-
    meta/positive-law-titles.yaml covers 8 titles, chosen because the manifest reaches them. It is
    deliberately partial: an atom citing an uncovered title FAILS rather than defaulting. Extend it
    with tools/scan-positive-law.py before extracting from a new title.
  - >-
    CONTEXT ENCODING. The section-level chapeau ("In all courts, tribunals, and public offices...")
    governs subsection (a) and is captured here by SPAN BOUNDARY rather than by operative_context,
    because chapeau and (a) are contiguous in the source. That is what the apparatus policy prefers
    — boundary selection over auxiliary fields. It does NOT generalise: the same chapeau also
    governs (c), (d) and (e), which are not contiguous with it, and a section-level context entry
    cannot be recorded because paragraph_path.path has minItems 1 and a section root has an empty
    path. See DEBT-005.
confidence: high
context_not_required: >-
  The governing section-level chapeau is INSIDE verbatim_span. Chapeau and subsection (a) are
  contiguous in the source, so span boundary selection captures the whole operative provision —
  which the apparatus policy prefers over auxiliary fields. Recording it again as operative_context
  would duplicate text already quoted.
