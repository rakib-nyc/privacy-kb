summary: >-
  The US Code establishes the laws prima facie; only where a title has been enacted into positive
  law is the Code text legal evidence of the law. This is what makes sourcing_posture a real
  distinction rather than a bookkeeping one.
taxonomy:
  rule:
    non_positive_law_title: the Code text is PRIMA FACIE evidence; the enacted text is in the Statutes at Large
    positive_law_title: the Code text is LEGAL EVIDENCE of the law in all courts
  table: >-
    meta/positive-law-titles.yaml, generated from USLM's own <property role="is-positive-law">
    element
  why_it_matters_here: >-
    Six of the eight US Code titles carrying Priority 1 are NOT positive law: titles 12, 15, 20, 42
    and 47 — which is FCRA, GLBA, the FTC Act, COPPA, CAN-SPAM, FERPA, HIPAA, HITECH, TCPA and CPNI.
    Only titles 18 (VPPA, DPPA, ECPA) and 5 (Privacy Act, FOIA) are positive law. The prima facie
    posture is this corpus's default, not its edge case.
  sourcing_policy:
    decision: >-
      The USLM Code is the default primary source for statutory text, including for non-positive-law
      titles.
    trigger_for_pulling_the_enrolled_act:
      - >-
        OLRC flags the Code text editorially — a <note type="footnote"> saying "So in original",
        "Probably should be", or a codification note recording that the Code departs from the act
      - the flagged text falls INSIDE a verbatim_span, not merely nearby
      - an adversarial verification session identifies a substantive discrepancy
    what_is_accepted: >-
      That a Code-sourced atom from a non-positive-law title quotes prima facie evidence of the law
      rather than the law itself, and that in the rare case of divergence the Statutes at Large
      governs.
decision_procedure:
  tool: tools/authority-tier.mjs
  function: sourcingPosture
  outputs:
    - legal_evidence
    - prima_facie_evidence
    - unknown_refuses
    - not_us_code
  refuses_rather_than_guesses: true
  refusal_case: >-
    a US Code title absent from meta/positive-law-titles.yaml — guessing positive-law status is
    guessing whether the text quoted is the law or evidence of it
scope_justification: >-
  Anchored at competency level I.A.2 for the same reason as us.taxonomy.sources_of_us_law: it
  governs how EVERY statutory source in the corpus is read, rather than sitting under any one
  performance indicator.
