verbatim_span: >-
  In all courts, tribunals, and public offices of the United States, at home or abroad, of the
  District of Columbia, and of each State, Territory, or insular possession of the United States—
  (a) United States Code.— The matter set forth in the edition of the Code of Laws of the United
  States current at any time shall, together with the then current supplement, if any, establish
  prima facie the laws of the United States, general and permanent in their nature, in force on the
  day preceding the commencement of the session following the last session the legislation of which
  is included: Provided, however , That whenever titles of such Code shall have been enacted into
  positive law the text thereof shall be legal evidence of the laws therein contained, in all the
  courts of the United States, the several States, and the Territories and insular possessions of
  the United States.
