common_errors:
  - >-
    Treating an interpretative rule as a regulation because it was published in the CFR. Publication
    location does not confer force of law; notice-and-comment does.
  - >-
    Inflating an agency FAQ's tier because it drives enforcement in practice. Practical force is
    real and is recorded separately — it never moves the tier (invariant I7).
  - >-
    Giving a contract an authority_tier. Contract is not a source of law; a tier would let a
    contractual term rank against a statute.
open_questions:
  - >-
    SCHEMA WANT, NOT BUILT (schema frozen at 6369d05). authority_tier's enum maps interpretative
    rules and general statements of policy both to agency_guidance. The quoted provision treats them
    as one category for notice-and-comment purposes, and neither carries the force of law, so the
    collapse is defensible for APPLICABILITY. It is lossy for DEFERENCE analysis and for whether an
    agency may change position without process. No agency-guidance records exist yet; Priority 1
    will create many. Reported rather than absorbed.
  - >-
    GATE 18 TRIGGER IS UNDER-INCLUSIVE. It fires at paragraph_path depth > 1. 1 U.S.C. § 204(a) is
    depth 1 and is governed by a SECTION-level chapeau it is meaningless without. That context was
    recorded voluntarily on us.taxonomy.code_evidentiary_status; nothing required it. See DEBT-005.
confidence: high
